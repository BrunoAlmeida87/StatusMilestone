  return `<dl class="kv">
    ${lin(LANG==="pt"?"Itens no Arquivo 1":"Items in File 1",r.itens_arquivo1)}
    ${lin(LANG==="pt"?"Itens no Arquivo 2":"Items in File 2",r.itens_arquivo2)}
    ${lin(LANG==="pt"?"Itens nos dois":"Items in both",r.itens_nos_dois)}
    ${lin(LANG==="pt"?"Só no Arquivo 1":"Only in File 1",r.somente_arquivo1.length)}
    ${lin(LANG==="pt"?"Só no Arquivo 2":"Only in File 2",r.somente_arquivo2.length)}
    ${lin(LANG==="pt"?"Conflitos":"Conflicts",`${r.conflitos_total} (${r.conflitos_em_aberto} ${LANG==="pt"?"em aberto":"open"})`)}
    ${lin(LANG==="pt"?"Campos só no Arquivo 1":"Fields only in File 1",esc(r.campos_so_arquivo1.join(", ")||"—"))}
    ${lin(LANG==="pt"?"Campos só no Arquivo 2":"Fields only in File 2",esc(r.campos_so_arquivo2.join(", ")||"—"))}
  </dl>`;
}
/* ===================== validacao estrutural da base ====================
   Normalizar e validar sao coisas diferentes: normalizar CONSERTA o que da
   para consertar (preenche campo que falta), validar apenas OLHA e diz o que
   impede a base de ser usada. Bloqueante e so o que torna a base inutilizavel
   - o resto e aviso, senao um evento orfao tranca a pessoa fora da propria
   base. Funcao pura: nao toca no objeto recebido.                        */
/* Valores repetidos numa lista, em uma passada. */
function duplicados(lista){
  const vistos=new Set(), repetidos=new Set();
  for(const v of lista){ if(vistos.has(v)) repetidos.add(v); else vistos.add(v); }
  return repetidos;
}
function validarBase(db){
  const pt = LANG==="pt", erros=[], avisos=[];
  const E=(a,b)=>erros.push(pt?a:b), A=(a,b)=>avisos.push(pt?a:b);
  if(!db || typeof db!=="object" || Array.isArray(db)){
    E("O arquivo não contém um objeto de base.","The file does not contain a database object.");
    return {valido:false, erros, avisos};
  }
  for(const k of ["itens","historico","pendentes","observacoes","conflitos","marcos","waivers"])
    if(k in db && !Array.isArray(db[k]))
      E(`"${k}" existe no arquivo mas não é uma lista.`, `"${k}" exists but is not a list.`);
  for(const k of ["config","meta"])
    if(k in db && (typeof db[k]!=="object" || db[k]===null || Array.isArray(db[k])))
      E(`"${k}" existe no arquivo mas não é um objeto.`, `"${k}" exists but is not an object.`);
  const rev = db.meta?.revisao;
  if(rev!==undefined && (!Number.isInteger(rev) || rev<0))
    E(`meta.revisao inválida (${JSON.stringify(rev)}): o controle de versão entre pessoas depende dela.`,
      `Invalid meta.revisao (${JSON.stringify(rev)}): concurrent-write control depends on it.`);
  if(erros.length) return {valido:false, erros, avisos};

  const itens = Array.isArray(db.itens)? db.itens : [];
  if(!("itens" in db)) A("O arquivo não traz a lista de itens.","The file has no items list.");
  if(itens.some(i=>!i || typeof i!=="object" || Array.isArray(i)))
    E("Há itens que não são objetos.","Some items are not objects.");
  const semId = itens.filter(i=>i && typeof i==="object" && !i.item).length;
  if(semId) E(`${semId} item(ns) sem identificador.`, `${semId} item(s) without an identifier.`);
  const ids = itens.map(i=>i?.item).filter(Boolean);
  /* indexOf dentro de filter e O(n^2) - e esta funcao roda na abertura E toda
     vez que outra pessoa grava (Sync.receber). Com o historico grande isso
     travava a tela a cada gravacao alheia. */
  const dup = [...duplicados(ids)];
  if(dup.length) E(`Identificadores repetidos: ${dup.slice(0,10).join(", ")}${dup.length>10?"…":""}.`,
                   `Duplicate identifiers: ${dup.slice(0,10).join(", ")}${dup.length>10?"…":""}.`);

  /* daqui para baixo: avisos - a base abre, mas alguem precisa olhar */
  const conjunto = new Set(ids);
  const hist = Array.isArray(db.historico)? db.historico : [];
  const orf = hist.filter(h=>h?.item && !conjunto.has(h.item)).length;
  if(orf) A(`${orf} evento(s) de histórico apontam para itens que não existem.`,
            `${orf} history event(s) point to items that do not exist.`);
  const hid = hist.map(h=>h?.id).filter(Boolean);
  const hdup = [...duplicados(hid)];
  if(hdup.length) A(`${hdup.length} id(s) de evento repetidos.`, `${hdup.length} duplicate event id(s).`);
  const ISO = /^\d{4}-\d{2}-\d{2}/;
  const datas = hist.filter(h=>h?.dataEfetiva && !ISO.test(String(h.dataEfetiva))).length;
  if(datas) A(`${datas} evento(s) com data fora do formato AAAA-MM-DD.`,
              `${datas} event(s) with a date outside YYYY-MM-DD.`);
  const dom = new Set((db.config?.status||[]).map(x=>x?.codigo).filter(Boolean));
  if(dom.size){
    const fora = [...new Set(itens.map(i=>i?.status).filter(st=>st && !dom.has(st)))];
    if(fora.length) A(`Status fora do domínio configurado: ${fora.slice(0,6).join(", ")}${fora.length>6?"…":""}.`,
                      `Statuses outside the configured domain: ${fora.slice(0,6).join(", ")}${fora.length>6?"…":""}.`);
  }
  const semSt = itens.filter(i=>i && !i.status).length;
  if(semSt) A(`${semSt} item(ns) sem status.`, `${semSt} item(s) without a status.`);
  const pend = Array.isArray(db.pendentes)? db.pendentes : [];
  const pOrf = pend.filter(x=>x?.item && !conjunto.has(x.item)).length;
  if(pOrf) A(`${pOrf} pendência(s) apontam para itens que não existem.`,
             `${pOrf} pending change(s) point to items that do not exist.`);
  const pCampo = pend.filter(x=>!x?.campo || !Pend.campoEditavel.includes(x.campo)).length;
  if(pCampo) A(`${pCampo} pendência(s) em campo que não é editável.`,
               `${pCampo} pending change(s) on a non-editable field.`);
  return {valido: !erros.length, erros, avisos};
}

function verificarIntegridade(){
  const p=[], itens=S.db.itens;
  const ids=itens.map(i=>i.item);
  const dup=ids.filter((x,k)=>ids.indexOf(x)!==k);
  if(dup.length) p.push([`${LANG==="pt"?"Itens duplicados":"Duplicate items"}: ${[...new Set(dup)].join(", ")}`,"bad"]);
  const semId=itens.filter(i=>!i.item).length;
  if(semId) p.push([`${semId} ${LANG==="pt"?"itens sem identificador":"items without id"}`,"bad"]);
  const validos=new Set(S.db.config.status.map(s=>s.codigo));
  const inval=[...new Set(itens.map(i=>i.status).filter(s=>!validos.has(s)))];
  if(inval.length) p.push([`${LANG==="pt"?"Status fora do domínio":"Status outside domain"}: ${inval.join(", ")}`,"bad"]);
  const semSt=itens.filter(i=>!i.status).length;
  if(semSt) p.push([`${semSt} ${LANG==="pt"?"itens sem status":"items without status"}`,"bad"]);
  const orf=(S.db.historico||[]).filter(h=>!ids.includes(h.item)).length;
  if(orf) p.push([`${orf} ${LANG==="pt"?"eventos de histórico órfãos":"orphan history events"}`,"warn"]);
  const mb = R.tamanhoBase()/1048576, limite = S.db.config.mbAvisoTamanho ?? 8;
  if(mb > limite) p.push([`${LANG==="pt"?"Base grande":"Large database"}: ${mb.toFixed(1)} MB ${LANG==="pt"
    ? `(acima de ${limite} MB) — considere arquivar histórico antigo em Configurações`
    : `(over ${limite} MB) — consider archiving old history in Settings`}`,"warn"]);
  const incoer=itens.filter(i=>incoerente(i.status,i.updatedStatusObs)).length;
  if(incoer) p.push([`${incoer} ${LANG==="pt"?"itens com status incoerente com a observação":"items whose status conflicts with their note"}`,"warn"]);
  if(!p.length) return `<div class="rowflex" style="color:var(--ok)"><b>✓ ${LANG==="pt"?"Nenhum problema encontrado":"No problems found"}</b></div>`;
  return p.map(([t,k])=>`<div class="rowflex" style="gap:7px;padding:3px 0;color:var(--${k==="bad"?"bad":"warn"})">
    <span>${k==="bad"?"✕":"⚠"}</span><span style="color:var(--fg-2)">${esc(t)}</span></div>`).join("");
}
</script>
<script>
"use strict";
/* ================================ UI =================================== */
const UI = {
  modal(titulo, corpo, botoes=[], {aoFechar=null, confirmarSaida=false}={}){
    this.fechar();
    const ov=document.createElement("div"); ov.className="ov"; ov.id="ov";
    ov.__aoFechar = aoFechar;
    ov.innerHTML=`<div class="modal"><header><h2>${esc(titulo)}</h2>
        <button class="btn sm" id="mX">✕</button></header>
      <div class="body">${corpo}</div>
      ${botoes.length?`<footer>${botoes.map((b,k)=>`<button class="${b.cls||"btn"}" data-b="${k}" id="mb${k}">${esc(b.txt)}</button>`).join("")}</footer>`:""}</div>`;
    document.body.append(ov);
    ov.__confirmarSaida = confirmarSaida;
    /* Fechar clicando fora so vale quando o clique COMECA e TERMINA no fundo.
       Antes bastava terminar nele - e o navegador entrega o clique ao ancestral
       comum do mousedown e do mouseup. Arrastar para selecionar o texto de um
       campo e soltar o botao um pouco fora da janela dava, portanto, um clique
       no fundo: a janela fechava sozinha e o que estava escrito ia junto. Era
       exatamente o que acontecia ao mexer num item. */
    ov.__comecouNoFundo = false;
    ov.addEventListener("pointerdown", e=>{ ov.__comecouNoFundo = (e.target===ov); });
    ov.onclick = e => { if(this.cliqueFechaFundo(ov, e.target)) this.fecharPeloUsuario(); };
    /* Digitou algo? A partir daqui sair por fora pergunta antes de descartar.
       Vale so nas janelas que pedem (o detalhe do item, o item novo, o waiver):
       uma janela de filtro nao tem nada a perder. */
    const sujar = ()=>{ ov.__sujo = true; };
    ov.addEventListener("input", sujar); ov.addEventListener("change", sujar);
    $("#mX").onclick=()=>this.fecharPeloUsuario();
    /* Ligados pelo id, nao pelo seletor de atributo: e o que permite acionar o
       botao de uma janela nos testes em Node, onde so os ids existem. */
    botoes.forEach((b,k)=>{ const el=$("#mb"+k); if(el) el.onclick=()=>b.fn(); });
    return ov;
  },
  /* A regra do clique no fundo, isolada para poder ser conferida sem navegador. */
  cliqueFechaFundo(ov, alvo){ return !!ov && alvo===ov && ov.__comecouNoFundo===true; },

  /* Saida por iniciativa de quem esta usando: o fundo, o X ou o Esc. E diferente
     de fechar(), que tambem e chamada pelo proprio sistema - por modal(), ao
     abrir a janela seguinte - quando nao ha nada que perguntar. */
  fecharPeloUsuario(){
    const ov=$("#ov"); if(!ov) return;
    if(ov.__confirmarSaida && ov.__sujo && !confirmar(LANG==="pt"
      ? "Esta janela tem alterações que ainda não foram salvas.\n\nFechar e descartar?"
      : "This window has unsaved changes.\n\nClose and discard them?")) return;
    this.fechar();
  },

  /* aoFechar corre SEMPRE que a janela sai - pelo X, pelo clique fora ou porque
     outra janela tomou o lugar dela. E o que garante que uma tela que suspendeu
     algo (a de decisao do Sync suspende o polling) sempre o devolva. */
  fechar(){
    const ov=$("#ov"); if(!ov) return;
    const fn=ov.__aoFechar; ov.__aoFechar=null;
    ov.remove();
    try{ fn?.(); }catch{}
  },

  /* ---- selecionar pasta / carregar base ---- */
  async abrirPasta(){
    try{
      await Store.escolherPasta();
      Caminho.conferir();
      await this.carregarBase();
    }catch(e){ if(e.name!=="AbortError") toast(String(e.message),"bad"); }
  },
  async retomarPasta(){
    if(await Store.pedirPermissaoSalva()) await this.carregarBase();
    else toast(LANG==="pt"?"Permissão não concedida":"Permission not granted","bad");
  },
  async carregarBase(){
    try{
      const lida = await Store.carregar();
      const val = validarBase(lida);
      if(!val.valido){
        Render.semBase(LANG==="pt"
          ? "O database.json da pasta não passou na verificação estrutural. Nada foi gravado."
          : "The database.json in the folder failed the structural check. Nothing was written.");
        return this.baseRecusada("database.json", val, JSON.stringify(lida,null,1));
      }
      S.db = lida;
      normalizar(S.db); Pend.diario=[]; S.sujo=false;
      Caminho.sincronizarDaBase();
      Usuario.garantir();
      S.novidades = Visita.calcular(); Visita.marcar();
      await Store.backup(S.db,"abertura").catch(()=>{});
      Pend.iniciar();
      marcarEstado(LANG==="pt"?"base carregada":"database loaded", "info");
      toast(`${S.db.itens.length} ${LANG==="pt"?"itens carregados":"items loaded"}`,"ok");
      irPara(S.rotaInicial || "dashboard"); S.rotaInicial=null;
    }catch(e){
      if(e.message==="NAO_ENCONTRADO") return this.baseNova();
      Render.semBase(mensagemArmazenamento(e));
    }
  },
  baseNova(){
    if(!confirmar(LANG==="pt"
      ? "Não existe database.json nesta pasta. Criar uma base vazia aqui?"
      : "No database.json in this folder. Create an empty database here?")) return Render.semBase();
    S.db = baseVazia(); normalizar(S.db); Usuario.garantir();
    Store.gravar(S.db,{forcar:true}).then(()=>{Pend.iniciar(); irPara("dashboard");});
  },
  async recuperarEspelho(){
    const e=await IDB.get("espelho");
    if(!e) return toast(LANG==="pt"?"Nenhuma cópia local encontrada":"No local copy found","bad");
    const val = validarBase(e);
    if(!val.valido) return this.baseRecusada(LANG==="pt"?"cópia local":"local copy", val, JSON.stringify(e,null,1));
    if(!confirmar(LANG==="pt"
      ? `Cópia local de ${fmtDT(e.meta?.atualizadoEm)} com ${e.itens?.length||0} itens. Carregar?`
      : `Local copy from ${fmtDT(e.meta?.atualizadoEm)} with ${e.itens?.length||0} items. Load it?`)) return;
    S.db=e; normalizar(S.db); Usuario.garantir(); Pend.iniciar(); irPara("dashboard");
    toast(LANG==="pt"?"Cópia local carregada. Selecione a pasta para voltar a gravar.":"Local copy loaded. Select the folder to resume saving.","ok");
  },
  abrirArquivoManual(){
    const inp=document.createElement("input"); inp.type="file"; inp.accept=".json";
    inp.onchange=async()=>{ const f=inp.files[0]; if(!f) return;
      let texto, lida;
      try{ texto = await f.text(); lida = JSON.parse(texto); }
      catch(e){ return this.baseRecusada(f.name, {erros:[LANG==="pt"
        ? "O arquivo não é um JSON válido: "+e.message : "The file is not valid JSON: "+e.message], avisos:[]}, null); }
      /* uma base invalida nunca substitui a que esta aberta */
      const val = validarBase(lida);
      if(!val.valido) return this.baseRecusada(f.name, val, texto);
      S.db=lida; normalizar(S.db); Usuario.garantir(); Pend.iniciar(); irPara("dashboard");
      if(val.avisos.length) toast(LANG==="pt"
        ? `Base aberta com ${val.avisos.length} aviso(s) — veja Configurações > Integridade`
        : `Database opened with ${val.avisos.length} warning(s) — see Settings > Integrity`, "warn");
      else toast(LANG==="pt"?"Base aberta em modo leitura/baixar":"Database opened in read/download mode","ok"); };
    inp.click();
  },

  /* ---- conflito de gravação concorrente ---- */
  conflitoGravacao(err){
    marcarEstado(LANG==="pt"?"conflito de gravação":"write conflict", "conflito");
    this.modal(LANG==="pt"?"Conflito de gravação":"Write conflict",
      `<p>${LANG==="pt"
        ? `O arquivo na pasta foi alterado por <b>${esc(err.autorDisco||"outra pessoa")}</b> (revisão ${err.revisaoDisco}) depois que você carregou esta base (revisão ${Store.revisaoCarregada}).`
        : `The file was changed by <b>${esc(err.autorDisco||"someone else")}</b> (revision ${err.revisaoDisco}) after you loaded it (revision ${Store.revisaoCarregada}).`}</p>
       <p class="muted">${LANG==="pt"
        ? "Para não apagar o trabalho de ninguém, nada foi gravado. Escolha como prosseguir:"
        : "Nothing was written so nobody's work is lost. Choose how to proceed:"}</p>
       <ul class="muted" style="line-height:1.8">
        <li><b>${LANG==="pt"?"Recarregar":"Reload"}</b> — ${LANG==="pt"?"descarta suas alterações não gravadas e traz a versão do disco.":"discards your unsaved changes and loads the disk version."}</li>
        <li><b>${LANG==="pt"?"Salvar cópia":"Save a copy"}</b> — ${LANG==="pt"?"baixa a sua versão para comparação manual.":"downloads your version for manual comparison."}</li>
        <li><b>${LANG==="pt"?"Forçar gravação":"Force write"}</b> — ${LANG==="pt"?"sobrescreve o disco, mas só depois de gravar e conferir um backup da versão que está lá. Se o backup não puder ser confirmado, nada é sobrescrito.":"overwrites the disk, but only after a backup of the version on disk is written and verified. If the backup cannot be confirmed, nothing is overwritten."}</li></ul>`,
      [{txt:LANG==="pt"?"Recarregar":"Reload",cls:"btn",fn:async()=>{
          this.fechar(); Pend.diario=[]; S.sujo=false; await this.carregarBase();}},
       {txt:LANG==="pt"?"Salvar cópia":"Save a copy",cls:"btn",fn:()=>dl(`minha-versao-${hoje()}.json`,JSON.stringify(S.db,null,1),"application/json")},
       {txt:LANG==="pt"?"Forçar gravação":"Force write",cls:"btn danger",fn:async()=>{
          /* O backup da versao do disco e pre-requisito, nao tentativa: sem ele
             confirmado, a sobrescrita nao acontece e o conflito continua aberto. */
          const registro = {em:agora(), autor:Usuario.garantir(), acao:"sobrescrita-forcada",
                            revisaoDisco:err.revisaoDisco, revisaoLocal:Store.revisaoCarregada,
                            backup:null, resultado:"tentativa"};
          (S.db.logSobrescritas ??= []).push(registro);
          let nome;
          try{ nome = await Store.backup(err.disco,"pre-sobrescrita"); }
          catch(e){
            registro.resultado = "backup-falhou";
            marcarEstado(LANG==="pt"?"conflito de gravação":"write conflict", "conflito");
            return toast((LANG==="pt"
              ? "Backup da versão em disco falhou — nada foi sobrescrito. "
              : "Backup of the disk version failed — nothing was overwritten. ")
              + mensagemArmazenamento(e), "bad");
          }
          registro.backup = nome;
          try{
            S.db.meta.revisao = err.revisaoDisco;
            await Store.gravar(S.db,{forcar:true});
          }catch(e){
            registro.resultado = "gravacao-falhou";
            return toast(mensagemArmazenamento(e),"bad");
          }
          registro.resultado = "sobrescrito";
          registro.revisaoGravada = S.db.meta.revisao;
          Pend.diario=[]; S.sujo=false; Sync.ultimoMtime = await Store.mtime();
          this.fechar(); marcarEstado(LANG==="pt"?"gravado (forçado)":"written (forced)", "salvo");
          toast(LANG==="pt"?`Sobrescrito. Backup da versão anterior: ${nome}`
                           :`Overwritten. Backup of the previous version: ${nome}`,"ok");}}]);
  },

  /* ---- relatorio de uma base recusada, com saida para recuperacao ---- */
  baseRecusada(origem, res, texto){
    const lista = (t,l,cor)=> l.length? `<div style="margin-top:10px"><b style="color:var(--${cor})">${t}</b>
      <ul style="margin:6px 0 0 18px;line-height:1.7">${l.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>` : "";
    this.modal(LANG==="pt"?"Base recusada":"Database rejected",
      `<p>${LANG==="pt"
        ? `O conteúdo de <b>${esc(origem)}</b> não pode ser usado como base. <b>Nada foi alterado aqui</b>: a base que estava aberta continua intacta.`
        : `The contents of <b>${esc(origem)}</b> cannot be used as a database. <b>Nothing was changed here</b>: the database you had open is intact.`}</p>
       ${lista(LANG==="pt"?"Impedimentos":"Blocking problems", res.erros, "bad")}
       ${lista(LANG==="pt"?"Avisos":"Warnings", res.avisos, "warn")}`,
      texto? [{txt:LANG==="pt"?"Baixar o arquivo":"Download the file",cls:"btn",
               fn:()=>dl(`base-recusada-${hoje()}.json`, texto, "application/json")},
              {txt:T("fechar"),cls:"btn pri",fn:()=>this.fechar()}]
            : [{txt:T("fechar"),cls:"btn pri",fn:()=>this.fechar()}]);
  },

  /* ---- alteracoes pendentes: lista com descarte linha a linha ---- */
  painelPendentes(){
    const p=S.db?.pendentes||[]; if(!p.length) return this.fechar();
    this.modal(LANG==="pt"?"Alterações pendentes":"Pending changes",
      `<p class="muted">${LANG==="pt"
        ? `Estas alterações já estão salvas na base, mas ainda não viraram histórico definitivo. Consolidam sozinhas após ${S.db.config.minutosConsolidacao} minutos sem novo toque.`
        : `These changes are already saved, but not yet consolidated into the permanent history. They consolidate automatically after ${S.db.config.minutosConsolidacao} minutes without further edits.`}</p>
       <table style="margin-top:12px"><thead><tr><th>${T("item")}</th><th>${T("campo")}</th>
         <th>${T("anterior")}</th><th>${T("novo")}</th><th>${LANG==="pt"?"Desde":"Since"}</th><th></th></tr></thead><tbody>
       ${p.map(x=>`<tr><td class="num"><b>${esc(x.item)}</b></td><td>${esc(x.campo)}</td>
         <td>${esc(x.valorOriginal)||"—"}</td><td><b>${esc(x.valorAtual)}</b></td>
         <td class="num">${fmtDT(x.primeiraAlteracaoEm)}</td>
         <td><button class="btn sm danger" data-pd="${esc(x.id)}"
           title="${LANG==="pt"?"Descartar só esta":"Discard just this one"}">✕</button></td></tr>`).join("")}</tbody></table>`,
      [{txt:T("descartar"),cls:"btn danger",fn:()=>{UI.fechar(); Pend.descartarTudo();}},
       {txt:T("salvarAgora"),cls:"btn pri",fn:()=>{UI.fechar(); Pend.consolidarTudo();}}]);
    $$("[data-pd]").forEach(b=>b.onclick=()=>{
      const x=S.db.pendentes.find(y=>y.id===b.dataset.pd);
      if(x && Pend.descartarUma(x)) this.painelPendentes();
    });
  },

  /* Grava os cinco campos editaveis do detalhe. Pend.alterar ignora os que
     nao mudaram, entao nao ha risco de criar pendencia a toa. */
  salvarDetalhe(itemId){
    const dt=$("#dData")?.value||hoje(), mot=$("#dMotivo")?.value.trim()||"";
    const campos=[["dStatus","status"],["dObs","updatedStatusObs"],["dGer","generalObs"],
                  ["dNcr","ncr"],["dTests","tests"]];
    for(const [el,campo] of campos){
      const v=$("#"+el); if(v) Pend.alterar(itemId,campo,v.value,{dataEfetiva:dt,motivo:mot});
    }
  },
  /* Anda na lista filtrada sem fechar o detalhe: revisar item a item vira
     um fluxo continuo em vez de abrir-fechar-procurar. */
  irrItem(passo, {semSalvar=false}={}){
    const l = ordenar(itensFiltrados()).map(x=>x.item);
    const k = l.indexOf(S.selecionado);
    const alvo = l[k + passo];
    if(alvo===undefined){ this.fechar(); Render.atual();
      return toast(LANG==="pt"?"Fim da lista":"End of list"); }
    S.cursor = alvo;
    Render.atual();                     /* a tabela atras acompanha */
    this.detalhe(alvo);
  },

  /* ---- detalhe do item ---- */
  detalhe(itemId){
    const i=S.db.itens.find(x=>x.item===itemId); if(!i) return;
    S.selecionado=itemId; S.cursor=itemId;
    const vizinhos = ordenar(itensFiltrados()).map(x=>x.item);
    const pos = vizinhos.indexOf(itemId);
    const hist=(S.db.historico||[]).filter(h=>h.item===itemId)
                .sort((a,b)=>b.dataEfetiva.localeCompare(a.dataEfetiva));
    const obs=(S.db.observacoes||[]).filter(o=>o.item===itemId)
                .sort((a,b)=>b.criadoEm.localeCompare(a.criadoEm));
    const pend=S.db.pendentes.filter(p=>p.item===itemId);
    const ativos=R.statusAtivos();

    const aba=(id,txt)=>`<button data-t="${id}">${esc(txt)}</button>`;
    this.modal(`${LANG==="pt"?"Item":"Item"} ${itemId}`
      + (pos>=0 && vizinhos.length>1? `  (${pos+1}/${vizinhos.length})` : ""), `
      <div class="tabs">${aba("d",T("detalhes"))}${aba("h",T("historico"))}${aba("o",T("observacoes"))}${aba("x",T("dados"))}</div>
      <div id="tp-d">
        ${(()=>{ const quem=Sync.quemEdita(itemId); return quem.length
          ? `<div class="panel pad" style="border-left:3px solid var(--warn);margin-bottom:12px">
              <b style="color:var(--warn)">✎ ${esc(quem.join(", "))}</b> ${LANG==="pt"
                ? "está com este item aberto agora. Se os dois mudarem o mesmo campo, o sistema vai pedir uma decisão."
                : "has this item open right now. If you both change the same field, the app will ask for a decision."}</div>`
          : ""; })()}
        ${Waiver.blocoItemHTML(itemId)}
        ${pend.length?`<div class="panel pad" style="border-left:3px solid var(--chg-line);margin-bottom:12px">
          <b>${pend.length} ${LANG==="pt"?"alteração(ões) pendente(s) de consolidação":"change(s) pending consolidation"}</b>
          ${pend.map(p=>`<div class="rowflex muted" style="font-size:11.5px;margin-top:4px">
            <span style="flex:1">${esc(p.campo)}: "${esc(p.valorOriginal)}" → "${esc(p.valorAtual)}"
              · ${LANG==="pt"?"desde":"since"} ${fmtDT(p.primeiraAlteracaoEm)}</span>
            <button class="btn sm danger" data-pd="${esc(p.id)}">${LANG==="pt"?"Descartar":"Discard"}</button>
          </div>`).join("")}</div>`:""}
        <div class="grid" style="grid-template-columns:1fr 1fr;gap:12px">
          <label class="fld"><span>${T("status")}</span>
            <select id="dStatus">${ativos.map(s=>`<option ${s===i.status?"selected":""}>${esc(s)}</option>`).join("")}</select></label>
          <label class="fld"><span>${LANG==="pt"?"Data efetiva da mudança":"Effective change date"}</span>
            <input type="date" id="dData" value="${hoje()}" max="${hoje()}"></label>
        </div>
        <div class="sep"></div>
        <label class="fld" style="margin-bottom:10px"><span>Updated Status Obs</span>
          <textarea id="dObs" rows="2">${esc(i.updatedStatusObs)}</textarea></label>
        <label class="fld" style="margin-bottom:10px"><span>General Obs</span>
          <textarea id="dGer" rows="2">${esc(i.generalObs)}</textarea></label>
        <div class="grid" style="grid-template-columns:1fr 1fr;gap:12px">
          <label class="fld"><span>NCR's</span><input type="text" id="dNcr" value="${esc(i.ncr)}"></label>
          <label class="fld"><span>${LANG==="pt"?"Motivo da alteração (opcional)":"Reason for change (optional)"}</span>
            <input type="text" id="dMotivo" placeholder="${LANG==="pt"?"vai para o histórico":"goes to history"}"></label>
        </div>
        <label class="fld" style="margin-top:10px"><span>Tests</span>
          <textarea id="dTests" rows="3" class="mono" style="font-size:11px">${esc(i.tests)}</textarea></label>
      </div>
      <div id="tp-h" hidden>${hist.length? `<table><thead><tr><th>${T("data")}</th><th>${T("campo")}</th>
        <th>${T("anterior")}</th><th>${T("novo")}</th><th>${T("autor")}</th></tr></thead><tbody>
        ${hist.map(h=>`<tr><td class="num">${fmtD(h.dataEfetiva)}</td><td>${esc(h.campo)}</td>
          <td>${h.valorAnterior?esc(h.valorAnterior):"—"}</td><td><b>${esc(h.valorNovo)}</b></td>
          <td>${esc(h.autor||"")}</td></tr>`).join("")}</tbody></table>`
        :`<div class="empty">${LANG==="pt"?"Sem histórico":"No history"}</div>`}</div>
      <div id="tp-o" hidden>
        <div class="rowflex" style="margin-bottom:12px">
          <input type="text" id="oTxt" placeholder="${T("obsNova")}" style="flex:1">
          <button class="btn pri" id="oAdd">${T("adicionar")}</button></div>
        ${obs.map(o=>`<div class="panel pad" style="margin-bottom:8px">
          <div class="rowflex" style="justify-content:space-between;font-size:11px;color:var(--fg-3)">
            <b>${esc(o.autor||"")}</b><span>${fmtDT(o.criadoEm)}</span></div>
          <div style="margin-top:5px;white-space:pre-wrap">${esc(o.texto)}</div></div>`).join("")
          ||`<div class="empty">${LANG==="pt"?"Nenhuma observação":"No notes"}</div>`}</div>
      <div id="tp-x" hidden><dl class="kv">
        ${/* Cada valor ja sai escapado daqui. A versao anterior decidia pelo
             CONTEUDO ("contem <span?"), entao qualquer campo descritivo com
             essa sequencia era injetado cru no HTML. */
          [["Evidence",esc(i.evidence)],["InspType",esc(i.inspType)],["Insp",esc(i.insp)],
           ["OriginalJx",esc(i.originalJx)],["ActualJx",esc(i.actualJx)],
           ["ActualJxDescription",esc(i.actualJxDescription)],
           ["Nº and Description",esc(i.numAndDescription)],["Performance",esc(i.performance)],
           ["Mode",esc(i.mode)+(i.modeOrigem?` <span class="muted">(${LANG==="pt"?"origem":"source"}: ${esc(i.modeOrigem)})</span>`:"")],
           ["Description",esc(i.description)],["HullPassageParts",esc(i.hullPassageParts)],
           ["Position AC",esc(i.positionAC)],
           ["Bigram",(i.bigram||[]).map(b=>`<span class="tag">${esc(b)}</span>`).join("")],
           ["SBR",esc(i.sbr)],[LANG==="pt"?"Criado em":"Created",esc(fmtD(i.criadoEm))],
           [LANG==="pt"?"Última mudança de status":"Last status change",esc(fmtD(i.ultimaAlteracaoStatus))],
           [LANG==="pt"?"Dias sem atualização":"Days without update",esc(R.diasSemAtualizacao(i))],
           [LANG==="pt"?"Presente em":"Present in",esc(i.presenteEm)],
        ].map(([k,v])=>`<dt>${esc(k)}</dt><dd>${v}</dd>`).join("")}
      </dl></div>`,
      [...(vizinhos.length>1? [
        {txt:"‹ "+(LANG==="pt"?"Anterior":"Previous"),cls:"btn",fn:()=>this.irrItem(-1)},
        {txt:(LANG==="pt"?"Próximo":"Next")+" ›",cls:"btn",fn:()=>this.irrItem(1)}] : []),
       {txt:T("fechar"),cls:"btn",fn:()=>this.fechar()},
       {txt:LANG==="pt"?"Salvar e próximo":"Save and next",cls:"btn",
        fn:()=>{ this.salvarDetalhe(itemId); this.irrItem(1, {semSalvar:true}); }},
       {txt:T("salvar"),cls:"btn pri",fn:()=>{
          this.salvarDetalhe(itemId); this.fechar(); Render.atual();}}],
      {confirmarSaida:true});

    Waiver.ligarBloco(itemId);
    $$("[data-pd]").forEach(b=>b.onclick=()=>{
      const x=S.db.pendentes.find(y=>y.id===b.dataset.pd);
      if(x && Pend.descartarUma(x)) this.detalhe(itemId);
    });
    $$(".tabs button").forEach((b,k)=>{ if(!k) b.classList.add("on");
      b.onclick=()=>{ $$(".tabs button").forEach(x=>x.classList.remove("on")); b.classList.add("on");
        ["d","h","o","x"].forEach(t=>$("#tp-"+t).hidden = t!==b.dataset.t); };});
    $("#oAdd").onclick=()=>{
      const t=$("#oTxt").value.trim(); if(!t) return;
      const o={id:uid(),item:itemId,texto:t,criadoEm:agora(),autor:Usuario.garantir()};
      S.db.observacoes.push(o); Pend.registrar({t:"obs",obj:o});
      Pend.autosave(); this.detalhe(itemId);   // observações gravam na hora (não passam por pendentes)
      $$(".tabs button")[2].click();
      toast(LANG==="pt"?"Observação salva":"Note saved","ok");};
  },

  /* Alternativa ao arraste: escolher o status direto no card. Com o quadro
     vertical, arrastar entre faixas distantes exige rolar muito - este caminho
     resolve em dois cliques e usa o mesmo motor de pendentes. */
  escolherStatus(itemId){
    const i=S.db.itens.find(x=>x.item===itemId); if(!i) return;
    const fams=R.familias().slice().sort((a,b)=>a.ordem-b.ordem);
    this.modal(`${LANG==="pt"?"Status do item":"Item status"} ${itemId}`,
      `<div class="rowflex" style="margin-bottom:14px">
       <span class="muted">${LANG==="pt"?"Atual":"Current"}:</span>
       <span class="pill" style="background:${R.corDe(i.status)}22;color:${R.corDe(i.status)};
         border-color:${R.corDe(i.status)}">${esc(i.status)}</span></div>
     ${fams.map(f=>{
       const l=S.db.config.status.filter(x=>x.familia===f.id && (x.ativo||x.codigo===i.status));
       if(!l.length) return "";
       return `<div style="margin-bottom:12px">
         <div style="font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
           color:var(--fg-3);margin-bottom:6px">${esc(R.nomeFamilia(f.id))}</div>
         <div style="display:grid;gap:6px">${l.map(o=>`
           <button class="btn" data-s="${esc(o.codigo)}" style="text-align:left;padding:10px 13px;font-size:13px;
             ${o.codigo===i.status?"border-color:var(--accent);background:var(--accent-soft)":""}">
             <i class="dot" style="background:${R.corDe(o.codigo)};display:inline-block;margin-right:9px;
               width:10px;height:10px"></i>${esc(o.codigo)}
             ${o.codigo===i.status?`<span class="tag" style="margin-left:8px">${LANG==="pt"?"atual":"current"}</span>`:""}
           </button>`).join("")}</div></div>`;}).join("")}
     <label class="fld"><span>${LANG==="pt"?"Data efetiva":"Effective date"}</span>
       <input type="date" id="esData" value="${hoje()}" max="${hoje()}"></label>`,
      [{txt:T("cancelar"),cls:"btn",fn:()=>this.fechar()}]);
    $$("#ov button[data-s]").forEach(b=>b.onclick=()=>{
      if(b.dataset.s!==i.status){
      Pend.alterar(itemId,"status",b.dataset.s,{dataEfetiva:$("#esData").value||hoje()});
      toast(`${itemId}: ${b.dataset.s}`,"ok");
      }
      this.fechar(); Render.atual();});
  },

  /* ---- kanban: mover card ---- */
  moverPara(itemId, familia){
    const i=S.db.itens.find(x=>x.item===itemId); if(!i) return;
    if(R.familiaDe(i.status)===familia){
      return toast(LANG==="pt"?"O item já está nesta categoria":"Item is already in this category");
    }
    const todos  = S.db.config.status.filter(s=>s.familia===familia);
    const ativos = todos.filter(s=>s.ativo);
    /* Se a categoria não tem status ativo, oferecemos os inativos mesmo assim:
       recusar o arraste em silêncio é pior do que perguntar. */
    const opcoes = ativos.length? ativos : todos;
    if(!opcoes.length){
      return toast(LANG==="pt"?"Esta categoria não tem nenhum status configurado"
                             :"This category has no configured status","bad");
    }
    if(opcoes.length===1){
      Pend.alterar(itemId,"status",opcoes[0].codigo);
      Render.atual();
      return toast(`${itemId}: ${opcoes[0].codigo}`,"ok");
    }
    this.modal(`${itemId} → ${R.nomeFamilia(familia)}`,
      `<div class="rowflex" style="margin-bottom:12px">
         <span class="muted">${LANG==="pt"?"Status atual":"Current status"}:</span>
         <span class="pill" style="background:${R.corDe(i.status)}22;color:${R.corDe(i.status)};
           border-color:${R.corDe(i.status)}">${esc(i.status)}</span></div>
       <p class="muted">${LANG==="pt"?"Esta categoria tem mais de um status. Escolha qual aplicar:"
                                    :"This category has more than one status. Pick which one to apply:"}</p>
       <div style="display:grid;gap:8px;margin-top:11px">${opcoes.map(o=>`
         <button class="btn" data-s="${esc(o.codigo)}" style="text-align:left;padding:11px 14px;font-size:13px">
           <i class="dot" style="background:${R.corDe(o.codigo)};display:inline-block;margin-right:9px;
             width:10px;height:10px"></i>${esc(o.codigo)}
           ${o.ativo?"":`<span class="tag" style="margin-left:8px">${LANG==="pt"?"inativo":"inactive"}</span>`}
         </button>`).join("")}</div>
       <label class="fld" style="margin-top:14px"><span>${LANG==="pt"?"Data efetiva":"Effective date"}</span>
         <input type="date" id="kData" value="${hoje()}" max="${hoje()}"></label>`,
      [{txt:T("cancelar"),cls:"btn",fn:()=>this.fechar()}]);
    $$("button[data-s]").forEach(b=>b.onclick=()=>{
      Pend.alterar(itemId,"status",b.dataset.s,{dataEfetiva:$("#kData").value||hoje()});
      this.fechar(); Render.atual(); toast(`${itemId}: ${b.dataset.s}`,"ok");});
  },


  async restaurar(nome){
    if(!confirmar(LANG==="pt"
      ? `Restaurar o backup ${nome}? A base atual será salva como backup antes.`
      : `Restore backup ${nome}? The current database is backed up first.`)) return;
    try{
      /* O que a restauracao apaga e a versao que esta NO DISCO, que pode ser de
         outra pessoa - nao a que temos em memoria. E dela que o backup tem de
         ser feito: gravar {forcar:true} por cima de um trabalho mais novo,
         guardando so o nosso, apagava o da outra pessoa sem deixar copia. */
      let disco = null;
      try{ disco = await Store.lerArquivo(); }
      catch(e){ if(Store.tipoErroLeitura(e) !== "INEXISTENTE") throw e; }
      const revDisco = disco?.meta?.revisao ?? 0;
      if(disco && revDisco !== Store.revisaoCarregada && !confirmar(LANG==="pt"
        ? `Atenção: ${disco?.meta?.ultimoAutor || "outra pessoa"} gravou a revisão ${revDisco} depois que você carregou esta base (revisão ${Store.revisaoCarregada}).\n\nA restauração substitui esse trabalho também. Uma cópia dele vai para backups/ antes. Continuar?`
        : `Warning: ${disco?.meta?.ultimoAutor || "someone else"} saved revision ${revDisco} after you loaded this database (revision ${Store.revisaoCarregada}).\n\nRestoring replaces that work too. A copy of it goes to backups/ first. Continue?`)) return;
      await Store.backup(disco ?? S.db, "pre-restauracao");
      const b=await Store.restaurarBackup(nome);
      const val = validarBase(b);
      if(!val.valido) return this.baseRecusada(nome, val, JSON.stringify(b,null,1));
      normalizar(b);
      /* A revisao so anda para a frente: se regredir, as outras sessoes deixam
         de reconhecer a base restaurada como mais nova que a delas. */
      b.meta.revisao = Math.max(revDisco, S.db?.meta?.revisao ?? 0);
      S.db=b; await Store.gravar(S.db,{forcar:true});
      Pend.diario=[]; S.sujo=false; Sync.ultimoMtime = await Store.mtime(); Sync.iniciar();
      Render.atual(); toast(LANG==="pt"?"Backup restaurado":"Backup restored","ok");
    }catch(e){ toast(mensagemArmazenamento(e),"bad"); }
  },
};
</script>
<script>
"use strict";
/* ============================= exportação =============================
   Uma unica porta para sair da base: mesma lista de campos, mesma escolha de
   colunas e mesmo saneamento para CSV, Excel, PDF e JSON. Antes cada tela
   montava o seu proprio CSV com a lista fixa de 20 colunas, e o "PDF" era o
   window.print() da tela como ela estava - a impressao saia com menu lateral,
   pilulas de filtro e a tabela cortada na largura da janela.               */

/* Texto que vai para um arquivo. Tres estragos nascem aqui e sao consertados
   aqui, nao em cada formato:
   1. caracteres de controle (o NUL que vem de celula de planilha antiga)
      cortam o arquivo no meio para a maior parte dos leitores - saem;
   2. quebra de linha DENTRO de uma celula e legal em CSV, mas so entre aspas e
      so com CRLF; muito leitor (e o proprio Excel no import automatico) quebra
      a linha ali e desalinha todo o resto do arquivo - vira separador visivel;
   3. \r solto e a origem classica do "arquivo corrompido": normaliza.      */
function limparTexto(v, {quebras="achatar"}={}){
  let t = String(v ?? "");
  t = t.replace(/\r\n?/g, "\n");
  t = t.replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g, "");
  if(quebras==="achatar") t = t.replace(/\n+/g, " · ").replace(/[ \t]{2,}/g," ").trim();
  return t;
}
/* Nome de arquivo que o Windows aceita: \ / : * ? " < > | e ponto no fim matam
   o download sem dizer por que. */
function nomeArquivo(base, ext){
  const limpo = String(base||"export").normalize("NFC")
    .replace(/[\\/:*?"<>|\u0000-\u001F]/g,"-").replace(/\s+/g," ").trim()
    .replace(/\.+$/,"").slice(0,90) || "export";
  return `${limpo}.${ext}`;
}

const Export = {
  /* Catalogo unico de campos exportaveis. `get` existe para o campo que nao e
     texto puro (lista, data, derivado) sair igual em todos os formatos. */
  CAMPOS:[
    {id:"item",                 pt:"Item",                  en:"Item"},
    {id:"status",               pt:"Actual Status",         en:"Actual Status"},
    {id:"inspType",             pt:"InspType",              en:"InspType"},
    {id:"insp",                 pt:"Insp",                  en:"Insp"},
    {id:"originalJx",           pt:"OriginalJx",            en:"OriginalJx"},
    {id:"actualJx",             pt:"ActualJx",              en:"ActualJx"},
    {id:"actualJxDescription",  pt:"ActualJxDescription",   en:"ActualJxDescription"},
    {id:"numAndDescription",    pt:"Nº and Description", en:"Nº and Description"},
    {id:"evidence",             pt:"Evidence",              en:"Evidence"},
    {id:"hullPassageParts",     pt:"HullPassageParts",      en:"HullPassageParts"},
    {id:"description",          pt:"Description",           en:"Description"},
    {id:"performance",          pt:"Performance",           en:"Performance"},
    {id:"mode",                 pt:"Mode",                  en:"Mode"},
    {id:"positionAC",           pt:"Position AC",           en:"Position AC"},
    {id:"bigram",               pt:"Bigram",                en:"Bigram",
      get:i=>(i.bigram||[]).join("; ")},
    {id:"sbr",                  pt:"SBR",                   en:"SBR"},
    {id:"ncr",                  pt:"NCR's",                 en:"NCR's"},
    {id:"tests",                pt:"Tests",                 en:"Tests"},
    {id:"updatedStatusObs",     pt:"Updated Status Obs",    en:"Updated Status Obs"},
    {id:"generalObs",           pt:"General Obs",           en:"General Obs"},
    {id:"b05",                  pt:"É B05",            en:"Is B05",
      get:i=>i.isB05? (LANG==="pt"?"Sim":"Yes") : (LANG==="pt"?"Não":"No")},
    {id:"familia",              pt:"Família do status", en:"Status family",
      get:i=>R.nomeFamilia(R.familiaDe(i.status))},
    {id:"emAberto",             pt:"Em aberto",             en:"Open",
      get:i=>R.aberto(i.status)? (LANG==="pt"?"Sim":"Yes") : (LANG==="pt"?"Não":"No")},
    {id:"criadoEm",             pt:"Criado em",             en:"Created",
      get:i=>fmtD(i.criadoEm)},
    {id:"ultimaAlteracaoStatus",pt:"Última mudança de status", en:"Last status change",
      get:i=>fmtD(i.ultimaAlteracaoStatus)},
    {id:"aging",                pt:"Aging (dias)",          en:"Aging (days)",
      get:i=>R.diasSemAtualizacao(i)},
    {id:"observacoes",          pt:"Observações", en:"Notes",
      get:i=>(S.db?.observacoes||[]).filter(o=>o.item===i.item)
              .map(o=>`${o.autor||"?"}: ${o.texto}`).join(" | ")},
  ],
  PADRAO:["item","status","inspType","insp","originalJx","actualJx","numAndDescription",
          "evidence","description","updatedStatusObs","generalObs","ncr","ultimaAlteracaoStatus","aging"],

  campo(id){ return this.CAMPOS.find(c=>c.id===id); },
  rotulo(c){ return LANG==="pt"? c.pt : c.en; },
  val(i,c){ return c.get? c.get(i) : (i[c.id] ?? ""); },

  /* A escolha de colunas fica no navegador de cada um, como a da tabela: e
     preferencia de quem exporta, nao dado da base. */
  escolhidas(){
    let l=null;
    try{ l = JSON.parse(localStorage.getItem("sm.exportCols")||"null"); }catch{}
    l = Array.isArray(l)? l.filter(id=>this.campo(id)) : null;
    return l?.length? l : [...this.PADRAO];
  },
  guardarColunas(l){ try{ localStorage.setItem("sm.exportCols", JSON.stringify(l)); }catch{} },
  opcoes(){
    let o=null;
    try{ o = JSON.parse(localStorage.getItem("sm.exportOpc")||"null"); }catch{}
    return Object.assign({sep:";", bom:true, quebras:"achatar",
                          orientacao:"paisagem", resumo:true, zebra:true,
                          layout:"tabela", kanbanAgrupar:"familia", kanbanColunas:"auto",
                          kanbanVazias:true, kanbanQuebra:"quadro",
                          kanbanDensidade:"compacto", kanbanEscala:100, cssExtra:"",
                          somenteAberto:false}, o||{});
  },
  guardarOpcoes(o){ try{ localStorage.setItem("sm.exportOpc", JSON.stringify(o)); }catch{} },

  defs(cols){ return (cols??this.escolhidas()).map(id=>this.campo(id)).filter(Boolean); },

  /* "Somente em aberto" e um recorte da EXPORTACAO, nao um filtro de tela: quem
     esta olhando a base inteira quer poder tirar dali so o que falta sem mexer
     nos filtros. Aplicado na porta de cada formato, entao CSV, Excel, JSON,
     relatorio e a previsao de paginas enxergam exatamente a mesma lista - e o
     resumo, que e calculado dentro de cada um, tambem. A regra e a mesma dos
     paineis (R.aberto), lida da config: nao ha uma segunda definicao de
     "pendente" para divergir. */
  recorte(lista, o){
    return o?.somenteAberto ? (lista||[]).filter(i=>R.aberto(i.status)) : (lista||[]);
  },

  /* Excel e LibreOffice executam o conteudo de uma celula que comeca por
     = + - @ (ou tabulacao/retorno de carro) MESMO entre aspas: um texto vindo
     da planilha de origem viraria formula na maquina de quem abre o CSV.
     O apostrofo desarma e continua legivel. */
  seguro(v){ const t=String(v??""); return /^[=+\-@\t\r]/.test(t) ? "'"+t : t; },

  /* ------------------------------- CSV -------------------------------- */
  /* Separador, BOM e tratamento de quebra de linha sao escolha de quem exporta:
     o ";" com BOM abre no Excel em portugues com um duplo-clique; a virgula sem
     BOM e o que um script em Python, R ou o Power BI espera. */
  textoCSV(lista, {cols, sep=";", quebras="achatar"}={}){
    const defs = this.defs(cols);
    const q = v => `"${this.seguro(limparTexto(v,{quebras})).replace(/"/g,'""')}"`;
    const linhas = [defs.map(c=>q(this.rotulo(c))).join(sep)];
    for(const i of lista) linhas.push(defs.map(c=>q(this.val(i,c))).join(sep));
    /* linha em branco no fim: sem ela alguns leitores comem o ultimo registro */
    return linhas.join("\r\n")+"\r\n";
  },
  csv(lista, opc={}){
    const o = Object.assign(this.opcoes(), opc);
    lista = this.recorte(lista, o);
    dl(nomeArquivo(o.nome || `itens-${hoje()}`,"csv"),
       (o.bom===false? "":"\ufeff")+this.textoCSV(lista,o), "text/csv;charset=utf-8");
  },
  historico(evs, opc={}){
    const o = Object.assign(this.opcoes(), opc);
    const q = v => `"${Export.seguro(limparTexto(v,{quebras:o.quebras})).replace(/"/g,'""')}"`;
    const h = LANG==="pt"
      ? ["Item","Campo","Valor anterior","Novo valor","Data efetiva","Consolidado em","Autor","Origem","Observação"]
      : ["Item","Field","Previous value","New value","Effective date","Consolidated at","Author","Source","Note"];
    const l = [h.map(q).join(o.sep)];
    for(const e of evs) l.push([e.item,e.campo,e.valorAnterior,e.valorNovo,fmtD(e.dataEfetiva),
                                fmtDT(e.consolidadoEm),e.autor,e.origem,e.observacao].map(q).join(o.sep));
    dl(nomeArquivo(o.nome || `historico-${hoje()}`,"csv"),
       (o.bom===false?"":"\ufeff")+l.join("\r\n")+"\r\n", "text/csv;charset=utf-8");
  },

  /* ------------------------------ resumo ------------------------------ */
  /* O mesmo resumo alimenta a aba "Resumo" do Excel e a capa do relatorio: um
     numero so pode sair diferente nos dois se o calculo for duplicado. */
  resumo(lista){
    const ef=M.evidenceFlow(lista), sy=M.shipyard(lista), fu=M.funcional(lista);
    const k=M.kpis(lista);
    const bloco=(titulo,b)=>({titulo, total:b.total, aberto:b.aberto,
      linhas:b.status.map(([s,n])=>({rotulo:s, n, pct:n/Math.max(b.total,1)*100, cor:R.corDe(s)}))});
    return {
      kpis:[[T("total"),k.total],[T("emAberto"),k.aberto],[T("validados"),k.validado],
            [T("conclusao"),(k.pct*100).toFixed(1)+"%"]],
      blocos:[
        bloco(LANG==="pt"?"Evidências somente B05":"Evidences only B05", ef.b05),
        bloco(LANG==="pt"?"Evidências exceto B05":"Evidences except B05", ef.exceto),
        bloco("Shipyard Prerequisites (ActualJx = J08)", sy),
      ],
      funcional:fu.linhas.filter(l=>l.total),
    };
  },

  /* ------------------------------- Excel ------------------------------ */
  /* SpreadsheetML 2003: o Excel abre nativamente, com várias abas e formatação. */
  excel(lista,titulo,opc={}){
    const o = Object.assign(this.opcoes(), opc);
    lista = this.recorte(lista, o);
    const defs = this.defs(o.cols);
    const x=s=>limparTexto(s,{quebras:"manter"})
      .replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c])).replace(/\n/g,"&#10;");
    const cel=(v,estilo="")=>`<Cell${estilo?` ss:StyleID="${estilo}"`:""}><Data ss:Type="String">${x(this.seguro(v))}</Data></Cell>`;
    const num=v=>`<Cell ss:StyleID="n"><Data ss:Type="Number">${Number.isFinite(+v)?+v:0}</Data></Cell>`;
    const aba=(nome,linhas,larguras)=>`<Worksheet ss:Name="${x(nome).slice(0,31)}"><Table>${
      larguras? larguras.map(w=>`<Column ss:AutoFitWidth="0" ss:Width="${w}"/>`).join("") : ""}${
      linhas.map(l=>`<Row>${l}</Row>`).join("")}</Table>
      <WorksheetOptions xmlns="urn:schemas-microsoft-com:office:excel"><FreezePanes/><SplitHorizontal>1</SplitHorizontal>
      <TopRowBottomPane>1</TopRowBottomPane><ActivePane>2</ActivePane></WorksheetOptions></Worksheet>`;

    const dados=[defs.map(c=>cel(this.rotulo(c),"h")).join("")]
      .concat(lista.map(i=>defs.map(c=>cel(this.val(i,c),"w")).join("")));
    const larg = defs.map(c=>{
      const curto = ["item","insp","originalJx","actualJx","aging","b05","emAberto"].includes(c.id);
      const longo = ["description","tests","updatedStatusObs","generalObs","evidence",
                     "numAndDescription","observacoes","actualJxDescription"].includes(c.id);
      return curto? 62 : longo? 230 : 110;
    });

    const r=this.resumo(lista);
    const resumo=[
      [cel("StatusMilestone — "+titulo,"t")].join(""),
      [cel(`${LANG==="pt"?"Gerado em":"Generated"} ${fmtDT(agora())} — ${Usuario.nome()}`)].join(""),
      [cel(`${LANG==="pt"?"Recorte":"Scope"}: ${this.descricaoFiltro()}`)].join(""),
      "",
      ...r.kpis.map(([lab,v])=>[cel(lab,"h"), /^\d+$/.test(String(v))? num(v) : cel(v)].join("")),
      "",
      ...r.blocos.flatMap(b=>[
        [cel(b.titulo.toUpperCase(),"h"),cel("","h"),cel("","h")].join(""),
        [cel(LANG==="pt"?"Total":"Total"),num(b.total),cel("")].join(""),
        [cel(LANG==="pt"?"Em aberto":"Remaining"),num(b.aberto),cel("")].join(""),
        ...b.linhas.map(l=>[cel(l.rotulo),num(l.n),cel(l.pct.toFixed(2)+"%")].join("")),
        "",
      ]),
      [cel("FUNCTIONAL INSP. TYPE","h"),cel(LANG==="pt"?"Em aberto":"Open","h"),
       cel(LANG==="pt"?"Anterior":"Previous","h"),cel("Δ","h"),cel("Total","h")].join(""),
      ...r.funcional.map(l=>[cel(l.tipo),num(l.atual),num(l.anterior),
        cel((l.delta>0?"▼-":l.delta<0?"▲+":"▬")+(l.delta?Math.abs(l.delta):"")),num(l.total)].join("")),
    ].filter(v=>v!=="").map(v=>v||cel(""));

    const alvos=new Set(lista.map(i=>i.item));
    const hist=(S.db?.historico||[]).filter(h=>alvos.has(h.item))
                .sort((a,b)=>String(b.dataEfetiva).localeCompare(String(a.dataEfetiva)));
    const cabH=LANG==="pt"?["Item","Campo","Anterior","Novo","Data efetiva","Autor","Observação"]
                          :["Item","Field","Previous","New","Effective date","Author","Note"];
    const abaHist=[cabH.map(v=>cel(v,"h")).join("")]
      .concat(hist.map(h=>[h.item,h.campo,h.valorAnterior,h.valorNovo,fmtD(h.dataEfetiva),h.autor,h.observacao]
        .map(v=>cel(v,"w")).join("")));

    const xml=`<?xml version="1.0"?><?mso-application progid="Excel.Sheet"?>
<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet"
 xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel"
 xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">
<Styles>
 <Style ss:ID="Default" ss:Name="Normal"><Alignment ss:Vertical="Top"/><Font ss:FontName="Calibri" ss:Size="10"/></Style>
 <Style ss:ID="h"><Font ss:Bold="1" ss:Color="#FFFFFF"/><Interior ss:Color="#2F5FA8" ss:Pattern="Solid"/>
   <Alignment ss:Vertical="Center"/></Style>
 <Style ss:ID="t"><Font ss:Bold="1" ss:Size="13"/></Style>
 <Style ss:ID="w"><Alignment ss:Vertical="Top" ss:WrapText="1"/></Style>
 <Style ss:ID="n"><NumberFormat ss:Format="0"/></Style>
</Styles>
${aba("Resumo",resumo)}${aba("Itens",dados,larg)}${aba(LANG==="pt"?"Historico":"History",abaHist)}
</Workbook>`;
    dl(nomeArquivo(o.nome || `statusmilestone-${hoje()}`,"xls"), xml, "application/vnd.ms-excel");
  },

  /* ------------------------------- JSON ------------------------------- */
  json(lista, opc={}){
    const o = Object.assign(this.opcoes(), opc);
    lista = this.recorte(lista, o);
    const defs = this.defs(o.cols);
    const corpo = {
      gerado:agora(), autor:Usuario.nome(), recorte:this.descricaoFiltro(),
      revisaoBase:S.db?.meta?.revisao ?? null,
      colunas:defs.map(c=>c.id), total:lista.length,
      itens: lista.map(i=>Object.fromEntries(defs.map(c=>[c.id, this.val(i,c)]))),
    };
    dl(nomeArquivo(o.nome || `itens-${hoje()}`,"json"), JSON.stringify(corpo,null,1), "application/json");
  },

  /* --------------------------- relatório PDF --------------------------- */
  descricaoFiltro(){
    const a = (typeof Filtros!=="undefined" && Filtros.ativos)? Filtros.ativos() : [];
    if(!a.length) return LANG==="pt"?"todos os itens da base":"all items in the database";
    return a.map(f=>f.rotulo).join(" · ");
  },
  /* O relatorio e um documento montado do zero - capa, resumo em numeros e o
     corpo -, nao a tela impressa. O corpo sai em dois formatos: a TABELA
     paginada (cabecalho repetido em toda pagina, linha que nao parte ao meio)
     ou o QUADRO, que reproduz o kanban em papel. Capa, resumo e folha de estilo
     sao os mesmos nos dois: o que muda e so o corpo. */

  /* --- agrupamentos possiveis do quadro --- */
  AGRUPAR:[
    {id:"familia", pt:"Coluna do Kanban (família do status)", en:"Kanban column (status family)",
     chave:i=>R.familiaDe(i.status), rotulo:k=>R.nomeFamilia(k), cor:k=>R.corFamilia(k),
     ordem:k=>R.familiaObj(k).ordem},
    {id:"status", pt:"Status", en:"Status",
     chave:i=>i.status||"", rotulo:k=>k||"—", cor:k=>R.corDe(k), ordem:k=>R.ordemDe(k)},
    {id:"inspType", pt:"InspType", en:"InspType", chave:i=>i.inspType||""},
    {id:"originalJx", pt:"OriginalJx", en:"OriginalJx", chave:i=>i.originalJx||""},
    {id:"actualJx", pt:"ActualJx", en:"ActualJx", chave:i=>i.actualJx||""},
    {id:"numAndDescription", pt:"Função vital", en:"Vital function", chave:i=>i.numAndDescription||""},
    {id:"insp", pt:"Insp", en:"Insp", chave:i=>i.insp||""},
  ],
  agrupamento(id){ return this.AGRUPAR.find(a=>a.id===id) || this.AGRUPAR[0]; },

  /* Divide a lista em colunas do quadro. A ordem das colunas segue a do
     dominio quando ela existe (familia, status); nos demais campos e
     alfabetica, que e a unica ordem defensavel para um texto livre. */
  colunasQuadro(lista, o){
    const ag = this.agrupamento(o.kanbanAgrupar);
    const mapa = new Map();
    for(const i of lista){
      const k = ag.chave(i);
      (mapa.get(k) ?? mapa.set(k,[]).get(k)).push(i);
    }
    /* Com "todas as colunas", as vazias do dominio tambem entram: um quadro em
       que "Bloqueado" aparece zerado diz mais do que um quadro sem a coluna. */
    if(o.kanbanVazias && ag.id==="familia")
      for(const f of R.familias()) if(!mapa.has(f.id)) mapa.set(f.id, []);
    if(o.kanbanVazias && ag.id==="status")
      for(const st of R.statusAtivos()) if(!mapa.has(st)) mapa.set(st, []);

    const chaves = [...mapa.keys()].sort((a,b)=>
      ag.ordem? (ag.ordem(a)-ag.ordem(b)) || String(a).localeCompare(String(b))
              : String(a).localeCompare(String(b), undefined, {numeric:true}));
    return chaves.map(k=>({
      chave:k,
      rotulo: ag.rotulo? ag.rotulo(k) : (String(k) || "—"),
      cor: ag.cor? ag.cor(k) : "#5b6472",
      itens: (mapa.get(k)||[]).slice().sort((a,b)=>
        String(a.item).localeCompare(String(b.item), undefined, {numeric:true})),
    }));
  },

  /* ------- as tres pecas comuns aos dois formatos ------- */
  cssRelatorio(o, paisagem){
    return `
  @page { size: A4 ${paisagem?"landscape":"portrait"}; margin: 12mm 10mm 14mm; }

  table.resumo th { background:none; color:#3a4150; text-transform:uppercase; font-size:9px; }
  td.st i { display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:6px; }

  td.bar span { display:block; height:7px; border-radius:3px; min-width:1px; }
  td.vazio { color:#9aa0aa; }
  .pill { display:inline-block; padding:1px 6px; border-radius:9px; font-size:9.5px; font-weight:600;
          border:1px solid currentColor; }
  footer { margin-top:14px; padding-top:7px; border-top:1px solid #d6d9e0; font-size:9px; color:#6b7280;
           display:flex; justify-content:space-between; gap:12px; }
  .nada { padding:22px; text-align:center; color:#6b7280; border:1px dashed #d6d9e0; border-radius:6px; }

    .folha { background:#fff; box-shadow:0 1px 6px rgba(0,0,0,.14); border-radius:4px; } }`;
  },
  /* ------- folha de estilo so do quadro -------
     Tudo aqui e dimensionado em `em` a partir de --q: mexer numa so variavel
     encolhe o cartao inteiro, junto com a fonte, o espacamento e a borda. E o
     que torna possivel caber um quadro grande numa pagina - com 428 itens e
     cartao completo nao cabe, e nenhuma escala resolve; o que cabe e a
     etiqueta. */
  cssQuadro(o){
    const esc0 = Math.min(140, Math.max(60, +o.kanbanEscala || 100)) / 100;
    const cols = o.kanbanColunas === "auto" ? null : Math.min(10, Math.max(1, +o.kanbanColunas || 4));
    const densidade = o.kanbanDensidade || "compacto";
    return `
  .quadro { --q:${(11*esc0).toFixed(2)}px; display:grid; gap:.8em; align-items:start; font-size:var(--q);
            grid-template-columns:${cols ? `repeat(${cols}, minmax(0,1fr))`
                                        : "repeat(auto-fit, minmax(12em, 1fr))"}; }
  .coluna { border:1px solid #dfe2e8; border-radius:.6em; overflow:hidden; background:#fbfcfd; font-size:1em; }
  .coluna > .topo { padding:.5em .8em; border-bottom:1px solid #dfe2e8; background:#f2f4f7;
            display:flex; align-items:center; gap:.6em; }
  .coluna > .topo i { width:.8em; height:.8em; border-radius:.2em; flex:none; }
  .coluna > .topo b { font-size:.88em; text-transform:uppercase; letter-spacing:.04em; flex:1;
            overflow-wrap:anywhere; line-height:1.3; }
  .coluna > .topo .qtd { font-size:1em; font-variant-numeric:tabular-nums; color:#6b7280; font-weight:700; }
  .cartoes { padding:.6em; display:flex; flex-direction:column; gap:.5em; }
  .cartao { border:1px solid #e3e6eb; border-left:.28em solid #999; border-radius:.45em; padding:.5em .7em;
            background:#fff; break-inside:avoid; page-break-inside:avoid; }
  .cartao .id { font-weight:700; font-size:1.03em; font-variant-numeric:tabular-nums; line-height:1.25; }
  .cartao .campo { margin-top:.25em; font-size:.85em; line-height:1.35; overflow-wrap:anywhere; }
  .cartao .campo b { color:#6b7280; font-weight:600; text-transform:uppercase; font-size:.8em;
            letter-spacing:.04em; display:block; }
  .coluna.vazia .cartoes { padding:1em .6em; color:#9aa0aa; font-size:.9em; text-align:center; }
  .porpagina { break-after:page; page-break-after:always; }
  .porpagina:last-child { break-after:auto; page-break-after:auto; }
${densidade==="compacto" ? `
  /* Compacto: o rotulo do campo sai (o cartao ja e curto o bastante para se
     ler sem ele) e tudo encosta. */
  .cartao { padding:.35em .55em; }
  .cartao .campo { margin-top:.15em; font-size:.82em; }
  .cartao .campo b { display:none; }
  .cartoes { gap:.35em; padding:.45em; }` : ""}
${densidade==="etiqueta" ? `
  /* Etiqueta: so o codigo do item, colorido pelo status. E o unico formato em
     que uma base inteira cabe em uma pagina - 428 etiquetas cabem, 428 cartoes
     completos nao cabem em escala nenhuma. */
  .cartoes { flex-direction:row; flex-wrap:wrap; gap:.3em; padding:.5em; }
  .cartao { border-left-width:1px; border-radius:.9em; padding:.15em .55em; }
  .cartao .id { font-size:.95em; }
  .cartao .campo { display:none; }` : ""}`;
  },
  capaHTML(lista, titulo, o, subtitulo){
    const e = v => esc(limparTexto(v,{quebras:"achatar"}));
    return `<header class="capa">
    <div class="marca">StatusMilestone — J08</div>
    <h1>${esc(titulo)}</h1>
    <dl>
      <dt>${LANG==="pt"?"Recorte":"Scope"}</dt><dd>${e(this.descricaoFiltro())}${
        o.somenteAberto? ` · ${LANG==="pt"?"somente em aberto":"open items only"}` : ""}</dd>
      ${subtitulo?`<dt>${LANG==="pt"?"Formato":"Layout"}</dt><dd>${e(subtitulo)}</dd>`:""}
      <dt>${LANG==="pt"?"Itens":"Items"}</dt><dd>${lista.length}</dd>
      <dt>${LANG==="pt"?"Gerado em":"Generated"}</dt><dd>${esc(fmtDT(agora()))}</dd>
      <dt>${LANG==="pt"?"Por":"By"}</dt><dd>${esc(Usuario.nome()||"—")}</dd>
      <dt>${LANG==="pt"?"Revisão da base":"Database revision"}</dt><dd>${esc(String(S.db?.meta?.revisao ?? "—"))}</dd>
    </dl>
  </header>`;
  },
  resumoDocHTML(lista, o){
    if(!o.resumo) return "";
    const r = this.resumo(lista);
    const e = v => esc(limparTexto(v,{quebras:"achatar"}));
    const barra = b => b.linhas.map(l=>`
      <tr><td class="st"><i style="background:${l.cor}"></i>${e(l.rotulo)}</td>
        <td class="n">${l.n}</td><td class="n">${l.pct.toFixed(1)}%</td>
        <td class="bar"><span style="width:${l.pct.toFixed(1)}%;background:${l.cor}"></span></td></tr>`).join("");
    return `
      <section>
        <h2>${LANG==="pt"?"Resumo":"Summary"}</h2>
        <div class="kpis">${r.kpis.map(([lab,v])=>`
          <div class="kpi"><span class="lab">${e(lab)}</span><b>${e(v)}</b></div>`).join("")}</div>
        ${r.blocos.map(b=>`
          <h3>${e(b.titulo)} <span class="sub">${b.aberto} ${LANG==="pt"?"em aberto de":"open of"} ${b.total}</span></h3>
          <table class="resumo"><tbody>${barra(b)||`<tr><td colspan="4" class="vazio">—</td></tr>`}</tbody></table>`).join("")}
        ${r.funcional.length?`
          <h3>Functional Insp. Type</h3>
          <table class="resumo"><thead><tr><th>${LANG==="pt"?"Tipo":"Type"}</th>
            <th class="n">${LANG==="pt"?"Em aberto":"Open"}</th><th class="n">${LANG==="pt"?"Anterior":"Previous"}</th>
            <th class="n">Δ</th><th class="n">Total</th></tr></thead><tbody>
            ${r.funcional.map(l=>`<tr><td>${e(l.tipo)}</td><td class="n">${l.atual}</td>
              <td class="n">${l.anterior}</td>
              <td class="n" style="color:${l.delta>0?"#2f7a4f":l.delta<0?"#b3403a":"#777"}">${
                l.delta>0?"−"+l.delta : l.delta<0? "+"+Math.abs(l.delta) : "—"}</td>
              <td class="n">${l.total}</td></tr>`).join("")}
          </tbody></table>`:""}
      </section>`;
  },
  rodapeHTML(){
    const rev = String(S.db?.meta?.revisao ?? "—");
    return `<footer>
    <span>StatusMilestone · ${esc(fmtDT(agora()))} · ${esc(Usuario.nome()||"—")}</span>
    <span>database.json · ${LANG==="pt"?"revisão":"revision"} ${esc(rev)}</span>
  </footer>`;
  },
  /* CSS de quem exporta: entra por ULTIMO, entao vence o nosso sem !important.
     E a porta para ajustar o relatorio sem mexer no sistema - e o que sai no
     arquivo HTML, que da para abrir e continuar editando. Vai como texto dentro
     de <style>: o unico jeito de escapar dali seria fechar a tag, e e isso que
     a limpeza abaixo impede. */
  cssDoUsuario(css){
    return String(css||"").replace(/<\/?(style|script)/gi, "/*$&*/").slice(0, 20000);
  },
  moldura(titulo, o, paisagem, extraCSS, corpo){
    const meu = this.cssDoUsuario(o.cssExtra);
    return `<!doctype html><html lang="${LANG==="pt"?"pt-BR":"en"}"><head><meta charset="utf-8">
<title>${esc(titulo)} — StatusMilestone</title>
<style>${this.cssRelatorio(o, paisagem)}${extraCSS||""}
${meu? `\n/* ----- ajustes de quem exportou (Exportar > Aparência do quadro) ----- */\n${meu}` : ""}
</style></head><body><div class="folha">
${corpo}
${this.rodapeHTML()}
</div></body></html>`;
  },

  /* ---------------------- corpo 1: a tabela paginada ------------------- */
  docHTML(lista, titulo, o){
    const defs = this.defs(o.cols);
    const paisagem = o.orientacao!=="retrato";
    const e = v => esc(limparTexto(v,{quebras:o.quebras==="manter"?"manter":"achatar"}));
    /* Largura por coluna: sem isto o texto longo empurra tudo e a tabela sai
       com a coluna do Item com 2 cm e a descricao espremida. */
    const larguras = defs.map(c=>{
      const w = {item:6, status:13, aging:5, insp:6, originalJx:6, actualJx:6, criadoEm:7,
                 ultimaAlteracaoStatus:8, b05:5, emAberto:5, familia:8}[c.id];
      return w ?? (["description","tests","updatedStatusObs","generalObs","evidence",
                    "numAndDescription","observacoes","actualJxDescription"].includes(c.id) ? 16 : 9);
    });
    const soma = larguras.reduce((a,b)=>a+b,0) || 1;

    const corpo = `${this.capaHTML(lista, titulo, o)}
  ${this.resumoDocHTML(lista, o)}
  <h2>${LANG==="pt"?"Itens":"Items"} <span style="font-weight:400;color:#6b7280">(${lista.length})</span></h2>
  ${lista.length? `<table class="itens">
    <colgroup>${larguras.map(w=>`<col style="width:${(w/soma*100).toFixed(2)}%">`).join("")}</colgroup>
    <thead><tr>${defs.map(c=>`<th class="${c.id==="aging"?"n":""}">${esc(this.rotulo(c))}</th>`).join("")}</tr></thead>
    <tbody>${lista.map(i=>`<tr>${defs.map(c=>{
      if(c.id==="status"){ const cor=R.corDe(i.status);
        return `<td><span class="pill" style="color:${cor};background:${cor}1a">${e(i.status)}</span></td>`; }
      if(c.id==="aging") return `<td class="n">${e(this.val(i,c))}</td>`;
      return `<td>${e(this.val(i,c))||'<span style="color:#b6bac2">—</span>'}</td>`;
    }).join("")}</tr>`).join("")}</tbody></table>`
   : `<div class="nada">${LANG==="pt"?"Nenhum item neste recorte.":"No items in this scope."}</div>`}`;
    return this.moldura(titulo, o, paisagem, "", corpo);
  },

  /* ---------------------- corpo 2: o quadro (kanban) ------------------- */
  /* O quadro em papel. As colunas sao o agrupamento escolhido e cada cartao
     traz as MESMAS colunas escolhidas na janela de exportacao: a primeira e o
     titulo do cartao, o status vira a pilula colorida e o resto sai como
     rotulo + valor. Assim nao ha uma segunda lista de campos para manter.    */
  docKanbanHTML(lista, titulo, o){
    const defs = this.defs(o.cols);
    const ag = this.agrupamento(o.kanbanAgrupar);
    const colunas = this.colunasQuadro(lista, o);
    /* Um quadro quer largura: o retrato so e respeitado se a pessoa pedir. */
    const paisagem = o.orientacao!=="retrato";
    const e = v => esc(limparTexto(v,{quebras:o.quebras==="manter"?"manter":"achatar"}));
    const porPagina = o.kanbanQuebra==="pagina";

    /* O primeiro campo escolhido vira o titulo do cartao; se "item" estiver na
       lista ele ganha a vez, porque e o que identifica a linha para quem le. */
    const tituloCampo = defs.find(c=>c.id==="item") || defs[0];
    const corpoCampos = defs.filter(c=>c!==tituloCampo);

    const cartao = i => {
      const cor = R.corDe(i.status);
      const temStatus = corpoCampos.some(c=>c.id==="status");
      return `<div class="cartao" style="border-left-color:${cor}">
        <div class="id">${e(tituloCampo? this.val(i,tituloCampo) : i.item)}</div>
        ${temStatus?`<div class="campo"><span class="pill" style="color:${cor};background:${cor}1a">${e(i.status)}</span></div>`:""}
        ${corpoCampos.filter(c=>c.id!=="status").map(c=>{
          const v = e(this.val(i,c));
          return v? `<div class="campo"><b>${esc(this.rotulo(c))}</b>${v}</div>` : "";
        }).join("")}
      </div>`;
    };
    const colunaHTML = col => `<div class="coluna${col.itens.length?"":" vazia"}">
        <div class="topo"><i style="background:${col.cor}"></i><b>${e(col.rotulo)}</b>
          <span class="qtd">${col.itens.length}</span></div>
        <div class="cartoes">${col.itens.length? col.itens.map(cartao).join("")
          : (LANG==="pt"?"nenhum item":"no items")}</div>
      </div>`;

    const quadro = !colunas.length
      ? `<div class="nada">${LANG==="pt"?"Nenhum item neste recorte.":"No items in this scope."}</div>`
      : porPagina
        /* uma coluna por pagina: para um quadro grande, e a unica forma de o
           cartao sair legivel em papel em vez de espremido em 4 cm. */
        ? colunas.map(col=>`<section class="porpagina">
            <h2>${e(col.rotulo)} <span style="font-weight:400;color:#6b7280">(${col.itens.length})</span></h2>
            <div class="quadro" style="grid-template-columns:repeat(${Math.min(3,o.kanbanColunas||3)},minmax(0,1fr))">
              ${col.itens.length? col.itens.map(cartao).join("")
                : `<div class="nada">${LANG==="pt"?"nenhum item":"no items"}</div>`}
            </div></section>`).join("")
        : `<div class="quadro">${colunas.map(colunaHTML).join("")}</div>`;

    const corpo = `${this.capaHTML(lista, titulo, o,
        `${LANG==="pt"?"quadro por":"board by"} ${LANG==="pt"?ag.pt:ag.en}`)}
  ${this.resumoDocHTML(lista, o)}
  <h2>${LANG==="pt"?"Quadro":"Board"} <span style="font-weight:400;color:#6b7280">(${
      colunas.length} ${LANG==="pt"?"colunas":"columns"} · ${lista.length} ${LANG==="pt"?"itens":"items"})</span></h2>
  ${quadro}`;
    return this.moldura(titulo, o, paisagem, this.cssQuadro(o), corpo);
  },

  /* Uma porta so: quem chama pede o documento e o formato decide o corpo. */
  documento(lista, titulo, o){
    lista = this.recorte(lista, o);
    return o.layout==="kanban"? this.docKanbanHTML(lista, titulo, o)
                              : this.docHTML(lista, titulo, o);
  },
  /* Quantas paginas isto vai dar? A conta nao e estimada a partir de um modelo
     de altura de cartao - seria chute, e chute errado e pior que nenhum. O
     documento e montado de verdade num quadro escondido com a largura util da
     folha e o que se le e a altura real. O numero e aproximado so porque o
     Chrome ajusta a escala na hora de imprimir, e isso esta dito na tela. */
  A4:{paisagem:{l:297,a:210}, retrato:{l:210,a:297}}, MM_PX:96/25.4,
  async previsaoPaginas(lista, titulo, opc={}){
    const o = Object.assign(this.opcoes(), opc);
    const pag = this.A4[o.orientacao==="retrato"?"retrato":"paisagem"];
    const larguraPx = (pag.l - 20) * this.MM_PX;       /* margens de 10mm dos dois lados */
    const alturaPx  = (pag.a - 26) * this.MM_PX;       /* 12mm em cima, 14mm embaixo */
    const html = this.documento(lista, titulo, o);
    return new Promise(resolve=>{
      const f = document.createElement("iframe");
      f.setAttribute("aria-hidden","true");
      f.style.cssText = `position:fixed;left:-10000px;top:0;border:0;width:${Math.round(larguraPx)}px;height:${Math.round(alturaPx)}px;visibility:hidden`;
      let respondido = false;
      const responder = v => { if(respondido) return; respondido = true; f.remove(); resolve(v); };
      f.onload = ()=>{
        try{
          const d = f.contentDocument;
          const alt = Math.max(d.documentElement.scrollHeight, d.body.scrollHeight);
          const larg = Math.max(d.documentElement.scrollWidth, d.body.scrollWidth);
          responder({paginas: Math.max(1, Math.ceil(alt/alturaPx)),
                     cortaNaLargura: larg > Math.round(larguraPx)+2});
        }catch{ responder(null); }
      };
      f.srcdoc = html;
      document.body.append(f);
      setTimeout(()=>responder(null), 8000);          /* nunca deixa a janela pendurada */
    });
  },

  /* "Cabe em uma pagina" sem chute: a escada vai do mais legivel ao mais
     apertado e cada degrau e MEDIDO. Para no primeiro que couber, entao o
     resultado e sempre o cartao mais legivel que ainda cabe - nao o menor.
     Se nem o ultimo degrau couber, diz isso em vez de entregar um quadro
     cortado fingindo que coube. */
  ESCADA:[
    {kanbanDensidade:"completo", kanbanEscala:100},
    {kanbanDensidade:"completo", kanbanEscala:90},
    {kanbanDensidade:"completo", kanbanEscala:80},
    {kanbanDensidade:"compacto", kanbanEscala:100},
    {kanbanDensidade:"compacto", kanbanEscala:90},
    {kanbanDensidade:"compacto", kanbanEscala:80},
    {kanbanDensidade:"compacto", kanbanEscala:70},
    {kanbanDensidade:"etiqueta", kanbanEscala:100},
    {kanbanDensidade:"etiqueta", kanbanEscala:85},
    {kanbanDensidade:"etiqueta", kanbanEscala:70},
    {kanbanDensidade:"etiqueta", kanbanEscala:60},
  ],
  rotuloDegrau(d){
    const nome = {completo: LANG==="pt"?"Completo":"Full",
                  compacto: LANG==="pt"?"Compacto":"Compact",
                  etiqueta: LANG==="pt"?"Etiqueta":"Chip"}[d.kanbanDensidade];
    return `${nome} ${d.kanbanEscala}%`;
  },
  async ajustarParaCaber(lista, titulo, opc={}, {paginas=1}={}){
    const base = Object.assign(this.opcoes(), opc, {layout:"kanban"});
    const tentativas = [];
    /* O resumo ocupa quase meia folha. Enquanto ele estiver ligado, a escada
       corre com ele; se nada couber, corre de novo sem ele antes de desistir -
       e diz que desligou, porque isso muda o que sai no papel. */
    for(const semResumo of (base.resumo? [false, true] : [false])){
      for(const degrau of this.ESCADA){
        const o = {...base, ...degrau, resumo: base.resumo && !semResumo};
        const r = await this.previsaoPaginas(lista, titulo, o);
        if(!r) return {erro:"medicao"};
        tentativas.push({...degrau, semResumo, paginas:r.paginas});
        if(r.paginas <= paginas && !r.cortaNaLargura)
          return {o, degrau, semResumo, paginas:r.paginas, tentativas};
      }
    }
    return {naoCoube:true, tentativas,
            melhor: tentativas.reduce((a,b)=>b.paginas<a.paginas?b:a, tentativas[0])};
  },

  /* Imprime num quadro escondido: nao depende de o navegador liberar janela
     nova (bloqueador de pop-up e o padrao em muita instalacao corporativa) e
     nao mexe na tela que a pessoa esta usando. */
  pdf(lista, titulo, opc={}){
    const o = Object.assign(this.opcoes(), opc);
    this.imprimirHTML(this.documento(lista, titulo, o));
  },
  /* A impressao separada do que se imprime: o waiver e um documento de outra
     forma, mas passa pelo mesmo quadro escondido - e por ele que se escapa do
     bloqueador de pop-up das instalacoes corporativas. */
  imprimirHTML(html){
    try{
      $("#quadroImpressao")?.remove();
      const f = document.createElement("iframe");
      f.id = "quadroImpressao";
      f.setAttribute("aria-hidden","true");
      f.style.cssText = "position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden";
      f.onload = ()=>{
        try{ f.contentWindow.focus(); f.contentWindow.print(); }
        catch{ this.pdfJanela(html); }
        /* o quadro nao pode sair antes de a caixa de impressao terminar de ler */
        setTimeout(()=>f.remove(), 60000);
      };
      f.srcdoc = html;
      document.body.append(f);
      toast(LANG==="pt"?'Relatório montado — escolha "Salvar como PDF" na caixa de impressão'
                       :'Report built — pick "Save as PDF" in the print dialog',"ok");
    }catch{ this.pdfJanela(html); }
  },
  pdfJanela(html){
    const w = window.open("","_blank");
    if(!w) return toast(LANG==="pt"?"O navegador bloqueou a janela do relatório"
                                   :"The browser blocked the report window","bad");
    w.document.write(html); w.document.close();
    setTimeout(()=>{ try{ w.focus(); w.print(); }catch{} }, 350);
  },
  /* O mesmo relatorio como arquivo: da para anexar num e-mail sem passar pela
     caixa de impressao, e abre igual em qualquer maquina. */
  html(lista, titulo, opc={}){
    const o = Object.assign(this.opcoes(), opc);
    dl(nomeArquivo(o.nome || `relatorio-${hoje()}`,"html"),
       this.documento(lista, titulo, o), "text/html;charset=utf-8");
  },

          : "Board selectors: <code>.quadro</code> (the grid), <code>.coluna</code>, <code>.coluna &gt; .topo</code>, <code>.cartoes</code>, <code>.cartao</code>, <code>.cartao .id</code>, <code>.cartao .campo</code>, <code>.pill</code>. The <code>--q</code> variable on <code>.quadro</code> is the base size: almost everything is in <code>em</code>, so changing it shrinks the whole card. It is remembered for next time — and ships inside the <b>HTML</b> file, which you can open and keep editing."}</p>

        : "The <b>PDF report</b> opens the browser print dialog: pick <b>Save as PDF</b>. It is a document of its own — cover, summary and paginated table with a repeating header — not a screenshot. The <b>HTML</b> button saves the same document as a file, to attach to an e-mail."}</p>`,
      [{txt:"CSV",   cls:"btn", fn:()=>sair(opc=>this.csv(lista,opc))},
       {txt:"Excel", cls:"btn", fn:()=>sair(opc=>this.excel(lista,titulo,opc))},
       {txt:"JSON",  cls:"btn", fn:()=>sair(opc=>this.json(lista,opc))},
       {txt:"HTML",  cls:"btn", fn:()=>sair(opc=>this.html(lista,titulo,opc))},
       {txt:LANG==="pt"?"Relatório PDF":"PDF report", cls:"btn pri", fn:()=>sair(opc=>this.pdf(lista,titulo,opc))}]);

    const conta = ()=>{ const el=$("#xConta"); if(el) el.textContent=$$(".chip[data-xc].on").length; };
    $$("[data-xc]").forEach(c=>c.onclick=()=>{ c.classList.toggle("on"); conta(); });

    $("#xDaTabela").onclick= ()=>marcar(Colunas.escolhidas().filter(id=>this.campo(id)));

    const trocouLayout = ()=>{ const bl=$("#xKanban");
