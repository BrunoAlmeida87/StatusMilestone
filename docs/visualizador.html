<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StatusMilestone — Visualizador</title>
<style>
/* Tema: superfícies mais quentes, contraste suave, cantos arredondados e
   respiro maior. O azul só aparece onde há ação. */
:root{
  --bg:#eef0f4; --panel:#ffffff; --panel-2:#f5f7fa; --line:#b9c2d0; --line-2:#dbe1ea;
  --fg:#1f2430; --fg-2:#596273; --fg-3:#8b93a3;
  --accent:#2a78d6; --accent-fg:#ffffff; --accent-soft:#e8f0fb;
  --ok:#0ca30c; --warn:#d99400; --bad:#d03b3b; --info:#2a78d6; --neutral:#8b93a3; --orange:#eb6834;
  --chg:#fff3c4; --chg-line:#eda100;
  --radius:12px;
  --shadow:0 1px 2px rgba(23,28,40,.04), 0 2px 8px rgba(23,28,40,.05);
  --shadow-2:0 4px 16px rgba(23,28,40,.08);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1218; --panel:#181c23; --panel-2:#20262f; --line:#454f5e; --line-2:#333b47;
  --fg:#e8ebf0; --fg-2:#a8b1c0; --fg-3:#78818f;
  --accent:#5b9ae8; --accent-fg:#0b1016; --accent-soft:#1b2734;
  --ok:#3fbf3f; --warn:#e0a92a; --bad:#e26b6b; --info:#5b9ae8; --neutral:#78818f; --orange:#e8834f;
  --chg:#3d3417; --chg-line:#c99a1e;
  --shadow:0 1px 2px rgba(0,0,0,.28), 0 2px 10px rgba(0,0,0,.24);
  --shadow-2:0 6px 22px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --bg:#0f1218; --panel:#181c23; --panel-2:#20262f; --line:#454f5e; --line-2:#333b47;
  --fg:#e8ebf0; --fg-2:#a8b1c0; --fg-3:#78818f;
  --accent:#5b9ae8; --accent-fg:#0b1016; --accent-soft:#1b2734;
  --ok:#3fbf3f; --warn:#e0a92a; --bad:#e26b6b; --info:#5b9ae8; --neutral:#78818f; --orange:#e8834f;
  --chg:#3d3417; --chg-line:#c99a1e;
  --shadow:0 1px 2px rgba(0,0,0,.28), 0 2px 10px rgba(0,0,0,.24);
  --shadow-2:0 6px 22px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:13.5px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:620;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}

/* ---------- layout ---------- */
#app{display:grid;grid-template-columns:212px 1fr;min-height:100vh}
#side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:17px 17px 14px;border-bottom:1px solid var(--line-2)}
.brand b{display:block;font-size:15px;letter-spacing:-.025em}
.brand span{font-size:11px;color:var(--fg-3)}
nav{padding:8px;display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
nav button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 11px;border:0;border-radius:9px;
  background:transparent;color:var(--fg-2);cursor:pointer;text-align:left;font-size:13px}
nav button:hover{background:var(--line-2);color:var(--fg)}
nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:650;box-shadow:inset 3px 0 0 var(--accent)}
nav button .ic{width:15px;text-align:center;opacity:.85;font-size:13px}
nav button .cnt{margin-left:auto;font:600 10px/1.6 var(--mono);background:var(--bad);color:#fff;
  padding:0 5px;border-radius:9px;min-width:17px;text-align:center}
.sidefoot{padding:9px;border-top:1px solid var(--line-2);display:flex;flex-direction:column;gap:6px}
#main{min-width:0;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--panel) 92%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  padding:11px 22px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h2{font-size:17px;margin-right:auto;letter-spacing:-.02em}
main{padding:20px 22px 70px;min-width:0}

/* ---------- controles ---------- */
.btn{border:1px solid var(--line);background:var(--panel);padding:6px 13px;border-radius:9px;cursor:pointer;
  color:var(--fg-2);white-space:nowrap;font-size:12.5px;font-weight:500;transition:.12s}
.btn:hover{background:var(--line-2);color:var(--fg);border-color:var(--fg-3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.warn{border-color:var(--chg-line);color:var(--chg-line)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 10px;font-size:11.5px;border-radius:7px}
input[type=text],input[type=search],input[type=date],input[type=number],select,textarea{
  background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:6px 11px;outline:0;min-width:0;transition:.12s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
textarea{resize:vertical;font:inherit;width:100%}
label.fld{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--fg-3)}
label.fld>span{font-weight:600;text-transform:uppercase;letter-spacing:.04em;font-size:10px}

/* ---------- cards ---------- */
.panel{background:var(--panel);border:2px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0}
.panel>h3{padding:13px 17px;border-bottom:2px solid var(--line);background:var(--panel-2);border-radius:calc(var(--radius) - 2px) calc(var(--radius) - 2px) 0 0;font-size:11.5px;text-transform:uppercase;
  letter-spacing:.07em;color:var(--fg-2);display:flex;align-items:center;gap:9px;font-weight:700}
.panel[data-dobra]>h3{cursor:pointer;user-select:none}
.panel[data-dobra]>h3:hover{color:var(--fg)}
.panel>h3 .caret{color:var(--fg-3);font-size:10px;width:11px;flex:none;text-align:center}
.panel.recolhido>.corpo{display:none}
.panel.recolhido>h3{border-bottom:0;border-radius:calc(var(--radius) - 2px)}
.panel>h3 .sub{margin-left:auto;font:500 11px/1 var(--sans);text-transform:none;letter-spacing:0;color:var(--fg-3)}
.pad{padding:17px}
.grid{display:grid;gap:16px;min-width:0}
.grid>*{min-width:0}
.kpis{grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr))}
.kpi{background:var(--panel);border:2px solid var(--line);border-radius:var(--radius);padding:15px 17px;box-shadow:var(--shadow);
  border-top:4px solid var(--accent)}
.kpi .lab{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--fg-3);font-weight:600}
.kpi .val{font:700 30px/1.1 var(--sans);letter-spacing:-.03em;margin-top:5px}
.kpi .dlt{font-size:11.5px;margin-top:2px;color:var(--fg-3)}
.up{color:var(--ok)} .down{color:var(--bad)} .flat{color:var(--fg-3)}

/* ---------- tabela ---------- */
.tblwrap{overflow:auto;max-height:calc(100vh - 230px)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);border-right:1px solid var(--line-2);vertical-align:top}
th:last-child,td:last-child{border-right:0}
tbody tr:nth-child(even){background:var(--panel-2)}
thead th{position:sticky;top:0;z-index:2;background:var(--panel-2);font-size:10.5px;text-transform:uppercase;
  letter-spacing:.04em;color:var(--fg-2);font-weight:700;cursor:pointer;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;border-bottom:3px solid var(--line)}
thead th:hover{color:var(--fg)}
tbody tr{cursor:pointer;transition:background .1s}
tbody tr:hover{background:var(--accent-soft)}
/* Estado da gravacao: o ponto colorido le-se de longe; o texto some no
   celular, onde o espaco do cabecalho e disputado. */
.estado{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--fg-3)}
.estado .dot{width:9px;height:9px;border-radius:50%;background:var(--fg-3);flex:none}
.estado[data-e="alterado"] .dot{background:var(--chg-line)}
.estado[data-e="salvando"] .dot{background:var(--warn);animation:pulsa 1s ease-in-out infinite}
.estado[data-e="salvo"] .dot{background:var(--ok)}
.estado[data-e="falha"] .dot,.estado[data-e="conflito"] .dot{background:var(--bad)}
@keyframes pulsa{50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){.estado .dot{animation:none}}
tbody tr.sel{background:var(--accent-soft)}
tbody tr.cursor>td{box-shadow:inset 0 2px 0 var(--accent),inset 0 -2px 0 var(--accent)}
th.selcol,td.selcol{width:34px;text-align:center;padding-left:6px;padding-right:6px}
td.num{font:500 12px/1.5 var(--mono)}
.trunc{max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
/* leitura integral: desliga o corte e deixa o texto quebrar linha */
table.livre .trunc{max-width:none;white-space:pre-wrap;overflow:visible;word-break:break-word}
table.livre td{vertical-align:top}
.trunc[data-tip]{cursor:help;text-decoration:underline dotted var(--line);text-underline-offset:3px}
#tip{position:fixed;z-index:300;max-width:min(460px,86vw);background:var(--fg);color:var(--panel);
  padding:9px 12px;border-radius:9px;font-size:12px;line-height:1.55;box-shadow:0 10px 30px rgba(0,0,0,.34);
  pointer-events:none;white-space:pre-wrap;word-break:break-word;display:none}
#tip b{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;opacity:.62;margin-bottom:3px}

/* ---------- pills ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:11px;font-size:11px;
  font-weight:600;white-space:nowrap;border:1px solid transparent;line-height:1.7}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.tag{display:inline-block;padding:1px 7px;border-radius:6px;background:var(--line-2);color:var(--fg-2);
  font:600 10.5px/1.75 var(--mono);margin:1px 3px 1px 0;border:1px solid var(--line)}
.chgmark{background:var(--chg);border-left:3px solid var(--chg-line)!important}

/* ---------- kanban: colunas lado a lado (h) ou faixas empilhadas (v) ---------- */
.kb{display:flex;gap:12px}
.kb.v{flex-direction:column}
.kb.h{flex-direction:row;align-items:flex-start;overflow-x:auto;padding-bottom:10px}
.kb.h>.col{flex:0 0 306px;max-height:calc(100vh - 212px)}
.kb.h>.col.collapsed{flex:0 0 214px}
.kb.h .colh .ch{display:none}
.col{background:var(--panel);border:2px solid var(--line);border-radius:var(--radius);
  display:flex;flex-direction:column;box-shadow:var(--shadow);overflow:hidden;min-height:0}
.col.collapsed .colbody{display:none}
.colh{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;flex:none;
  border-left:7px solid transparent;border-bottom:2px solid var(--line);background:var(--panel-2)}
.colh:hover{background:var(--line-2)}
.colh .nm{font-weight:650;font-size:13.5px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;min-width:0;flex:1}
.colh .n{flex:none}
.colh .n{font:650 12px/1 var(--mono);color:var(--fg-2);background:var(--panel);
  border:1px solid var(--line);border-radius:10px;padding:3px 9px}
.colh .ch{margin-left:auto;display:flex;gap:6px;align-items:center}
.colh .caret{color:var(--fg-3);font-size:12px;width:14px;text-align:center}
.colbody{padding:12px;display:grid;gap:9px;overflow-y:auto;min-height:0}
.kb.v .colbody{grid-template-columns:repeat(auto-fill,minmax(min(232px,100%),1fr));max-height:430px}
.kb.h .colbody{grid-template-columns:1fr;flex:1 1 auto;max-height:none}
.col.over{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft),var(--shadow-2)}
.col.over .colbody{background:var(--accent-soft)}
.col.over .colh{background:var(--accent-soft)}
body.arrastando .col:not(.over){opacity:.72}
body.arrastando .colh{cursor:copy}
.card{-webkit-user-drag:element}
.card{background:var(--panel);border:2px solid var(--line);border-left-width:7px;border-radius:8px;
  padding:9px 11px;cursor:grab;font-size:12px;transition:border-color .12s,transform .12s}
.card:hover{border-color:var(--accent);transform:translateY(-1px)}
.card.dragging{opacity:.4}
.card .cid{font:700 13px/1.4 var(--mono)}
.card .cdesc{color:var(--fg-2);font-size:11.5px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden}
.card .cmeta{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}
.card .cst{display:flex;align-items:center;gap:6px;width:100%;margin-top:8px;padding:5px 8px;
  border:1px solid var(--line);border-radius:7px;background:var(--panel);cursor:pointer;
  font-size:10.5px;font-weight:600;text-align:left;transition:.12s}
.card .cst span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .cst b{opacity:.5;font-size:13px;line-height:1}
.card .cst:hover{background:var(--panel-2);filter:brightness(1.05)}
.colbody:empty,.colbody{min-height:84px}

/* ---------- modal ---------- */
.ov{position:fixed;inset:0;background:rgba(10,13,18,.55);display:flex;align-items:center;justify-content:center;
  z-index:100;padding:20px;backdrop-filter:blur(2px)}
.modal{background:var(--panel);border:2px solid var(--line);border-radius:16px;max-width:920px;width:100%;
  max-height:88vh;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.modal>header{border-radius:16px 16px 0 0;backdrop-filter:none;background:var(--panel)}
.modal .body{overflow:auto;padding:16px}
.modal footer{padding:11px 16px;border-top:1px solid var(--line-2);display:flex;gap:8px;justify-content:flex-end}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{border:0;background:transparent;padding:7px 12px;cursor:pointer;color:var(--fg-3);
  border-bottom:2px solid transparent;font-size:12.5px}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:620}

/* ---------- diversos ---------- */
.flow{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(135px,100%),1fr))}
.empty{text-align:center;padding:56px 20px;color:var(--fg-3)}
.empty h3{font-size:15px;color:var(--fg-2);margin-bottom:6px}
.toast{position:fixed;bottom:16px;right:16px;z-index:200;display:flex;flex-direction:column;gap:7px;align-items:flex-end}
.toast div{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);
  padding:9px 13px;border-radius:7px;box-shadow:0 6px 20px rgba(0,0,0,.18);animation:sl .2s;max-width:340px}
.toast div.ok{border-left-color:var(--ok)} .toast div.bad{border-left-color:var(--bad)}
@keyframes sl{from{opacity:0;transform:translateY(8px)}}
.rowflex{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.muted{color:var(--fg-3)}
.mono{font-family:var(--mono)}
.sep{height:1px;background:var(--line-2);margin:12px 0}
dl.kv{display:grid;grid-template-columns:150px 1fr;gap:5px 12px;margin:0;font-size:12.5px}
dl.kv dt{color:var(--fg-2);font-size:11px;text-transform:uppercase;letter-spacing:.03em;font-weight:600;padding-top:2px}
dl.kv dd{margin:0;white-space:pre-wrap;word-break:break-word}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:4px 12px;cursor:pointer;font-size:11.5px;transition:.12s}
.chip:hover{border-color:var(--fg-3)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
@media(max-width:860px){
  #app{grid-template-columns:minmax(0,1fr)}
  #side{position:sticky;top:0;z-index:40;height:auto;flex-direction:row;align-items:center;
    min-width:0;max-width:100%;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  nav{flex-direction:row;min-width:0;overflow-x:auto;padding:7px;gap:4px}
  nav button{padding:7px 10px}
  #main{min-width:0}
  main{padding:14px 14px 60px}
  header{padding:10px 14px}
  .brand,.sidefoot{display:none}
}
/* Telefone e tablet em pe: a tabela de itens vira uma pilha de cartoes, cada
   celula com o nome da coluna ao lado - oito colunas lado a lado nao cabem. */
@media(max-width:700px){
  #itensTbl{table-layout:auto!important}
  #itensTbl colgroup,#itensTbl thead{display:none}
  #itensTbl,#itensTbl tbody,#itensTbl tr,#itensTbl td{display:block;width:auto!important}
  #itensTbl tr{border:1px solid var(--line);border-radius:10px;margin:0 0 9px;padding:7px 10px;background:var(--panel)}
  #itensTbl tr.sel{background:var(--accent-soft)}
  #itensTbl td{border:0;padding:3px 0;display:flex;gap:10px;align-items:flex-start}
  #itensTbl td::before{content:attr(data-r);flex:0 0 38%;color:var(--fg-3);font-size:10.5px;
    text-transform:uppercase;letter-spacing:.04em;padding-top:2px}
  #itensTbl td.selcol{justify-content:flex-start}
  #itensTbl td.selcol::before{content:""}
  #itensTbl .trunc{max-width:none;white-space:normal;word-break:break-word}
  .tblwrap{max-height:none;overflow:visible}
}
@media print{#side,header,.noprint{display:none!important}#app{display:block}main{padding:0}}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand"><b>StatusMilestone</b><span id="brandsub">J08 &middot; Visualizador (somente leitura)</span></div>
    <nav id="nav"></nav>
    <div class="sidefoot">
      <button class="btn sm" id="btnTheme">◐ <span data-i="tema">Tema</span></button>
      <button class="btn sm" id="btnLang">🌐 PT / EN</button>
      <div class="muted" style="font-size:10px" id="whoami"></div>
    </div>
  </aside>
  <div id="main">
    <header>
      <h2 id="pageTitle">Dashboard</h2>
      <div id="headerExtra" class="rowflex noprint"></div>
      <div class="rowflex noprint">
        <span id="presenca" class="pill noprint" style="display:none;background:var(--accent-soft);
          color:var(--accent);border-color:var(--accent)"></span>
        <span id="saveState" class="estado" role="status" aria-live="polite" data-e="info"
          ><i class="dot"></i><span class="txt"></span></span>
      </div>
    </header>
    <main id="view"></main>
  </div>
</div>
<div class="toast" id="toast"></div>
<div id="tip"></div>
<script>
"use strict";
/* ==========================================================================
   StatusMilestone - sistema local de acompanhamento do fluxo de evidencias
   Interface HTML standalone. Os dados vivem num database.json numa pasta
   escolhida pelo usuario (local ou de rede) - nunca dentro deste arquivo.
   ========================================================================== */

/* ------------------------------- i18n ---------------------------------- */
const I18N = {
 pt:{dashboard:"Dashboard",itens:"Itens",kanban:"Kanban",historico:"Histórico",relatorios:"Relatórios",
   sobre:"Sobre a base",tema:"Tema",fluxo:"Evidence Flow",salvarAgora:"Salvar alterações agora",
   total:"Total de itens",emAberto:"Em aberto",validados:"Validados",conclusao:"Conclusão",
   alterados:"Alterados no ciclo",selecionarPasta:"Selecionar pasta da base",
   semBase:"Nenhuma base carregada",semBaseTxt:"Selecione a pasta onde fica o arquivo database.json. Pode ser uma pasta no seu computador ou na rede compartilhada.",
   buscar:"Buscar item, descrição, observação...",status:"Status",todos:"Todos",limpar:"Limpar filtros",
   detalhes:"Detalhes",observacoes:"Observações",dados:"Dados",salvar:"Salvar",cancelar:"Cancelar",fechar:"Fechar",
   pendentes:"pendentes",descartar:"Descartar pendentes",exportar:"Exportar",imprimir:"Imprimir",backup:"Backup",
   restaurar:"Restaurar",periodo:"Período",de:"De",ate:"Até",comparar:"Comparar",
   melhoraram:"Melhoraram",pioraram:"Pioraram",iguais:"Sem alteração",novos:"Novos itens",
   nenhumItem:"Nenhum item encontrado",obsNova:"Nova observação...",adicionar:"Adicionar",
   b05:"B05",naoB05:"Não B05",tipoInsp:"Tipo de inspeção",funcaoVital:"Função vital",
   origem:"Marco de origem",aging:"Aging",semAtualizacao:"Sem atualização",dias:"dias",
   evolucao:"Evolução",distribuicao:"Distribuição",campo:"Campo",anterior:"Anterior",novo:"Novo",
   data:"Data",autor:"Autor",item:"Item",acoes:"Ações",resolver:"Resolver",
   waivers:"Waivers"},
 en:{dashboard:"Dashboard",itens:"Items",kanban:"Kanban",historico:"History",relatorios:"Reports",
   sobre:"About",tema:"Theme",fluxo:"Evidence Flow",salvarAgora:"Save changes now",

/* Um download so acaba quando o navegador termina de LER o blob. Revogar a URL
   1,5 s depois do clique cortava o arquivo no meio quando a base era grande ou
   o destino era uma pasta de rede lenta - e o que chegava ao disco era um CSV
   truncado no meio de uma linha ("arquivo corrompido"). O minuto de folga custa
   memoria de nada e o blob e liberado de qualquer jeito ao fechar a aba. */
function dl(nome,conteudo,mime){
  const b=new Blob([conteudo],{type:mime||"text/plain;charset=utf-8"});
  const url=URL.createObjectURL(b);
  const a=document.createElement("a"); a.href=url; a.download=nome; a.rel="noopener";
  document.body.append(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 60000);
}

/* ------------------- IndexedDB: handle + copia de seguranca ------------- */
const IDB = (()=>{
  let dbp;
  const open = ()=> dbp ??= new Promise((res,rej)=>{
    const r = indexedDB.open("statusmilestone",1);
    r.onupgradeneeded = ()=>{ const d=r.result;
      if(!d.objectStoreNames.contains("kv")) d.createObjectStore("kv"); };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
  const tx = async (mode,fn)=>{ const d=await open(); return new Promise((res,rej)=>{
      const t=d.transaction("kv",mode), s=t.objectStore("kv"); const rq=fn(s);
      rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error); }); };
  return {
    get:k=>tx("readonly",s=>s.get(k)).catch(()=>null),
    set:(k,v)=>tx("readwrite",s=>s.put(v,k)).catch(()=>null),
  };
})();

/* --------------------------- camada de dados --------------------------- */
const Store = {
  dirHandle:null, fileHandle:null, revisaoCarregada:0, suportado:"showDirectoryPicker" in window,

  async restaurarHandle(){
    const h = await IDB.get("dirHandle"); if(!h) return false;
    try{
      if(await h.queryPermission({mode:"read"}) === "granted"){ this.dirHandle=h; return true; }
      this.dirHandlePendente = h; return false;
    }catch{ return false; }
  },
  async pedirPermissaoSalva(){
    const h=this.dirHandlePendente; if(!h) return false;
    if(await h.requestPermission({mode:"read"}) === "granted"){ this.dirHandle=h; return true; }
    return false;

  async escolherPasta(){
    this.dirHandle = await showDirectoryPicker({mode:"read", id:"statusmilestone"});

  /* Data de modificacao sem ler o conteudo: o polling so abre o arquivo quando muda. */
  async mtime(nome="database.json"){
    try{ const fh=await this.dirHandle.getFileHandle(nome); return (await fh.getFile()).lastModified; }
    catch{ return 0; }
  },
  async lerTexto(nome="database.json"){
    const fh = await this.dirHandle.getFileHandle(nome);
    return (await fh.getFile()).text();
  },
  async lerArquivo(nome="database.json"){
    return JSON.parse(await this.lerTexto(nome));

     como pasta vazia: permissao negada, JSON invalido ou falha de I/O sao coisas
     diferentes e, na hora de gravar, nenhuma delas autoriza sobrescrever. */
  tipoErroLeitura(e){
    if(e?.name === "NotFoundError") return "INEXISTENTE";
    if(e?.name === "NotAllowedError" || e?.name === "SecurityError") return "PERMISSAO";
    if(e instanceof SyntaxError) return "JSON_INVALIDO";
    return "LEITURA";
  },
  async carregar(){
    if(!this.dirHandle) throw new Error("sem pasta");
    let db;
    try{ db = await this.lerArquivo(); }
    catch(e){
      const tipo = this.tipoErroLeitura(e);
      if(tipo==="INEXISTENTE")   throw new Error("NAO_ENCONTRADO");
      if(tipo==="JSON_INVALIDO") throw new Error("CORROMPIDO: "+e.message);
      const err = new Error("LEITURA_"+tipo); err.causa=e; err.detalhe=e?.message||String(e);
      throw err;
    }
    this.revisaoCarregada = db?.meta?.revisao ?? 0;
    await IDB.set("espelho", db);
    return db;
  },
  /* Uma escrita por vez. Autosave, consolidacao manual, varredura automatica e
     resolucao de conflito podem disparar quase juntos; sem fila, dois writers
     abrem no mesmo arquivo. Uma falha nao trava a fila: a tarefa seguinte roda. */
  _fila:null,
  enfileirar(){
    return Promise.reject(new Error("SOMENTE_LEITURA"));
  },
  /* ----------------------------- a trava ---------------------------------
     A fila do Store serializa as gravacoes DESTA sessao; entre sessoes nao havia
     nada. Conferir meta.revisao antes de gravar e um check-then-use: entre reler
     o arquivo e fechar o writer cabe a gravacao inteira de outra pessoa, e o que
     se perdia ali nao ficava em lugar nenhum - nem no disco, nem em backups/ - e
     nem o polling via, porque a revisao no disco terminava igual a nossa.

     O File System Access nao tem escrita atomica, rename nem lock, entao nao da
     para tornar isto atomico de verdade. O que da e uma trava por arquivo, com
     dono e prazo: quem quer gravar le a trava, desiste se ela esta viva e e de
     outra pessoa, escreve a sua e RELE para ver se ficou sendo a dela. Duas
     sessoes que escrevem quase juntas leem depois das duas escritas, e no maximo
     uma se ve como dona. O prazo evita que uma aba fechada no meio deixe todo
     mundo travado para sempre. */
  TRAVA:"database.lock.json", SEGUNDOS_TRAVA:20,

  /* {lida:false} separa "nao existe trava" de "nao deu para ler a trava": a
     primeira libera, a segunda nao autoriza concluir nada sobre o vizinho. */
  async lerTrava(){
    try{ return {lida:true, t:JSON.parse(await this.lerTexto(this.TRAVA))}; }
    catch(e){ return e?.name==="NotFoundError" ? {lida:true, t:null} : {lida:false, t:null}; }
  },
  escreverTrava(){
    return Promise.reject(new Error("SOMENTE_LEITURA"));
  },
  viva(t){
    if(!t?.dono) return false;
    const idade = Date.now() - new Date(t.em||0).getTime();
    return idade >= 0 && idade < this.SEGUNDOS_TRAVA*1000;
  },
  /* Devolve o dono da trava, ou null quando a trava em si nao funcionou. A trava
     e uma protecao a mais, nunca um motivo para recusar uma gravacao: se a pasta
     nao deixa le-la ou grava-la, segue sem ela - o que sobra (conferencia de
     revisao antes e de carimbo depois) ainda e mais do que havia antes. */
  travar(){
    return Promise.reject(new Error("SOMENTE_LEITURA"));
  },
  destravar(){
    return Promise.reject(new Error("SOMENTE_LEITURA"));
  },

  /* Controle de concorrencia: trava a pasta, rele o arquivo e compara a revisao. */
  gravar(){
    return Promise.reject(new Error("SOMENTE_LEITURA"));
  },
  _gravar(){
    return Promise.reject(new Error("SOMENTE_LEITURA"));
  },
  _gravarTravado(){
    return Promise.reject(new Error("SOMENTE_LEITURA"));
  },
  /* A conferencia por revisao e um check-then-use: entre reler o arquivo e fechar
     o writer cabe a gravacao inteira de outra pessoa - a fila do Store serializa
     as gravacoes DESTA sessao, nao as das outras. Quem perdia essa corrida sumia
     sem deixar rastro: nao ficava no disco, nao ia para backups/, e nem o polling
     via, porque a revisao no disco terminava igual a nossa. O File System Access
     nao tem escrita atomica nem lock, entao a saida e conferir depois: cada
     gravacao leva um carimbo unico e o arquivo e relido para ver se o carimbo que
     ficou e o nosso. Nao evita a corrida - troca a perda silenciosa por um
     conflito detectado, com o trabalho ainda inteiro em memoria e no diario. */
  conferirGravacao(){
    return Promise.reject(new Error("SOMENTE_LEITURA"));
  },
  /* O backup so e dado como feito depois de reler e conferir o arquivo gravado:
     quem depende dele (sobrescrita forcada, restauracao) precisa dessa certeza. */
  backup(){
    return Promise.reject(new Error("SOMENTE_LEITURA"));
  },
  _backup(){
    return Promise.reject(new Error("SOMENTE_LEITURA"));
  },
  /* Historico arquivado: mesma exigencia do backup - so conta como gravado
     depois de reler e conferir, porque a base perde esses eventos em seguida. */
  arquivarHistorico(){
    return Promise.reject(new Error("SOMENTE_LEITURA"));
  },
  _arquivarHistorico(){
    return Promise.reject(new Error("SOMENTE_LEITURA"));
  },
  async listarBackups(){
    try{
      const bdir = await this.dirHandle.getDirectoryHandle("backups");
      const out=[]; for await (const [nome,h] of bdir.entries())
        if(h.kind==="file" && nome.endsWith(".json")){ const f=await h.getFile();
          out.push({nome,tamanho:f.size,data:new Date(f.lastModified).toISOString()}); }
      return out.sort((a,b)=>b.nome.localeCompare(a.nome));
    }catch{ return []; }
  },
  limparBackupsAntigos(){
    return Promise.reject(new Error("SOMENTE_LEITURA"));
  },
  restaurarBackup(){
    return Promise.reject(new Error("SOMENTE_LEITURA"));
  },
};

<script>
"use strict";
/* ============================== estado ================================= */
const S = {

  selecionado:null, salvando:false, sujo:false,

function filtrosVazios(){
  return {busca:"",status:[],familia:[],inspType:[],origem:[],b05:"",bigram:[],funcao:[],
          aging:"",alteradas:false,comObs:false,dataDe:"",dataAte:""};
}

/* --------------------------- regras de dominio ------------------------- */
const R = {
  cfg(){ return S.db?.config ?? {}; },
  statusDefs(){ return this.cfg().status ?? []; },
  familias(){ return this.cfg().familias ?? []; },
  familiaDe(st){ return this.statusDefs().find(s=>s.codigo===st)?.familia ?? "pendente"; },
  familiaObj(id){ return this.familias().find(f=>f.id===id) ?? {id,pt:id,en:id,cor:"#888",ordem:0}; },
  nomeFamilia(id){ const f=this.familiaObj(id); return LANG==="pt"?f.pt:f.en; },
  escuro(){ const t=document.documentElement.dataset.theme;
    return t==="dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches); },
  /* Unico ponto por onde a cor de um status chega a tela - por isso o
     saneamento mora aqui e vale para tabela, kanban, pills e graficos. */
  corDe(st){
    const d=this.statusDefs().find(x=>x.codigo===st);
    if(d?.cor) return corSegura(this.escuro()? (d.corEscura||d.cor) : d.cor);
    return this.corFamilia(this.familiaDe(st));
  },
  corFamilia(id){ return corSegura(this.familiaObj(id).cor); },
  ordemDe(st){ return this.familiaObj(this.familiaDe(st)).ordem; },

  /* Desenho do diagrama "Evidence Flow". Fica no config para poder ser ajustado,
     mas o padrao vive aqui: uma base antiga (sem config.fluxo) desenha do mesmo
     jeito em vez de aparecer em branco. */
  FLUXO_PADRAO:{
    b05:{principal:["8 - Mounting not Completed","5 - Waiting Proof","4 - Under Analysis",
                    "6 - Waiting B05","1 - Validated by ICN"],
         desvio:"7 - Missing Vacuum Test or Sign", bloqueio:"3 - Blocking",
         grupoA:["4 - Under Analysis to Not Blocking","4 - Under Analysis To Downgraded",
                 "4 - Under Analysis To Not Available Jx"],
         grupoB:["2 - Not Blocking","2 - Not Blocking - Downgraded","2 - Not Available Jx"]},
    exceto:{principal:["8 - Mounting not Completed","5 - Waiting Proof","4 - Under Analysis",
                       "1 - Validated by ICN"],
         desvio:null, bloqueio:"3 - Blocking",
         grupoA:["4 - Under Analysis to Not Blocking","4 - Under Analysis To Downgraded",
                 "4 - Under Analysis To Not Available Jx"],
         grupoB:["2 - Not Blocking","2 - Not Blocking - Downgraded","2 - Not Available Jx"]},
  },
  /* Devolve o desenho e acrescenta, num grupo "outros", qualquer status presente
     na lista que o desenho nao preveja - nenhum item some da conta. */
  fluxoLayout(qual, lista){
    const pad = this.FLUXO_PADRAO[qual] || this.FLUXO_PADRAO.exceto;
    const cfg = (this.cfg().fluxo || {})[qual] || {};
    const arr = (a,b)=> Array.isArray(a) && a.length ? a : b;
    const l = {
      principal: arr(cfg.principal, pad.principal),
      desvio:    ("desvio"   in cfg) ? cfg.desvio   : pad.desvio,
      bloqueio:  ("bloqueio" in cfg) ? cfg.bloqueio : pad.bloqueio,
      grupoA:    arr(cfg.grupoA, pad.grupoA),
      grupoB:    arr(cfg.grupoB, pad.grupoB),
    };
    if(!l.principal.length) return null;
    const desenhados = new Set([...l.principal, ...l.grupoA, ...l.grupoB,
                                l.desvio, l.bloqueio].filter(Boolean));
    const fora = [...new Set((lista||[]).map(i=>i.status).filter(st=>st && !desenhados.has(st)))]
                   .sort((a,b)=>this.ordemDe(a)-this.ordemDe(b)||cmpAlfa(a,b));
    l.grupoC = fora;
    return l;
  },
  statusAtivos(){ const a=this.statusDefs().filter(s=>s.ativo).map(s=>s.codigo);
    const usados=[...new Set((S.db?.itens??[]).map(i=>i.status))];
    return [...new Set([...a,...usados])].sort((x,y)=>this.ordemDe(x)-this.ordemDe(y)||x.localeCompare(y)); },
  /* Definicao canonica de "em aberto" - fonte unica, lida da base.
     A lista vive em config.statusAbertoExcecoes e vale POR PREFIXO: e assim que
     "2 - Not Blocking" sempre cobriu "2 - Not Blocking - Downgraded" nos dois
     Excel. Lista vazia ou ausente cai no padrao, para que um campo apagado sem
     querer nas Configuracoes nao mude todos os indicadores em silencio.
     Status vazio nao conta como aberto (era assim antes e mexer nisso mudaria
     numero de painel); item sem status e sinalizado pelo verificador de
     integridade, que e onde esse problema tem de aparecer. */
  ABERTO_PADRAO:["1 - Validated by ICN","2 - Not Blocking","2 - Not Available Jx"],
  abertoExcecoes(){
    const l = S.db?.config?.statusAbertoExcecoes;
    return Array.isArray(l) && l.length? l : this.ABERTO_PADRAO;
  },
  aberto(st){
    if(!st) return false;
    const st1 = String(st);
    return !this.abertoExcecoes().some(e => e && st1.startsWith(e));
  },
  /* Tamanho da base em bytes - o JSON e o que vai para o disco. */
  tamanhoBase(){ try{ return JSON.stringify(S.db||{}).length; }catch{ return 0; } },
  /* Reconstroi o status de um item numa data (event sourcing). */
  statusEm(item,data){
    const evs = this.histStatus()[item]; if(!evs) return null;
    let st=null; for(const e of evs){ if(e.dataEfetiva<=data) st=e.valorNovo; else break; } return st;
  },
  /* Indice do historico por item. A validade e amarrada ao objeto da base e a uma
     invalidacao explicita - nao a meta.revisao, que so muda quando o arquivo e
     gravado: um evento consolidado agora precisa aparecer nos calculos agora. */
  _hs:null, _hsDb:null,
  invalidarHist(){ this._hs=null; this._hsDb=null; },
  /* Ordem deterministica: data do fato, data do registro como desempate, id no fim. */
  cmpEventos(a,b){
    return String(a.dataEfetiva??"").localeCompare(String(b.dataEfetiva??"")) ||
           String(a.consolidadoEm??"").localeCompare(String(b.consolidadoEm??"")) ||
           String(a.id??"").localeCompare(String(b.id??""));
  },
  histStatus(){
    if(this._hs && this._hsDb === S.db) return this._hs;
    const m={}; for(const h of (S.db?.historico??[])) if(h.campo==="status") (m[h.item] ??= []).push(h);
    for(const k in m) m[k].sort(this.cmpEventos);
    this._hs=m; this._hsDb=S.db; return m;
  },
  marcos(){ return [...(S.db?.marcos??[])].sort((a,b)=>a.data.localeCompare(b.data)); },
  marcoAnterior(){ const m=this.marcos(); return m.length>1?m[m.length-2]:m[0]; },
  marcoAtual(){ const m=this.marcos(); return m[m.length-1]; },
  /* Um item "mudou no ciclo" se o status hoje difere do status no marco anterior. */
  mudouNoCiclo(it){ const ma=this.marcoAnterior(); if(!ma) return false;
    const antes=this.statusEm(it.item,ma.data); return antes && antes!==it.status; },
  diasSemAtualizacao(it){ return diasEntre(it.ultimaAlteracaoStatus||it.criadoEm, hoje()); },
  valoresDe(campo){ return [...new Set((S.db?.itens??[]).map(i=>i[campo]).filter(Boolean))].sort(); },
  bigrams(){ const s=new Set(); (S.db?.itens??[]).forEach(i=>(i.bigram||[]).forEach(b=>s.add(b)));
    return [...s].sort(); },
};

/* ----------------------------- filtragem ------------------------------- */
function itensFiltrados(){
  const f=S.filtros, itens=S.db?.itens??[];
  const q=f.busca.trim().toLowerCase();
  const obsPorItem = new Set((S.db?.observacoes??[]).map(o=>o.item));
  return itens.filter(i=>{
    if(f.status.length && !f.status.includes(i.status)) return false;
    if(f.familia.length && !f.familia.includes(R.familiaDe(i.status))) return false;
    if(f.inspType.length && !f.inspType.includes(i.inspType)) return false;
    if(f.origem.length && !f.origem.includes(i.originalJx)) return false;
    if(f.funcao.length && !f.funcao.includes(i.numAndDescription)) return false;
    if(f.b05==="sim" && !i.isB05) return false;
    if(f.b05==="nao" && i.isB05) return false;
    if(f.bigram.length && !(i.bigram||[]).some(b=>f.bigram.includes(b))) return false;
    if(f.aging && R.diasSemAtualizacao(i) < +f.aging) return false;
    if(f.alteradas && !R.mudouNoCiclo(i)) return false;
    if(f.comObs && !obsPorItem.has(i.item)) return false;
    if(f.dataDe && (i.ultimaAlteracaoStatus||"") < f.dataDe) return false;
    if(f.dataAte && (i.ultimaAlteracaoStatus||"") > f.dataAte) return false;
    if(q){
      const alvo=[i.item,i.evidence,i.description,i.updatedStatusObs,i.generalObs,i.ncr,i.performance,
                  i.numAndDescription,i.inspType,i.insp,i.tests,(i.bigram||[]).join(" ")].join(" ").toLowerCase();
      if(!alvo.includes(q)) return false;
    }
    return true;
  });
}
function ordenar(lista){
  const {campo,dir}=S.ordenacao;
  return [...lista].sort((a,b)=>{
    let x=a[campo], y=b[campo];
    if(campo==="status"){ x=R.ordemDe(a.status); y=R.ordemDe(b.status);
      if(x===y) return cmpAlfa(a.item,b.item)*dir;
      return (x-y)*dir; }
    if(campo==="aging"){ x=R.diasSemAtualizacao(a); y=R.diasSemAtualizacao(b); return (x-y)*dir; }
    if(Array.isArray(x)) x=x.join(", "); if(Array.isArray(y)) y=y.join(", ");
    const r=cmpAlfa(x,y);
    return (r||cmpAlfa(a.item,b.item))*dir;   /* desempate estavel pelo Item */
  });
}

/* ==================== motor de alterações pendentes ===================
   Fluxo:  edição -> autosave (3s) -> pending change -> janela de
   consolidação (config, padrão 10 min) -> histórico definitivo.
   Agrupa várias mudanças no mesmo campo e descarta ida-e-volta.        */
/* Casca inerte: o visualizador nao altera a base, entao nao ha pendencia,
   consolidacao nem autosave. Os metodos ficam porque as telas os chamam. */
const Pend = {
  diario:[], campoEditavel:[],
  alterar(){ toast(LANG==="pt"?"Esta é a tela de consulta — nada aqui altera a base"
                              :"This is the read-only viewer — nothing here changes the database","warn"); },
  registrar(){}, agendarAutosave(){}, async autosave(){}, varrer(){},
  consolidar(){}, consolidarTudo(){}, descartarUma(){ return false; },
  descartarTudo(){}, esquecerNoDiario(){}, desfazer(){}, iniciar(){},
};


/* ==================== arquivamento de historico ========================
   O JSON e um arquivo so: passando de alguns MB a abertura comeca a pesar. A
   saida prevista na arquitetura e tirar da base os eventos antigos SEM perder
   a capacidade de reconstruir o presente: para cada item sai um evento-marco
   com o ultimo status conhecido antes do corte. A reconstrucao a partir dai
   continua exata; o que e anterior ao corte passa a viver no arquivo gravado
   em historico/, que nunca e apagado.                                     */
/* arquivamento: grava na pasta, nao existe aqui */

/* ==================== sincronizacao entre duas ou mais pessoas ==========
   A base continua sendo um unico database.json numa pasta compartilhada.
   Cada sessao:
     - verifica a data do arquivo a cada poucos segundos (barato: so metadados);
     - quando muda, traz a versao nova e reaplica por cima o que ainda nao
       tinha gravado daqui (Pend.diario);
     - se a mesma pessoa e a outra mexeram no MESMO campo do MESMO item,
       nada e sobrescrito em silencio: o usuario decide campo a campo;
     - anuncia sua presenca em presenca/<nome>.json (um arquivo por pessoa,
       portanto sem disputa de escrita) para todos verem quem esta na base.
   ====================================================================== */
/* Casca inerte: sem gravacao nao ha o que conciliar, e anunciar presenca
   exigiria escrever na pasta. O visualizador so le. */
const Sync = {
  ligado:false, presentes:[], editando:new Map(),
  segundos(){ return 0; }, iniciar(){}, parar(){}, async tick(){},
  receber(){ return "adotado"; }, reaplicar(){}, decidir(){},
  quemEdita(){ return []; }, meusItens(){ return []; },
  pintarEdicao(){}, async presenca(){}, sair(){}, slug(n){ return String(n||""); },
};

/* tipo: info | alterado | salvando | salvo | falha | conflito - vira a cor do ponto */
function marcarEstado(txt, tipo="info"){
  const el=$("#saveState"); if(!el) return;
  el.dataset.e = tipo; el.title = txt;
  const t=$(".txt", el); if(t) t.textContent = txt; else el.textContent = txt;
}
/* Mensagem acionavel para as falhas de leitura/escrita da base - nada de stack trace. */
function mensagemArmazenamento(e){
  const pt = LANG==="pt";
  switch(e?.message){
    case "LEITURA_PERMISSAO": return pt
      ? "Sem permissão para ler o database.json da pasta. Nada foi gravado — reautorize a pasta e tente de novo."
      : "No permission to read database.json in the folder. Nothing was written — re-authorize the folder and try again.";
    case "LEITURA_JSON_INVALIDO": return pt
      ? "O database.json da pasta está ilegível (JSON inválido). Nada foi gravado, para não apagá-lo. Restaure um backup da subpasta backups/ ou baixe a sua versão em Configurações."
      : "The database.json in the folder is unreadable (invalid JSON). Nothing was written, so it is not destroyed. Restore a backup from backups/ or download your version in Settings.";
    case "LEITURA_LEITURA": return pt
      ? "Não foi possível ler o database.json antes de gravar. Nada foi gravado. Verifique o acesso à pasta e tente de novo."
      : "Could not read database.json before writing. Nothing was written. Check folder access and try again.";
    case "FALHA_ESCRITA": return pt
      ? "Falha ao gravar o database.json. Suas alterações continuam aqui e na cópia local; tente de novo quando a pasta estiver acessível."
      : "Failed to write database.json. Your changes are still here and in the local copy; try again when the folder is reachable.";
    case "GRAVACAO_OCUPADA": return pt
      ? "Outra pessoa está gravando o database.json neste momento. Nada foi gravado e nada se perdeu — suas alterações continuam aqui. Tente de novo em instantes."
      : "Someone else is writing database.json right now. Nothing was written and nothing was lost — your changes are still here. Try again in a moment.";
    case "GRAVACAO_PERDIDA": return pt
      ? "Outra pessoa gravou o database.json ao mesmo tempo e a sua gravação não pôde ser confirmada. Nada se perdeu aqui: suas alterações continuam nesta sessão e na cópia local. Junte as versões e grave de novo."
      : "Someone else wrote database.json at the same time and your write could not be confirmed. Nothing was lost here: your changes are still in this session and in the local copy. Merge the versions and save again.";
    case "BASE_MUDOU": return pt
      ? "A base foi atualizada por outra pessoa durante o arquivamento. Nada foi tirado da base — o arquivo gerado em historico/ pode ser descartado. Tente arquivar de novo."
      : "The database was updated by someone else during archiving. Nothing was removed — the file generated in historico/ can be discarded. Try archiving again.";
    case "ARQUIVO_NAO_CONFIRMADO": return pt
      ? "O arquivo de histórico não pôde ser confirmado na subpasta historico/. Nada foi tirado da base."
      : "The history archive could not be confirmed in the historico/ subfolder. Nothing was removed from the database.";
    case "BACKUP_NAO_CONFIRMADO": return pt
      ? "O backup não pôde ser confirmado (não foi possível gravar ou reler o arquivo em backups/)."
      : "The backup could not be confirmed (failed to write or re-read the file in backups/).";
    default: return String(e?.message ?? e);
  }
}
</script>
<script>
"use strict";
/* ============================ indicadores ============================== */
const M = {
  kpis(base){
    const itens=base??S.db.itens;
    const ab=itens.filter(i=>R.aberto(i.status)).length;
    const val=itens.filter(i=>i.status==="1 - Validated by ICN").length;
    const mud=itens.filter(i=>R.mudouNoCiclo(i)).length;
    return {total:itens.length, aberto:ab, validado:val, mudou:mud,
            pct: itens.length? (itens.length-ab)/itens.length : 0};
  },
  /* Contagem por status com a variacao desde o marco anterior, como nos
     paineis impressos ("Validated: 152 (-)"). */
  statusComDelta(lista){
    const ma=R.marcoAnterior()?.data;
    const at=new Map(), an=new Map();
    for(const i of lista){
      at.set(i.status,(at.get(i.status)||0)+1);
      if(ma){ const s=R.statusEm(i.item,ma); if(s) an.set(s,(an.get(s)||0)+1); }
    }
    return [...new Set([...at.keys(),...an.keys()])]
      .map(st=>({st, n:at.get(st)||0, ant:ma? (an.get(st)||0) : undefined}))
      .sort((a,b)=>R.ordemDe(a.st)-R.ordemDe(b.st)||cmpAlfa(a.st,b.st));
  },
  porStatus(itens){ const m=new Map();
    for(const i of itens) m.set(i.status,(m.get(i.status)||0)+1);
    return [...m].sort((a,b)=>R.ordemDe(a[0])-R.ordemDe(b[0])); },
  /* Painel "Evidence Flow": B05 x Except-B05, identico ao Arquivo 2. */
  evidenceFlow(itens){
    const b05=itens.filter(i=>i.isB05), nb=itens.filter(i=>!i.isB05);
    const bloco=l=>({total:l.length, aberto:l.filter(i=>R.aberto(i.status)).length,
                     status:this.porStatus(l)});
    return {b05:bloco(b05), exceto:bloco(nb)};
  },
  /* Painel "Shipyard Prerequisites": o marco que vale e o ATUAL (ActualJx), nao
     o de origem. Um pre-requisito que nasceu em J07 e foi transferido para o J08
     e um pre-requisito do J08 - e era exatamente esse que ficava de fora quando
     o filtro olhava OriginalJx. */
  shipyard(itens,jx="J08"){
    const l=itens.filter(i=>i.inspType==="Shipyard prerequisites" && i.actualJx===jx);
    return {total:l.length, aberto:l.filter(i=>R.aberto(i.status)).length,
            status:this.porStatus(l), itens:l};
  },
  /* Painel "Functional Insp Type": conta PENDENCIAS por InspType, com delta. */
  funcional(itens){
    const tipos=R.cfg().inspTypesFuncionais??[];
    const ma=R.marcoAnterior()?.data;
    const linhas=tipos.map(t=>{
      const l=itens.filter(i=>i.inspType===t);
      const at=l.filter(i=>R.aberto(i.status)).length;
      const an=ma? l.filter(i=>R.aberto(R.statusEm(i.item,ma))).length : at;
      return {tipo:t,total:l.length,atual:at,anterior:an,delta:an-at};
    });
    return {linhas, total:linhas.reduce((s,x)=>s+x.total,0), aberto:linhas.reduce((s,x)=>s+x.atual,0)};
  },
  abertoPorCampo(itens,campo){ const m=new Map();
    for(const i of itens){ if(!R.aberto(i.status)) continue;
      const v=i[campo]||"—"; const o=m.get(v)||{}; o[i.status]=(o[i.status]||0)+1; m.set(v,o); }
    return [...m].sort((a,b)=>Object.values(b[1]).reduce((s,x)=>s+x,0)-Object.values(a[1]).reduce((s,x)=>s+x,0)); },
  /* Serie temporal de "em aberto" e "validados" por data. */
  serie(itens,de,ate,passo=1){
    const datas=[]; let d=new Date(de); const f=new Date(ate);
    const n=Math.max(1,Math.round((f-d)/864e5));
    const st = n>60? Math.ceil(n/60) : passo;
    while(d<=f){ datas.push(d.toISOString().slice(0,10)); d=new Date(d.getTime()+st*864e5); }
    if(datas[datas.length-1]!==ate) datas.push(ate);
    return datas.map(dt=>{
      const o={data:dt,aberto:0,validado:0,total:0};
      for(const i of itens){ const s=R.statusEm(i.item,dt); if(!s) continue;
        o.total++; if(R.aberto(s)) o.aberto++; if(s==="1 - Validated by ICN") o.validado++; }
      return o;
    });
  },
  /* Comparativo entre duas datas: fluxo de entradas, saidas, melhoras e pioras. */
  comparar(itens,d1,d2){
    const r={inicio:{},fim:{},melhoraram:[],pioraram:[],iguais:0,novos:[],alterados:[],
             transicoes:new Map(), totalInicio:0, totalFim:0, abertoInicio:0, abertoFim:0};
    for(const i of itens){
      const a=R.statusEm(i.item,d1), b=R.statusEm(i.item,d2);
      if(b){ r.fim[b]=(r.fim[b]||0)+1; r.totalFim++; if(R.aberto(b)) r.abertoFim++; }
      if(a){ r.inicio[a]=(r.inicio[a]||0)+1; r.totalInicio++; if(R.aberto(a)) r.abertoInicio++; }
      else if(b){ r.novos.push(i); continue; }
      if(!b||!a) continue;
      if(a===b){ r.iguais++; continue; }
      r.alterados.push({item:i,de:a,para:b});
      const k=a+" → "+b; r.transicoes.set(k,(r.transicoes.get(k)||0)+1);
      (R.ordemDe(b)>R.ordemDe(a)? r.melhoraram : r.pioraram).push({item:i,de:a,para:b});
    }
    return r;
  },
  aging(itens){
    const faixas=[[0,7],[8,30],[31,60],[61,90],[91,1e9]];
    const rot=["0-7","8-30","31-60","61-90","90+"];
    const abertos=itens.filter(i=>R.aberto(i.status));
    return faixas.map(([a,b],k)=>({faixa:rot[k],
      /* Relogios diferentes entre as maquinas da pasta de rede produzem
         ultimaAlteracaoStatus no futuro; sem o piso em 0 esse item nao caia em
         faixa nenhuma e simplesmente sumia do grafico. */
      n:abertos.filter(i=>{const d=Math.max(0,R.diasSemAtualizacao(i)); return d>=a&&d<=b;}).length}));
  },
};

/* ============================== graficos =============================== */
/* SVG inline, sem biblioteca externa - funciona offline e em file:// */
const G = {
  /* Coordenadas em espaco fixo (W x H) com escala uniforme: o texto dentro do
     SVG nao deforma quando o painel muda de largura. */
  barras(dados,{h=190,cor="var(--accent)",fmt=v=>v,max=null}={}){
    if(!dados.length) return `<div class="empty">&mdash;</div>`;
    const W=600, mx = max ?? Math.max(1,...dados.map(d=>d.v)), bw=W/dados.length;
    return `<svg viewBox="0 0 ${W} ${h}" style="width:100%;height:auto;display:block">
      <line x1="0" y1="${h-13}" x2="${W}" y2="${h-13}" stroke="var(--line)" stroke-width="2"/>
      ${dados.map((d,k)=>{
        const bh=(d.v/mx)*(h-34), x=k*bw, y=h-14-bh, c=d.cor||cor;
        return `<rect x="${(x+bw*.16).toFixed(1)}" y="${y.toFixed(1)}" width="${(bw*.68).toFixed(1)}"
                 height="${Math.max(bh,d.v?3:0).toFixed(1)}" fill="${c}" rx="3" stroke="${c}" stroke-width="1.5">
                 <title>${esc(d.l)}: ${d.v}</title></rect>
          ${d.v?`<text x="${(x+bw/2).toFixed(1)}" y="${(y-5).toFixed(1)}" text-anchor="middle" font-size="13"
             font-weight="700" fill="${c}" font-family="var(--mono)">${fmt(d.v)}</text>`:""}`;}).join("")}
      </svg>
      <div style="display:grid;grid-template-columns:repeat(${dados.length},1fr);margin-top:3px">
      ${dados.map(d=>`<div style="font-size:10.5px;color:var(--fg-2);font-weight:600;text-align:center;overflow:hidden;
        text-overflow:ellipsis;white-space:nowrap" title="${esc(d.l)}">${esc(d.l)}</div>`).join("")}</div>`;
  },
  barrasEmpilhadas(linhas,chaves,cores,{h=220,quebra=false}={}){
    if(!linhas.length) return `<div class="empty">&mdash;</div>`;
    const W=600, mx=Math.max(1,...linhas.map(l=>chaves.reduce((s,k)=>s+(l.v[k]||0),0))), bw=W/linhas.length;
    return `<svg viewBox="0 0 ${W} ${h}" style="width:100%;height:auto;display:block">
      <line x1="0" y1="${h-9}" x2="${W}" y2="${h-9}" stroke="var(--line)" stroke-width="2"/>
      ${linhas.map((l,k)=>{ let acc=0; const x=k*bw; const tot=chaves.reduce((s,c)=>s+(l.v[c]||0),0);
        const barras = chaves.map((key,ki)=>{ const v=l.v[key]||0; if(!v) return "";
          const bh=(v/mx)*(h-30); acc+=bh;
          const y=h-10-acc, alt=Math.max(bh-2.5,1.5);
          /* O valor de cada faixa fica dentro dela, em corpo pequeno e com halo
             da cor do painel: legivel sobre qualquer cor de fundo, claro ou escuro.
             So aparece quando a faixa tem altura para isso. */
          const rotulo = alt>=11
            ? `<text x="${(x+bw/2).toFixed(1)}" y="${(y+alt/2+3.2).toFixed(1)}" text-anchor="middle"
                 font-size="9.5" font-weight="700" font-family="var(--mono)" fill="var(--fg)"
                 stroke="var(--panel)" stroke-width="2.6" paint-order="stroke"
                 style="pointer-events:none">${v}</text>` : "";
          return `<rect x="${(x+bw*.16).toFixed(1)}" y="${y.toFixed(1)}" width="${(bw*.68).toFixed(1)}"
            height="${alt.toFixed(1)}" fill="${cores[ki]}" rx="2.5" stroke="var(--panel)"
            stroke-width="1.5"><title>${esc(l.l)} \u2014 ${esc(key)}: ${v}</title></rect>${rotulo}`;}).join("");
        return barras + (tot?`<text x="${(x+bw/2).toFixed(1)}" y="${(h-16-acc).toFixed(1)}" text-anchor="middle"
          font-size="12" font-weight="700" fill="var(--fg-2)" font-family="var(--mono)">${tot}</text>`:"");}).join("")}
      </svg>
      <div style="display:grid;grid-template-columns:repeat(${linhas.length},1fr);margin-top:3px">
      ${linhas.map(l=>`<div style="font-size:${quebra?10:10.5}px;color:var(--fg-2);font-weight:600;text-align:center;
        padding:0 3px;${quebra
          ? "white-space:normal;line-height:1.3;word-break:break-word;hyphens:auto"
          : "overflow:hidden;text-overflow:ellipsis;white-space:nowrap"}"
        title="${esc(l.l)}">${esc(l.l)}</div>`).join("")}</div>`;
  },
  linhas(serie,series,{h=200}={}){
    if(serie.length<2) return `<div class="empty">&mdash;</div>`;
    const W=600, L=34, mx=Math.max(1,...serie.flatMap(p=>series.map(s=>p[s.k])));
    const px=k=>L+(k/(serie.length-1))*(W-L-6);
    const py=v=>h-16-(v/mx)*(h-30);
    return `<svg viewBox="0 0 ${W} ${h}" style="width:100%;height:auto;display:block">
      ${[0,.25,.5,.75,1].map(f=>`<line x1="${L}" y1="${py(mx*f).toFixed(1)}" x2="${W-6}" y2="${py(mx*f).toFixed(1)}"
          stroke="${f?"var(--line-2)":"var(--line)"}" stroke-width="${f?1.5:2.5}"/>
        <text x="${L-5}" y="${(py(mx*f)+4).toFixed(1)}" text-anchor="end" font-size="11.5" fill="var(--fg-2)"
          font-weight="600" font-family="var(--mono)">${Math.round(mx*f)}</text>`).join("")}
      ${series.map(s=>`<polyline fill="none" stroke="${s.cor}" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"
         points="${serie.map((p,k)=>`${px(k).toFixed(1)},${py(p[s.k]).toFixed(1)}`).join(" ")}"/>
        ${serie.map((p,k)=>{ const pta=(k===0||k===serie.length-1)||serie.length<=20;
          return (pta?`<circle cx="${px(k).toFixed(1)}" cy="${py(p[s.k]).toFixed(1)}" r="${k===0||k===serie.length-1?5.5:3.6}"
            fill="${s.cor}" stroke="var(--panel)" stroke-width="2"/>`:"")
          + `<circle cx="${px(k).toFixed(1)}" cy="${py(p[s.k]).toFixed(1)}" r="7" fill="transparent"
            ><title>${fmtD(p.data)} \u2014 ${s.nome}: ${p[s.k]}</title></circle>`;}).join("")}`).join("")}
      </svg>
      <div class="rowflex" style="justify-content:space-between;font-size:10px;color:var(--fg-3);margin-top:2px;padding:0 6px 0 34px">
        <span>${fmtD(serie[0].data)}</span><span>${fmtD(serie[serie.length-1].data)}</span></div>
      <div class="rowflex" style="gap:14px;margin-top:6px;font-size:11.5px;font-weight:600">
      ${series.map(s=>`<span class="rowflex" style="gap:6px"><i class="dot" style="background:${s.cor};width:11px;height:11px"></i>
        <span style="color:${s.cor}">${esc(s.nome)}</span></span>`).join("")}</div>`;
  },
  /* Diagrama de fluxo no mesmo esquema da aba "Evidence Flow" do Excel:
     cadeia principal com setas, desvio acima, bloqueio abaixo e os grupos de
     rebaixamento a direita. Coordenadas fixas, escala uniforme, sem deformar texto. */
  fluxo(conta, total, layout){
    if(!layout || !Array.isArray(layout.principal) || !layout.principal.length)
      return `<div class="empty">&mdash;</div>`;
    const W=1256, BW=158, BH=72, GAP=40, YT=18, M=14;
    const temDesvio=!!layout.desvio;
    const temOutros=!!(layout.grupoC && layout.grupoC.length);
    const YP=temDesvio? YT+BH+48 : 26, YB=YP+BH+44;
    /* A altura sai do que foi desenhado, e nao de uma conta a parte: era assim
       que o quadro "outros status" acabava cortado pela borda do viewBox. */
    let maxY=0; const reg=y=>{ if(y>maxY) maxY=y; };
    const prin=layout.principal||[];
    /* Cadeia alinhada a esquerda e o "Validated" ancorado na borda direita,
       como na planilha: a seta longa ate ele mostra o caminho de conclusao.
       Assim os dois blocos (com e sem os passos extras) tem a mesma geometria. */
    const ult=prin.length-1;
    const px=k=> k===ult ? W-M-BW : M+k*(BW+GAP);
    const n=st=>conta.get(st)||0;
    const pc=v=>total? (v/total*100) : 0;
    /* nos grupos o prefixo se repete em todas as linhas: mostramos so o que muda.
       O corte vem da largura util do quadro (rotulo -> valor), nao de um numero
       fixo de caracteres, para o texto nunca encostar no numero. */
    const curto=(st,w=228)=>{
      const t=st.replace(/^\d+ - /,"").replace(/^Under Analysis [Tt]o /,"→ ");
      const cabe=Math.max(8, Math.floor((w-34-58)/6.7));
      return t.length>cabe ? t.slice(0,cabe-1)+"…" : t;  /* o nome inteiro fica no tooltip */
    };

    /* Caixa com faixa cheia no topo, fundo no tom do status e contorno grosso:
       a cor identifica o passo mesmo de longe, como na planilha. */
    const caixa=(st,x,y,w=BW,h=BH,forte=false)=>{
      const c=R.corDe(st), v=n(st); reg(y+h);
      return `<g><rect class="fxcaixa" x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="${c}"
          fill-opacity="${v?0.17:0.06}" stroke="${c}" stroke-width="${forte?3.5:2.5}"/>
        <rect x="${x+4}" y="${y+2}" width="${w-8}" height="6" rx="3" fill="${c}"/>
        <text x="${x+w/2}" y="${y+23}" text-anchor="middle" font-weight="700"
          font-size="${st.length>28?8.8:st.length>23?9.6:10.6}"
          fill="${c}">${esc(st)}</text>
        <text x="${x+w/2}" y="${y+h*0.72}" text-anchor="middle" font-size="22" font-weight="800"
          fill="${v?c:"var(--fg-3)"}" font-family="var(--mono)">${v}</text>
        <text x="${x+w/2}" y="${y+h-8}" text-anchor="middle" font-size="10.5" font-weight="600"
          fill="var(--fg-2)" font-family="var(--mono)">${pc(v).toFixed(v?2:0)}%</text>
        <title>${esc(st)}: ${v} de ${total} (${pc(v).toFixed(2)}%)</title></g>`;
    };
    let nG=0;
    const grupo=(lista,x,y,w,titulo)=>{
      const h=20+lista.length*25+(titulo?17:0);
      const cid=`gcl${nG++}`; reg(y+h);
      return `<g><clipPath id="${cid}"><rect x="${x+26}" y="${y}" width="${w-84}" height="${h}"/></clipPath>
        <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="var(--panel-2)"
          stroke="var(--line)" stroke-width="2.5"/>
        ${titulo?`<text x="${x+14}" y="${y+18}" font-size="10.5" font-weight="700" fill="var(--fg-3)"
          letter-spacing="0.6">${esc(titulo)}</text>`:""}
        ${lista.map((st,k)=>{const c=R.corDe(st), v=n(st), cy=y+25+(titulo?17:0)+k*25;
          return `<g><title>${esc(st)}: ${v} (${pc(v).toFixed(2)}%)</title>
            <rect x="${x+11}" y="${cy-11}" width="10" height="10" rx="3" fill="${c}"/>
            <text x="${x+30}" y="${cy}" font-size="11" font-weight="600" clip-path="url(#${cid})"
              fill="${v?c:"var(--fg-2)"}">${esc(curto(st,w))}</text>
            <text x="${x+w-42}" y="${cy}" text-anchor="end" font-size="14" font-weight="800"
              font-family="var(--mono)" fill="${v?c:"var(--fg-3)"}">${v}</text>
            <text x="${x+w-10}" y="${cy}" text-anchor="end" font-size="11" font-weight="600"
              font-family="var(--mono)" fill="var(--fg-2)">${pc(v).toFixed(0)}%</text></g>`;}).join("")}
        </g>`;
    };
    const seta=(x1,y1,x2,y2,cor="var(--fg-2)")=>
      `<path d="M${x1} ${y1} L${x2} ${y2}" stroke="${cor}" stroke-width="3.4" fill="none"
        marker-end="url(#pf)" stroke-linecap="round"/>`;
    const cotovelo=(x1,y1,x2,y2,cor="var(--fg-2)")=>
      `<path d="M${x1} ${y1} V${(y1+y2)/2} H${x2} V${y2}" stroke="${cor}" stroke-width="3.4" fill="none"
        marker-end="url(#pf)" stroke-linejoin="round" stroke-linecap="round"/>`;

    let svg="";
    let iA=prin.indexOf("4 - Under Analysis"); if(iA<0) iA=Math.max(0,prin.length-2);
    prin.forEach((st,k)=>{ svg+=caixa(st,px(k),YP,BW,BH,st==="1 - Validated by ICN"); });
    for(let k=0;k<prin.length-1;k++) svg+=seta(px(k)+BW+5,YP+BH/2,px(k+1)-9,YP+BH/2);

    if(layout.desvio){
      const dw=228, dx=Math.min(px(iA)+BW/2+36, W-dw-M);
      svg+=caixa(layout.desvio,dx,YT,dw,BH);
      svg+=cotovelo(px(iA)+BW/2,YP-5,dx+58,YT+BH+9);           // sobe de Under Analysis
      svg+=cotovelo(dx+dw-58,YT+BH+9,px(iA+1)+BW/2,YP-5);       // desce para o proximo passo
    }
    if(layout.bloqueio){
      const bx=px(iA)-12;
      svg+=caixa(layout.bloqueio,bx,YB,BW,BH,true);
      svg+=cotovelo(px(iA)+BW/2-34,YP+BH+5,bx+BW/2-34,YB-9,R.corDe(layout.bloqueio));
      svg+=cotovelo(bx+BW/2+44,YB-9,px(iA)+BW/2+44,YP+BH+5);
      const gx=bx+BW+42, sobra=(W-M)-gx-30;
      const gw=Math.round(sobra*0.47), hw=sobra-gw;
      const hx=gx+gw+30;
      svg+=grupo(layout.grupoA,gx,YB-6,gw);
      svg+=seta(bx+BW+5,YB+BH/2,gx-9,YB+BH/2);
      svg+=grupo(layout.grupoB,hx,YB-6,hw);
      svg+=seta(gx+gw+5,YB+BH/2,hx-9,YB+BH/2);
      /* Nenhum item pode ficar fora da conta: status sem lugar no desenho
         aparecem num quadro proprio, a esquerda. */
      if(temOutros) svg+=grupo(layout.grupoC, M, YB+BH+16, Math.max(300,bx-M-24),
        LANG==="pt"?"OUTROS STATUS":"OTHER STATUSES");
    }else if(temOutros){
      svg+=grupo(layout.grupoC, M, YP+BH+26, Math.max(300,W/2),
        LANG==="pt"?"OUTROS STATUS":"OTHER STATUSES");
    }
    const mk="pf"+Math.random().toString(36).slice(2,7);
    const ALT=Math.round(maxY+16);
    return `<svg viewBox="0 0 ${W} ${ALT}" style="width:100%;height:auto;display:block;min-width:800px">
      <defs><marker id="${mk}" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5"
        orient="auto-start-reverse"><path d="M0 0.5 L9.5 5 L0 9.5 z" fill="context-stroke"/></marker></defs>
      ${svg.replace(/url\(#pf\)/g,"url(#"+mk+")")
            .replace(/(id="|url\(#)gcl/g,(m)=>m.replace("gcl",mk+"gcl"))}</svg>`;
  },
  donut(dados,{size=128}={}){
    const tot=dados.reduce((s,d)=>s+d.v,0)||1; let acc=0; const r=15.915;
    return `<div class="rowflex" style="gap:16px;align-items:center">
      <svg viewBox="0 0 42 42" style="width:${size}px;height:${size}px;flex:none">
        <circle cx="21" cy="21" r="${r}" fill="none" stroke="var(--line-2)" stroke-width="8"/>
        ${dados.filter(d=>d.v).map(d=>{const p=d.v/tot*100; const el=`<circle cx="21" cy="21" r="${r}" fill="none"
          stroke="${d.cor}" stroke-width="8" stroke-dasharray="${p.toFixed(2)} ${(100-p).toFixed(2)}"
          stroke-dashoffset="${(25-acc).toFixed(2)}" transform="rotate(0 21 21)"><title>${esc(d.l)}: ${d.v}</title></circle>`;
          acc+=p; return el;}).join("")}
        <text x="21" y="20.5" text-anchor="middle" font-size="7" font-weight="700" fill="var(--fg)">${tot}</text>
        <text x="21" y="25.5" text-anchor="middle" font-size="3" fill="var(--fg-3)">${LANG==="pt"?"ITENS":"ITEMS"}</text>
      </svg>
      <div style="display:flex;flex-direction:column;gap:3px;font-size:11.5px;min-width:0;flex:1">
      ${dados.filter(d=>d.v).map(d=>`<div class="rowflex" style="gap:6px"><i class="dot" style="background:${d.cor}"></i>
        <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(d.l)}</span>
        <b class="mono">${d.v}</b><span class="muted mono" style="font-size:10px">${(d.v/tot*100).toFixed(1)}%</span></div>`).join("")}
      </div></div>`;
  },
  /* A seta segue o sinal real da varia\u00e7\u00e3o; a cor diz se isso \u00e9 bom ou ruim.
     Em contagem de pend\u00eancias, cair \u00e9 bom (menorMelhor). */
  seta(delta,{menorMelhor=false}={}){
    if(!delta) return `<span class="flat">\u25ac</span>`;
    const bom = menorMelhor ? delta<0 : delta>0;
    const ic  = delta>0 ? "\u25b2+" : "\u25bc-";
    return `<span class="${bom?"up":"down"}">${ic}${String(Math.abs(delta)).padStart(2,"0")}</span>`;
  },
};
</script>
<script>
"use strict";
/* ===================== caminho padrão da base =======================
   O navegador NAO abre o seletor de pasta num caminho escolhido por nós: a
   File System Access API so aceita um handle ja autorizado ou um lugar
   generico ("documents", "downloads"). Por isso o caminho padrao aqui e o que
   da para ser: fica escrito na tela de abertura, com um botao que o copia para
   a area de transferencia - cola-se na barra de endereco do seletor do Windows
   e chega-se la num Enter. Depois da primeira autorizacao a pasta volta
   sozinha pelo handle guardado no IndexedDB e ninguem precisa mais disto.

   O valor mora em dois lugares de proposito: na config da base (vale para
   todo mundo que abre aquele database.json) e numa copia no localStorage -
   e esta que a tela de abertura consegue ler, porque nesse momento ainda nao
   ha base nenhuma carregada.                                             */
const Caminho = {
  FABRICA: "G:\\DOP\\GTO\\3_INTERNO\\01_SAFE_TO_DIVE\\11_STATUS MILESTONE J08",
  padrao(){
    const daBase = S.db?.config?.caminhoPadrao;
    if(typeof daBase === "string" && daBase.trim()) return daBase.trim();
    try{ const l = localStorage.getItem("sm.caminhoPadrao");
         if(l && l.trim()) return l.trim(); }catch{}
    return this.FABRICA;
  },
  /* Guarda nos dois lugares. Na base entra como qualquer alteracao de config:
     pendente + autosave, para viajar para as outras pessoas. */
  definir(valor, {gravar=true}={}){
    const v = String(valor ?? "").trim();
    try{ localStorage.setItem("sm.caminhoPadrao", v); }catch{}
    if(gravar && S.db){
      if((S.db.config.caminhoPadrao ?? "") === v) return;
      S.db.config.caminhoPadrao = v;
      Pend.registrar({t:"outro", o:"caminho"}); Pend.agendarAutosave();
    }
  },
  /* Ao carregar a base, a config manda: e ela que vale para a equipe. */
  sincronizarDaBase(){
    const v = S.db?.config?.caminhoPadrao;
    if(typeof v === "string" && v.trim()) this.definir(v, {gravar:false});
  },
  /* Ultimo pedaco do caminho - o nome que a pasta escolhida deveria ter. */
  ultimaPasta(c){
    const partes = String(c ?? this.padrao()).split(/[\\/]+/).filter(Boolean);
    return partes[partes.length-1] || "";
  },
  /* Escolheu outra pasta? Nao e erro (a base pode estar noutro lugar), mas
     abrir a pasta errada e gravar nela e o tipo de engano que so aparece
     semanas depois, quando falta metade do trabalho. */
  conferir(){
    const esperada = this.ultimaPasta();
    const real = Store.dirHandle?.name || "";
    if(!esperada || !real) return true;
    if(real.toLowerCase() === esperada.toLowerCase()) return true;
    toast(LANG==="pt"
      ? `Pasta "${real}" — o caminho padrão termina em "${esperada}". Confira se é a base certa.`
      : `Folder "${real}" — the default path ends in "${esperada}". Check this is the right database.`, "warn");
    return false;
  },
  copiar(){
    const txt = this.padrao();
    const pronto = ()=>toast(LANG==="pt"?"Caminho copiado — cole na barra de endereço do seletor de pasta"
                                        :"Path copied — paste it in the folder picker address bar","ok");
    try{
      navigator.clipboard?.writeText(txt).then(pronto, ()=>this.copiarNaMao(txt));
    }catch{ this.copiarNaMao(txt); }
  },
  /* Sem permissao de area de transferencia (http:// ou file://), o caminho
     aparece selecionado numa caixa: Ctrl+C resolve. */
  copiarNaMao(txt){
    const el = $("#cmPadrao");
    if(el?.select){ el.focus(); el.select();
      return toast(LANG==="pt"?"Pressione Ctrl+C para copiar":"Press Ctrl+C to copy"); }
    toast(txt);
  },
  /* O bloco que aparece na tela de abertura e na de configurações. */
  blocoHTML({editavel=false}={}){
    return `<div class="panel pad" style="background:var(--panel-2)">
      <b style="font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--fg-3)">
        ${LANG==="pt"?"Caminho padrão da base":"Default database path"}</b>
      <div class="rowflex" style="margin-top:7px;gap:7px">
        <input type="text" id="cmPadrao" class="mono" style="flex:1;min-width:180px;font-size:11.5px"
          value="${esc(this.padrao())}" ${editavel?"":"readonly"}
          spellcheck="false" autocomplete="off">
        <button class="btn sm" id="cmCopiar">${LANG==="pt"?"Copiar":"Copy"}</button>
        ${editavel?`<button class="btn sm pri" id="cmSalvar">${T("salvar")}</button>
                    <button class="btn sm" id="cmReset" title="${esc(this.FABRICA)}">${LANG==="pt"?"Restaurar padrão":"Reset"}</button>`:""}
      </div>
      <p class="muted" style="font-size:11.5px;line-height:1.7;margin-top:9px">${LANG==="pt"
        ? "O navegador não deixa nenhum site abrir o seletor de pasta já dentro de um caminho — é uma trava de segurança dele, não uma limitação daqui. Então: <b>Copiar</b>, clicar em <b>Selecionar pasta da base</b> e colar o caminho na <b>barra de endereço</b> da janela do Windows (ou <code>Ctrl+L</code> e colar). Da segunda vez em diante a pasta volta sozinha."
        : "Browsers do not let any site open the folder picker already inside a path — that is their security rule, not a limitation here. So: <b>Copy</b>, click <b>Select database folder</b> and paste the path into the <b>address bar</b> of the Windows dialog (or <code>Ctrl+L</code> and paste). From the second time on the folder comes back on its own."}</p>
      ${editavel?`<p class="muted" style="font-size:11.5px;margin-top:7px">${LANG==="pt"
        ? "Guardado na base: quem abrir este <code>database.json</code> vê o mesmo caminho."
        : "Stored in the database: anyone who opens this <code>database.json</code> sees the same path."}</p>`:""}
    </div>`;
  },
  ligar({editavel=false}={}){
    const c=$("#cmCopiar"); if(c) c.onclick=()=>this.copiar();
    if(!editavel) return;
    const s=$("#cmSalvar"); if(s) s.onclick=()=>{
      this.definir($("#cmPadrao")?.value ?? "");
      toast(LANG==="pt"?"Caminho padrão salvo":"Default path saved","ok"); Render.atual(); };
    const r=$("#cmReset"); if(r) r.onclick=()=>{
      this.definir(this.FABRICA);
      toast(LANG==="pt"?"Caminho restaurado":"Path reset","ok"); Render.atual(); };
  },
};

/* ============================== navegação ============================== */
const ROTAS = [
  {id:"dashboard", ic:"◧", t:"dashboard"},
  {id:"itens",     ic:"▤", t:"itens"},
  {id:"kanban",    ic:"▦", t:"kanban"},
  {id:"fluxo",     ic:"⇉", t:"fluxo"},
  {id:"historico", ic:"◴", t:"historico"},
  {id:"relatorios",ic:"◰", t:"relatorios"},
  {id:"waivers",   ic:"⚖", t:"waivers"},
  {id:"sobre",     ic:"ℹ", t:"sobre"},
];

const Render = {
  nav(){
    $("#nav").innerHTML = ROTAS.map(r=>`<button data-r="${r.id}" class="${S.rota===r.id?"on":""}">
      <span class="ic">${r.ic}</span><span>${T(r.t)}</span></button>`).join("");
    $$("#nav button").forEach(b=>b.onclick=()=>irPara(b.dataset.r));
    $("#whoami").textContent = Usuario.nome() ? (LANG==="pt"?"Usuário: ":"User: ")+Usuario.nome() : "";
  },
  badgePendentes(){
    const n=S.db?.pendentes?.length||0;
    const b=$("#pendBadge"), s=$("#btnSaveNow");
    b.style.display = n? "inline-flex":"none";
    b.textContent = `${n} ${T("pendentes")}`;
    s.style.display = n? "inline-block":"none";
  },
  atual(){ Filtros.persistir(); this.nav(); this.badgePendentes();
    (this[S.rota]||this.dashboard).call(this); },

  /* ------------------------------ sem base ----------------------------- */
  semBase(motivo){
    $("#pageTitle").textContent="StatusMilestone"; $("#headerExtra").innerHTML="";
    const semSuporte = !Store.suportado;
    $("#view").innerHTML = `<div class="panel pad" style="max-width:640px;margin:36px auto">
      <h3 style="border:0;padding:0;text-transform:none;font-size:17px;letter-spacing:-.02em;color:var(--fg)">${T("semBase")}</h3>
      <p class="muted" style="margin:10px 0 18px">${T("semBaseTxt")}</p>
      ${motivo?`<p style="color:var(--bad);margin-bottom:14px">${esc(motivo)}</p>`:""}
      ${/* O caminho vale nos dois casos: sem a API de pasta ainda e por ele que
            a pessoa acha o database.json para abrir a mao. */ Caminho.blocoHTML()}
      ${semSuporte? `<div class="panel pad" style="margin-top:14px;background:var(--panel-2);border-color:var(--bad)">
          <b style="color:var(--bad)">${LANG==="pt"?"Navegador sem suporte":"Unsupported browser"}</b>
          <p class="muted" style="margin:8px 0 0">${LANG==="pt"
            ? "A gravação direta em pasta exige Chrome ou Edge. Neste navegador você pode apenas abrir e baixar a base manualmente."
            : "Direct folder writing requires Chrome or Edge. Here you can only open and download the database manually."}</p></div>
          <div class="rowflex" style="margin-top:14px">
            <button class="btn pri" id="btnAbrirArq">${LANG==="pt"?"Abrir database.json":"Open database.json"}</button></div>`
        : `<div class="rowflex" style="margin-top:14px">
            <button class="btn pri" id="btnPasta">📁 ${T("selecionarPasta")}</button>
            ${Store.dirHandlePendente?`<button class="btn" id="btnRetomar">${LANG==="pt"?"Reautorizar pasta anterior":"Re-authorize previous folder"}</button>`:""}
            <button class="btn" id="btnEspelho">${LANG==="pt"?"Recuperar cópia local":"Recover local copy"}</button>
          </div>`}
      <div class="sep"></div>
      <p class="muted" style="font-size:11.5px;line-height:1.7">${LANG==="pt"
        ? "Os dados ficam sempre no arquivo <b>database.json</b> da pasta escolhida — nunca dentro desta página. Backups automáticos vão para a subpasta <b>backups/</b>."
        : "Data always lives in <b>database.json</b> inside the chosen folder — never inside this page. Automatic backups go to the <b>backups/</b> subfolder."}</p>
    </div>`;
    Caminho.ligar();
    const bp=$("#btnPasta"); if(bp) bp.onclick=()=>UI.abrirPasta();
    const br=$("#btnRetomar"); if(br) br.onclick=()=>UI.retomarPasta();
    const be=$("#btnEspelho"); if(be) be.onclick=()=>UI.recuperarEspelho();
    const ba=$("#btnAbrirArq"); if(ba) ba.onclick=()=>UI.abrirArquivoManual();
  },

  /* Faixa de abertura: o que outras pessoas fizeram desde a ultima visita. */
  faixaNovidades(){
    const n = S.novidades; if(!n) return "";
    const quem = n.autores.length? ` — ${esc(n.autores.join(", "))}` : "";
    const partes = [`${n.eventos} ${LANG==="pt"?"alteração(ões) no histórico":"history change(s)"}`];
    if(n.obs) partes.push(`${n.obs} ${LANG==="pt"?"observação(ões)":"note(s)"}`);
    return `<div class="panel pad" style="border-left:3px solid var(--accent);margin-bottom:14px;
        display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <b>${LANG==="pt"?"Desde a sua última visita":"Since your last visit"} (${fmtDT(n.desde)})</b>
      <span class="muted">${partes.join(" · ")}${quem}</span>
      <span style="flex:1"></span>
      <button class="btn sm" id="novVer">${LANG==="pt"?"Ver no histórico":"See in history"}</button>
      <button class="btn sm" id="novX" title="${LANG==="pt"?"Dispensar":"Dismiss"}">✕</button></div>`;
  },
  /* Os dois diagramas de Evidence Flow saem do dashboard para a tela propria:
     sao consulta, nao acompanhamento, e ocupavam a maior parte da rolagem. */
  fluxo(){
    $("#pageTitle").textContent=T("fluxo");
    $("#headerExtra").innerHTML = Filtros.resumoHTML();
    const itens = itensFiltrados();
    const ef = M.evidenceFlow(itens);
    const contaDe = l => { const m=new Map(); l.forEach(i=>m.set(i.status,(m.get(i.status)||0)+1)); return m; };
    const flow = (b,lista,titulo,qual)=>painel(qual, titulo,
      `<b style="color:var(--fg)">${b.aberto}</b> ${LANG==="pt"?"em aberto de":"open of"} ${b.total}`,
      `<div class="pad" style="overflow-x:auto;overscroll-behavior-x:contain">${
        G.fluxo(contaDe(lista), b.total, R.fluxoLayout(qual, lista))}</div>`);
    $("#view").innerHTML = `<div class="grid" style="grid-template-columns:1fr">
      ${flow(ef.b05, itens.filter(i=>i.isB05), LANG==="pt"?'Evidências "somente" B05':'Evidences "only" B05', "b05")}
      ${flow(ef.exceto, itens.filter(i=>!i.isB05), LANG==="pt"?'Evidências "exceto" B05':'Evidences "except" B05', "exceto")}
    </div>`;
    ligarDobras();
