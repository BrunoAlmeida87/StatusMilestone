  },

  /* ------------------------------ dashboard ---------------------------- */
  dashboard(){
    $("#pageTitle").textContent=T("dashboard");
    $("#headerExtra").innerHTML = Filtros.resumoHTML()+
      `<button class="btn sm noprint" id="dExp">↓ ${LANG==="pt"?"Exportar":"Export"}</button>`;
    const itens = itensFiltrados();
    const k = M.kpis(itens);
    const ef = M.evidenceFlow(itens);
    const sy = M.shipyard(itens);
    const fu = M.funcional(itens);
    const ma = R.marcoAnterior(), mt = R.marcoAtual();
    const abAnt = ma? itens.filter(i=>R.aberto(R.statusEm(i.item,ma.data))).length : k.aberto;
    const serieDe = R.marcos()[0]?.data || hoje();
    const serie = M.serie(itens, serieDe, hoje());
    const cores = st=>R.corDe(st);

    const contaDe = l => { const m=new Map(); l.forEach(i=>m.set(i.status,(m.get(i.status)||0)+1)); return m; };

    $("#view").innerHTML = `
    ${this.faixaNovidades()}
    <div class="grid kpis" style="margin-bottom:14px">
      ${kpi(T("total"),k.total,"")}
      ${kpi(T("emAberto"),k.aberto, ma? `${G.seta(k.aberto-abAnt,{menorMelhor:true})} ${LANG==="pt"?"vs":"vs"} ${fmtD(ma.data)}`:"")}
      ${kpi(T("validados"),k.validado,"")}
      ${kpi(T("conclusao"),(k.pct*100).toFixed(1)+"%","")}
      ${kpi(T("alterados"),k.mudou, ma?`${LANG==="pt"?"desde":"since"} ${fmtD(ma.data)}`:"")}
    </div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(330px,100%),1fr));margin-bottom:14px">
      ${painel("shipyard","Shipyard Prerequisites","ActualJx = J08",
        `<div class="pad">${cabecalhoRemaining(sy.aberto, sy.total)}
          ${M.statusComDelta(sy.itens).map(r=>linhaStatus(r.st,r.n,sy.total,r.ant)).join("")||`<div class="muted">—</div>`}
        </div>`)}
      ${painel("b05status","B05 Status","inspType = B05",
        `<div class="pad">${cabecalhoRemaining(ef.b05.aberto, ef.b05.total)}
          ${M.statusComDelta(itens.filter(i=>i.isB05)).map(r=>linhaStatus(r.st,r.n,ef.b05.total,r.ant)).join("")||`<div class="muted">—</div>`}
        </div>`)}
      ${painel("funcional","Functional Insp. Type",
        `${fu.aberto} ${LANG==="pt"?"em aberto de":"open of"} ${fu.total}`,
        `<div class="pad">${fu.linhas.filter(l=>l.total).map(l=>`
          <div class="rowflex" style="justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--line-2)">
            <span style="font-weight:600;color:var(--fg)">${esc(l.tipo)}</span>
            <span class="rowflex" style="gap:9px"><b class="mono" style="font-size:13.5px;
              color:${l.atual?"var(--bad)":"var(--ok)"}">${String(l.atual).padStart(2,"0")}</b>
            <span style="min-width:48px;text-align:right">${G.seta(l.atual-l.anterior,{menorMelhor:true})}</span>
            <span class="muted mono" style="font-size:10.5px;min-width:34px;text-align:right">/${l.total}</span></span>
          </div>`).join("")}</div>`)}
      ${painel("distribuicao",T("distribuicao"),"",
        `<div class="pad">${G.donut(M.porStatus(itens).map(([st,n])=>({l:st,v:n,cor:cores(st)})))}</div>`)}
    </div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(440px,100%),1fr));margin-bottom:14px">
      ${painel("evolucao",T("evolucao"),`${fmtD(serieDe)} — ${fmtD(hoje())}`,
        `<div class="pad">${G.linhas(serie,[
          {k:"aberto",nome:T("emAberto"),cor:"var(--bad)"},
          {k:"validado",nome:T("validados"),cor:"var(--ok)"}])}</div>`)}
      ${painel("aging",T("aging"),
        LANG==="pt"?"itens em aberto, por dias sem atualização":"open items, by days without update",
        `<div class="pad">${G.barras(M.aging(itens).map(a=>({l:a.faixa,v:a.n,
          cor:a.faixa==="90+"?"var(--bad)":a.faixa==="61-90"?"var(--orange)":"var(--accent)"})),{h:160})}</div>`)}
      ${painel("tipoInsp",T("tipoInsp"),
        LANG==="pt"?"pendências por status":"open by status",
        `<div class="pad">${pilhaPor(itens,"inspType")}</div>`)}
      ${painel("funcaoVital",T("funcaoVital"),
        LANG==="pt"?"pendências por status":"open by status",
        `<div class="pad">${pilhaPor(itens,"numAndDescription",14,{largo:true})}</div>`, "grid-column:1/-1")}
    </div>
    `;
    ligarDobras();
    Filtros.ligar();
    const nv=$("#novVer"); if(nv) nv.onclick=()=>{
      S.histDe = S.novidades.dataDe; S.histAte = hoje(); S.novidades=null; irPara("historico"); };
    const nx=$("#novX"); if(nx) nx.onclick=()=>{ S.novidades=null; Render.atual(); };
    $("#dExp").onclick=()=>Export.painel(itens,"Dashboard");
  },
};

/* Painel que o usuario pode recolher clicando no cabecalho. O estado fica no
   navegador de quem usa, nao na base: e preferencia de tela, nao dado. */
function painel(id, titulo, sub, corpo, estilo=""){
  const rec = S.dobradas.has(id);
  return `<div class="panel${rec?" recolhido":""}" data-dobra="${esc(id)}"${estilo?` style="${estilo}"`:""}>
    <h3 title="${LANG==="pt"?"Clique para recolher ou abrir":"Click to collapse or expand"}">
      <span class="caret">${rec?"\u25b8":"\u25be"}</span>${titulo}${sub?`<span class="sub">${sub}</span>`:""}</h3>
    <div class="corpo">${corpo}</div></div>`;
}
function ligarDobras(){
  $$("#view .panel[data-dobra]>h3").forEach(h=>h.onclick=()=>{
    const p=h.parentElement, id=p.dataset.dobra;
    const rec = !S.dobradas.has(id);
    rec? S.dobradas.add(id) : S.dobradas.delete(id);
    localStorage.setItem("sm.dobradas", JSON.stringify([...S.dobradas]));
    p.classList.toggle("recolhido", rec);
    h.querySelector(".caret").textContent = rec? "\u25b8" : "\u25be";
  });
}
function kpi(lab,val,dlt){ return `<div class="kpi"><div class="lab">${esc(lab)}</div>
  <div class="val">${val}</div><div class="dlt">${dlt||"&nbsp;"}</div></div>`; }
/* "Remaining X on a total of Y", como no relatorio impresso. */
function cabecalhoRemaining(aberto,total){
  return `<div class="rowflex" style="justify-content:space-between;margin-bottom:9px;
    padding-bottom:8px;border-bottom:2px solid var(--line)">
    <span class="muted" style="font-weight:600">${LANG==="pt"?"Em aberto":"Remaining"}</span>
    <b style="font-size:20px;color:${aberto?"var(--bad)":"var(--ok)"}">${aberto}
      <span class="muted" style="font-size:12px;font-weight:400">${LANG==="pt"?"de":"of"} ${total}</span></b></div>`;
}
/* Cada status na sua propria cor, com a variacao desde o marco anterior. */
function linhaStatus(st,n,tot,ant){
  const c=R.corDe(st);
  return `<div class="rowflex" style="justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid var(--line-2)">
  <span class="rowflex" style="gap:7px;min-width:0;flex:1">
    <i style="width:11px;height:11px;border-radius:3px;background:${c};flex:none"></i>
    <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:${c};font-weight:600"
      title="${esc(st)}">${esc(st)}</span></span>
  <span class="rowflex" style="gap:10px;flex:none">
    <b class="mono" style="color:${c};font-size:13.5px">${String(n).padStart(2,"0")}</b>
    ${ant===undefined?"":`<span style="min-width:46px;text-align:right">${G.seta(n-ant,{menorMelhor:R.aberto(st)})}</span>`}
  </span></div>`;
}
function pilhaPor(itens,campo,maxLinhas=10,{largo=false}={}){
  const dados=M.abertoPorCampo(itens,campo).slice(0,maxLinhas);
  if(!dados.length) return `<div class="empty">—</div>`;
  const chaves=[...new Set(dados.flatMap(d=>Object.keys(d[1])))].sort((a,b)=>R.ordemDe(a)-R.ordemDe(b));
  /* No modo largo o nome inteiro aparece, quebrando em linhas; no estreito
     continua cortado, porque nao caberia de jeito nenhum. */
  return G.barrasEmpilhadas(dados.map(([l,v])=>({l: largo? l : (l.length>16?l.slice(0,15)+"…":l), v})),
    chaves, chaves.map(k=>R.corDe(k)), {h:largo?210:190, quebra:largo})
    + `<div class="rowflex" style="gap:10px;margin-top:8px;font-size:10.5px">${chaves.map(k=>
      `<span class="rowflex" style="gap:4px"><i class="dot" style="background:${R.corDe(k)}"></i>${esc(k)}</span>`).join("")}</div>`;
}
</script>
<script>
"use strict";
/* ============================== filtros ================================ */
/* ------------- filtros como endereco: URL, localStorage e vistas -------
   S.filtros vivia so em memoria: um F5 perdia tudo e nao havia como dizer a
   outra pessoa "olhe estes 12 itens". O mesmo conjunto agora vira texto
   (rota + querystring), que serve para o hash da URL, para o localStorage e
   para as vistas nomeadas guardadas na base.                              */
const FiltroURL = {
  LISTAS:["status","familia","inspType","origem","funcao","bigram"],
  TEXTOS:["busca","b05","aging","dataDe","dataAte"],
  BOOLS:["alteradas","comObs"],
  paraTexto(f=S.filtros, rota=S.rota, ord=S.ordenacao){
    const q = new URLSearchParams();
    for(const k of this.LISTAS) if(f[k]?.length) q.set(k, f[k].join("~"));
    for(const k of this.TEXTOS) if(f[k]) q.set(k, f[k]);
    for(const k of this.BOOLS)  if(f[k]) q.set(k, "1");
    if(ord && (ord.campo!=="item" || ord.dir!==1)) q.set("ord", ord.campo+"~"+ord.dir);
    const t = q.toString();
    return (rota||"dashboard") + (t? "?"+t : "");
  },
  doTexto(txt){
    const [rota, busca] = String(txt||"").replace(/^#/,"").split("?");
    const f = filtrosVazios(), q = new URLSearchParams(busca||"");
    for(const k of this.LISTAS) if(q.get(k)) f[k] = q.get(k).split("~").filter(Boolean);
    for(const k of this.TEXTOS) if(q.get(k)) f[k] = q.get(k);
    for(const k of this.BOOLS)  f[k] = q.get(k)==="1";
    let ordenacao = null;
    if(q.get("ord")){ const [campo,dir] = q.get("ord").split("~"); ordenacao = {campo, dir:+dir||1}; }
    const valida = ROTAS.some(r=>r.id===rota);
    return {rota: valida? rota : "dashboard", filtros:f, ordenacao};
  },
};

/* ---- o que mudou desde a ultima vez que esta pessoa abriu a base ------
   Com 2-4 pessoas em horarios diferentes, a pergunta da abertura e sempre
   "o que aconteceu enquanto eu estava fora". A marca fica no computador de
   cada um (localStorage), nunca na base compartilhada.                    */
const Visita = {
  ler(){ try{ return JSON.parse(localStorage.getItem("sm.visto")||"null"); }catch{ return null; } },
  marcar(){ try{ localStorage.setItem("sm.visto",
    JSON.stringify({revisao:S.db?.meta?.revisao ?? 0, em:agora()})); }catch{} },
  calcular(){
    const v = this.ler(); if(!v?.em || !S.db) return null;
    const eu = Usuario.nome();
    const evs = (S.db.historico||[]).filter(h=>String(h.consolidadoEm||"") > v.em);
    const obs = (S.db.observacoes||[]).filter(o=>String(o.criadoEm||"") > v.em);
    if(!evs.length && !obs.length) return null;
    const autores = [...new Set([...evs,...obs].map(x=>x.autor).filter(a=>a && a!==eu))];
    return {eventos:evs.length, obs:obs.length, autores, desde:v.em,
            dataDe: evs.map(e=>e.dataEfetiva).filter(Boolean).sort()[0] || v.em.slice(0,10)};
  },
};

const Filtros = {
  /* Os filtros ligados aparecem como pilulas com "x" na barra: da para ver e
     desligar um a um sem abrir o painel. */
  ativos(){
    const f=S.filtros, out=[];
    for(const k of FiltroURL.LISTAS)
      for(const v of f[k]) out.push({chave:k, valor:v, rotulo: k==="familia"? R.nomeFamilia(v) : v});
    if(f.b05)       out.push({chave:"b05", valor:"", rotulo: f.b05==="sim"? T("b05") : T("naoB05")});
    if(f.aging)     out.push({chave:"aging", valor:"", rotulo:`${T("semAtualizacao")} ≥ ${f.aging} ${T("dias")}`});
    if(f.dataDe)    out.push({chave:"dataDe", valor:"", rotulo:`${T("de")} ${fmtD(f.dataDe)}`});
    if(f.dataAte)   out.push({chave:"dataAte", valor:"", rotulo:`${T("ate")} ${fmtD(f.dataAte)}`});
    if(f.alteradas) out.push({chave:"alteradas", valor:"", rotulo: LANG==="pt"?"alterados no ciclo":"changed in cycle"});
    if(f.comObs)    out.push({chave:"comObs", valor:"", rotulo: LANG==="pt"?"com observação":"with notes"});
    return out;
  },
  remover(chave, valor){
    const f=S.filtros;
    if(Array.isArray(f[chave])){ const i=f[chave].indexOf(valor); if(i>=0) f[chave].splice(i,1); }
    else if(typeof f[chave]==="boolean") f[chave]=false;
    else f[chave]="";
    Render.atual();
  },
  /* Grava o estado atual no computador e no hash - o hash e o link que se manda. */
  persistir(){
    const txt = FiltroURL.paraTexto();
    try{ localStorage.setItem("sm.filtros", txt); }catch{}
    const alvo = "#"+txt;
    if(location.hash === alvo) return;
    this._proprio = alvo;
    try{ history.replaceState(null,"",alvo); }         /* sem encher o historico */
    catch{ location.hash = alvo; }                     /* file:// as vezes recusa */
  },
  restaurar(){
    const fonte = location.hash.length>1 ? location.hash : (localStorage.getItem("sm.filtros")||"");
    if(!fonte) return;
    const {rota, filtros, ordenacao} = FiltroURL.doTexto(fonte);
    S.filtros = filtros; if(ordenacao) S.ordenacao = ordenacao;
    S.rotaInicial = rota;
  },
  aplicarTexto(txt){
    const {rota, filtros, ordenacao} = FiltroURL.doTexto(txt);
    S.filtros = filtros; S.ordenacao = ordenacao ?? {campo:"item",dir:1};
    if(S.db) irPara(rota); else S.rotaInicial = rota;
  },
  /* ---- vistas nomeadas: ficam na config, logo valem para todo mundo ---- */
  vistas(){ return S.db?.config?.vistas ?? []; },
  salvarVista(){
    const nome = (prompt(LANG==="pt"?"Nome da vista:":"View name:")||"").trim();
    if(!nome) return;
    (S.db.config.vistas ??= []).push({id:uid(), nome, filtro:FiltroURL.paraTexto(),
      autor:Usuario.garantir(), criadoEm:agora()});
    Pend.registrar({t:"outro", o:"vista"}); Pend.agendarAutosave();
    UI.fechar(); Render.atual();
    toast(LANG==="pt"?`Vista "${nome}" salva para todos`:`View "${nome}" saved for everyone`,"ok");
  },
  aplicarVista(id){
    const v = this.vistas().find(x=>x.id===id); if(!v) return;
    UI.fechar(); this.aplicarTexto(v.filtro);
  },
  removerVista(id){
    const l = S.db.config.vistas||[], i = l.findIndex(x=>x.id===id); if(i<0) return;
    if(!confirmar(LANG==="pt"?`Remover a vista "${l[i].nome}"?`:`Remove the view "${l[i].nome}"?`)) return;
    l.splice(i,1);
    Pend.registrar({t:"outro", o:"vista"}); Pend.agendarAutosave();
    this.painelVistas();
  },
  painelVistas(){
    const l = this.vistas();
    UI.modal(LANG==="pt"?"Vistas salvas":"Saved views",
      (l.length? `<table><thead><tr><th>${LANG==="pt"?"Nome":"Name"}</th><th>${T("autor")}</th>
          <th>${LANG==="pt"?"Filtro":"Filter"}</th><th></th></tr></thead><tbody>
        ${l.map(v=>`<tr><td><b>${esc(v.nome)}</b></td><td>${esc(v.autor||"")}</td>
          <td class="muted mono" style="font-size:10.5px">${esc(v.filtro)}</td>
          <td style="white-space:nowrap"><button class="btn sm" data-va="${esc(v.id)}">${LANG==="pt"?"Abrir":"Open"}</button>
            <button class="btn sm danger" data-vr="${esc(v.id)}">✕</button></td></tr>`).join("")}
        </tbody></table>`
        : `<div class="empty">${LANG==="pt"?"Nenhuma vista salva ainda.":"No saved views yet."}</div>`)
      + `<p class="muted" style="margin-top:12px">${LANG==="pt"
          ? "As vistas ficam na base, então todo mundo que abre o database.json enxerga as mesmas."
          : "Views live in the database, so everyone who opens database.json sees the same ones."}</p>`,
      [{txt:LANG==="pt"?"Salvar a busca atual":"Save current search",cls:"btn pri",fn:()=>this.salvarVista()}]);
    $$("[data-va]").forEach(b=>b.onclick=()=>this.aplicarVista(b.dataset.va));
    $$("[data-vr]").forEach(b=>b.onclick=()=>this.removerVista(b.dataset.vr));
  },
  resumoHTML(){
    const f=S.filtros;
    const ativos = this.ativos();
    const nv = this.vistas().length;
    const chips = ativos.slice(0,8).map(a=>`<span class="chip on" data-rm="${esc(a.chave)}"
        data-rmv="${esc(a.valor)}" title="${LANG==="pt"?"Remover este filtro":"Remove this filter"}"
        >${esc(a.rotulo)} <b style="opacity:.6">✕</b></span>`).join("")
      + (ativos.length>8? `<span class="chip" data-mais="1">+${ativos.length-8}</span>` : "");
    return `<input type="search" id="fBusca" placeholder="${T("buscar")}" value="${esc(f.busca)}" style="width:250px">
      <button class="btn" id="fAbrir">⚟ ${LANG==="pt"?"Filtros":"Filters"}${ativos.length?` <b>(${ativos.length})</b>`:""}</button>
      <button class="btn sm" id="fVistas" title="${LANG==="pt"?"Vistas salvas na base":"Views saved in the database"}">★ ${LANG==="pt"?"Vistas":"Views"}${nv?` (${nv})`:""}</button>
      ${ativos.length||f.busca?`<button class="btn sm" id="fLimpar">${T("limpar")}</button>`:""}
      ${chips}`;
  },
  ligar(){
    const b=$("#fBusca");
    if(b){ b.oninput=()=>{S.filtros.busca=b.value; clearTimeout(this._t);
      this._t=setTimeout(()=>{const p=b.selectionStart; Render.atual();
        const nb=$("#fBusca"); if(nb){nb.focus(); nb.setSelectionRange(p,p);} },220); }; }
    const a=$("#fAbrir"); if(a) a.onclick=()=>this.painel();
    const v=$("#fVistas"); if(v) v.onclick=()=>this.painelVistas();
    const l=$("#fLimpar"); if(l) l.onclick=()=>{S.filtros=filtrosVazios(); Render.atual();};
    $$("[data-rm]").forEach(c=>c.onclick=()=>this.remover(c.dataset.rm, c.dataset.rmv));
    const m=$("[data-mais]"); if(m) m.onclick=()=>this.painel();
  },
  painel(){
    const f=S.filtros;
    const grupo=(tit,chave,valores,rotulo=v=>v)=>`<div style="margin-bottom:14px">
      <div style="font-size:10.5px;font-weight:650;text-transform:uppercase;letter-spacing:.04em;color:var(--fg-3);margin-bottom:6px">${esc(tit)}</div>
      <div class="chips">${valores.map(v=>`<span class="chip ${f[chave].includes(v)?"on":""}"
        data-g="${chave}" data-v="${esc(v)}">${esc(rotulo(v))}</span>`).join("")}</div></div>`;
    UI.modal(LANG==="pt"?"Filtros":"Filters", `
      ${grupo(T("status"),"status",R.statusAtivos())}
      ${grupo(LANG==="pt"?"Coluna do Kanban":"Kanban column","familia",R.familias().map(x=>x.id),id=>R.nomeFamilia(id))}
      ${grupo(T("tipoInsp"),"inspType",R.valoresDe("inspType"))}
      ${grupo(T("origem"),"origem",R.valoresDe("originalJx"))}
      ${grupo(T("funcaoVital"),"funcao",R.valoresDe("numAndDescription"))}
      ${grupo("Bigram","bigram",R.bigrams())}
      <div class="sep"></div>
      <div class="rowflex" style="gap:16px;align-items:flex-end;flex-wrap:wrap">
        <label class="fld"><span>B05</span><select id="fB05">
          <option value="">${T("todos")}</option>
          <option value="sim" ${f.b05==="sim"?"selected":""}>${T("b05")}</option>
          <option value="nao" ${f.b05==="nao"?"selected":""}>${T("naoB05")}</option></select></label>
        <label class="fld"><span>${T("semAtualizacao")} (${T("dias")})</span>
          <input type="number" id="fAging" value="${esc(f.aging)}" min="0" style="width:90px"></label>
        <label class="fld"><span>${LANG==="pt"?"Última mudança de":"Last change from"}</span>
          <input type="date" id="fDe" value="${esc(f.dataDe)}"></label>
        <label class="fld"><span>${LANG==="pt"?"até":"to"}</span>
          <input type="date" id="fAte" value="${esc(f.dataAte)}"></label>
        <label class="rowflex" style="gap:6px"><input type="checkbox" id="fAlt" ${f.alteradas?"checked":""}>
          ${LANG==="pt"?"Só alterados no ciclo":"Only changed in cycle"}</label>
        <label class="rowflex" style="gap:6px"><input type="checkbox" id="fObs" ${f.comObs?"checked":""}>
          ${LANG==="pt"?"Só com observação":"Only with notes"}</label>
      </div>`,
      [{txt:T("limpar"),cls:"btn",fn:()=>{S.filtros=filtrosVazios(); UI.fechar(); Render.atual();}},
       {txt:LANG==="pt"?"Aplicar":"Apply",cls:"btn pri",fn:()=>{
          f.b05=$("#fB05").value; f.aging=$("#fAging").value; f.dataDe=$("#fDe").value;
          f.dataAte=$("#fAte").value; f.alteradas=$("#fAlt").checked; f.comObs=$("#fObs").checked;
          UI.fechar(); Render.atual();}}]);
    $$(".chip[data-g]").forEach(c=>c.onclick=()=>{
      const g=c.dataset.g, v=c.dataset.v, arr=S.filtros[g];
      const i=arr.indexOf(v); i<0?arr.push(v):arr.splice(i,1); c.classList.toggle("on");
    });
  },
};

/* =============================== itens ================================= */
/* Catalogo de colunas da tabela de itens. Cada pessoa escolhe as suas (fica no
   navegador, nao na base): quem acompanha Bigram nao quer Description ocupando
   um quinto da largura. `peso` e a largura relativa, normalizada na hora. */
const COLUNAS_ITENS = [
  {id:"item", pt:"Item", en:"Item", peso:7, cls:"num",
    cel:i=>`<b>${esc(i.item)}</b> <span data-ed="${esc(i.item)}"></span>`},
  {id:"status", pt:"Status", en:"Status", peso:17, cel:i=>
    `<span class="pill" style="background:${R.corDe(i.status)}26;color:${R.corDe(i.status)};
       border-color:${R.corDe(i.status)};max-width:100%;overflow:hidden;text-overflow:ellipsis;display:inline-flex"
       title="${esc(i.status)}"><i class="dot" style="background:${R.corDe(i.status)}"></i>
       <span style="overflow:hidden;text-overflow:ellipsis">${esc(i.status)}</span></span>`,
    marca:i=>R.mudouNoCiclo(i)?"chgmark":""},
  {id:"inspType", pt:"Tipo de inspeção", en:"Inspection type", peso:11, cel:i=>
    `<span class="rowflex" style="gap:4px;flex-wrap:nowrap;min-width:0">
       <span class="trunc">${esc(i.inspType)}</span>${
       i.isB05&&i.inspType!=="B05"?`<span class="tag" style="flex:none">B05</span>`:""}</span>`},
  {id:"insp", pt:"Insp", en:"Insp", peso:8},
  {id:"originalJx", pt:"Marco de origem", en:"Origin milestone", peso:8},
  {id:"actualJx", pt:"Marco atual", en:"Current milestone", peso:8},
  {id:"evidence", pt:"Evidence", en:"Evidence", peso:13},
  {id:"numAndDescription", pt:"Função vital", en:"Vital function", peso:14},
  {id:"description", pt:"Descrição", en:"Description", peso:22},
  {id:"updatedStatusObs", pt:"Obs. do status", en:"Status note", peso:16},
  {id:"generalObs", pt:"Obs. geral", en:"General note", peso:16},
  {id:"ncr", pt:"NCR's", en:"NCR's", peso:9},
  {id:"tests", pt:"Tests", en:"Tests", peso:14},
  {id:"performance", pt:"Performance", en:"Performance", peso:10},
  {id:"mode", pt:"Mode", en:"Mode", peso:8},
  {id:"positionAC", pt:"Position AC", en:"Position AC", peso:9},
  {id:"bigram", pt:"Bigram", en:"Bigram", peso:9, cel:i=>
    (i.bigram||[]).map(b=>`<span class="tag">${esc(b)}</span>`).join(" ")||`<span class="muted">—</span>`},
  {id:"ultimaAlteracaoStatus", pt:"Última mudança", en:"Last change", peso:9, cls:"num",
    cel:i=>fmtD(i.ultimaAlteracaoStatus)},
  {id:"aging", pt:"Aging", en:"Aging", peso:6, cls:"num", cel:i=>
    `<span style="color:${R.aberto(i.status)&&R.diasSemAtualizacao(i)>(S.db.config.diasAlertaAging??60)
      ?"var(--bad)":"var(--fg-3)"}">${R.diasSemAtualizacao(i)}</span>`},
];
const COLUNAS_PADRAO = ["item","status","inspType","originalJx","evidence","description","updatedStatusObs","aging"];
const Colunas = {
  escolhidas(){
    const l = S.colunas?.filter(id=>COLUNAS_ITENS.some(c=>c.id===id));
    return l?.length? l : COLUNAS_PADRAO;
  },
  defs(){ const esc0=this.escolhidas(); return esc0.map(id=>COLUNAS_ITENS.find(c=>c.id===id)); },
  rotulo(c){ return LANG==="pt"? c.pt : c.en; },
  guardar(l){ S.colunas=l; try{ localStorage.setItem("sm.colunas", JSON.stringify(l)); }catch{} },
  painel(){
    const atual = new Set(this.escolhidas());
    UI.modal(LANG==="pt"?"Colunas da tabela":"Table columns",
      `<p class="muted">${LANG==="pt"
        ? "A escolha fica neste navegador — cada pessoa monta a sua tabela sem mexer na base."
        : "The choice stays in this browser — everyone builds their own table without touching the database."}</p>
       <div class="chips" style="margin-top:12px">${COLUNAS_ITENS.map(c=>
         `<span class="chip ${atual.has(c.id)?"on":""}" data-col="${esc(c.id)}">${esc(this.rotulo(c))}</span>`).join("")}</div>`,
      [{txt:LANG==="pt"?"Padrão":"Default",cls:"btn",fn:()=>{this.guardar([...COLUNAS_PADRAO]); UI.fechar(); Render.atual();}},
       {txt:LANG==="pt"?"Aplicar":"Apply",cls:"btn pri",fn:()=>{
          const l=COLUNAS_ITENS.map(c=>c.id).filter(id=>$$(`.chip[data-col="${id}"]`)[0]?.classList.contains("on"));
          if(!l.length) return toast(LANG==="pt"?"Escolha ao menos uma coluna":"Pick at least one column","bad");
          this.guardar(l); UI.fechar(); Render.atual();}}]);
    $$("[data-col]").forEach(c=>c.onclick=()=>c.classList.toggle("on"));
  },
};

/* Selecao para edicao em lote: o gesto mais repetido numa reuniao de status e
   "estes oito vao para o mesmo status". Usa o mesmo Pend.alterar da edicao
   normal - nenhuma logica paralela, entao agrupa e consolida igual. */
/* Casca inerte: a edicao em lote e edicao. */
const Lote = { barra(){ return ""; }, ligar(){} };

/* ========================= item novo, à mão =========================
   Ate aqui a base so crescia pela migracao: um item que aparecesse depois
   (evidencia nova, item desdobrado, pre-requisito acrescentado pelo estaleiro)
   nao tinha por onde entrar. O item nasce aqui com o mesmo caminho de gravacao
   de qualquer edicao - pendente, autosave, historico - e entra no diario como
   uma criacao, para sobreviver a uma gravacao de outra pessoa no meio.   */
/* item novo: nao existe no visualizador */

/* =============================== waivers ==============================
   Um waiver e um pedido formal de dispensa: "este item nao vai atender o
   requisito como esta escrito; peco que seja aceito assim mesmo, por estas
   razoes". Ate aqui isso vivia em e-mail e em papel, e o sistema so via o
   resultado - o status mudava e ninguem sabia por que. Agora o pedido mora na
   base, preso aos itens que ele cobre, e sai em documento pronto para assinar.

   Duas portas entram aqui:
     - o pedido novo, escrito na tela, que ja move os itens para o status de
       tramitacao escolhido (o "para onde mando agora") e guarda qual e o
       status que se espera no fim (o "onde isto tem de parar");
     - o passivo: o waiver que ja foi feito a mao antes de existir esta tela.
       Entra com a data e a referencia do documento original e NAO mexe no
       status por conta propria, porque o item ja esta onde o papel o deixou.

   Nada aqui grava por um caminho proprio: o status vai por Pend.alterar, como
   qualquer edicao, e o waiver em si e gravado pelo autosave.              */
const Waiver = {
  SITUACOES:[
    {id:"rascunho", pt:"Rascunho",  en:"Draft",     cor:"#8a8f98"},
    {id:"enviado",  pt:"Enviado",   en:"Submitted", cor:"#b8860b"},
    {id:"aprovado", pt:"Aprovado",  en:"Approved",  cor:"#2f7a4f"},
    {id:"recusado", pt:"Recusado",  en:"Rejected",  cor:"#b3403a"},
    {id:"cancelado",pt:"Cancelado", en:"Canceled",  cor:"#5c5f66"},
  ],
  situacao(id){ return this.SITUACOES.find(s=>s.id===id) ?? this.SITUACOES[0]; },
  rotuloSituacao(id){ const s=this.situacao(id); return LANG==="pt"? s.pt : s.en; },
  corSituacao(id){ return corSegura(this.situacao(id).cor); },

  lista(){ return S.db?.waivers ?? []; },
  porId(id){ return this.lista().find(w=>w.id===id) || null; },
  doItem(itemId){ return this.lista().filter(w=>(w.itens||[]).includes(itemId)); },

  /* Numero legivel, uma serie por ano: W-2026-001. A contagem olha o MAIOR
     numero ja usado, nao o tamanho da lista - apagar um rascunho nao pode
     fazer o waiver seguinte nascer com um numero que ja circulou por e-mail. */
  proximoNumero(){
    const pre = `W-${hoje().slice(0,4)}-`;
    const maior = this.lista().map(w=>String(w.numero||""))
      .filter(x=>x.startsWith(pre))
      .map(x=>parseInt(x.slice(pre.length),10))
      .filter(Number.isFinite)
      .reduce((a,b)=>Math.max(a,b), 0);
    return pre + String(maior+1).padStart(3,"0");
  },

  MODELO(){ return LANG==="pt"
    ? "Solicitamos a concessão de waiver para o(s) item(ns) acima, pelas razões a seguir:\n\n"
    + "1. Situação encontrada:\n   \n\n"
    + "2. Razão pela qual o requisito não pode ser atendido como previsto:\n   \n\n"
    + "3. Impacto em segurança, operação e integridade:\n   \n\n"
    + "4. Evidências e documentos de apoio:\n   \n"
    : "We request a waiver for the item(s) above, for the following reasons:\n\n"
    + "1. Condition found:\n   \n\n"
    + "2. Why the requirement cannot be met as written:\n   \n\n"
    + "3. Impact on safety, operation and integrity:\n   \n\n"
    + "4. Supporting evidence and documents:\n   \n"; },

  /* ------------------------------ persistencia ------------------------ */
  /* Um waiver nao passa pela janela de consolidacao: nao e um valor que possa
     ir e voltar, e um documento. Grava na hora, como a observacao, e entra no
     diario para sobreviver a uma gravacao de outra pessoa no meio. O `base`
     guarda de qual versao partimos: e o que permite ao Sync saber se a outra
     pessoa mexeu NESTE waiver ou em outro. */
  guardar(){ toast(LANG==="pt"?"Esta é a tela de consulta — o waiver é pedido no sistema"
                        :"Read-only viewer — waivers are requested in the app","warn"); },
  excluir(){ toast(LANG==="pt"?"Esta é a tela de consulta — o waiver é pedido no sistema"
                        :"Read-only viewer — waivers are requested in the app","warn"); },

  /* O waiver nao escreve status por um caminho proprio: chama a mesma edicao
     de qualquer outra tela, com o numero do waiver como motivo. A mudanca
     entra no historico do item dizendo de onde veio, vira pendente e e gravada
     como todas as outras. */
  /* Quem nao esta no status alvo. E o que a janela pergunta e o que o
     documento mostra: nao adianta dizer "3 itens" quando um deles ja esta la. */
  divergentes(itens, alvo){
    if(!alvo) return [];
    return (itens||[]).map(id=>S.db?.itens.find(i=>i.item===id))
      .filter(i=>i && String(i.status)!==String(alvo));
  },

  /* O texto que fica no item por causa de um waiver. Cabecalho com o numero e
     a transicao, e embaixo o que foi escrito: quem abrir o item daqui a tres
     meses le POR QUE ele mudou, nao so que mudou. Sem transicao (o waiver foi
     recusado e nada se moveu) o cabecalho diz o resultado - a resposta do
     destinatario e informacao do item mesmo sem mudanca de status. */
  textoObservacao(w, de, para, qual){
    const corpo = qual==="final" ? (w.decisaoObs || w.texto) : w.texto;
    const quem = w.decisaoPor? (LANG==="pt"?` por ${w.decisaoPor}`:` by ${w.decisaoPor}`) : "";
    const quando = w.decisaoEm? ` (${fmtD(w.decisaoEm)})` : "";
    const cab = para
      ? (LANG==="pt" ? `Waiver ${w.numero} — status alterado de "${de}" para "${para}".`
                     : `Waiver ${w.numero} — status changed from "${de}" to "${para}".`)
      : (LANG==="pt" ? `Waiver ${w.numero} — ${this.rotuloSituacao(w.situacao).toLowerCase()}${quem}${quando}.`
                     : `Waiver ${w.numero} — ${this.rotuloSituacao(w.situacao).toLowerCase()}${quem}${quando}.`);
    return cab + (corpo ? `\n\n${corpo}` : "");
  },

  /* Uma observacao por item, pelo caminho de qualquer observacao: entra no
     diario como {t:"obs"} e e gravada na hora. Um lugar so, usado pela
     aplicacao de status e pela resposta que nao move nada. */
  anotar(){ toast(LANG==="pt"?"Esta é a tela de consulta — o waiver é pedido no sistema"
                        :"Read-only viewer — waivers are requested in the app","warn"); },

  /* O bloco de pergunta "o status atual e outro". Uma implementacao so, usada
     pela janela do pedido e pela janela da resposta - duas copias divergiriam
     na primeira vez que uma das duas fosse ajustada. */
  blocoDivergenciaHTML(lista, alvo, o={}){
    const idApl = o.idApl || "wAplicar", idObs = o.idObs || "wObs";
    if(!alvo || !lista.length) return "";
    const fora = this.divergentes(lista, alvo);
    if(!fora.length) return `<div class="muted" style="font-size:11.5px">✓ ${LANG==="pt"
      ? `Os ${lista.length} item(ns) já estão em "${esc(alvo)}" — nada a mudar.`
      : `All ${lista.length} item(s) are already at "${esc(alvo)}" — nothing to change.`}</div>`;
    const porSt = new Map();
    for(const i of fora) porSt.set(i.status, (porSt.get(i.status)||0)+1);
    const de = [...porSt.entries()].sort((a,b)=>b[1]-a[1])
      .map(([st,q])=>`<span class="pill" style="background:${R.corDe(st)}18;color:${R.corDe(st)};
        border-color:${R.corDe(st)}55">${q}× ${esc(st)}</span>`).join(" ");
    const trava = o.desabilitado? " disabled" : "";
    return `<div class="panel pad" style="border-left:3px solid var(--warn);padding:9px 12px">
      <div class="rowflex" style="gap:7px;margin-bottom:7px">
        <b style="color:var(--warn)">${LANG==="pt"?"O status atual é outro":"The current status is different"}</b>
        <span class="muted">${LANG==="pt"
          ? `${fora.length} de ${lista.length} item(ns) não estão em "${esc(alvo)}":`
          : `${fora.length} of ${lista.length} item(s) are not at "${esc(alvo)}":`}</span>
      </div>
      <div class="rowflex" style="gap:5px;margin-bottom:9px">${de}
        <span style="opacity:.6">→</span>
        <span class="pill" style="background:${R.corDe(alvo)}18;color:${R.corDe(alvo)};
          border-color:${R.corDe(alvo)}55"><b>${esc(alvo)}</b></span></div>
      <label class="rowflex" style="gap:7px"><input type="checkbox" id="${idApl}"${
        o.aplMarcado && !o.desabilitado?" checked":""}${trava}>
        <span>${esc(o.rotuloApl || (LANG==="pt"
          ? `Alterar o status desses ${fora.length} item(ns)`
          : `Change the status of these ${fora.length} item(s)`))}</span></label>
      <label class="rowflex" style="gap:7px;margin-top:5px;margin-left:19px">
        <input type="checkbox" id="${idObs}"${o.obsMarcado?" checked":""}${trava}>
        <span>${esc(o.rotuloObs || (LANG==="pt"
          ? "e registrar o texto do waiver como observação no item, junto dessa mudança"
          : "and record the waiver text as a note on the item, alongside that change"))}</span></label>
    </div>`;
  },

  aplicar(){ toast(LANG==="pt"?"Esta é a tela de consulta — o waiver é pedido no sistema"
                        :"Read-only viewer — waivers are requested in the app","warn"); },

  /* ------------------------------- a janela --------------------------- */
  painel(){ toast(LANG==="pt"?"Esta é a tela de consulta — o waiver é pedido no sistema"
                        :"Read-only viewer — waivers are requested in the app","warn"); },

  /* Le a janela. Devolve {w} ou {erro}: nada e gravado com o formulario pela
     metade, e a mensagem diz o que falta em vez de falhar calado. */
  ler(w){
    const v = id => String($("#w"+id)?.value ?? "").trim();
    const itens = [...(this.__sel || new Set())];
    if(!itens.length) return {erro: LANG==="pt"?"Escolha pelo menos um item." : "Pick at least one item."};
    const texto = String($("#wTexto")?.value ?? "").trim();
    if(!texto) return {erro: LANG==="pt"?"Escreva o texto do waiver." : "Write the waiver text."};
    const novo = {
      ...(w || {}),
      id: w?.id || uid(),
      numero: w?.numero || this.proximoNumero(),
      itens, texto,
      assunto: v("Assunto"), para: v("Para"), situacao: v("Situacao") || "rascunho",
      statusDestino: v("Destino"), statusFinal: v("Final"),
      origem: v("Origem") || "sistema",
      dataDocumento: v("Data") || hoje(),
      referencia: v("Ref"),
      condicao: String($("#wCondicao")?.value ?? "").trim(),
      criadoEm: w?.criadoEm || agora(),
      autor: w?.autor || Usuario.garantir(),
    };
    /* O parecer NAO e lido daqui: ele so existe depois que o destinatario
       responde e tem janela propria (responder). O spread acima preserva o que
       ja estiver gravado - editar o pedido nao pode apagar a resposta. */
    return {w:novo};
  },

  salvarDaJanela(){ toast(LANG==="pt"?"Esta é a tela de consulta — o waiver é pedido no sistema"
                        :"Read-only viewer — waivers are requested in the app","warn"); },

  /* ------------------------ a resposta, depois --------------------------
     O parecer nao existe na hora do pedido: ele chega quando o destinatario
     responde, dias ou semanas depois. Este e o momento em que o waiver deixa
     de ser pedido e vira decisao - entra quem respondeu, quando, o que disse,
     e SO AGORA o status final e aplicado.

     Alcancavel dos dois lados, porque a lembranca vem dos dois lados: da tela
     de Waivers (o waiver na mao) e de dentro do item (o item na mao). Vindo do
     item, a janela do item reabre depois, para a pessoa ver o status novo e a
     observacao que acabou de nascer.

     A resposta vale para o waiver INTEIRO - todos os itens que ele cobre -
     porque foi para o waiver inteiro que o destinatario respondeu.            */
  responder(){ toast(LANG==="pt"?"Esta é a tela de consulta — o waiver é pedido no sistema"
                        :"Read-only viewer — waivers are requested in the app","warn"); },

  gravarResposta(){ toast(LANG==="pt"?"Esta é a tela de consulta — o waiver é pedido no sistema"
                        :"Read-only viewer — waivers are requested in the app","warn"); },

  /* ---------------------------- so olhar ------------------------------ */
  ver(id){
    const w = this.porId(id); if(!w) return;
    const cor = this.corSituacao(w.situacao);
    const linha = (k,v)=>v?`<dt>${esc(k)}</dt><dd>${v}</dd>`:"";
    UI.modal(`Waiver ${w.numero}`, `
      <div class="rowflex" style="margin-bottom:12px">
        <span class="pill" style="background:${cor}18;color:${cor};border-color:${cor}55;font-size:13px">
          <i class="dot" style="background:${cor}"></i>${esc(this.rotuloSituacao(w.situacao))}</span>
        ${w.origem==="passivo"?`<span class="tag">${LANG==="pt"?"passivo (feito à mão)":"backlog (by hand)"}</span>`:""}
        ${w.aplicado?`<span class="tag" title="${esc(fmtDT(w.aplicado.em))}">${LANG==="pt"?"status aplicado":"status applied"}: ${esc(w.aplicado.status)}</span>`:""}
        ${!w.decisaoObs && ["rascunho","enviado"].includes(w.situacao)
          ? `<span class="tag" style="color:var(--warn);border-color:var(--warn)">${LANG==="pt"
              ? "aguardando a resposta do destinatário" : "waiting for the addressee's answer"}</span>` : ""}
      </div>
      <dl class="kv">
        ${linha(LANG==="pt"?"Assunto":"Subject", esc(w.assunto))}
        ${linha(LANG==="pt"?"Destinatário":"Addressed to", esc(w.para))}
        ${linha(LANG==="pt"?"Data do documento":"Document date", esc(fmtD(w.dataDocumento)))}
        ${linha(LANG==="pt"?"Referência":"Reference", esc(w.referencia))}
        ${linha(LANG==="pt"?"Status de tramitação":"Routing status", esc(w.statusDestino))}
        ${linha(LANG==="pt"?"Status final desejado":"Desired final status", esc(w.statusFinal))}
        ${linha(LANG==="pt"?"Itens":"Items", (w.itens||[]).map(x=>
            `<span class="tag" data-wvi="${esc(x)}" style="cursor:pointer">${esc(x)}</span>`).join(" "))}
        ${linha(LANG==="pt"?"Aberto por":"Opened by", esc(w.autor)+" &middot; "+esc(fmtDT(w.criadoEm)))}
        ${linha(LANG==="pt"?"Respondido por":"Answered by",
                esc(w.decisaoPor)+(w.decisaoEm?" &middot; "+esc(fmtD(w.decisaoEm)):""))}
      </dl>
      <div class="sep"></div>
      <h3 style="border:0;padding:0;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-3)">
        ${LANG==="pt"?"Texto do waiver":"Waiver text"}</h3>
      <div style="white-space:pre-wrap;margin-top:6px;line-height:1.55">${esc(w.texto)}</div>
      ${w.condicao?`<div class="sep"></div>
        <h3 style="border:0;padding:0;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-3)">
          ${LANG==="pt"?"Condições":"Conditions"}</h3>
        <div style="white-space:pre-wrap;margin-top:6px">${esc(w.condicao)}</div>`:""}
      ${w.decisaoObs?`<div class="sep"></div>
        <h3 style="border:0;padding:0;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-3)">
          ${LANG==="pt"?"Parecer do destinatário":"Addressee's answer"}</h3>
        <div class="panel pad" style="border-left:3px solid ${cor};margin-top:6px;padding:9px 12px">
          <div style="white-space:pre-wrap;line-height:1.55">${esc(w.decisaoObs)}</div></div>`:""}`,
      [{txt:T("fechar"), cls:"btn", fn:()=>UI.fechar()},
       ...(EDITAVEL ? [
         {txt:LANG==="pt"?"Apagar":"Delete", cls:"btn danger",
          fn:()=>{ if(this.excluir(w)){ UI.fechar(); Render.atual(); } }},
         {txt:LANG==="pt"?"Editar pedido":"Edit request", cls:"btn", fn:()=>this.painel({id:w.id})},
         {txt:w.decisaoObs ? (LANG==="pt"?"Rever resposta":"Revise the answer")
                           : (LANG==="pt"?"Registrar resposta":"Record the answer"),
          cls:"btn", fn:()=>this.responder(w.id)}] : []),
       {txt:T("imprimir"), cls:"btn pri", fn:()=>this.imprimir([w])}]);
    $$("[data-wvi]").forEach(t=>t.onclick=()=>UI.detalhe(t.dataset.wvi));
  },

  /* ------------------- o bloco que aparece dentro do item -------------- */
  blocoItemHTML(itemId){
    const l = this.doItem(itemId);
    if(!l.length && !EDITAVEL) return "";
    return `<div class="panel pad" style="border-left:3px solid var(--accent);margin-bottom:12px">
      <div class="rowflex" style="justify-content:space-between">
        <b>${LANG==="pt"?"Waivers":"Waivers"}</b>
        ${EDITAVEL?`<button class="btn sm" id="wvNovoDoItem">+ ${LANG==="pt"?"Pedir waiver":"Request waiver"}</button>`:""}
      </div>
      ${l.length? l.map(w=>{ const c=this.corSituacao(w.situacao); return `
        <div class="rowflex" style="font-size:11.5px;margin-top:6px">
          <span class="pill" style="background:${c}18;color:${c};border-color:${c}55">${esc(this.rotuloSituacao(w.situacao))}</span>
          <b>${esc(w.numero)}</b>
          <span class="muted" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(w.assunto||w.texto)}</span>
          ${EDITAVEL && !w.decisaoObs && ["rascunho","enviado"].includes(w.situacao)
            ? `<button class="btn sm pri" data-wvr="${esc(w.id)}" title="${LANG==="pt"
                 ? "O destinatário respondeu: registrar o parecer e aplicar o status final"
                 : "The addressee answered: record the decision and apply the final status"}">${
                 LANG==="pt"?"Responder":"Answer"}</button>` : ""}
          <button class="btn sm" data-wvv="${esc(w.id)}">${LANG==="pt"?"Abrir":"Open"}</button>
        </div>`; }).join("")
        : `<div class="muted" style="font-size:11.5px;margin-top:5px">${LANG==="pt"
             ? "Nenhum waiver para este item." : "No waiver for this item."}</div>`}
    </div>`;
  },
  ligarBloco(itemId){
    const b = $("#wvNovoDoItem");
    if(b) b.onclick = ()=>this.painel({itens:[itemId]});
    $$("[data-wvv]").forEach(x=>x.onclick=()=>this.ver(x.dataset.wvv));
    /* Vindo do item, a janela do item reabre depois: e la que a pessoa vai
       conferir o status novo e a observacao que acabou de nascer. */
    $$("[data-wvr]").forEach(x=>x.onclick=()=>this.responder(x.dataset.wvr, {voltarAoItem:itemId}));
  },

  /* --------------------------- o documento ---------------------------
     Folha de estilo propria: um waiver e um documento formal, nao um relatorio
     de dados. Herda do relatorio o corpo, a tabela e o rodape (Export.moldura)
     e acrescenta o que faz um oficio parecer um oficio.

     As decisoes de desenho, em uma linha cada:
       - faixa cheia no topo em vez de caixa vazada: da peso ao documento e
         separa a identificacao do conteudo sem uma regua a mais;
       - o fio colorido sob a faixa e a cor da SITUACAO - da para saber se um
         waiver foi aprovado de longe, com a folha na mesa;
       - as pilulas de status usam a cor real do status na base, a mesma da
         tela: o papel e a tela falam a mesma lingua;
       - tres etapas na tramitacao (de onde esta -> para onde vai agora -> onde
         deve parar), porque duas escondiam a informacao que mais importa: o
         item nao esta onde o waiver supoe;
       - cada bloco de texto tem uma barra lateral de cor propria (azul para o
         pedido, verde para as condicoes, ambar para o parecer): quem folheia
         acha a secao sem ler o titulo;
       - marca d'agua so em rascunho e cancelado - um papel que nao vale nao
         pode parecer que vale. */
  cssWaiver(){ return `
  /* A moldura do relatorio afasta o conteudo das bordas para ficar bonito na
     TELA; no papel quem afasta e a margem da @page, entao esse respiro extra e
     so folha desperdicada - e sao 28px, que e o que faz um waiver bem escrito
     caber ou nao caber. */
  @media print { .folha { padding:0; } }
  /* Margem propria, menor que a do relatorio: aqui a folha e um documento
     unico e cada milimetro de sobra decide se o waiver bem escrito cabe numa
     folha ou deixa as assinaturas orfas na seguinte. 10mm continua dentro da
     area imprimivel de qualquer impressora de escritorio. */
  @page { size: A4 portrait; margin: 10mm 10mm 12mm; }
  .waiver { break-after:page; page-break-after:always; position:relative; }
  .waiver:last-of-type { break-after:auto; page-break-after:auto; }
  .waiver > * { position:relative; z-index:1; }

  /* ---- marca d'agua: so no que ainda nao vale ----
     POR CIMA do conteudo, nao atras: atras dos paineis brancos ela sumia e o
     rascunho saia com cara de documento valido. Contornada em vez de
     preenchida - le-se de longe sem cobrir uma linha sequer do texto. */
  .wmarca { position:absolute; inset:0; z-index:2; display:flex; align-items:center;
            justify-content:center; pointer-events:none; }
  .wmarca span { font-size:80px; font-weight:800; letter-spacing:.22em; text-transform:uppercase;
                 color:transparent; -webkit-text-stroke:2px rgba(17,36,63,.17);
                 transform:rotate(-24deg); white-space:nowrap; }

  /* ---- cabecalho ---- */
  .wtopo { display:flex; justify-content:space-between; align-items:stretch; gap:16px;
           background:linear-gradient(100deg,#11243f 0%,#22467a 58%,#2f5fa8 100%);
           color:#fff; border-radius:7px 7px 0 0; padding:11px 17px; }
  .wtopo .esq { min-width:0; }
  .wtopo .esq .marca { font-size:8px; letter-spacing:.18em; text-transform:uppercase;
                       color:#9cc0ee; font-weight:700; }
  .wtopo .esq h1 { font-size:18.5px; margin:3px 0 0; font-weight:650; letter-spacing:.005em; color:#fff; }
  .wtopo .esq .ass { font-size:11px; color:#cddff5; margin-top:3px; overflow-wrap:anywhere; }
  .wtopo .dir { flex:none; text-align:right; display:flex; flex-direction:column;
                justify-content:space-between; align-items:flex-end; }
  .wtopo .dir .rot { font-size:7.5px; letter-spacing:.16em; text-transform:uppercase; color:#9cc0ee; }
  .wtopo .dir .num { font-size:18px; font-weight:750; font-variant-numeric:tabular-nums; letter-spacing:.02em; }
  .wtopo .dir .sit { margin-top:6px; padding:2px 11px; border-radius:20px; background:#fff;
                     font-size:8.5px; font-weight:800; text-transform:uppercase; letter-spacing:.1em; }
  .wfio { height:4px; border-radius:0 0 3px 3px; margin-bottom:11px; }

  /* ---- ficha de identificacao ---- */
  .wficha { display:grid; grid-template-columns:repeat(4,1fr); border:1px solid #dbe3ef;
            border-radius:6px; overflow:hidden; margin:0 0 4px; background:#fff; }
  .wficha > div { padding:4px 11px; border-right:1px solid #e9eef6; border-bottom:1px solid #e9eef6; }
  .wficha > div:nth-child(4n) { border-right:0; }
  .wficha > div:nth-last-child(-n+4) { border-bottom:0; background:#f7f9fc; }
  .wficha dt { font-size:7.5px; text-transform:uppercase; letter-spacing:.11em; color:#8a97a8; font-weight:700; }
  .wficha dd { margin:2px 0 0; font-size:11px; font-weight:600; color:#16181d; overflow-wrap:anywhere; }

  /* ---- secoes numeradas ---- */
  .wsec { margin-top:9px; break-inside:avoid; }
  .wsec > h2 { display:flex; align-items:center; gap:8px; margin:0 0 6px; padding:0 0 4px;
               font-size:10px; text-transform:uppercase; letter-spacing:.11em; color:#11243f;
               font-weight:700; border-bottom:1.5px solid #dbe3ef; }
  .wsec > h2 .n { display:inline-flex; align-items:center; justify-content:center; flex:none;
                  width:17px; height:17px; border-radius:50%; background:#2f5fa8; color:#fff;
                  font-size:9px; font-weight:700; letter-spacing:0; }
  .wsec > h2 .aux { margin-left:auto; font-weight:500; letter-spacing:.02em; text-transform:none;
                    color:#8a97a8; font-size:9.5px; }

  /* ---- tramitacao: de onde esta, para onde vai agora, onde deve parar ---- */
  .wtram { display:flex; align-items:stretch; }
  .wtram .cx { flex:1; min-width:0; border:1px solid #dbe3ef; border-top:3px solid #9db1cc;
               border-radius:6px; padding:8px 10px; background:#fff; text-align:center; }
  /* A do meio e a ACAO que se pede - as duas vizinhas sao contexto. */
  .wtram .cx.agora { background:#f4f8fd; border-color:#c3d4ea; border-top-width:4px; }
  .wtram .cx .lab { display:block; font-size:7.5px; text-transform:uppercase; letter-spacing:.11em;
                    color:#8a97a8; font-weight:700; margin-bottom:5px; }
  .wtram .cx .val { display:flex; flex-direction:column; gap:3px; align-items:center; }
  .wtram .seta { display:flex; align-items:center; padding:0 9px; color:#b3c4da; font-size:17px; font-weight:700; }

  /* ---- pilula de status, com a cor real do status na base ---- */
  .stp { display:inline-block; padding:1px 8px; border-radius:20px; font-size:9.5px; font-weight:700;
         border:1px solid currentColor; white-space:nowrap; max-width:100%; overflow-wrap:break-word; }

  /* ---- tabela dos itens ---- */
  table.witens th { background:#11243f; border-color:#11243f; font-size:8.5px; letter-spacing:.09em; }
  table.witens td { font-size:10px; border-color:#e4eaf3; overflow-wrap:break-word; padding:3px 6px; }
  table.witens tbody tr:nth-child(even) td { background:#f7f9fc; }
  table.witens td.cod b { font-size:10.5px; }

  /* ---- blocos de texto, cada um com a sua cor ---- */
  .wtexto { white-space:pre-wrap; font-size:11px; line-height:1.55; text-align:justify; color:#16181d;
            border:1px solid #e4eaf3; border-left:3px solid #2f5fa8; border-radius:0 6px 6px 0;
            padding:8px 13px; background:#fbfcfe; min-height:24mm; }
  .wtexto.cond { border-left-color:#2f7a4f; background:#f9fdfa; min-height:0; }
  .wtexto.parecer { border-left-color:#b8860b; background:#fffdf6; min-height:13mm; }
  .wtexto .vazio { color:#aab3c0; font-style:italic; }

  /* ---- assinaturas: o espaco de assinar fica ACIMA da linha ---- */
  /* O parecer e as assinaturas viajam juntos: um waiver que quebre deixando
     so a linha de assinatura na folha seguinte parece documento truncado. */
  .wfecho { break-inside:avoid; page-break-inside:avoid; }
  .wassin { display:grid; grid-template-columns:repeat(2,1fr); gap:30px; margin-top:4px; break-inside:avoid; }
  .wassin .lin { border-top:1.2px solid #11243f; padding-top:5px; margin-top:10mm;
                 font-size:9.5px; color:#5d6a7d; }
  .wassin .lin b { display:block; font-size:10.5px; color:#11243f; letter-spacing:.02em; }
  .wnota { font-size:8.5px; color:#8a97a8; margin-top:6px; padding-top:5px; border-top:1px solid #eef2f7; }`; },

  docWaiverHTML(w){
    const e = v => esc(limparTexto(v,{quebras:"achatar"}));
    const p = v => esc(limparTexto(v,{quebras:"manter"}));
    const pt = LANG==="pt";
    const sit = this.situacao(w.situacao);
    const itens = (w.itens||[]).map(id => (S.db?.itens||[]).find(i=>i.item===id) || {item:id});
    const cor = st => corSegura(R.corDe(st));
    const pilula = st => st
      ? `<span class="stp" style="color:${cor(st)};background:${cor(st)}14">${e(st)}</span>`
      : `<span class="stp" style="color:#9aa3b0;background:#f2f4f7">—</span>`;

    /* De onde os itens saem HOJE. Sem isto o documento dizia para onde vai sem
       dizer de onde - e quem le nao consegue conferir se a premissa vale. */
    const atuais = [...new Set(itens.map(i=>i.status).filter(Boolean))];
    const fora = w.statusDestino ? itens.filter(i=>i.status && i.status!==w.statusDestino).length : 0;

    let k = 0;
    const sec = (titulo, corpo, aux="") => `<section class="wsec">
      <h2><span class="n">${++k}</span>${e(titulo)}${aux?`<span class="aux">${e(aux)}</span>`:""}</h2>
      ${corpo}</section>`;
    const ficha = (rot, v) => `<div><dt>${e(rot)}</dt><dd>${e(v)||"—"}</dd></div>`;
    const marca = ["rascunho","cancelado"].includes(w.situacao)
      ? `<div class="wmarca"><span>${e(this.rotuloSituacao(w.situacao))}</span></div>` : "";

    return `<section class="waiver">
    ${marca}
    <div class="wtopo">
      <div class="esq">
        <div class="marca">StatusMilestone &middot; J08 &middot; ${e(pt?"Fluxo de Evidências":"Evidence Flow")}</div>
        <h1>${e(pt?"Solicitação de Waiver":"Waiver Request")}</h1>
        ${w.assunto?`<div class="ass">${e(w.assunto)}</div>`:""}
      </div>
      <div class="dir">
        <div><div class="rot">${e(pt?"Documento nº":"Document no.")}</div>
             <div class="num">${e(w.numero)}</div></div>
        <span class="sit" style="color:${corSegura(sit.cor)}">${e(this.rotuloSituacao(w.situacao))}</span>
      </div>
    </div>
    <div class="wfio" style="background:${corSegura(sit.cor)}"></div>

    <dl class="wficha">
      ${ficha(pt?"Data do documento":"Document date", fmtD(w.dataDocumento))}
      ${ficha(pt?"Destinatário":"Addressed to", w.para)}
      ${ficha(pt?"Solicitante":"Requested by", w.autor)}
      ${ficha(pt?"Referência":"Reference", w.referencia)}
      ${ficha(pt?"Itens abrangidos":"Items covered", String(itens.length))}
      ${ficha(pt?"Origem":"Origin", w.origem==="passivo" ? (pt?"Passivo — feito à mão":"Backlog — by hand")
                                                         : (pt?"Emitido pelo sistema":"Issued by the app"))}
      ${ficha(pt?"Revisão da base":"Database revision", String(S.db?.meta?.revisao ?? "—"))}
      ${ficha(pt?"Emitido em":"Printed", fmtDT(agora()))}
    </dl>

    ${sec(pt?"Tramitação solicitada":"Requested routing", `
      <div class="wtram">
        <div class="cx"><span class="lab">${e(pt?"Situação atual dos itens":"Items' current status")}</span>
          <div class="val">${atuais.length? atuais.slice(0,4).map(pilula).join("")
            + (atuais.length>4?`<span class="stp" style="color:#9aa3b0;background:#f2f4f7">+${atuais.length-4}</span>`:"")
            : pilula("")}</div></div>
        <div class="seta">&rarr;</div>
        <div class="cx agora" style="border-top-color:${w.statusDestino?cor(w.statusDestino):"#9db1cc"}">
          <span class="lab">${e(pt?"Tramitação (agora)":"Routing (now)")}</span>
          <div class="val">${pilula(w.statusDestino)}</div></div>
        <div class="seta">&rarr;</div>
        <div class="cx" style="border-top-color:${w.statusFinal?cor(w.statusFinal):"#9db1cc"}">
          <span class="lab">${e(pt?"Status final desejado":"Desired final status")}</span>
          <div class="val">${pilula(w.statusFinal)}</div></div>
      </div>`,
      w.statusDestino ? (fora ? (pt?`${fora} item(ns) ainda não estão na tramitação`
                                  : `${fora} item(s) not yet at the routing status`)
                              : (pt?"todos já na tramitação":"all already at the routing status")) : "")}

    ${sec(pt?"Itens abrangidos":"Items covered", `
      <table class="itens witens">
        <colgroup><col style="width:24px"><col style="width:86px"><col style="width:92px"><col style="width:72px">
          <col><col style="width:126px"></colgroup>
        <thead><tr><th class="n">#</th><th>${e(pt?"Item":"Item")}</th><th>InspType</th><th>Evidence</th>
          <th>${e(pt?"Descrição":"Description")}</th><th>${e(pt?"Status atual":"Current status")}</th></tr></thead>
        <tbody>${itens.map((i,j)=>`<tr>
          <td class="n">${j+1}</td><td class="cod"><b>${e(i.item)}</b></td><td>${e(i.inspType)}</td>
          <td>${e(i.evidence)}</td><td>${e(i.numAndDescription || i.description)}</td>
          <td>${i.status? pilula(i.status)
                        : `<span class="vazio">${e(pt?"não está na base":"not in the database")}</span>`}</td>
        </tr>`).join("") || `<tr><td colspan="6" class="vazio">—</td></tr>`}</tbody>
      </table>`, `${itens.length} ${pt?"item(ns)":"item(s)"}`)}

    ${sec(pt?"Texto do waiver":"Waiver text",
      `<div class="wtexto">${p(w.texto) || `<span class="vazio">${e(pt?"(sem texto)":"(no text)")}</span>`}</div>`)}

    ${w.condicao ? sec(pt?"Condições e medidas compensatórias":"Conditions and compensating measures",
      `<div class="wtexto cond">${p(w.condicao)}</div>`) : ""}

    <div class="wfecho">
    ${sec(pt?"Parecer e decisão":"Decision",
      `<div class="wtexto parecer">${
        (p(w.decisaoObs) || `<span class="vazio">${e(pt?"a preencher":"to be filled in")}</span>`)
        + (w.decisaoPor?`\n\n${e(pt?"Decidido por":"Decided by")}: ${e(w.decisaoPor)}${
            w.decisaoEm?` (${e(fmtD(w.decisaoEm))})`:""}`:"")
      }</div>`)}

    <div class="wassin">
      <div class="lin"><b>${e(pt?"Solicitante":"Requested by")}</b>
        <span>${e(w.autor)||"&nbsp;"} &middot; ${e(pt?"data":"date")} ___/___/______</span></div>
      <div class="lin"><b>${e(pt?"Aprovação":"Approval")}</b>
        <span>${e(w.para)||e(pt?"nome e visto":"name and initials")} &middot; ___/___/______</span></div>
    </div>
    </div>
    <p class="wnota">${e(pt
      ? "Documento gerado pelo StatusMilestone a partir do registro do waiver na base. A situação e os status impressos são os do momento da geração."
      : "Generated by StatusMilestone from the waiver record in the database. The status printed is the one at generation time.")}</p>
  </section>`;
  },

  documento(lista){
    const l = (lista||[]).filter(Boolean);
    const o = {...Export.opcoes(), resumo:false, somenteAberto:false};
    const titulo = l.length===1 ? `Waiver ${l[0].numero}`
                                : (LANG==="pt"?`Waivers (${l.length})`:`Waivers (${l.length})`);
    const corpo = l.length ? l.map(w=>this.docWaiverHTML(w)).join("\n")
      : `<div class="nada">${LANG==="pt"?"Nenhum waiver para imprimir":"No waiver to print"}</div>`;
    return Export.moldura(titulo, o, false, this.cssWaiver(), corpo);
  },
  imprimir(lista){ Export.imprimirHTML(this.documento(lista)); },
  filtro:"",
  htmlArquivo(lista){
    const l = (lista||[]).filter(Boolean);
    dl(nomeArquivo(l.length===1 ? `waiver-${l[0].numero}` : `waivers-${hoje()}`, "html"),
       this.documento(l), "text/html;charset=utf-8");
  },
};

/* ---------------------------- a tela de waivers ----------------------- */
Render.waivers = function(){
  $("#pageTitle").textContent = T("waivers");
  const todos = Waiver.lista().slice()
    .sort((a,b)=>String(b.dataDocumento||"").localeCompare(String(a.dataDocumento||""))
                 || String(b.numero||"").localeCompare(String(a.numero||"")));
  const filtro = Waiver.filtro || "";
  const lista = filtro ? todos.filter(w=>w.situacao===filtro) : todos;
  const conta = id => todos.filter(w=>w.situacao===id).length;

  $("#headerExtra").innerHTML =
    (EDITAVEL?`<button class="btn pri" id="wvNovo">+ ${LANG==="pt"?"Novo waiver":"New waiver"}</button>`:"")+
    `<button class="btn" id="wvImp" ${lista.length?"":"disabled"}>⎙ ${LANG==="pt"?"Imprimir":"Print"}</button>`+
    `<button class="btn" id="wvHtml" ${lista.length?"":"disabled"}>↓ HTML</button>`;

  const cor = w => Waiver.corSituacao(w.situacao);
  $("#view").innerHTML = `
    <div class="chips" style="margin-bottom:14px">
      <span class="chip ${filtro?"":"on"}" data-wf="">${T("todos")} <b>${todos.length}</b></span>
      ${Waiver.SITUACOES.map(x=>`<span class="chip ${filtro===x.id?"on":""}" data-wf="${x.id}">${
        esc(LANG==="pt"?x.pt:x.en)} <b>${conta(x.id)}</b></span>`).join("")}
    </div>
    ${lista.length? `<div class="panel"><div class="corpo" style="overflow:auto">
      <table><thead><tr>
        <th style="width:118px">${LANG==="pt"?"Número":"Number"}</th>
        <th style="width:84px">${T("data")}</th>
        <th style="width:96px">${LANG==="pt"?"Situação":"Status"}</th>
        <th style="width:54px" class="num">${LANG==="pt"?"Itens":"Items"}</th>
        <th>${LANG==="pt"?"Assunto":"Subject"}</th>
        <th style="width:270px">${LANG==="pt"?"Tramitação":"Routing"}</th>
        <th style="width:120px">${T("autor")}</th>
      </tr></thead><tbody>
      ${lista.map(w=>`<tr data-wv="${esc(w.id)}" style="cursor:pointer">
        <td class="num"><b>${esc(w.numero)}</b>${w.origem==="passivo"
            ? ` <span class="tag" title="${LANG==="pt"?"feito à mão, registrado depois":"written by hand, recorded later"}">${
                LANG==="pt"?"passivo":"backlog"}</span>` : ""}</td>
        <td class="num">${esc(fmtD(w.dataDocumento))}</td>
        <td><span class="pill" style="background:${cor(w)}18;color:${cor(w)};border-color:${cor(w)}55">${
          esc(Waiver.rotuloSituacao(w.situacao))}</span></td>
        <td class="num">${(w.itens||[]).length}</td>
        <td>${esc(w.assunto || limparTexto(w.texto,{quebras:"achatar"}).slice(0,90))}</td>
        <td class="muted" style="font-size:11px">${esc(w.statusDestino||"—")} → ${esc(w.statusFinal||"—")}</td>
        <td>${esc(w.autor||"")}</td>
      </tr>`).join("")}
      </tbody></table></div></div>`
    : `<div class="empty"><h3>${LANG==="pt"?"Nenhum waiver":"No waiver"}</h3>
        <p>${LANG==="pt"
          ? (EDITAVEL ? "Um waiver pode ser pedido aqui, na janela de um item ou com vários itens selecionados na tabela. Waiver que já foi feito à mão entra pelo mesmo caminho, marcado como <b>passivo</b>."
                      : "Nenhum waiver registrado nesta base.")
          : (EDITAVEL ? "A waiver can be requested here, from an item window, or with several items selected in the table."
                      : "No waiver recorded in this database.")}</p></div>`}`;

  $$("[data-wf]").forEach(c=>c.onclick=()=>{ Waiver.filtro = c.dataset.wf; Render.waivers(); });
  $$("tr[data-wv]").forEach(r=>r.onclick=()=>Waiver.ver(r.dataset.wv));
  const bn=$("#wvNovo");  if(bn) bn.onclick=()=>Waiver.painel({});
  const bi=$("#wvImp");   if(bi) bi.onclick=()=>Waiver.imprimir(lista);
  const bh=$("#wvHtml");  if(bh) bh.onclick=()=>Waiver.htmlArquivo(lista);

Render.itens = function(){
  $("#pageTitle").textContent=T("itens");
  $("#headerExtra").innerHTML = Filtros.resumoHTML()+
    `<button class="btn sm" id="btnCols" title="${LANG==="pt"?"Escolher colunas":"Choose columns"}">▦ ${LANG==="pt"?"Colunas":"Columns"}</button>`+
    `<button class="btn ${S.textoCompleto?"pri":""}" id="btnTxt" title="${LANG==="pt"
       ? "Alterna entre uma linha por item (com o texto completo ao passar o mouse) e o texto inteiro na tabela"
       : "Switch between one line per item (full text on hover) and the whole text in the table"}">${
       S.textoCompleto? (LANG==="pt"?"⇕ Texto completo":"⇕ Full text")
                      : (LANG==="pt"?"⇔ Uma linha":"⇔ Single line")}</button>`+
    `<button class="btn" id="btnExpTab">↓ ${LANG==="pt"?"Exportar":"Export"}</button>`;
  const lista = ordenar(itensFiltrados());
  const visiveis = new Set(lista.map(i=>i.item));
  for(const id of [...S.selecao]) if(!visiveis.has(id)) S.selecao.delete(id);  /* filtro mudou */
  const cols = Colunas.defs();
  const soma = cols.reduce((a,c)=>a+c.peso,0);
  /* Celula de texto: corta com reticencias e entrega o conteudo inteiro no
     balao ao passar o mouse; no modo "texto completo" nada e cortado. */
  const cel = (valor, rotulo) => {
    const v = String(valor ?? "");
    if(!v) return `<span class="muted">—</span>`;
    const tip = (!S.textoCompleto && v.length>26)
      ? ` data-tip="${esc(v)}" data-tip-l="${esc(rotulo)}"` : "";
    return `<span class="trunc"${tip}>${esc(v)}</span>`;
  };
  const todosMarcados = lista.length && lista.every(i=>S.selecao.has(i.item));
  $("#view").innerHTML = `${Lote.barra(lista)}<div class="panel">
    <h3>${lista.length} ${LANG==="pt"?"itens":"items"}${lista.length!==S.db.itens.length?` <span class="sub">${LANG==="pt"?"de":"of"} ${S.db.itens.length}</span>`:""}</h3>
    <div class="tblwrap"><table id="itensTbl" class="${S.textoCompleto?"livre":""}" style="table-layout:fixed">
    <colgroup>${cols.map(c=>`<col style="width:${(c.peso/soma*100).toFixed(1)}%">`).join("")}</colgroup>
    <thead><tr>
      ${cols.map(c=>`<th data-s="${c.id}" title="${LANG==="pt"?"Ordenar por":"Sort by"} ${esc(Colunas.rotulo(c))}"${
        S.ordenacao.campo===c.id?' style="color:var(--accent)"':""}>${esc(Colunas.rotulo(c))} <span style="opacity:${

      ${lista.length? lista.map(i=>`<tr data-i="${esc(i.item)}" class="${S.selecao.has(i.item)?"sel":""}${
          S.cursor===i.item?" cursor":""}">
        ${cols.map(c=>`<td class="${c.cls||""} ${c.marca?c.marca(i):""}" data-r="${esc(Colunas.rotulo(c))}">${
          c.cel? c.cel(i) : cel(i[c.id], Colunas.rotulo(c))}</td>`).join("")}
      </tr>`).join("")

  $$("thead th[data-s]").forEach(th=>th.onclick=()=>{
    const c=th.dataset.s;

    Render.atual();});
  $$("tbody tr[data-i]").forEach(tr=>tr.onclick=e=>{
    if(e.target.closest("input[data-sel]")) return;          /* clique na caixinha nao abre o detalhe */
    S.cursor=tr.dataset.i; UI.detalhe(tr.dataset.i);});

    e.stopPropagation();
    cb.checked? S.selecao.add(cb.dataset.sel) : S.selecao.delete(cb.dataset.sel);
    Render.atual();});
  const st=$("#selTodos"); if(st) st.onclick=()=>{
    st.checked? lista.forEach(i=>S.selecao.add(i.item)) : S.selecao.clear();
    Render.atual();};
  Lote.ligar(lista);

  $("#btnCols").onclick=()=>Colunas.painel();
  $("#btnExpTab").onclick=()=>Export.painel(lista, LANG==="pt"?"Itens":"Items");
  $("#btnTxt").onclick=()=>{ S.textoCompleto=!S.textoCompleto;

};

/* Teclado na tabela: revisar 71 itens abertos nao pode exigir mouse a cada
   linha. Setas andam, Enter abre, espaco marca para o lote. */
const TecladoItens = {
  lista(){ return ordenar(itensFiltrados()); },
  mover(passo){
    const l=this.lista(); if(!l.length) return;
    const i=l.findIndex(x=>x.item===S.cursor);
    const novo=l[Math.max(0, Math.min(l.length-1, i<0? 0 : i+passo))];
    S.cursor=novo.item;
    const trs=$$("tbody tr[data-i]");
    trs.forEach(tr=>tr.classList.toggle("cursor", tr.dataset.i===S.cursor));
    trs.find(tr=>tr.dataset.i===S.cursor)?.scrollIntoView({block:"nearest"});
  },
  marcar(){
    if(!S.cursor) return;
    S.selecao.has(S.cursor)? S.selecao.delete(S.cursor) : S.selecao.add(S.cursor);
    Render.atual();
  },
  tecla(e){
    if(S.rota!=="itens" || $("#ov")) return false;
    if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target?.tagName||"")) return false;
    if(e.key==="ArrowDown"){ this.mover(1); return true; }
    if(e.key==="ArrowUp"){ this.mover(-1); return true; }
    if(e.key==="Enter" && S.cursor){ UI.detalhe(S.cursor); return true; }
    if(e.key===" " && S.cursor){ this.marcar(); return true; }
    return false;
  },
};

   Clicar no cabecalho recolhe; o seletor ao lado reordena os cards. */
const ORD_KANBAN=[

  {id:"status",    pt:"Status",            en:"Status"},
  {id:"inspType",  pt:"Tipo de inspe\u00e7\u00e3o", en:"Inspection type"},

/* ================= coerência entre status e observação =================
   Nada a ver com a extinta tela de conflitos de migracao: aqui o que se olha e
   se o TEXTO da observacao contradiz o status do proprio item. Alimenta o
   relatorio "Inconsistências" e a verificacao de integridade. */
function textoDizConcluido(t){
  t=(t||"").toLowerCase();
  return /done|conform|accepted|waiver|aceito|conclu/.test(t);
}
/* Alguns status sao POSTERIORES a execucao: fazer o B05 e depois aguardar o teste
   a vacuo ou a assinatura e o fluxo normal, entao "B05 done" neles nao e
   contradicao. A lista fica em config, ajustavel sem mexer no codigo. */
function statusAceitaTextoConcluido(st){
  const l = S.db?.config?.statusPosExecucao ?? ["7 - Missing Vacuum Test or Sign"];
  return l.includes(st);
}
function incoerente(status,texto){
  if(!texto) return false;
  if(statusAceitaTextoConcluido(status)) return false;
  const c=textoDizConcluido(texto);
  return (R.aberto(status) && c) || (status==="1 - Validated by ICN" && !c);
}

function relMigracaoHTML(){
  const r=S.db.relatorioMigracao; if(!r) return `<div class="muted">—</div>`;
