    const esc0=$("#xKescala"), escV=$("#xKescalaV");
    if(esc0 && escV) esc0.oninput = ()=>{ escV.textContent = esc0.value+"%"; };

    /* A previsao e medida, nao estimada - e por isso ela custa um clique em vez
       de correr a cada toque num cursor. */
    const dica=$("#xKdica");
    if(dica){
      /* O resultado vai num span ao lado, nao no lugar do botao: substituir o
         innerHTML inteiro apagava o proprio botao e so dava para prever uma vez. */
      dica.innerHTML = `<button class="btn sm" id="xPrever">${LANG==="pt"?"Quantas páginas vai dar?":"How many pages?"}</button>
        <button class="btn sm pri" id="xCaber">${LANG==="pt"?"Ajustar para caber em 1 página":"Fit on 1 page"}</button>
        <span id="xKdicaR" style="margin-left:8px"></span>`;
      const saida = $("#xKdicaR");
      $("#xPrever").onclick = async ()=>{
        const cols = lerSelecao();
        if(!cols.length) return toast(LANG==="pt"?"Escolha ao menos uma coluna":"Pick at least one column","bad");
        saida.textContent = LANG==="pt"?"medindo…":"measuring…";
        const r = await this.previsaoPaginas(lista, titulo, {...lerOpcoes(), cols});
        if(!r){ saida.textContent = LANG==="pt"?"não consegui medir aqui":"could not measure here"; return; }
        const cabe = r.paginas===1;
        saida.innerHTML = `<b style="color:var(--${cabe?"ok":r.paginas<=4?"fg-2":"warn"})">${
            r.paginas===1 ? (LANG==="pt"?"cabe em 1 página":"fits on 1 page")
                          : `${r.paginas} ${LANG==="pt"?"páginas":"pages"}`}</b>
          <span class="muted"> — ${LANG==="pt"
            ? `medido de verdade, não estimado; o Chrome ainda ajusta a escala na impressão. ${
                cabe? "" : "Para caber em uma: cartão <b>Etiqueta</b> e tamanho menor."}`
            : `actually measured, not guessed; Chrome still adjusts the scale when printing. ${
                cabe? "" : "To fit one page: <b>Chip</b> card and a smaller size."}`}</span>
          ${r.cortaNaLargura?`<br><b style="color:var(--bad)">${LANG==="pt"
            ? "corta na largura — reduza as colunas por página ou o tamanho do cartão"
            : "clipped horizontally — reduce columns per page or card size"}</b>`:""}`;
      };

      /* Ajustar e medir varias vezes: pode levar um segundo, e a tela diz isso
         em vez de parecer travada. */
      $("#xCaber").onclick = async ()=>{
        const cols = lerSelecao();
        if(!cols.length) return toast(LANG==="pt"?"Escolha ao menos uma coluna":"Pick at least one column","bad");
        $("#xLayout").value = "kanban"; trocouLayout();
        saida.textContent = LANG==="pt"?"ajustando…":"fitting…";
        const r = await this.ajustarParaCaber(lista, titulo, {...lerOpcoes(), cols});
        if(r.erro) return void (saida.textContent = LANG==="pt"?"não consegui medir aqui":"could not measure here");
        if(r.naoCoube){
          saida.innerHTML = `<b style="color:var(--warn)">${LANG==="pt"
            ? `não cabe em 1 página: o menor cartão ainda dá ${r.melhor.paginas}`
            : `does not fit on 1 page: the smallest card still needs ${r.melhor.paginas}`}</b>
            <span class="muted"> — ${LANG==="pt"
              ? "marque <b>Somente os em aberto</b>, tire o resumo, ou aceite mais páginas."
              : "tick <b>Open items only</b>, drop the summary, or accept more pages."}</span>`;
          return;
        }
        /* O que foi decidido volta para os controles: a pessoa ve o que mudou e
           pode continuar mexendo a partir dali. */
        $("#xKdens").value  = r.degrau.kanbanDensidade;
        $("#xKescala").value = r.degrau.kanbanEscala;
        const ev=$("#xKescalaV"); if(ev) ev.textContent = r.degrau.kanbanEscala+"%";
        if(r.semResumo && $("#xResumo")) $("#xResumo").checked = false;
        saida.innerHTML = `<b style="color:var(--ok)">${LANG==="pt"?"cabe em 1 página":"fits on 1 page"}</b>
          <span class="muted"> — ${LANG==="pt"?"cartão":"card"} <b>${esc(this.rotuloDegrau(r.degrau))}</b>${
            r.semResumo? (LANG==="pt"?", sem o resumo":", summary off") : ""}. ${LANG==="pt"
              ? "É o cartão mais legível que ainda coube, não o menor."
              : "It is the most readable card that still fits, not the smallest."}</span>`;
      };
    }
  },
};

/* ============================ normalização ============================ */
/* Decisao A3: "o descarte fica no log tecnico por alguns dias para recuperacao".
   Sem poda, logDescartes e logSobrescritas so engordam o database.json - e cada
   descarte carrega uma copia inteira das pendencias desfeitas. O indice dos
   arquivamentos NAO e podado: e ele que diz onde cada arquivo de historico foi
   parar, e isso vale para sempre. */
function podarLogs(db){
  const dias = db.config?.diasLogTecnico ?? 30;
  const corte = new Date(Date.now() - dias*864e5).toISOString();
  for(const k of ["logDescartes","logSobrescritas"]){
    if(!Array.isArray(db[k])) continue;
    db[k] = db[k].filter(l => String(l?.em ?? "") >= corte).slice(-500);
  }
}
function baseVazia(){
  return {schemaVersion:1, meta:{criadoEm:agora(),atualizadoEm:agora(),revisao:0,
      ultimoAutor:"",appVersion:"1.0.0",origem:"base vazia"},
    config:{idioma:"pt",minutosConsolidacao:10,diasSemAtualizacao:30,diasAlertaAging:60,
      caminhoPadrao:Caminho.FABRICA,
      status:[], familias:[], statusAbertoExcecoes:["1 - Validated by ICN","2 - Not Blocking","2 - Not Available Jx"],
      inspTypesFuncionais:[]},
    marcos:[], itens:[], historico:[], pendentes:[], observacoes:[], conflitos:[], waivers:[]};
}
function normalizar(db){
  db.schemaVersion ??= 1;
  db.meta ??= {revisao:0}; db.config ??= {}; db.marcos ??= [];
  db.itens ??= []; db.historico ??= []; db.pendentes ??= [];
  db.observacoes ??= []; db.conflitos ??= [];
  /* Base gravada antes dos waivers nao traz a lista; sem isto a tela de
     waivers estouraria ao abrir uma base antiga. */
  db.waivers ??= [];
  if(!Array.isArray(db.waivers)) db.waivers = [];
  for(const w of db.waivers){
    if(!w || typeof w!=="object") continue;
    w.itens = Array.isArray(w.itens) ? w.itens.filter(x=>typeof x==="string") : [];
    w.situacao ??= "rascunho"; w.origem ??= "sistema";
    for(const k of ["numero","assunto","texto","condicao","para","referencia",
                    "statusDestino","statusFinal","decisaoPor","decisaoObs"]) w[k] ??= "";
    w.dataDocumento ??= (w.criadoEm||"").slice(0,10) || hoje();
    w.criadoEm ??= agora(); w.atualizadoEm ??= w.criadoEm; w.autor ??= "";
  }
  const c=db.config;
  c.minutosConsolidacao ??= 10; c.diasSemAtualizacao ??= 30; c.diasAlertaAging ??= 60;
  c.segundosSync ??= 7;
  /* Bases geradas antes do diagrama nao traziam este desenho; sem ele o painel
     "Evidências somente/exceto B05" ficava em branco. */
  c.fluxo ??= {};
  for(const k of ["b05","exceto"]) c.fluxo[k] ??= structuredClone(R.FLUXO_PADRAO[k]);
  /* As listas vem ANTES de qualquer laco sobre elas: uma base estruturalmente
     valida pode simplesmente nao trazer config.status, e percorrer o que ainda
     nao existe trancava a pessoa fora da propria base. */
  c.status ??= []; c.familias ??= []; c.inspTypesFuncionais ??= [];
  if(!Array.isArray(c.status)) c.status = [];
  if(!Array.isArray(c.familias)) c.familias = [];
  /* Correcao de cor. Duas cores ficavam perto demais do vermelho de
     "3 - Blocking" em visao normal (piso DeltaE 15): o laranja de
     "7 - Missing Vacuum" (7,1) e o rosa de "5 - Waiting Proof" (7,8 no escuro).
     As tres aparecem na mesma barra empilhada. Ciano e magenta resolvem.
     So mexemos no valor exato que saiu da migracao: uma cor ajustada a mao
     pelo usuario fica como esta. */
  const RECOR = {
    "7 - Missing Vacuum Test or Sign": ["#eb6834","#0891b2","#d95926","#1d94ad"],
    "5 - Waiting Proof":               ["#e87ba4","#b83280","#d55181","#b8518a"],
  };
  for(const d of c.status){
    const r = RECOR[d?.codigo]; if(!r) continue;
    if(d.cor===r[0]) d.cor=r[1];
    if(d.corEscura===r[2]) d.corEscura=r[3];
  }
  c.vistas ??= [];                      /* vistas salvas viajam com a base */
  c.mbAvisoTamanho ??= 8;               /* acima disso, a tela avisa (ver Arquivamento) */
  c.statusPosExecucao ??= ["7 - Missing Vacuum Test or Sign"];
  c.diasLogTecnico ??= 30;              /* decisao A3: o descarte e recuperavel por alguns dias */
  c.caminhoPadrao ??= Caminho.FABRICA;  /* onde a base mora na rede, para quem abre pela primeira vez */
  podarLogs(db);
  if(!c.familias.length) c.familias=[
    {id:"pendente",pt:"Pendente",en:"Pending",cor:"#8a8f98",ordem:1},
    {id:"prova",pt:"Em prova",en:"Waiting Proof",cor:"#b8860b",ordem:2},
    {id:"analise",pt:"Em análise",en:"Under Analysis",cor:"#c2703d",ordem:3},
    {id:"bloqueado",pt:"Bloqueado",en:"Blocking",cor:"#b3403a",ordem:4},
    {id:"ressalva",pt:"Aceito c/ ressalva",en:"Accepted w/ note",cor:"#3d6fa8",ordem:5},
    {id:"validado",pt:"Validado",en:"Validated",cor:"#2f7a4f",ordem:6},
    {id:"cancelado",pt:"Cancelado",en:"Canceled",cor:"#5c5f66",ordem:7}];
  /* qualquer status presente nos dados que não esteja no domínio entra como inativo */
  const conhecidos=new Set(c.status.map(s=>s.codigo));
  for(const st of new Set(db.itens.map(i=>i.status).filter(Boolean)))
    if(!conhecidos.has(st)){
      const n=parseInt(st,10);
      const fam = n===1?"validado":n===2?"ressalva":n===3||n===7?"bloqueado":n===4?"analise":
                  n===5?"prova":n===0?"cancelado":"pendente";
      c.status.push({codigo:st,familia:fam,ativo:true,ordem:c.status.length});
    }
  for(const i of db.itens){
    i.bigram ??= []; if(typeof i.bigram==="string") i.bigram=i.bigram.split(/[;,]/).map(s=>s.trim()).filter(Boolean);
    i.isB05 = i.isB05 ?? (i.inspType==="B05");
    i.criadoEm ??= (db.marcos[0]?.data || hoje());
    i.ultimaAlteracaoStatus ??= i.criadoEm;
    for(const k of ["updatedStatusObs","generalObs","ncr","tests","description","evidence",
                    "inspType","insp","originalJx","actualJx","actualJxDescription",
                    "numAndDescription","performance","mode","positionAC","hullPassageParts","sbr"]) i[k] ??= "";
  }
  R.invalidarHist();
}

/* Balao com o conteudo inteiro da celula cortada. */
(function balao(){
  let alvo=null;
  const d=()=>$("#tip");
  const esconder=()=>{ alvo=null; const t=d(); if(t) t.style.display="none"; };
  const posicionar=e=>{
    const t=d(); const r=t.getBoundingClientRect();
    let x=e.clientX+15, y=e.clientY+18;
    if(x+r.width  > innerWidth-10)  x = Math.max(8, e.clientX-14-r.width);
    if(y+r.height > innerHeight-10) y = Math.max(8, e.clientY-14-r.height);
    t.style.left=x+"px"; t.style.top=y+"px";
  };
  addEventListener("mouseover",e=>{
    const el=e.target.closest?.("[data-tip]"); if(!el || el===alvo) return;
    alvo=el; const t=d(); if(!t) return;
    t.innerHTML=(el.dataset.tipL?`<b>${esc(el.dataset.tipL)}</b>`:"")+esc(el.dataset.tip);
    t.style.display="block"; posicionar(e);
  });
  addEventListener("mousemove",e=>{ if(alvo) posicionar(e); });
  addEventListener("mouseout",e=>{ if(alvo && !e.relatedTarget?.closest?.("[data-tip]")) esconder(); });
  addEventListener("scroll",esconder,true);
  addEventListener("keydown",e=>{ if(e.key==="Escape") esconder(); });
})();

addEventListener("keydown",e=>{
  if(e.key==="Escape") UI.fecharPeloUsuario();
  if(!S.db) return;
  /* no detalhe: Alt+setas pula de item, Ctrl+Enter salva e avanca */
  if($("#ov") && S.selecionado){
    if(e.altKey && (e.key==="ArrowRight"||e.key==="ArrowLeft")){
      e.preventDefault(); return UI.irrItem(e.key==="ArrowRight"?1:-1); }
    if((e.ctrlKey||e.metaKey) && e.key==="Enter"){
      e.preventDefault(); UI.salvarDetalhe(S.selecionado); return UI.irrItem(1); }
    return;
  }
  if(TecladoItens.tecla(e)) e.preventDefault();
});

      </div>
    </div></div>

    <div class="panel"><h3>${LANG==="pt"?"O que esta tela é":"What this page is"}</h3><div class="pad">
      <p class="muted" style="line-height:1.8">${LANG==="pt"
        ? `Esta é a versão <b>somente leitura</b> do StatusMilestone. Ela abre o <b>database.json</b> que
           estiver na mesma pasta que este arquivo e mostra o estado atual: painéis, itens, quadro,
           fluxo de evidências, histórico e relatórios — tudo pode ser exportado.
           <b>Nada do que se faça aqui altera a base</b>: os comandos de gravação não existem neste
           arquivo, e a pasta é aberta em modo de leitura.<br><br>
           Para <b>registrar</b> uma mudança de status, use o sistema completo.`
        : `This is the <b>read-only</b> build of StatusMilestone. It opens the <b>database.json</b> sitting
           in the same folder as this file and shows the current state: panels, items, board, evidence
           flow, history and reports — all exportable.
           <b>Nothing done here changes the database</b>: the write routines are not in this file, and the
           folder is opened in read mode.<br><br>
           To <b>record</b> a status change, use the full system.`}</p>
    </div></div>

    <div class="panel"><h3>${LANG==="pt"?"Status e regra de “em aberto”":"Statuses and the “open” rule"}</h3>
      <div class="pad" style="max-height:340px;overflow:auto">
      ${(c.status||[]).map(st=>`<div class="rowflex" style="gap:8px;padding:3px 0;border-bottom:1px solid var(--line-2)">
        <i class="dot" style="background:${R.corDe(st.codigo)}"></i>
        <span style="flex:1;font-size:12px">${esc(st.codigo)}</span>
        <span class="tag">${R.aberto(st.codigo)? (LANG==="pt"?"em aberto":"open") : (LANG==="pt"?"fechado":"closed")}</span>
        <span class="muted mono" style="font-size:10.5px">${S.db.itens.filter(i=>i.status===st.codigo).length}</span>
      </div>`).join("")}</div></div>
  </div>`;
  const b=$("#vRecarregar"); if(b) b.onclick=()=>Visualizador.recarregar();
};
Render.config = Render.sobre;

/* ------------------------- a abertura ---------------------------------- */
const Visualizador = {
  origem:"",

  /* Caminho 1: buscar o database.json ao lado do arquivo. Funciona quando a
     pagina e servida por http(s) - intranet, GitHub Pages, um "python3 -m
     http.server" na pasta. Em file:// o proprio navegador recusa a leitura de
     um arquivo vizinho (e regra de seguranca dele, nao limitacao daqui), e ai
     vale o caminho 2. */
  async pelaURL(){
    if(!location.protocol.startsWith("http")) return null;
    const url = new URL("database.json", location.href).href;
    const r = await fetch(url, {cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const db = await r.json();
    this.origem = url;
    return db;
  },

  /* Caminho 2: a pasta autorizada uma vez fica guardada no navegador e volta
     sozinha nas proximas aberturas - e o que faz o duplo-clique funcionar sem
     perguntar nada a partir da segunda vez. */
  async pelaPasta({pedir=false}={}){
    if(!Store.suportado) return null;
    let ok = !!Store.dirHandle;
    if(!ok) ok = await Store.restaurarHandle();
    if(!ok && Store.dirHandlePendente) ok = await Store.pedirPermissaoSalva();
    if(!ok && pedir){ await Store.escolherPasta(); ok = !!Store.dirHandle; }
    if(!ok) return null;
    const db = await Store.lerArquivo();
    this.origem = (Store.dirHandle?.name || "") + "/database.json";
    return db;
  },

  aceitar(db){
    const val = validarBase(db);
    if(!val.valido){ UI.baseRecusada("database.json", val, JSON.stringify(db,null,1)); return false; }
    S.db = db;
    normalizar(S.db);
    Caminho.sincronizarDaBase();
    S.novidades = null;
    marcarEstado(LANG==="pt"?"base carregada (somente leitura)":"database loaded (read-only)","info");
    return true;
  },

  async abrir({pedir=false, silencioso=false}={}){
    let db=null, erro=null;
    try{ db = await this.pelaURL(); }catch(e){ erro = e; }
    if(!db){ try{ db = await this.pelaPasta({pedir}); }catch(e){ erro = erro||e; } }
    if(!db) return this.telaAbertura(erro);
    if(!this.aceitar(db)) return;
    irPara(S.rotaInicial || "dashboard"); S.rotaInicial = null;
    if(!silencioso) toast(`${S.db.itens.length} ${LANG==="pt"?"itens carregados":"items loaded"}`,"ok");
  },

  async recarregar(){
    try{
      const db = await this.pelaURL().catch(()=>null) || await this.pelaPasta();
      if(!db) return toast(LANG==="pt"?"Não consegui reler a base":"Could not re-read the database","bad");
      if(!this.aceitar(db)) return;
      R.invalidarHist(); Render.atual();
      toast(LANG==="pt"?"Base recarregada":"Database reloaded","ok");
    }catch(e){ toast(mensagemArmazenamento(e),"bad"); }
  },

  /* So aparece quando o carregamento automatico nao deu - e diz por que. */
  telaAbertura(erro){
    $("#pageTitle").textContent = "StatusMilestone";
    $("#headerExtra").innerHTML = "";
    const arquivo = location.protocol === "file:";
    $("#view").innerHTML = `<div class="panel pad" style="max-width:660px;margin:36px auto">
      <h3 style="border:0;padding:0;text-transform:none;font-size:17px;letter-spacing:-.02em;color:var(--fg)">
        ${LANG==="pt"?"Escolha a pasta da base, uma vez":"Pick the database folder, once"}</h3>
      <p class="muted" style="margin:10px 0 16px;line-height:1.8">${LANG==="pt"
        ? `Este visualizador lê o <b>database.json</b> que estiver na <b>mesma pasta</b> que ele.
           ${arquivo? `Como o arquivo foi aberto por duplo clique (<code>file://</code>), o navegador não
           deixa a página ler o arquivo vizinho sozinha — é uma trava de segurança dele. Autorize a pasta
           uma vez no botão abaixo: <b>da próxima vez ela volta sozinha</b> e a base abre direto.`
           : `Não encontrei o arquivo ao lado desta página. Autorize a pasta onde ele está:`}`
        : `This viewer reads the <b>database.json</b> in its <b>own folder</b>.
           ${arquivo? `Because the file was opened by double-click (<code>file://</code>), the browser will
           not let the page read its neighbour on its own — that is their security rule. Authorize the
           folder once with the button below: <b>next time it comes back on its own</b>.`
           : `I could not find the file next to this page. Authorize the folder it is in:`}`}</p>
      ${Store.suportado
        ? `<button class="btn pri" id="vPasta">📁 ${LANG==="pt"?"Selecionar pasta da base":"Select database folder"}</button>
           <button class="btn" id="vArquivo">${LANG==="pt"?"Abrir database.json":"Open database.json"}</button>`
        : `<div class="panel pad" style="background:var(--panel-2);border-color:var(--warn)">
             <b style="color:var(--warn)">${LANG==="pt"?"Navegador sem seleção de pasta":"Browser without folder picking"}</b>
             <p class="muted" style="margin:8px 0 0">${LANG==="pt"
               ? "Neste navegador só dá para abrir o arquivo à mão. No Chrome ou no Edge, a pasta é lembrada e a base abre sozinha."
               : "In this browser you can only open the file by hand. In Chrome or Edge the folder is remembered and the database opens on its own."}</p></div>
           <div class="rowflex" style="margin-top:12px">
             <button class="btn pri" id="vArquivo">${LANG==="pt"?"Abrir database.json":"Open database.json"}</button></div>`}
      ${erro?`<p class="muted" style="font-size:11px;margin-top:14px">${LANG==="pt"?"Detalhe":"Detail"}: ${esc(String(erro.message||erro))}</p>`:""}
      <div class="sep"></div>
      <p class="muted" style="font-size:11.5px;line-height:1.7">${LANG==="pt"
        ? "Esta tela <b>só lê</b>. Para registrar alterações, use o sistema completo."
        : "This page is <b>read-only</b>. To record changes, use the full system."}</p>
    </div>`;
    const bp=$("#vPasta"); if(bp) bp.onclick=()=>this.abrir({pedir:true});
    const ba=$("#vArquivo"); if(ba) ba.onclick=()=>this.abrirArquivo();
  },

  abrirArquivo(){
    const inp=document.createElement("input"); inp.type="file"; inp.accept=".json";
    inp.onchange=async()=>{
      const f=inp.files[0]; if(!f) return;
      let db;
      try{ db = JSON.parse(await f.text()); }
      catch(e){ return toast((LANG==="pt"?"JSON inválido: ":"Invalid JSON: ")+e.message,"bad"); }
      this.origem = f.name;
      if(!this.aceitar(db)) return;
      irPara("dashboard");
      toast(`${S.db.itens.length} ${LANG==="pt"?"itens carregados":"items loaded"}`,"ok");
    };
    inp.click();
  },
};
/* O cracha de pendentes e o botao de salvar sairam do cabecalho: a versao
   original mexeria em elementos que nao existem mais neste arquivo. */
Render.badgePendentes = function(){};

/* Sem base carregada, a tela "sem base" do sistema falaria em gravar. */
Render.semBase = function(motivo){ Visualizador.telaAbertura(motivo? new Error(motivo) : null); };

(async function iniciarVisualizador(){
  aplicarTema();
  document.documentElement.lang = LANG==="pt"?"pt-BR":"en";
  Filtros.restaurar();
  Render.nav();
  await Visualizador.abrir();
})();
</script>
