          <span class="mono">${S.db.itens.filter(i=>R.familiaDe(i.status)===f.id).length}</span></div>`).join("")}
    </div></div>

    <div class="panel"><h3>${T("backup")}</h3><div class="pad">
      <div class="rowflex" style="margin-bottom:11px">
        <button class="btn pri" id="bFazer">${LANG==="pt"?"Fazer backup agora":"Backup now"}</button>
        <button class="btn" id="bBaixar">${LANG==="pt"?"Baixar cópia":"Download copy"}</button>
        <button class="btn" id="bListar">${LANG==="pt"?"Listar backups":"List backups"}</button></div>
      <div id="bLista" class="muted" style="font-size:11.5px"></div>
      <div class="sep"></div>
      <p class="muted" style="font-size:11.5px;line-height:1.7">${LANG==="pt"
        ? "Backup automático a cada carregamento e antes de operações importantes, na subpasta <b>backups/</b>. Mantém as 30 versões mais recentes."
        : "Automatic backup on load and before important operations, in the <b>backups/</b> subfolder. Keeps the 30 most recent versions."}</p>
    </div></div>

    <div class="panel"><h3>${LANG==="pt"?"Integridade da base":"Database integrity"}</h3><div class="pad">
      <div id="integ"></div>
      <div class="rowflex" style="margin-top:11px"><button class="btn" id="bVerif">${LANG==="pt"?"Verificar agora":"Check now"}</button></div>
    </div></div>

    <div class="panel"><h3>${LANG==="pt"?"Log técnico e recuperação":"Technical log and recovery"}</h3><div class="pad">
      <dl class="kv">
        <dt>${LANG==="pt"?"Revisão":"Revision"}</dt><dd class="mono">${m.revisao}</dd>
        <dt>${LANG==="pt"?"Último autor":"Last author"}</dt><dd>${esc(m.ultimoAutor||"—")}</dd>
        <dt>${LANG==="pt"?"Atualizado em":"Updated at"}</dt><dd>${fmtDT(m.atualizadoEm)}</dd>
        <dt>${LANG==="pt"?"Pendentes":"Pending"}</dt><dd class="mono">${S.db.pendentes.length}</dd>
        <dt>${LANG==="pt"?"Eventos":"Events"}</dt><dd class="mono">${S.db.historico.length}</dd>
        <dt>${LANG==="pt"?"Descartes":"Discards"}</dt><dd class="mono">${(S.db.logDescartes||[]).length}</dd>
      </dl>
      ${(S.db.logDescartes||[]).length?`<div class="sep"></div>
        <div style="max-height:170px;overflow:auto;font-size:11.5px">
        ${S.db.logDescartes.slice().reverse().map(l=>`<div style="padding:4px 0;border-bottom:1px solid var(--line-2)">
          <b>${fmtDT(l.em)}</b> — ${esc(l.autor)} — ${l.itens.length} ${LANG==="pt"?"alteração(ões)":"change(s)"}
          <div class="muted mono" style="font-size:10.5px">${l.itens.map(p=>`${esc(p.item)}/${esc(p.campo)}: "${esc(p.valorOriginal)}" → "${esc(p.valorAtual)}"`).join("<br>")}</div>
        </div>`).join("")}</div>`:""}
    </div></div>

    <div class="panel"><h3>${LANG==="pt"?"Relatório de migração":"Migration report"}</h3><div class="pad">
      ${relMigracaoHTML()}</div></div>
  </div>`;

  $("#cSalvar").onclick=()=>{
    c.minutosConsolidacao=+$("#cCons").value; c.diasSemAtualizacao=+$("#cSem").value;
    c.diasAlertaAging=+$("#cAge").value;
    const a=$("#cAutor").value.trim(); if(a) localStorage.setItem("sm.autor",a);
    Pend.agendarAutosave(); toast(LANG==="pt"?"Configurações salvas":"Settings saved","ok"); Render.atual();};
  $$("input[data-st]").forEach(cb=>cb.onchange=()=>{
    c.status[+cb.dataset.st].ativo=cb.checked; Pend.agendarAutosave();});
  $("#bFazer").onclick=async()=>{try{const n=await Store.backup(S.db,"manual");
    toast((LANG==="pt"?"Backup criado: ":"Backup created: ")+n,"ok");}catch(e){toast(String(e.message),"bad");}};
  $("#bBaixar").onclick=()=>dl(`database-${hoje()}.json`,JSON.stringify(S.db,null,1),"application/json");
  $("#bListar").onclick=async()=>{
    const l=await Store.listarBackups();
    $("#bLista").innerHTML = l.length? l.map(b=>`<div class="rowflex" style="justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--line-2)">
      <span class="mono" style="font-size:10.5px">${esc(b.nome)}</span>
      <span class="rowflex"><span class="muted">${(b.tamanho/1024).toFixed(0)} KB</span>
      <button class="btn sm" data-rb="${esc(b.nome)}">${T("restaurar")}</button></span></div>`).join("")
      : (LANG==="pt"?"Nenhum backup ainda.":"No backups yet.");
    $$("button[data-rb]").forEach(b=>b.onclick=()=>UI.restaurar(b.dataset.rb));};
  $("#bVerif").onclick=()=>{$("#integ").innerHTML=verificarIntegridade();};
  $("#integ").innerHTML=verificarIntegridade();
};
function relMigracaoHTML(){
  const r=S.db.relatorioMigracao; if(!r) return `<div class="muted">—</div>`;
  const lin=(k,v)=>`<dt>${esc(k)}</dt><dd class="mono">${v}</dd>`;
  return `<dl class="kv">
    ${lin(LANG==="pt"?"Itens no Arquivo 1":"Items in File 1",r.itens_arquivo1)}
    ${lin(LANG==="pt"?"Itens no Arquivo 2":"Items in File 2",r.itens_arquivo2)}
    ${lin(LANG==="pt"?"Itens nos dois":"Items in both",r.itens_nos_dois)}
    ${lin(LANG==="pt"?"Só no Arquivo 1":"Only in File 1",r.somente_arquivo1.length)}
    ${lin(LANG==="pt"?"Só no Arquivo 2":"Only in File 2",r.somente_arquivo2.length)}
    ${lin(LANG==="pt"?"Conflitos":"Conflicts",`${r.conflitos_total} (${r.conflitos_em_aberto} ${LANG==="pt"?"em aberto":"open"})`)}
    ${lin(LANG==="pt"?"Campos só no Arquivo 1":"Fields only in File 1",esc(r.campos_so_arquivo1.join(", ")||"—"))}
    ${lin(LANG==="pt"?"Campos só no Arquivo 2":"Fields only in File 2",esc(r.campos_so_arquivo2.join(", ")||"—"))}
  </dl>`;
}
function verificarIntegridade(){
  const p=[], itens=S.db.itens;
  const ids=itens.map(i=>i.item);
  const dup=ids.filter((x,k)=>ids.indexOf(x)!==k);
  if(dup.length) p.push([`${LANG==="pt"?"Itens duplicados":"Duplicate items"}: ${[...new Set(dup)].join(", ")}`,"bad"]);
  const semId=itens.filter(i=>!i.item).length;
  if(semId) p.push([`${semId} ${LANG==="pt"?"itens sem identificador":"items without id"}`,"bad"]);
  const validos=new Set(S.db.config.status.map(s=>s.codigo));
  const inval=[...new Set(itens.map(i=>i.status).filter(s=>!validos.has(s)))];
  if(inval.length) p.push([`${LANG==="pt"?"Status fora do domínio":"Status outside domain"}: ${inval.join(", ")}`,"bad"]);
  const semSt=itens.filter(i=>!i.status).length;
  if(semSt) p.push([`${semSt} ${LANG==="pt"?"itens sem status":"items without status"}`,"bad"]);
  const orf=(S.db.historico||[]).filter(h=>!ids.includes(h.item)).length;
  if(orf) p.push([`${orf} ${LANG==="pt"?"eventos de histórico órfãos":"orphan history events"}`,"warn"]);
  const conf=(S.db.conflitos||[]).filter(c=>!c.resolvido).length;
  if(conf) p.push([`${conf} ${LANG==="pt"?"conflitos aguardando decisão":"conflicts awaiting decision"}`,"warn"]);
  const incoer=itens.filter(i=>{const o=(i.updatedStatusObs||"").toLowerCase(); if(!o) return false;
    const c=o.includes("done")||o.includes("conform")||o.includes("accepted");
    return (i.status==="1 - Validated by ICN"&&!c)||(R.aberto(i.status)&&c);}).length;
  if(incoer) p.push([`${incoer} ${LANG==="pt"?"itens com status incoerente com a observação":"items whose status conflicts with their note"}`,"warn"]);
  if(!p.length) return `<div class="rowflex" style="color:var(--ok)"><b>✓ ${LANG==="pt"?"Nenhum problema encontrado":"No problems found"}</b></div>`;
  return p.map(([t,k])=>`<div class="rowflex" style="gap:7px;padding:3px 0;color:var(--${k==="bad"?"bad":"warn"})">
    <span>${k==="bad"?"✕":"⚠"}</span><span style="color:var(--fg-2)">${esc(t)}</span></div>`).join("");
}
</script>
<script>
"use strict";
/* ================================ UI =================================== */
const UI = {
  modal(titulo, corpo, botoes=[]){
    this.fechar();
    const ov=document.createElement("div"); ov.className="ov"; ov.id="ov";
    ov.innerHTML=`<div class="modal"><header><h2>${esc(titulo)}</h2>
        <button class="btn sm" id="mX">✕</button></header>
      <div class="body">${corpo}</div>
      ${botoes.length?`<footer>${botoes.map((b,k)=>`<button class="${b.cls||"btn"}" data-b="${k}">${esc(b.txt)}</button>`).join("")}</footer>`:""}</div>`;
    document.body.append(ov);
    ov.onclick=e=>{if(e.target===ov) this.fechar();};
    $("#mX").onclick=()=>this.fechar();
    $$("[data-b]",ov).forEach(b=>b.onclick=()=>botoes[+b.dataset.b].fn());
    return ov;
  },
  fechar(){ $("#ov")?.remove(); },

  /* ---- selecionar pasta / carregar base ---- */
  async abrirPasta(){
    try{
      await Store.escolherPasta();
      await this.carregarBase();
    }catch(e){ if(e.name!=="AbortError") toast(String(e.message),"bad"); }
  },
  async retomarPasta(){
    if(await Store.pedirPermissaoSalva()) await this.carregarBase();
    else toast(LANG==="pt"?"Permissão não concedida":"Permission not granted","bad");
  },
  async carregarBase(){
    try{
      S.db = await Store.carregar();
      normalizar(S.db);
      Usuario.garantir();
      await Store.backup(S.db,"abertura").catch(()=>{});
      Pend.iniciar();
      marcarEstado(LANG==="pt"?"base carregada":"database loaded");
      toast(`${S.db.itens.length} ${LANG==="pt"?"itens carregados":"items loaded"}`,"ok");
      irPara("dashboard");
    }catch(e){
      if(e.message==="NAO_ENCONTRADO") return this.baseNova();
      Render.semBase(String(e.message));
    }
  },
  baseNova(){
    if(!confirmar(LANG==="pt"
      ? "Não existe database.json nesta pasta. Criar uma base vazia aqui?"
      : "No database.json in this folder. Create an empty database here?")) return Render.semBase();
    S.db = baseVazia(); normalizar(S.db); Usuario.garantir();
    Store.gravar(S.db,{forcar:true}).then(()=>{Pend.iniciar(); irPara("dashboard");});
  },
  async recuperarEspelho(){
    const e=await IDB.get("espelho");
    if(!e) return toast(LANG==="pt"?"Nenhuma cópia local encontrada":"No local copy found","bad");
    if(!confirmar(LANG==="pt"
      ? `Cópia local de ${fmtDT(e.meta?.atualizadoEm)} com ${e.itens?.length||0} itens. Carregar?`
      : `Local copy from ${fmtDT(e.meta?.atualizadoEm)} with ${e.itens?.length||0} items. Load it?`)) return;
    S.db=e; normalizar(S.db); Usuario.garantir(); Pend.iniciar(); irPara("dashboard");
    toast(LANG==="pt"?"Cópia local carregada. Selecione a pasta para voltar a gravar.":"Local copy loaded. Select the folder to resume saving.","ok");
  },
  abrirArquivoManual(){
    const inp=document.createElement("input"); inp.type="file"; inp.accept=".json";
    inp.onchange=async()=>{ const f=inp.files[0]; if(!f) return;
      try{ S.db=JSON.parse(await f.text()); normalizar(S.db); Usuario.garantir(); Pend.iniciar(); irPara("dashboard");
        toast(LANG==="pt"?"Base aberta em modo leitura/baixar":"Database opened in read/download mode","ok");
      }catch(e){ toast("JSON inválido","bad"); } };
    inp.click();
  },

  /* ---- conflito de gravação concorrente ---- */
  conflitoGravacao(err){
    marcarEstado(LANG==="pt"?"conflito de gravação":"write conflict");
    this.modal(LANG==="pt"?"Conflito de gravação":"Write conflict",
      `<p>${LANG==="pt"
        ? `O arquivo na pasta foi alterado por <b>${esc(err.autorDisco||"outra pessoa")}</b> (revisão ${err.revisaoDisco}) depois que você carregou esta base (revisão ${Store.revisaoCarregada}).`
        : `The file was changed by <b>${esc(err.autorDisco||"someone else")}</b> (revision ${err.revisaoDisco}) after you loaded it (revision ${Store.revisaoCarregada}).`}</p>
       <p class="muted">${LANG==="pt"
        ? "Para não apagar o trabalho de ninguém, nada foi gravado. Escolha como prosseguir:"
        : "Nothing was written so nobody's work is lost. Choose how to proceed:"}</p>
       <ul class="muted" style="line-height:1.8">
        <li><b>${LANG==="pt"?"Recarregar":"Reload"}</b> — ${LANG==="pt"?"descarta suas alterações não gravadas e traz a versão do disco.":"discards your unsaved changes and loads the disk version."}</li>
        <li><b>${LANG==="pt"?"Salvar cópia":"Save a copy"}</b> — ${LANG==="pt"?"baixa a sua versão para comparação manual.":"downloads your version for manual comparison."}</li>
        <li><b>${LANG==="pt"?"Forçar gravação":"Force write"}</b> — ${LANG==="pt"?"sobrescreve o disco. Um backup da versão do disco é criado antes.":"overwrites the disk. A backup of the disk version is created first."}</li></ul>`,
      [{txt:LANG==="pt"?"Recarregar":"Reload",cls:"btn",fn:async()=>{this.fechar(); await this.carregarBase();}},
       {txt:LANG==="pt"?"Salvar cópia":"Save a copy",cls:"btn",fn:()=>dl(`minha-versao-${hoje()}.json`,JSON.stringify(S.db,null,1),"application/json")},
       {txt:LANG==="pt"?"Forçar gravação":"Force write",cls:"btn danger",fn:async()=>{
          try{ await Store.backup(err.disco,"pre-sobrescrita"); }catch{}
          S.db.meta.revisao = err.revisaoDisco;
          await Store.gravar(S.db,{forcar:true});
          this.fechar(); marcarEstado(LANG==="pt"?"gravado (forçado)":"written (forced)");}}]);
  },

  /* ---- detalhe do item ---- */
  detalhe(itemId){
    const i=S.db.itens.find(x=>x.item===itemId); if(!i) return;
    S.selecionado=itemId;
    const hist=(S.db.historico||[]).filter(h=>h.item===itemId)
                .sort((a,b)=>b.dataEfetiva.localeCompare(a.dataEfetiva));
    const obs=(S.db.observacoes||[]).filter(o=>o.item===itemId)
                .sort((a,b)=>b.criadoEm.localeCompare(a.criadoEm));
    const pend=S.db.pendentes.filter(p=>p.item===itemId);
    const confl=(S.db.conflitos||[]).filter(c=>c.item===itemId&&!c.resolvido);
    const ativos=R.statusAtivos();

    const aba=(id,txt)=>`<button data-t="${id}">${esc(txt)}</button>`;
    this.modal(`${LANG==="pt"?"Item":"Item"} ${itemId}`, `
      <div class="tabs">${aba("d",T("detalhes"))}${aba("h",T("historico"))}${aba("o",T("observacoes"))}${aba("x",T("dados"))}</div>
      <div id="tp-d">
        ${confl.length?`<div class="panel pad" style="border-left:3px solid var(--warn);margin-bottom:12px">
          <b style="color:var(--warn)">⚠ ${confl.length} ${LANG==="pt"?"conflito(s) de migração em aberto":"open migration conflict(s)"}</b>
          ${confl.map(c=>`<div style="margin-top:6px;font-size:12px"><b>${esc(c.campo)}</b><br>
            <span class="muted">${T("arquivo1")}:</span> ${esc(c.valorArquivo1)}<br>
            <span class="muted">${T("arquivo2")}:</span> ${esc(c.valorArquivo2)}</div>`).join("")}</div>`:""}
        ${pend.length?`<div class="panel pad" style="border-left:3px solid var(--chg-line);margin-bottom:12px">
          <b>${pend.length} ${LANG==="pt"?"alteração(ões) pendente(s) de consolidação":"change(s) pending consolidation"}</b>
          ${pend.map(p=>`<div class="muted" style="font-size:11.5px;margin-top:4px">${esc(p.campo)}:
            "${esc(p.valorOriginal)}" → "${esc(p.valorAtual)}" · ${LANG==="pt"?"desde":"since"} ${fmtDT(p.primeiraAlteracaoEm)}</div>`).join("")}</div>`:""}
        <div class="grid" style="grid-template-columns:1fr 1fr;gap:12px">
          <label class="fld"><span>${T("status")}</span>
            <select id="dStatus">${ativos.map(s=>`<option ${s===i.status?"selected":""}>${esc(s)}</option>`).join("")}</select></label>
          <label class="fld"><span>${LANG==="pt"?"Data efetiva da mudança":"Effective change date"}</span>
            <input type="date" id="dData" value="${hoje()}" max="${hoje()}"></label>
        </div>
        <div class="sep"></div>
        <label class="fld" style="margin-bottom:10px"><span>Updated Status Obs</span>
          <textarea id="dObs" rows="2">${esc(i.updatedStatusObs)}</textarea></label>
        <label class="fld" style="margin-bottom:10px"><span>General Obs</span>
          <textarea id="dGer" rows="2">${esc(i.generalObs)}</textarea></label>
        <div class="grid" style="grid-template-columns:1fr 1fr;gap:12px">
          <label class="fld"><span>NCR's</span><input type="text" id="dNcr" value="${esc(i.ncr)}"></label>
          <label class="fld"><span>${LANG==="pt"?"Motivo da alteração (opcional)":"Reason for change (optional)"}</span>
            <input type="text" id="dMotivo" placeholder="${LANG==="pt"?"vai para o histórico":"goes to history"}"></label>
        </div>
        <label class="fld" style="margin-top:10px"><span>Tests</span>
          <textarea id="dTests" rows="3" class="mono" style="font-size:11px">${esc(i.tests)}</textarea></label>
      </div>
      <div id="tp-h" hidden>${hist.length? `<table><thead><tr><th>${T("data")}</th><th>${T("campo")}</th>
        <th>${T("anterior")}</th><th>${T("novo")}</th><th>${T("autor")}</th></tr></thead><tbody>
        ${hist.map(h=>`<tr><td class="num">${fmtD(h.dataEfetiva)}</td><td>${esc(h.campo)}</td>
          <td>${h.valorAnterior?esc(h.valorAnterior):"—"}</td><td><b>${esc(h.valorNovo)}</b></td>
          <td>${esc(h.autor||"")}</td></tr>`).join("")}</tbody></table>`
        :`<div class="empty">${LANG==="pt"?"Sem histórico":"No history"}</div>`}</div>
      <div id="tp-o" hidden>
        <div class="rowflex" style="margin-bottom:12px">
          <input type="text" id="oTxt" placeholder="${T("obsNova")}" style="flex:1">
          <button class="btn pri" id="oAdd">${T("adicionar")}</button></div>
        ${obs.map(o=>`<div class="panel pad" style="margin-bottom:8px">
          <div class="rowflex" style="justify-content:space-between;font-size:11px;color:var(--fg-3)">
            <b>${esc(o.autor||"")}</b><span>${fmtDT(o.criadoEm)}</span></div>
          <div style="margin-top:5px;white-space:pre-wrap">${esc(o.texto)}</div></div>`).join("")
          ||`<div class="empty">${LANG==="pt"?"Nenhuma observação":"No notes"}</div>`}</div>
      <div id="tp-x" hidden><dl class="kv">
        ${[["Evidence",i.evidence],["InspType",i.inspType],["Insp",i.insp],["OriginalJx",i.originalJx],
           ["ActualJx",i.actualJx],["ActualJxDescription",i.actualJxDescription],
           ["Nº and Description",i.numAndDescription],["Performance",i.performance],
           ["Mode",i.mode+(i.modeOrigem?` <span class="muted">(${LANG==="pt"?"origem":"source"}: ${esc(i.modeOrigem)})</span>`:"")],
           ["Description",i.description],["HullPassageParts",i.hullPassageParts],["Position AC",i.positionAC],
           ["Bigram",(i.bigram||[]).map(b=>`<span class="tag">${esc(b)}</span>`).join("")],
           ["SBR",i.sbr],[LANG==="pt"?"Criado em":"Created",fmtD(i.criadoEm)],
           [LANG==="pt"?"Última mudança de status":"Last status change",fmtD(i.ultimaAlteracaoStatus)],
           [LANG==="pt"?"Dias sem atualização":"Days without update",R.diasSemAtualizacao(i)],
           [LANG==="pt"?"Presente em":"Present in",i.presenteEm],
        ].map(([k,v])=>`<dt>${esc(k)}</dt><dd>${k==="Bigram"||String(v).includes("<span")?v:esc(v??"")}</dd>`).join("")}
      </dl></div>`,
      [{txt:T("fechar"),cls:"btn",fn:()=>this.fechar()},
       {txt:T("salvar"),cls:"btn pri",fn:()=>{
          const dt=$("#dData").value||hoje(), mot=$("#dMotivo").value.trim();
          Pend.alterar(itemId,"status",$("#dStatus").value,{dataEfetiva:dt,motivo:mot});
          Pend.alterar(itemId,"updatedStatusObs",$("#dObs").value,{dataEfetiva:dt,motivo:mot});
          Pend.alterar(itemId,"generalObs",$("#dGer").value,{dataEfetiva:dt,motivo:mot});
          Pend.alterar(itemId,"ncr",$("#dNcr").value,{dataEfetiva:dt,motivo:mot});
          Pend.alterar(itemId,"tests",$("#dTests").value,{dataEfetiva:dt,motivo:mot});
          this.fechar(); Render.atual();}}]);

    $$(".tabs button").forEach((b,k)=>{ if(!k) b.classList.add("on");
      b.onclick=()=>{ $$(".tabs button").forEach(x=>x.classList.remove("on")); b.classList.add("on");
        ["d","h","o","x"].forEach(t=>$("#tp-"+t).hidden = t!==b.dataset.t); };});
    $("#oAdd").onclick=()=>{
      const t=$("#oTxt").value.trim(); if(!t) return;
      S.db.observacoes.push({id:uid(),item:itemId,texto:t,criadoEm:agora(),autor:Usuario.garantir()});
      Pend.autosave(); this.detalhe(itemId);   // observações gravam na hora (não passam por pendentes)
      $$(".tabs button")[2].click();
      toast(LANG==="pt"?"Observação salva":"Note saved","ok");};
  },

  /* ---- kanban: mover card ---- */
  moverPara(itemId, familia){
    const i=S.db.itens.find(x=>x.item===itemId); if(!i) return;
    if(R.familiaDe(i.status)===familia) return;
    const opcoes=S.db.config.status.filter(s=>s.familia===familia && (s.ativo||s.codigo===i.status));
    if(!opcoes.length) return toast(LANG==="pt"?"Nenhum status ativo nesta coluna":"No active status in this column","bad");
    if(opcoes.length===1){ Pend.alterar(itemId,"status",opcoes[0].codigo); Render.atual();
      return toast(`${itemId} → ${opcoes[0].codigo}`); }
    this.modal(`${itemId} → ${R.nomeFamilia(familia)}`,
      `<p class="muted">${LANG==="pt"?"Escolha o status exato dentro desta coluna:":"Pick the exact status within this column:"}</p>
       <div style="display:grid;gap:7px;margin-top:10px">${opcoes.map(o=>`
         <button class="btn" data-s="${esc(o.codigo)}" style="text-align:left;padding:9px 12px">
           <i class="dot" style="background:${R.corDe(o.codigo)};display:inline-block;margin-right:7px"></i>${esc(o.codigo)}</button>`).join("")}</div>
       <label class="fld" style="margin-top:12px"><span>${LANG==="pt"?"Data efetiva":"Effective date"}</span>
         <input type="date" id="kData" value="${hoje()}" max="${hoje()}"></label>`,
      [{txt:T("cancelar"),cls:"btn",fn:()=>this.fechar()}]);
    $$("button[data-s]").forEach(b=>b.onclick=()=>{
      Pend.alterar(itemId,"status",b.dataset.s,{dataEfetiva:$("#kData").value||hoje()});
      this.fechar(); Render.atual(); toast(`${itemId} → ${b.dataset.s}`);});
  },

  aplicarResolucao(c, valor, justificativa){
    const it=S.db.itens.find(i=>i.item===c.item);
    const campo=CAMPO_ITEM[c.campo];
    if(it && campo){
      const antes = Array.isArray(it[campo])? it[campo].join(";") : it[campo];
      if(String(antes)!==String(valor)){
        it[campo] = campo==="bigram"? String(valor).split(/[;,]/).map(x=>x.trim()).filter(Boolean) : valor;
        it.atualizadoEm = agora();
        S.db.historico.push({id:uid(),item:c.item,campo:c.campo,valorAnterior:antes,valorNovo:valor,
          dataEfetiva:hoje(),consolidadoEm:agora(),primeiraAlteracaoEm:agora(),autor:Usuario.garantir(),
          origem:"conflito",tipo:"conflito",
          observacao:justificativa||(LANG==="pt"?"Resolução de conflito de migração":"Migration conflict resolution")});
      }
    }
    c.resolvido=true; c.valorAplicado=valor;
    c.resolvidoPor=Usuario.garantir(); c.resolvidoEm=agora();
    c.justificativa=justificativa||null;
  },
  resolverConflito(id, escolha){
    const c=(S.db.conflitos||[]).find(x=>x.id===id); if(!c) return;
    if(escolha==="x") return this.editarConflito(c, c.valorAplicado);
    this.aplicarResolucao(c, escolha==="1"? c.valorArquivo1 : c.valorArquivo2,
      escolha==="1"? T("arquivo1") : T("arquivo2"));
    Pend.autosave(); Render.atual(); toast(LANG==="pt"?"Conflito resolvido":"Conflict resolved","ok");
  },
  combinarConflito(id){
    const c=(S.db.conflitos||[]).find(x=>x.id===id); if(!c) return;
    const a=(c.valorArquivo2||"").trim(), b=(c.valorArquivo1||"").trim();
    const juntos = a && b ? (a.endsWith(".")? a+" "+b : a+". "+b) : (a||b);
    this.editarConflito(c, juntos, LANG==="pt"?"Combinação dos dois arquivos":"Combined from both files");
  },
  editarConflito(c, valorInicial, justificativa){
    const it=S.db.itens.find(i=>i.item===c.item);
    this.modal(`${LANG==="pt"?"Item":"Item"} ${c.item} — ${c.campo}`,
      `<div class="rowflex" style="margin-bottom:12px"><span class="muted">${T("status")}:</span>
         <span class="pill" style="background:${R.corDe(it?.status)}18;color:${R.corDe(it?.status)}">${esc(it?.status||"")}</span></div>
       <div class="grid" style="grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">
         <div class="panel pad"><b style="font-size:10.5px;color:var(--fg-3)">${T("arquivo1")}</b>
           <div style="white-space:pre-wrap;margin-top:4px">${esc(c.valorArquivo1)||"—"}</div></div>
         <div class="panel pad"><b style="font-size:10.5px;color:var(--fg-3)">${T("arquivo2")}</b>
           <div style="white-space:pre-wrap;margin-top:4px">${esc(c.valorArquivo2)||"—"}</div></div></div>
       <label class="fld"><span>${LANG==="pt"?"Valor oficial":"Official value"}</span>
         <textarea id="cfTxt" rows="4">${esc(valorInicial??"")}</textarea></label>`,
      [{txt:T("cancelar"),cls:"btn",fn:()=>this.fechar()},
       {txt:T("salvar"),cls:"btn pri",fn:()=>{
          this.aplicarResolucao(c, $("#cfTxt").value, justificativa||(LANG==="pt"?"Valor informado manualmente":"Manually entered value"));
          this.fechar(); Pend.autosave(); Render.atual();
          toast(LANG==="pt"?"Conflito resolvido":"Conflict resolved","ok");}}]);
  },
  resolverLote(campo, qual){
    const lista=(S.db.conflitos||[]).filter(c=>!c.resolvido && c.campo===campo);
    if(!lista.length) return;
    const nome = qual==="1"? T("arquivo1") : T("arquivo2");
    if(!confirmar(LANG==="pt"
      ? `Resolver ${lista.length} conflito(s) de "${campo}" usando o valor do ${nome}?\n\nO outro valor continua guardado em cada conflito e cada decisão vira um evento no histórico.`
      : `Resolve ${lista.length} "${campo}" conflict(s) using the value from ${nome}?\n\nThe other value stays recorded and each decision is logged in the history.`)) return;
    for(const c of lista) this.aplicarResolucao(c, qual==="1"? c.valorArquivo1 : c.valorArquivo2, nome+" (lote)");
    Pend.autosave(); Render.atual();
    toast(`${lista.length} ${LANG==="pt"?"conflitos resolvidos":"conflicts resolved"}`,"ok");
  },

  async restaurar(nome){
    if(!confirmar(LANG==="pt"
      ? `Restaurar o backup ${nome}? A base atual será salva como backup antes.`
      : `Restore backup ${nome}? The current database is backed up first.`)) return;
    try{
      await Store.backup(S.db,"pre-restauracao");
      const b=await Store.restaurarBackup(nome);
      normalizar(b); b.meta.revisao=S.db.meta.revisao;
      S.db=b; await Store.gravar(S.db,{forcar:true});
      Render.atual(); toast(LANG==="pt"?"Backup restaurado":"Backup restored","ok");
    }catch(e){ toast(String(e.message),"bad"); }
  },
};
</script>
<script>
"use strict";
/* ============================= exportação ============================= */
const Export = {
  COLS:[["item","Item"],["status","Actual Status"],["inspType","InspType"],["insp","Insp"],
        ["originalJx","OriginalJx"],["actualJx","ActualJx"],["actualJxDescription","ActualJxDescription"],
        ["numAndDescription","Nº and Description"],["evidence","Evidence"],
        ["hullPassageParts","HullPassageParts"],["description","Description"],["performance","Performance"],
        ["mode","Mode"],["positionAC","Position AC"],["bigram","Bigram"],
        ["updatedStatusObs","Updated Status Obs"],["generalObs","General Obs"],["ncr","NCR's"],
        ["tests","Tests"],["ultimaAlteracaoStatus","Last Status Change"]],
  val(i,k){ const v=i[k]; return Array.isArray(v)? v.join(";") : (v??""); },
  csv(lista){
    const q=s=>`"${String(s).replace(/"/g,'""')}"`;
    const linhas=[this.COLS.map(c=>q(c[1])).join(";")];
    for(const i of lista) linhas.push(this.COLS.map(c=>q(this.val(i,c[0]))).join(";"));
    dl(`itens-${hoje()}.csv`,"﻿"+linhas.join("\r\n"),"text/csv;charset=utf-8");
  },
  historico(evs){
    const q=s=>`"${String(s??"").replace(/"/g,'""')}"`;
    const h=["Item","Campo","Valor anterior","Novo valor","Data efetiva","Consolidado em","Autor","Origem","Observação"];
    const l=[h.map(q).join(";")];
    for(const e of evs) l.push([e.item,e.campo,e.valorAnterior,e.valorNovo,e.dataEfetiva,
                                e.consolidadoEm,e.autor,e.origem,e.observacao].map(q).join(";"));
    dl(`historico-${hoje()}.csv`,"﻿"+l.join("\r\n"),"text/csv;charset=utf-8");
  },
  /* SpreadsheetML 2003: o Excel abre nativamente, com várias abas e formatação. */
  excel(lista,titulo){
    const x=s=>String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
    const cel=(v,estilo="")=>`<Cell${estilo?` ss:StyleID="${estilo}"`:""}><Data ss:Type="String">${x(v)}</Data></Cell>`;
    const num=v=>`<Cell ss:StyleID="n"><Data ss:Type="Number">${+v||0}</Data></Cell>`;
    const aba=(nome,linhas)=>`<Worksheet ss:Name="${x(nome).slice(0,31)}"><Table>${
      linhas.map(l=>`<Row>${l}</Row>`).join("")}</Table>
      <WorksheetOptions xmlns="urn:schemas-microsoft-com:office:excel"><FreezePanes/><SplitHorizontal>1</SplitHorizontal>
      <TopRowBottomPane>1</TopRowBottomPane><ActivePane>2</ActivePane></WorksheetOptions></Worksheet>`;

    const dados=[this.COLS.map(c=>cel(c[1],"h")).join("")]
      .concat(lista.map(i=>this.COLS.map(c=>cel(this.val(i,c[0]))).join("")));

    const ef=M.evidenceFlow(lista), sy=M.shipyard(lista), fu=M.funcional(lista);
    const resumo=[
      [cel("StatusMilestone — "+titulo,"t")].join(""),
      [cel(`${LANG==="pt"?"Gerado em":"Generated"} ${fmtDT(agora())} — ${Usuario.nome()}`)].join(""),
      "",
      [cel(LANG==="pt"?"EVIDÊNCIAS SOMENTE B05":"EVIDENCES ONLY B05","h"),cel(""),cel("")].join(""),
      [cel(LANG==="pt"?"Total":"Total"),num(ef.b05.total),cel("")].join(""),
      [cel(LANG==="pt"?"Em aberto":"Remaining"),num(ef.b05.aberto),cel("")].join(""),
      ...ef.b05.status.map(([s,n])=>[cel(s),num(n),cel((n/Math.max(ef.b05.total,1)*100).toFixed(2)+"%")].join("")),
      "",
      [cel(LANG==="pt"?"EVIDÊNCIAS EXCETO B05":"EVIDENCES EXCEPT B05","h"),cel(""),cel("")].join(""),
      [cel(LANG==="pt"?"Total":"Total"),num(ef.exceto.total),cel("")].join(""),
      [cel(LANG==="pt"?"Em aberto":"Remaining"),num(ef.exceto.aberto),cel("")].join(""),
      ...ef.exceto.status.map(([s,n])=>[cel(s),num(n),cel((n/Math.max(ef.exceto.total,1)*100).toFixed(2)+"%")].join("")),
      "",
      [cel("SHIPYARD PREREQUISITES (J08)","h"),cel(""),cel("")].join(""),
      [cel(LANG==="pt"?"Total":"Total"),num(sy.total),cel("")].join(""),
      [cel(LANG==="pt"?"Em aberto":"Remaining"),num(sy.aberto),cel("")].join(""),
      ...sy.status.map(([s,n])=>[cel(s),num(n),cel("")].join("")),
      "",
      [cel("FUNCTIONAL INSP. TYPE","h"),cel(LANG==="pt"?"Em aberto":"Open","h"),
       cel(LANG==="pt"?"Anterior":"Previous","h"),cel("Δ","h"),cel("Total","h")].join(""),
      ...fu.linhas.filter(l=>l.total).map(l=>[cel(l.tipo),num(l.atual),num(l.anterior),
        cel((l.delta>0?"▼-":l.delta<0?"▲+":"▬")+(l.delta?Math.abs(l.delta):"")),num(l.total)].join("")),
    ].filter(r=>r!=="").map(r=>r||cel(""));

    const hist=(S.db.historico||[]).filter(h=>lista.some(i=>i.item===h.item));
    const abaHist=[["Item","Campo","Anterior","Novo","Data","Autor"].map(v=>cel(v,"h")).join("")]
      .concat(hist.map(h=>[h.item,h.campo,h.valorAnterior,h.valorNovo,h.dataEfetiva,h.autor].map(v=>cel(v)).join("")));

    const xml=`<?xml version="1.0"?><?mso-application progid="Excel.Sheet"?>
<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet"
 xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel"
 xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">
<Styles>
 <Style ss:ID="h"><Font ss:Bold="1" ss:Color="#FFFFFF"/><Interior ss:Color="#2F5FA8" ss:Pattern="Solid"/></Style>
 <Style ss:ID="t"><Font ss:Bold="1" ss:Size="13"/></Style>
 <Style ss:ID="n"><NumberFormat ss:Format="0"/></Style>
</Styles>
${aba("Resumo",resumo)}${aba("Itens",dados)}${aba(LANG==="pt"?"Historico":"History",abaHist)}
</Workbook>`;
    dl(`statusmilestone-${hoje()}.xls`, xml, "application/vnd.ms-excel");
  },
};

/* ============================ normalização ============================ */
function baseVazia(){
  return {schemaVersion:1, meta:{criadoEm:agora(),atualizadoEm:agora(),revisao:0,
      ultimoAutor:"",appVersion:"1.0.0",origem:"base vazia"},
    config:{idioma:"pt",minutosConsolidacao:10,diasSemAtualizacao:30,diasAlertaAging:60,
      status:[], familias:[], statusAbertoExcecoes:["1 - Validated by ICN","2 - Not Blocking","2 - Not Available Jx"],
      inspTypesFuncionais:[]},
    marcos:[], itens:[], historico:[], pendentes:[], observacoes:[], conflitos:[]};
}
function normalizar(db){
  db.schemaVersion ??= 1;
  db.meta ??= {revisao:0}; db.config ??= {}; db.marcos ??= [];
  db.itens ??= []; db.historico ??= []; db.pendentes ??= [];
  db.observacoes ??= []; db.conflitos ??= [];
  const c=db.config;
  c.minutosConsolidacao ??= 10; c.diasSemAtualizacao ??= 30; c.diasAlertaAging ??= 60;
  c.status ??= []; c.familias ??= []; c.inspTypesFuncionais ??= [];
  if(!c.familias.length) c.familias=[
    {id:"pendente",pt:"Pendente",en:"Pending",cor:"#8a8f98",ordem:1},
    {id:"prova",pt:"Em prova",en:"Waiting Proof",cor:"#b8860b",ordem:2},
    {id:"analise",pt:"Em análise",en:"Under Analysis",cor:"#c2703d",ordem:3},
    {id:"bloqueado",pt:"Bloqueado",en:"Blocking",cor:"#b3403a",ordem:4},
    {id:"ressalva",pt:"Aceito c/ ressalva",en:"Accepted w/ note",cor:"#3d6fa8",ordem:5},
    {id:"validado",pt:"Validado",en:"Validated",cor:"#2f7a4f",ordem:6},
    {id:"cancelado",pt:"Cancelado",en:"Canceled",cor:"#5c5f66",ordem:7}];
  /* qualquer status presente nos dados que não esteja no domínio entra como inativo */
  const conhecidos=new Set(c.status.map(s=>s.codigo));
  for(const st of new Set(db.itens.map(i=>i.status).filter(Boolean)))
    if(!conhecidos.has(st)){
      const n=parseInt(st,10);
      const fam = n===1?"validado":n===2?"ressalva":n===3||n===7?"bloqueado":n===4?"analise":
                  n===5?"prova":n===0?"cancelado":"pendente";
      c.status.push({codigo:st,familia:fam,ativo:true,ordem:c.status.length});
    }
  for(const i of db.itens){
    i.bigram ??= []; if(typeof i.bigram==="string") i.bigram=i.bigram.split(/[;,]/).map(s=>s.trim()).filter(Boolean);
    i.isB05 = i.isB05 ?? (i.inspType==="B05");
    i.criadoEm ??= (db.marcos[0]?.data || hoje());
    i.ultimaAlteracaoStatus ??= i.criadoEm;
    for(const k of ["updatedStatusObs","generalObs","ncr","tests","description","evidence",
                    "inspType","insp","originalJx","actualJx","actualJxDescription",
                    "numAndDescription","performance","mode","positionAC","hullPassageParts","sbr"]) i[k] ??= "";
  }
  R._hs=null; R._hsRev=-1;
}

/* ============================== arranque =============================== */
function irPara(rota){ S.rota=rota; if(!S.db) return Render.semBase(); Render.atual(); }

function aplicarTema(){
  const t=localStorage.getItem("sm.tema");
  if(t) document.documentElement.dataset.theme=t; else delete document.documentElement.dataset.theme;
}
$("#btnTheme").onclick=()=>{
  const at=document.documentElement.dataset.theme;
  const prox = at==="dark"?"light":at==="light"?"":"dark";
  prox? localStorage.setItem("sm.tema",prox) : localStorage.removeItem("sm.tema");
  aplicarTema();};
$("#btnLang").onclick=()=>{ LANG = LANG==="pt"?"en":"pt"; localStorage.setItem("sm.lang",LANG);
  document.documentElement.lang = LANG==="pt"?"pt-BR":"en"; Render.atual(); };
$("#btnSaveNow").onclick=()=>Pend.consolidarTudo();
$("#pendBadge").onclick=()=>{
  const p=S.db?.pendentes||[]; if(!p.length) return;
  UI.modal(LANG==="pt"?"Alterações pendentes":"Pending changes",
    `<p class="muted">${LANG==="pt"
      ? `Estas alterações já estão salvas na base, mas ainda não viraram histórico definitivo. Consolidam sozinhas após ${S.db.config.minutosConsolidacao} minutos sem novo toque.`
      : `These changes are already saved, but not yet consolidated into the permanent history. They consolidate automatically after ${S.db.config.minutosConsolidacao} minutes without further edits.`}</p>
     <table style="margin-top:12px"><thead><tr><th>${T("item")}</th><th>${T("campo")}</th>
       <th>${T("anterior")}</th><th>${T("novo")}</th><th>${LANG==="pt"?"Desde":"Since"}</th></tr></thead><tbody>
     ${p.map(x=>`<tr><td class="num"><b>${esc(x.item)}</b></td><td>${esc(x.campo)}</td>
       <td>${esc(x.valorOriginal)||"—"}</td><td><b>${esc(x.valorAtual)}</b></td>
       <td class="num">${fmtDT(x.primeiraAlteracaoEm)}</td></tr>`).join("")}</tbody></table>`,
    [{txt:T("descartar"),cls:"btn danger",fn:()=>{UI.fechar(); Pend.descartarTudo();}},
     {txt:T("salvarAgora"),cls:"btn pri",fn:()=>{UI.fechar(); Pend.consolidarTudo();}}]);
};
addEventListener("beforeunload",e=>{ if(S.sujo){ e.preventDefault(); e.returnValue=""; } });
addEventListener("keydown",e=>{
  if(e.key==="Escape") UI.fechar();
  if((e.ctrlKey||e.metaKey)&&e.key==="s"){ e.preventDefault(); if(S.db) Pend.consolidarTudo(); }
});

(async function iniciar(){
  aplicarTema();
  document.documentElement.lang = LANG==="pt"?"pt-BR":"en";
  Render.nav();
  if(Store.suportado && await Store.restaurarHandle()){
    await UI.carregarBase();
  }else{
    Render.semBase();
  }
})();
</script>
