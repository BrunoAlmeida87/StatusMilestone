<script>
"use strict";
/* ============================== estado ================================= */
const S = {
  db:null, rota:"dashboard", filtros:filtrosVazios(), ordenacao:{campo:"item",dir:1},
  selecionado:null, salvando:false, sujo:false, sujoEstrutural:false,
  kbLayout: localStorage.getItem("sm.kbLayout") || "h",
  dobradas: new Set(JSON.parse(localStorage.getItem("sm.dobradas")||"[]")),
  textoCompleto: localStorage.getItem("sm.textoCompleto")==="1",
  recolhidas:new Set(JSON.parse(localStorage.getItem("sm.recolhidas")||'["validado"]')),
};
function filtrosVazios(){
  return {busca:"",status:[],familia:[],inspType:[],origem:[],b05:"",bigram:[],funcao:[],
          aging:"",alteradas:false,comObs:false,dataDe:"",dataAte:""};
}

/* --------------------------- regras de dominio ------------------------- */
const R = {
  cfg(){ return S.db?.config ?? {}; },
  statusDefs(){ return this.cfg().status ?? []; },
  familias(){ return this.cfg().familias ?? []; },
  familiaDe(st){ return this.statusDefs().find(s=>s.codigo===st)?.familia ?? "pendente"; },
  familiaObj(id){ return this.familias().find(f=>f.id===id) ?? {id,pt:id,en:id,cor:"#888",ordem:0}; },
  nomeFamilia(id){ const f=this.familiaObj(id); return LANG==="pt"?f.pt:f.en; },
  escuro(){ const t=document.documentElement.dataset.theme;
    return t==="dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches); },
  corDe(st){
    const d=this.statusDefs().find(x=>x.codigo===st);
    if(d?.cor) return this.escuro()? (d.corEscura||d.cor) : d.cor;
    return this.familiaObj(this.familiaDe(st)).cor;
  },
  ordemDe(st){ return this.familiaObj(this.familiaDe(st)).ordem; },

  /* Desenho do diagrama "Evidence Flow". Fica no config para poder ser ajustado,
     mas o padrao vive aqui: uma base antiga (sem config.fluxo) desenha do mesmo
     jeito em vez de aparecer em branco. */
  FLUXO_PADRAO:{
    b05:{principal:["8 - Mounting not Completed","5 - Waiting Proof","4 - Under Analysis",
                    "6 - Waiting B05","1 - Validated by ICN"],
         desvio:"7 - Missing Vacuum Test or Sign", bloqueio:"3 - Blocking",
         grupoA:["4 - Under Analysis to Not Blocking","4 - Under Analysis To Downgraded",
                 "4 - Under Analysis To Not Available Jx"],
         grupoB:["2 - Not Blocking","2 - Not Blocking - Downgraded","2 - Not Available Jx"]},
    exceto:{principal:["8 - Mounting not Completed","5 - Waiting Proof","4 - Under Analysis",
                       "1 - Validated by ICN"],
         desvio:null, bloqueio:"3 - Blocking",
         grupoA:["4 - Under Analysis to Not Blocking","4 - Under Analysis To Downgraded",
                 "4 - Under Analysis To Not Available Jx"],
         grupoB:["2 - Not Blocking","2 - Not Blocking - Downgraded","2 - Not Available Jx"]},
  },
  /* Devolve o desenho e acrescenta, num grupo "outros", qualquer status presente
     na lista que o desenho nao preveja - nenhum item some da conta. */
  fluxoLayout(qual, lista){
    const pad = this.FLUXO_PADRAO[qual] || this.FLUXO_PADRAO.exceto;
    const cfg = (this.cfg().fluxo || {})[qual] || {};
    const arr = (a,b)=> Array.isArray(a) && a.length ? a : b;
    const l = {
      principal: arr(cfg.principal, pad.principal),
      desvio:    ("desvio"   in cfg) ? cfg.desvio   : pad.desvio,
      bloqueio:  ("bloqueio" in cfg) ? cfg.bloqueio : pad.bloqueio,
      grupoA:    arr(cfg.grupoA, pad.grupoA),
      grupoB:    arr(cfg.grupoB, pad.grupoB),
    };
    if(!l.principal.length) return null;
    const desenhados = new Set([...l.principal, ...l.grupoA, ...l.grupoB,
                                l.desvio, l.bloqueio].filter(Boolean));
    const fora = [...new Set((lista||[]).map(i=>i.status).filter(st=>st && !desenhados.has(st)))]
                   .sort((a,b)=>this.ordemDe(a)-this.ordemDe(b)||cmpAlfa(a,b));
    l.grupoC = fora;
    return l;
  },
  statusAtivos(){ const a=this.statusDefs().filter(s=>s.ativo).map(s=>s.codigo);
    const usados=[...new Set((S.db?.itens??[]).map(i=>i.status))];
    return [...new Set([...a,...usados])].sort((x,y)=>this.ordemDe(x)-this.ordemDe(y)||x.localeCompare(y)); },
  /* Definicao canonica de "em aberto", identica a usada nos dois Excel. */
  aberto(st){ if(!st) return false;
    return !(st==="1 - Validated by ICN" || st.startsWith("2 - Not Blocking") || st==="2 - Not Available Jx"); },
  /* Reconstroi o status de um item numa data (event sourcing). */
  statusEm(item,data){
    const evs = this.histStatus()[item]; if(!evs) return null;
    let st=null; for(const e of evs){ if(e.dataEfetiva<=data) st=e.valorNovo; else break; } return st;
  },
  /* Indice do historico por item. A validade e amarrada ao objeto da base e a uma
     invalidacao explicita - nao a meta.revisao, que so muda quando o arquivo e
     gravado: um evento consolidado agora precisa aparecer nos calculos agora. */
  _hs:null, _hsDb:null,
  invalidarHist(){ this._hs=null; this._hsDb=null; },
  histStatus(){
    if(this._hs && this._hsDb === S.db) return this._hs;
    const m={}; for(const h of (S.db?.historico??[])) if(h.campo==="status") (m[h.item] ??= []).push(h);
    /* ordem deterministica: data do fato, data do registro como desempate, id no fim */
    for(const k in m) m[k].sort((a,b)=>
      String(a.dataEfetiva??"").localeCompare(String(b.dataEfetiva??"")) ||
      String(a.consolidadoEm??"").localeCompare(String(b.consolidadoEm??"")) ||
      String(a.id??"").localeCompare(String(b.id??"")));
    this._hs=m; this._hsDb=S.db; return m;
  },
  marcos(){ return [...(S.db?.marcos??[])].sort((a,b)=>a.data.localeCompare(b.data)); },
  marcoAnterior(){ const m=this.marcos(); return m.length>1?m[m.length-2]:m[0]; },
  marcoAtual(){ const m=this.marcos(); return m[m.length-1]; },
  /* Um item "mudou no ciclo" se o status hoje difere do status no marco anterior. */
  mudouNoCiclo(it){ const ma=this.marcoAnterior(); if(!ma) return false;
    const antes=this.statusEm(it.item,ma.data); return antes && antes!==it.status; },
  diasSemAtualizacao(it){ return diasEntre(it.ultimaAlteracaoStatus||it.criadoEm, hoje()); },
  valoresDe(campo){ return [...new Set((S.db?.itens??[]).map(i=>i[campo]).filter(Boolean))].sort(); },
  bigrams(){ const s=new Set(); (S.db?.itens??[]).forEach(i=>(i.bigram||[]).forEach(b=>s.add(b)));
    return [...s].sort(); },
};

/* ----------------------------- filtragem ------------------------------- */
function itensFiltrados(){
  const f=S.filtros, itens=S.db?.itens??[];
  const q=f.busca.trim().toLowerCase();
  const obsPorItem = new Set((S.db?.observacoes??[]).map(o=>o.item));
  return itens.filter(i=>{
    if(f.status.length && !f.status.includes(i.status)) return false;
    if(f.familia.length && !f.familia.includes(R.familiaDe(i.status))) return false;
    if(f.inspType.length && !f.inspType.includes(i.inspType)) return false;
    if(f.origem.length && !f.origem.includes(i.originalJx)) return false;
    if(f.funcao.length && !f.funcao.includes(i.numAndDescription)) return false;
    if(f.b05==="sim" && !i.isB05) return false;
    if(f.b05==="nao" && i.isB05) return false;
    if(f.bigram.length && !(i.bigram||[]).some(b=>f.bigram.includes(b))) return false;
    if(f.aging && R.diasSemAtualizacao(i) < +f.aging) return false;
    if(f.alteradas && !R.mudouNoCiclo(i)) return false;
    if(f.comObs && !obsPorItem.has(i.item)) return false;
    if(f.dataDe && (i.ultimaAlteracaoStatus||"") < f.dataDe) return false;
    if(f.dataAte && (i.ultimaAlteracaoStatus||"") > f.dataAte) return false;
    if(q){
      const alvo=[i.item,i.evidence,i.description,i.updatedStatusObs,i.generalObs,i.ncr,i.performance,
                  i.numAndDescription,i.inspType,i.insp,i.tests,(i.bigram||[]).join(" ")].join(" ").toLowerCase();
      if(!alvo.includes(q)) return false;
    }
    return true;
  });
}
function ordenar(lista){
  const {campo,dir}=S.ordenacao;
  return [...lista].sort((a,b)=>{
    let x=a[campo], y=b[campo];
    if(campo==="status"){ x=R.ordemDe(a.status); y=R.ordemDe(b.status);
      if(x===y) return cmpAlfa(a.item,b.item)*dir;
      return (x-y)*dir; }
    if(campo==="aging"){ x=R.diasSemAtualizacao(a); y=R.diasSemAtualizacao(b); return (x-y)*dir; }
    if(Array.isArray(x)) x=x.join(", "); if(Array.isArray(y)) y=y.join(", ");
    const r=cmpAlfa(x,y);
    return (r||cmpAlfa(a.item,b.item))*dir;   /* desempate estavel pelo Item */
  });
}

/* ==================== motor de alterações pendentes ===================
   Fluxo:  edição -> autosave (3s) -> pending change -> janela de
   consolidação (config, padrão 10 min) -> histórico definitivo.
   Agrupa várias mudanças no mesmo campo e descarta ida-e-volta.        */
const Pend = {
  timerAuto:null, timerCons:null,
  /* Tudo o que foi feito aqui e ainda nao chegou ao disco. Serve para reaplicar
     as nossas alteracoes por cima da versao que outra pessoa gravou. */
  diario:[],
  registrar(e){ this.diario.push(e); },

  campoEditavel:["status","updatedStatusObs","generalObs","ncr","tests"],

  alterar(itemId, campo, valorNovo, {dataEfetiva=null, motivo="", silencioso=false}={}){
    if(!this.campoEditavel.includes(campo)) return toast("Campo somente leitura","bad");
    const it = S.db.itens.find(i=>i.item===itemId); if(!it) return;
    const atual = it[campo] ?? "";
    if(String(atual) === String(valorNovo)) return;

    let p = S.db.pendentes.find(x=>x.item===itemId && x.campo===campo);
    if(!p){
      p = {id:uid(), item:itemId, campo, valorOriginal:atual, valorAtual:valorNovo,
           /* Estado dos campos derivados antes da PRIMEIRA alteracao: e o que o
              descarte precisa devolver. Em A -> B -> C o snapshot continua sendo
              o de antes de A, porque so e gravado na criacao da pendencia. */
           origUltimaAlteracaoStatus: it.ultimaAlteracaoStatus ?? null,
           origAtualizadoEm: it.atualizadoEm ?? null,
           primeiraAlteracaoEm:agora(), ultimaAlteracaoEm:agora(),
           dataEfetiva:dataEfetiva||hoje(), autor:Usuario.garantir(), motivo};
      S.db.pendentes.push(p);
    }else{
      p.valorAtual=valorNovo; p.ultimaAlteracaoEm=agora();
      if(dataEfetiva) p.dataEfetiva=dataEfetiva; if(motivo) p.motivo=motivo;
    }
    it[campo]=valorNovo;
    if(campo==="status") it.ultimaAlteracaoStatus = p.dataEfetiva;
    it.atualizadoEm = agora();
    if(!silencioso) this.registrar({t:"campo", item:itemId, campo, de:atual, para:valorNovo,
                                    dataEfetiva:p.dataEfetiva, motivo:p.motivo||""});
    S.sujo = true;
    this.agendarAutosave();
    Render.badgePendentes();
  },

  agendarAutosave(){
    clearTimeout(this.timerAuto);
    marcarEstado(LANG==="pt"?"alterado...":"changed...");
    this.timerAuto = setTimeout(()=>this.autosave(), 3000);
  },
  /* Store.gravar ja serializa as escritas; aqui o cuidado e com o que acontece
     ENQUANTO uma escrita corre: o que entrar no diario depois da marca nao pode
     ser dado como salvo, senao a alteracao some do diario sem estar no disco. */
  async autosave(){
    if(!S.db || !Store.dirHandle) return;
    await IDB.set("espelho", S.db);              // rede técnica: recuperação após queda
    S.salvando = true;
    marcarEstado(LANG==="pt"?"salvando...":"saving...");
    try{
      for(let tentativa=0; ; tentativa++){
        const enviados = this.diario.length;
        try{
          await Store.gravar(S.db);
          this.diario = this.diario.slice(enviados);
          S.sujo = this.diario.length > 0;       /* so limpa se nada entrou no meio */
          marcarEstado(LANG==="pt"?"salvo "+new Date().toLocaleTimeString().slice(0,5)
                                  :"saved "+new Date().toLocaleTimeString().slice(0,5));
          Sync.ultimoMtime = await Store.mtime();
          if(S.sujo) this.agendarAutosave();
          return;
        }catch(e){
          if(e.message!=="CONFLITO_REVISAO"){
            /* S.sujo continua como estava: o que esta em memoria nao chegou ao disco. */
            marcarEstado(LANG==="pt"?"falha ao salvar":"save failed");
            toast(mensagemArmazenamento(e),"bad");
            return;
          }
          /* Outra pessoa gravou antes. Se as alteracoes nao se cruzam, junta as duas
             versoes e grava de novo; se cruzam, quem decide e o usuario. */
          if(tentativa<2 && Sync.receber(e.disco,{aoSalvar:true})!=="decidir") continue;
          return UI.conflitoGravacao(e);
        }
      }
    }finally{ S.salvando=false; }
  },

  /* Desfaz no item tudo o que as pendencias alteraram - inclusive os derivados.
     Sem isso, "descartar" devolvia o campo principal e deixava ultimaAlteracaoStatus
     e atualizadoEm com a data da alteracao desfeita, mexendo no aging e nos filtros. */
  desfazer(pends){
    const porItem = new Map();
    for(const p of pends){ if(!porItem.has(p.item)) porItem.set(p.item,[]); porItem.get(p.item).push(p); }
    for(const [itemId, lista] of porItem){
      const it = S.db.itens.find(i=>i.item===itemId); if(!it) continue;
      for(const p of lista) it[p.campo] = p.valorOriginal;
      const st = lista.find(p=>p.campo==="status");
      if(st && st.origUltimaAlteracaoStatus != null) it.ultimaAlteracaoStatus = st.origUltimaAlteracaoStatus;
      /* atualizadoEm so volta quando nao resta nenhuma outra pendencia do item:
         uma pendencia que continua de pe alterou a data legitimamente. */
      if(S.db.pendentes.some(x=>x.item===itemId && !lista.includes(x))) continue;
      const orig = lista.map(p=>p.origAtualizadoEm).filter(v=>v!=null).sort()[0];
      if(orig != null) it.atualizadoEm = orig;
      else if(lista.every(p=>"origAtualizadoEm" in p)) delete it.atualizadoEm;
    }
  },
  /* consolida um pendente no histórico definitivo (ou descarta se voltou ao original) */
  consolidar(p, {forcado=false}={}){
    const idx = S.db.pendentes.indexOf(p); if(idx<0) return;
    S.db.pendentes.splice(idx,1);
    if(String(p.valorOriginal) === String(p.valorAtual)){   // ida-e-volta: A -> B -> A
      this.desfazer([p]);                                   // aging volta ao que era
      return "descartado";
    }
    R.invalidarHist();                       /* o evento novo vale a partir de agora */
    S.db.historico.push({
      id:uid(), item:p.item, campo:p.campo,
      valorAnterior:p.valorOriginal, valorNovo:p.valorAtual,
      dataEfetiva:p.dataEfetiva, primeiraAlteracaoEm:p.primeiraAlteracaoEm,
      consolidadoEm:agora(), autor:p.autor, origem: forcado?"manual":"automatico",
      tipo:p.campo==="status"?"status":"campo", observacao:p.motivo||"",
    });
    return "consolidado";
  },
  varrer(){
    if(!S.db) return;
    const limite = (S.db.config.minutosConsolidacao ?? 10)*60000;
    const t = Date.now(); let n=0;
    for(const p of [...S.db.pendentes])
      if(t - new Date(p.ultimaAlteracaoEm).getTime() >= limite){ this.consolidar(p); n++; }
    if(n){ this.agendarAutosave(); Render.badgePendentes(); Render.atual(); }
  },
  consolidarTudo(){
    const n = S.db.pendentes.length; if(!n) return toast(LANG==="pt"?"Nada pendente":"Nothing pending");
    let c=0,d=0;
    for(const p of [...S.db.pendentes]) (this.consolidar(p,{forcado:true})==="consolidado"?c++:d++);
    const gravacao = this.autosave(); Render.badgePendentes(); Render.atual();
    toast(LANG==="pt" ? `${c} consolidada(s), ${d} descartada(s) por retorno ao valor original`
                      : `${c} consolidated, ${d} discarded (returned to original)`, "ok");
    return gravacao;                       /* quem chama pode aguardar a gravacao */
  },
  descartarTudo(){
    const n=S.db.pendentes.length; if(!n) return;
    const lista = S.db.pendentes.map(p=>`  ${p.item} / ${p.campo}: "${p.valorOriginal}" -> "${p.valorAtual}"`).join("\n");
    if(!confirmar((LANG==="pt"?`Descartar ${n} alteração(ões) pendente(s)?\n\n`:`Discard ${n} pending change(s)?\n\n`)+lista)) return;
    (S.db.logDescartes ??= []).push({em:agora(),autor:Usuario.garantir(),itens:structuredClone(S.db.pendentes)});
    const descartadas = [...S.db.pendentes];
    S.db.pendentes=[];
    this.desfazer(descartadas);
    this.autosave(); Render.badgePendentes(); Render.atual();
    toast(LANG==="pt"?"Descartado. Recuperável em Configurações > Log técnico.":"Discarded. Recoverable in Settings > Technical log.","ok");
  },
  iniciar(){ clearInterval(this.timerCons); this.timerCons=setInterval(()=>this.varrer(), 20000);
    Sync.iniciar(); },
};


/* ==================== sincronizacao entre duas ou mais pessoas ==========
   A base continua sendo um unico database.json numa pasta compartilhada.
   Cada sessao:
     - verifica a data do arquivo a cada poucos segundos (barato: so metadados);
     - quando muda, traz a versao nova e reaplica por cima o que ainda nao
       tinha gravado daqui (Pend.diario);
     - se a mesma pessoa e a outra mexeram no MESMO campo do MESMO item,
       nada e sobrescrito em silencio: o usuario decide campo a campo;
     - anuncia sua presenca em presenca/<nome>.json (um arquivo por pessoa,
       portanto sem disputa de escrita) para todos verem quem esta na base.
   ====================================================================== */
const Sync = {
  timer:null, timerPres:null, ultimoMtime:0, presentes:[], ligado:true,

  segundos(){ return Math.min(120, Math.max(3, S.db?.config?.segundosSync ?? 7)); },

  iniciar(){
    this.parar();
    if(!Store.dirHandle || !S.db) return;
    Store.mtime().then(m=>this.ultimoMtime=m);
    this.timer     = setInterval(()=>this.tick(),     this.segundos()*1000);
    this.timerPres = setInterval(()=>this.presenca(), 20000);
    this.presenca();
  },
  parar(){ clearInterval(this.timer); clearInterval(this.timerPres); this.timer=this.timerPres=null; },

  async tick(){
    if(!this.ligado || !S.db || !Store.dirHandle) return;
    if(S.salvando || $("#ov")) return;          /* gravando ou com janela aberta: espera */
    const m = await Store.mtime();
    if(!m || m===this.ultimoMtime) return;
    this.ultimoMtime = m;
    let disco; try{ disco = await Store.lerArquivo(); }catch{ return; }
    const rd = disco?.meta?.revisao ?? 0;
    if(rd <= Store.revisaoCarregada) return;    /* e o nosso proprio save voltando */
    this.receber(disco);
  },

  /* Junta a versao do disco com o que ainda nao foi gravado daqui.
     Devolve "adotado" | "juntado" | "decidir". */
  receber(disco, {aoSalvar=false}={}){
    if(!disco || !Array.isArray(disco.itens)) return "decidir";
    normalizar(disco);
    const autor = disco?.meta?.ultimoAutor || (LANG==="pt"?"outra pessoa":"someone else");

    /* compacta o diario: um registro por item+campo, do primeiro "de" ao ultimo "para" */
    const meus = new Map();
    let naoRebasavel = null;
    for(const e of Pend.diario){
      if(e.t==="campo"){
        const k = e.item+"\u0000"+e.campo;
        if(meus.has(k)) meus.get(k).para = e.para;
        else meus.set(k, {...e});
      }else if(e.t==="obs"){ meus.set("obs:"+e.obj.id, {...e});
      }else naoRebasavel = e;
    }

    const adotar = ()=>{
      const modal = !!$("#ov");
      S.db = disco; Store.revisaoCarregada = disco.meta.revisao ?? 0;
      Pend.diario = []; S.sujo = false;
      R.invalidarHist();
      IDB.set("espelho", disco);
      if(!modal) Render.atual(); else Render.badgePendentes();
      marcarEstado(LANG==="pt"?"atualizado do disco":"updated from disk");
    };

    if(!meus.size && !naoRebasavel){
      adotar();
      toast(LANG==="pt"? `Base atualizada por ${autor}` : `Database updated by ${autor}`);
      return "adotado";
    }
    if(naoRebasavel){ this.decidir(disco, [...meus.values()], [], autor); return "decidir"; }

    /* separa o que pode ser reaplicado do que colide de verdade */
    const ok=[], colide=[];
    for(const e of meus.values()){
      if(e.t==="obs"){ ok.push(e); continue; }
      const it = disco.itens.find(i=>i.item===e.item);
      if(!it){ colide.push({...e, remoto:null}); continue; }
      const rv = it[e.campo] ?? "";
      if(String(rv)===String(e.de) || String(rv)===String(e.para)) ok.push(e);
      else colide.push({...e, remoto:rv});
    }
    if(colide.length){ this.decidir(disco, ok, colide, autor); return "decidir"; }

    adotar();
    this.reaplicar(ok);
    Render.atual();
    toast(LANG==="pt"
      ? `${autor} atualizou a base; suas ${ok.length} alteração(ões) foram mantidas`
      : `${autor} updated the database; your ${ok.length} change(s) were kept`, "ok");
    return "juntado";
  },

  reaplicar(lista){
    for(const e of lista){
      if(e.t==="obs"){
        if(!S.db.observacoes.some(o=>o.id===e.obj.id)) S.db.observacoes.push(e.obj);
        Pend.registrar(e);
      }else{
        Pend.alterar(e.item, e.campo, e.para, {dataEfetiva:e.dataEfetiva, motivo:e.motivo});
      }
    }
    if(lista.length) Pend.agendarAutosave();
  },

  /* Colisao real no mesmo campo: nada e escolhido por conta propria. */
  decidir(disco, seguras, colide, autor){
    this.ligado = false;
    const lin = colide.map((c,k)=>`<tr>
      <td class="num"><b>${esc(c.item)}</b></td><td>${esc(c.campo)}</td>
      <td><label class="rowflex" style="gap:6px;align-items:flex-start">
        <input type="radio" name="cf${k}" value="meu" checked>
        <span style="white-space:pre-wrap">${esc(c.para)||"—"}</span></label></td>
      <td><label class="rowflex" style="gap:6px;align-items:flex-start">
        <input type="radio" name="cf${k}" value="deles">
        <span style="white-space:pre-wrap">${esc(c.remoto??"")||"—"}</span></label></td></tr>`).join("");
    UI.modal(LANG==="pt"?"A base mudou enquanto você editava":"The database changed while you were editing",
     `<p>${LANG==="pt"
        ? `<b>${esc(autor)}</b> gravou uma versão nova da base. O que não se cruza já foi juntado automaticamente.`
        : `<b>${esc(autor)}</b> saved a new version. Everything that does not overlap was merged automatically.`}</p>
      ${colide.length? `<p class="muted">${LANG==="pt"
        ? "Estes campos foram alterados dos dois lados. Escolha, para cada um, qual valor vale:"
        : "These fields were changed on both sides. Pick which value wins for each:"}</p>
      <table><thead><tr><th>${T("item")}</th><th>${T("campo")}</th>
        <th>${LANG==="pt"?"Seu valor":"Your value"}</th>
        <th>${esc(autor)}</th></tr></thead><tbody>${lin}</tbody></table>`
      : `<p class="muted">${LANG==="pt"
        ? "Há alterações aqui (configuração, conflito de migração ou restauração) que não podem ser reaplicadas sozinhas sobre a versão nova."
        : "There are local changes (settings, migration conflict or restore) that cannot be replayed on the new version."}</p>`}
      <div class="sep"></div>
      <p class="muted" style="font-size:11.5px">${LANG==="pt"
        ? "Nada foi apagado: sua versão continua em memória até você escolher, e o valor descartado fica registrado no histórico."
        : "Nothing was deleted: your version stays in memory until you choose, and the discarded value is logged in the history."}</p>`,
     [{txt:LANG==="pt"?"Baixar minha versão":"Download my version",cls:"btn",
       fn:()=>dl(`minha-versao-${hoje()}.json`,JSON.stringify(S.db,null,1),"application/json")},
      {txt:LANG==="pt"?"Manter tudo meu":"Keep all mine",cls:"btn",fn:()=>{
        const meus = colide.map(c=>({...c}));
        UI.fechar(); this.ligado=true;
        S.db=disco; Store.revisaoCarregada=disco.meta.revisao??0; Pend.diario=[]; R.invalidarHist();
        this.reaplicar([...seguras,...meus]); Render.atual();
        toast(LANG==="pt"?"Sua versão prevaleceu nos campos em disputa":"Your values won the disputed fields","ok");}},
      {txt:LANG==="pt"?"Aplicar escolhas":"Apply choices",cls:"btn pri",fn:()=>{
        const fica=[];
        colide.forEach((c,k)=>{ const r=$(`input[name="cf${k}"]:checked`);
          if(r && r.value==="meu") fica.push(c); });
        UI.fechar(); this.ligado=true;
        S.db=disco; Store.revisaoCarregada=disco.meta.revisao??0; Pend.diario=[]; R.invalidarHist();
        this.reaplicar([...seguras,...fica]); Render.atual();
        toast(LANG==="pt"?"Versões conciliadas":"Versions reconciled","ok");}}]);
  },

  /* ---- presenca: um arquivo por pessoa, sem disputa de escrita ---- */
  slug(n){ return (String(n).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
            .replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40)) || "anonimo"; },
  async presenca(){
    if(!Store.dirHandle) return;
    const eu = Usuario.nome(); if(!eu) return;
    try{
      const d = await Store.dirHandle.getDirectoryHandle("presenca",{create:true});
      const fh = await d.getFileHandle(this.slug(eu)+".json",{create:true});
      const w = await fh.createWritable();
      await w.write(JSON.stringify({nome:eu, em:agora()})); await w.close();
      const vivos=[], limite=Date.now()-90000;
      for await (const [n,h] of d.entries()){
        if(h.kind!=="file" || !n.endsWith(".json")) continue;
        try{ const j=JSON.parse(await (await h.getFile()).text());
          if(j?.nome && new Date(j.em).getTime()>=limite) vivos.push(j.nome); }catch{}
      }
      this.presentes=[...new Set(vivos)];
    }catch{ this.presentes=[]; }
    this.pintar();
  },
  async sair(){
    try{ const d=await Store.dirHandle?.getDirectoryHandle("presenca");
      await d?.removeEntry(this.slug(Usuario.nome())+".json"); }catch{}
  },
  pintar(){
    const el=$("#presenca"); if(!el) return;
    const outros=this.presentes.filter(n=>n!==Usuario.nome());
    if(!outros.length){ el.style.display="none"; return; }
    el.style.display="inline-flex";
    el.textContent = `\u25cf ${outros.length+1} ${LANG==="pt"?"na base":"online"}`;
    el.title = (LANG==="pt"?"Também com a base aberta: ":"Also working on this database: ")+outros.join(", ");
  },
};

function marcarEstado(txt){ $("#saveState").textContent = txt; }
/* Mensagem acionavel para as falhas de leitura/escrita da base - nada de stack trace. */
function mensagemArmazenamento(e){
  const pt = LANG==="pt";
  switch(e?.message){
    case "LEITURA_PERMISSAO": return pt
      ? "Sem permissão para ler o database.json da pasta. Nada foi gravado — reautorize a pasta e tente de novo."
      : "No permission to read database.json in the folder. Nothing was written — re-authorize the folder and try again.";
    case "LEITURA_JSON_INVALIDO": return pt
      ? "O database.json da pasta está ilegível (JSON inválido). Nada foi gravado, para não apagá-lo. Restaure um backup da subpasta backups/ ou baixe a sua versão em Configurações."
      : "The database.json in the folder is unreadable (invalid JSON). Nothing was written, so it is not destroyed. Restore a backup from backups/ or download your version in Settings.";
    case "LEITURA_LEITURA": return pt
      ? "Não foi possível ler o database.json antes de gravar. Nada foi gravado. Verifique o acesso à pasta e tente de novo."
      : "Could not read database.json before writing. Nothing was written. Check folder access and try again.";
    case "FALHA_ESCRITA": return pt
      ? "Falha ao gravar o database.json. Suas alterações continuam aqui e na cópia local; tente de novo quando a pasta estiver acessível."
      : "Failed to write database.json. Your changes are still here and in the local copy; try again when the folder is reachable.";
    case "BACKUP_NAO_CONFIRMADO": return pt
      ? "O backup não pôde ser confirmado (não foi possível gravar ou reler o arquivo em backups/)."
      : "The backup could not be confirmed (failed to write or re-read the file in backups/).";
    default: return String(e?.message ?? e);
  }
}
</script>
<script>
"use strict";
/* ============================ indicadores ============================== */
const M = {
  kpis(base){
    const itens=base??S.db.itens;
    const ab=itens.filter(i=>R.aberto(i.status)).length;
    const val=itens.filter(i=>i.status==="1 - Validated by ICN").length;
    const mud=itens.filter(i=>R.mudouNoCiclo(i)).length;
    return {total:itens.length, aberto:ab, validado:val, mudou:mud,
            pct: itens.length? (itens.length-ab)/itens.length : 0};
  },
  /* Contagem por status com a variacao desde o marco anterior, como nos
     paineis impressos ("Validated: 152 (-)"). */
  statusComDelta(lista){
    const ma=R.marcoAnterior()?.data;
    const at=new Map(), an=new Map();
    for(const i of lista){
      at.set(i.status,(at.get(i.status)||0)+1);
      if(ma){ const s=R.statusEm(i.item,ma); if(s) an.set(s,(an.get(s)||0)+1); }
    }
    return [...new Set([...at.keys(),...an.keys()])]
      .map(st=>({st, n:at.get(st)||0, ant:ma? (an.get(st)||0) : undefined}))
      .sort((a,b)=>R.ordemDe(a.st)-R.ordemDe(b.st)||cmpAlfa(a.st,b.st));
  },
  porStatus(itens){ const m=new Map();
    for(const i of itens) m.set(i.status,(m.get(i.status)||0)+1);
    return [...m].sort((a,b)=>R.ordemDe(a[0])-R.ordemDe(b[0])); },
  /* Painel "Evidence Flow": B05 x Except-B05, identico ao Arquivo 2. */
  evidenceFlow(itens){
    const b05=itens.filter(i=>i.isB05), nb=itens.filter(i=>!i.isB05);
    const bloco=l=>({total:l.length, aberto:l.filter(i=>R.aberto(i.status)).length,
                     status:this.porStatus(l)});
    return {b05:bloco(b05), exceto:bloco(nb)};
  },
  /* Painel "Shipyard Prerequisites": filtra OriginalJx = J08. */
  shipyard(itens,jx="J08"){
    const l=itens.filter(i=>i.inspType==="Shipyard prerequisites" && i.originalJx===jx);
    return {total:l.length, aberto:l.filter(i=>R.aberto(i.status)).length,
            status:this.porStatus(l), itens:l};
  },
  /* Painel "Functional Insp Type": conta PENDENCIAS por InspType, com delta. */
  funcional(itens){
    const tipos=R.cfg().inspTypesFuncionais??[];
    const ma=R.marcoAnterior()?.data;
    const linhas=tipos.map(t=>{
      const l=itens.filter(i=>i.inspType===t);
      const at=l.filter(i=>R.aberto(i.status)).length;
      const an=ma? l.filter(i=>R.aberto(R.statusEm(i.item,ma))).length : at;
      return {tipo:t,total:l.length,atual:at,anterior:an,delta:an-at};
    });
    return {linhas, total:linhas.reduce((s,x)=>s+x.total,0), aberto:linhas.reduce((s,x)=>s+x.atual,0)};
  },
  porCampo(itens,campo){ const m=new Map();
    for(const i of itens){ const v=i[campo]||"—"; m.set(v,(m.get(v)||0)+1); }
    return [...m].sort((a,b)=>b[1]-a[1]); },
  abertoPorCampo(itens,campo){ const m=new Map();
    for(const i of itens){ if(!R.aberto(i.status)) continue;
      const v=i[campo]||"—"; const o=m.get(v)||{}; o[i.status]=(o[i.status]||0)+1; m.set(v,o); }
    return [...m].sort((a,b)=>Object.values(b[1]).reduce((s,x)=>s+x,0)-Object.values(a[1]).reduce((s,x)=>s+x,0)); },
  /* Serie temporal de "em aberto" e "validados" por data. */
  serie(itens,de,ate,passo=1){
    const datas=[]; let d=new Date(de); const f=new Date(ate);
    const n=Math.max(1,Math.round((f-d)/864e5));
    const st = n>60? Math.ceil(n/60) : passo;
    while(d<=f){ datas.push(d.toISOString().slice(0,10)); d=new Date(d.getTime()+st*864e5); }
    if(datas[datas.length-1]!==ate) datas.push(ate);
    return datas.map(dt=>{
      const o={data:dt,aberto:0,validado:0,total:0};
      for(const i of itens){ const s=R.statusEm(i.item,dt); if(!s) continue;
        o.total++; if(R.aberto(s)) o.aberto++; if(s==="1 - Validated by ICN") o.validado++; }
      return o;
    });
  },
  /* Comparativo entre duas datas: fluxo de entradas, saidas, melhoras e pioras. */
  comparar(itens,d1,d2){
    const r={inicio:{},fim:{},melhoraram:[],pioraram:[],iguais:0,novos:[],alterados:[],
             transicoes:new Map(), totalInicio:0, totalFim:0, abertoInicio:0, abertoFim:0};
    for(const i of itens){
      const a=R.statusEm(i.item,d1), b=R.statusEm(i.item,d2);
      if(b){ r.fim[b]=(r.fim[b]||0)+1; r.totalFim++; if(R.aberto(b)) r.abertoFim++; }
      if(a){ r.inicio[a]=(r.inicio[a]||0)+1; r.totalInicio++; if(R.aberto(a)) r.abertoInicio++; }
      else if(b){ r.novos.push(i); continue; }
      if(!b||!a) continue;
      if(a===b){ r.iguais++; continue; }
      r.alterados.push({item:i,de:a,para:b});
      const k=a+" → "+b; r.transicoes.set(k,(r.transicoes.get(k)||0)+1);
      (R.ordemDe(b)>R.ordemDe(a)? r.melhoraram : r.pioraram).push({item:i,de:a,para:b});
    }
    return r;
  },
  aging(itens){
    const faixas=[[0,7],[8,30],[31,60],[61,90],[91,1e9]];
    const rot=["0-7","8-30","31-60","61-90","90+"];
    const abertos=itens.filter(i=>R.aberto(i.status));
    return faixas.map(([a,b],k)=>({faixa:rot[k],
      n:abertos.filter(i=>{const d=R.diasSemAtualizacao(i); return d>=a&&d<=b;}).length}));
  },
};

/* ============================== graficos =============================== */
/* SVG inline, sem biblioteca externa - funciona offline e em file:// */
const G = {
  /* Coordenadas em espaco fixo (W x H) com escala uniforme: o texto dentro do
     SVG nao deforma quando o painel muda de largura. */
  barras(dados,{h=190,cor="var(--accent)",fmt=v=>v,max=null}={}){
    if(!dados.length) return `<div class="empty">&mdash;</div>`;
    const W=600, mx = max ?? Math.max(1,...dados.map(d=>d.v)), bw=W/dados.length;
    return `<svg viewBox="0 0 ${W} ${h}" style="width:100%;height:auto;display:block">
      <line x1="0" y1="${h-13}" x2="${W}" y2="${h-13}" stroke="var(--line)" stroke-width="2"/>
      ${dados.map((d,k)=>{
        const bh=(d.v/mx)*(h-34), x=k*bw, y=h-14-bh, c=d.cor||cor;
        return `<rect x="${(x+bw*.16).toFixed(1)}" y="${y.toFixed(1)}" width="${(bw*.68).toFixed(1)}"
                 height="${Math.max(bh,d.v?3:0).toFixed(1)}" fill="${c}" rx="3" stroke="${c}" stroke-width="1.5">
                 <title>${esc(d.l)}: ${d.v}</title></rect>
          ${d.v?`<text x="${(x+bw/2).toFixed(1)}" y="${(y-5).toFixed(1)}" text-anchor="middle" font-size="13"
             font-weight="700" fill="${c}" font-family="var(--mono)">${fmt(d.v)}</text>`:""}`;}).join("")}
      </svg>
      <div style="display:grid;grid-template-columns:repeat(${dados.length},1fr);margin-top:3px">
      ${dados.map(d=>`<div style="font-size:10.5px;color:var(--fg-2);font-weight:600;text-align:center;overflow:hidden;
        text-overflow:ellipsis;white-space:nowrap" title="${esc(d.l)}">${esc(d.l)}</div>`).join("")}</div>`;
  },
  barrasEmpilhadas(linhas,chaves,cores,{h=220,quebra=false}={}){
    if(!linhas.length) return `<div class="empty">&mdash;</div>`;
    const W=600, mx=Math.max(1,...linhas.map(l=>chaves.reduce((s,k)=>s+(l.v[k]||0),0))), bw=W/linhas.length;
    return `<svg viewBox="0 0 ${W} ${h}" style="width:100%;height:auto;display:block">
      <line x1="0" y1="${h-9}" x2="${W}" y2="${h-9}" stroke="var(--line)" stroke-width="2"/>
      ${linhas.map((l,k)=>{ let acc=0; const x=k*bw; const tot=chaves.reduce((s,c)=>s+(l.v[c]||0),0);
        const barras = chaves.map((key,ki)=>{ const v=l.v[key]||0; if(!v) return "";
          const bh=(v/mx)*(h-30); acc+=bh;
          const y=h-10-acc, alt=Math.max(bh-2.5,1.5);
          /* O valor de cada faixa fica dentro dela, em corpo pequeno e com halo
             da cor do painel: legivel sobre qualquer cor de fundo, claro ou escuro.
             So aparece quando a faixa tem altura para isso. */
          const rotulo = alt>=11
            ? `<text x="${(x+bw/2).toFixed(1)}" y="${(y+alt/2+3.2).toFixed(1)}" text-anchor="middle"
                 font-size="9.5" font-weight="700" font-family="var(--mono)" fill="var(--fg)"
                 stroke="var(--panel)" stroke-width="2.6" paint-order="stroke"
                 style="pointer-events:none">${v}</text>` : "";
          return `<rect x="${(x+bw*.16).toFixed(1)}" y="${y.toFixed(1)}" width="${(bw*.68).toFixed(1)}"
            height="${alt.toFixed(1)}" fill="${cores[ki]}" rx="2.5" stroke="var(--panel)"
            stroke-width="1.5"><title>${esc(l.l)} \u2014 ${esc(key)}: ${v}</title></rect>${rotulo}`;}).join("");
        return barras + (tot?`<text x="${(x+bw/2).toFixed(1)}" y="${(h-16-acc).toFixed(1)}" text-anchor="middle"
          font-size="12" font-weight="700" fill="var(--fg-2)" font-family="var(--mono)">${tot}</text>`:"");}).join("")}
      </svg>
      <div style="display:grid;grid-template-columns:repeat(${linhas.length},1fr);margin-top:3px">
      ${linhas.map(l=>`<div style="font-size:${quebra?10:10.5}px;color:var(--fg-2);font-weight:600;text-align:center;
        padding:0 3px;${quebra
          ? "white-space:normal;line-height:1.3;word-break:break-word;hyphens:auto"
          : "overflow:hidden;text-overflow:ellipsis;white-space:nowrap"}"
        title="${esc(l.l)}">${esc(l.l)}</div>`).join("")}</div>`;
  },
  linhas(serie,series,{h=200}={}){
    if(serie.length<2) return `<div class="empty">&mdash;</div>`;
    const W=600, L=34, mx=Math.max(1,...serie.flatMap(p=>series.map(s=>p[s.k])));
    const px=k=>L+(k/(serie.length-1))*(W-L-6);
    const py=v=>h-16-(v/mx)*(h-30);
    return `<svg viewBox="0 0 ${W} ${h}" style="width:100%;height:auto;display:block">
      ${[0,.25,.5,.75,1].map(f=>`<line x1="${L}" y1="${py(mx*f).toFixed(1)}" x2="${W-6}" y2="${py(mx*f).toFixed(1)}"
          stroke="${f?"var(--line-2)":"var(--line)"}" stroke-width="${f?1.5:2.5}"/>
        <text x="${L-5}" y="${(py(mx*f)+4).toFixed(1)}" text-anchor="end" font-size="11.5" fill="var(--fg-2)"
          font-weight="600" font-family="var(--mono)">${Math.round(mx*f)}</text>`).join("")}
      ${series.map(s=>`<polyline fill="none" stroke="${s.cor}" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"
         points="${serie.map((p,k)=>`${px(k).toFixed(1)},${py(p[s.k]).toFixed(1)}`).join(" ")}"/>
        ${serie.map((p,k)=>{ const pta=(k===0||k===serie.length-1)||serie.length<=20;
          return (pta?`<circle cx="${px(k).toFixed(1)}" cy="${py(p[s.k]).toFixed(1)}" r="${k===0||k===serie.length-1?5.5:3.6}"
            fill="${s.cor}" stroke="var(--panel)" stroke-width="2"/>`:"")
          + `<circle cx="${px(k).toFixed(1)}" cy="${py(p[s.k]).toFixed(1)}" r="7" fill="transparent"
            ><title>${fmtD(p.data)} \u2014 ${s.nome}: ${p[s.k]}</title></circle>`;}).join("")}`).join("")}
      </svg>
      <div class="rowflex" style="justify-content:space-between;font-size:10px;color:var(--fg-3);margin-top:2px;padding:0 6px 0 34px">
        <span>${fmtD(serie[0].data)}</span><span>${fmtD(serie[serie.length-1].data)}</span></div>
      <div class="rowflex" style="gap:14px;margin-top:6px;font-size:11.5px;font-weight:600">
      ${series.map(s=>`<span class="rowflex" style="gap:6px"><i class="dot" style="background:${s.cor};width:11px;height:11px"></i>
        <span style="color:${s.cor}">${esc(s.nome)}</span></span>`).join("")}</div>`;
  },
  /* Diagrama de fluxo no mesmo esquema da aba "Evidence Flow" do Excel:
     cadeia principal com setas, desvio acima, bloqueio abaixo e os grupos de
     rebaixamento a direita. Coordenadas fixas, escala uniforme, sem deformar texto. */
  fluxo(conta, total, layout){
    if(!layout || !Array.isArray(layout.principal) || !layout.principal.length)
      return `<div class="empty">&mdash;</div>`;
    const W=1256, BW=158, BH=72, GAP=40, YT=18, M=14;
    const temDesvio=!!layout.desvio;
    const temOutros=!!(layout.grupoC && layout.grupoC.length);
    const YP=temDesvio? YT+BH+48 : 26, YB=YP+BH+44;
    /* A altura sai do que foi desenhado, e nao de uma conta a parte: era assim
       que o quadro "outros status" acabava cortado pela borda do viewBox. */
    let maxY=0; const reg=y=>{ if(y>maxY) maxY=y; };
    const prin=layout.principal||[];
    /* Cadeia alinhada a esquerda e o "Validated" ancorado na borda direita,
       como na planilha: a seta longa ate ele mostra o caminho de conclusao.
       Assim os dois blocos (com e sem os passos extras) tem a mesma geometria. */
    const ult=prin.length-1;
    const px=k=> k===ult ? W-M-BW : M+k*(BW+GAP);
    const n=st=>conta.get(st)||0;
    const pc=v=>total? (v/total*100) : 0;
    /* nos grupos o prefixo se repete em todas as linhas: mostramos so o que muda.
       O corte vem da largura util do quadro (rotulo -> valor), nao de um numero
       fixo de caracteres, para o texto nunca encostar no numero. */
    const curto=(st,w=228)=>{
      const t=st.replace(/^\d+ - /,"").replace(/^Under Analysis [Tt]o /,"→ ");
      const cabe=Math.max(8, Math.floor((w-34-58)/6.7));
      return t.length>cabe ? t.slice(0,cabe-1)+"…" : t;  /* o nome inteiro fica no tooltip */
    };

    /* Caixa com faixa cheia no topo, fundo no tom do status e contorno grosso:
       a cor identifica o passo mesmo de longe, como na planilha. */
    const caixa=(st,x,y,w=BW,h=BH,forte=false)=>{
      const c=R.corDe(st), v=n(st); reg(y+h);
      return `<g><rect class="fxcaixa" x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="${c}"
          fill-opacity="${v?0.17:0.06}" stroke="${c}" stroke-width="${forte?3.5:2.5}"/>
        <rect x="${x+4}" y="${y+2}" width="${w-8}" height="6" rx="3" fill="${c}"/>
        <text x="${x+w/2}" y="${y+23}" text-anchor="middle" font-weight="700"
          font-size="${st.length>28?8.8:st.length>23?9.6:10.6}"
          fill="${c}">${esc(st)}</text>
        <text x="${x+w/2}" y="${y+h*0.72}" text-anchor="middle" font-size="22" font-weight="800"
          fill="${v?c:"var(--fg-3)"}" font-family="var(--mono)">${v}</text>
        <text x="${x+w/2}" y="${y+h-8}" text-anchor="middle" font-size="10.5" font-weight="600"
          fill="var(--fg-2)" font-family="var(--mono)">${pc(v).toFixed(v?2:0)}%</text>
        <title>${esc(st)}: ${v} de ${total} (${pc(v).toFixed(2)}%)</title></g>`;
    };
    let nG=0;
    const grupo=(lista,x,y,w,titulo)=>{
      const h=20+lista.length*25+(titulo?17:0);
      const cid=`gcl${nG++}`; reg(y+h);
      return `<g><clipPath id="${cid}"><rect x="${x+26}" y="${y}" width="${w-84}" height="${h}"/></clipPath>
        <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="var(--panel-2)"
          stroke="var(--line)" stroke-width="2.5"/>
        ${titulo?`<text x="${x+14}" y="${y+18}" font-size="10.5" font-weight="700" fill="var(--fg-3)"
          letter-spacing="0.6">${esc(titulo)}</text>`:""}
        ${lista.map((st,k)=>{const c=R.corDe(st), v=n(st), cy=y+25+(titulo?17:0)+k*25;
          return `<g><title>${esc(st)}: ${v} (${pc(v).toFixed(2)}%)</title>
            <rect x="${x+11}" y="${cy-11}" width="10" height="10" rx="3" fill="${c}"/>
            <text x="${x+30}" y="${cy}" font-size="11" font-weight="600" clip-path="url(#${cid})"
              fill="${v?c:"var(--fg-2)"}">${esc(curto(st,w))}</text>
            <text x="${x+w-42}" y="${cy}" text-anchor="end" font-size="14" font-weight="800"
              font-family="var(--mono)" fill="${v?c:"var(--fg-3)"}">${v}</text>
            <text x="${x+w-10}" y="${cy}" text-anchor="end" font-size="11" font-weight="600"
              font-family="var(--mono)" fill="var(--fg-2)">${pc(v).toFixed(0)}%</text></g>`;}).join("")}
        </g>`;
    };
    const seta=(x1,y1,x2,y2,cor="var(--fg-2)")=>
      `<path d="M${x1} ${y1} L${x2} ${y2}" stroke="${cor}" stroke-width="3.4" fill="none"
        marker-end="url(#pf)" stroke-linecap="round"/>`;
    const cotovelo=(x1,y1,x2,y2,cor="var(--fg-2)")=>
      `<path d="M${x1} ${y1} V${(y1+y2)/2} H${x2} V${y2}" stroke="${cor}" stroke-width="3.4" fill="none"
        marker-end="url(#pf)" stroke-linejoin="round" stroke-linecap="round"/>`;

    let svg="";
    let iA=prin.indexOf("4 - Under Analysis"); if(iA<0) iA=Math.max(0,prin.length-2);
    prin.forEach((st,k)=>{ svg+=caixa(st,px(k),YP,BW,BH,st==="1 - Validated by ICN"); });
    for(let k=0;k<prin.length-1;k++) svg+=seta(px(k)+BW+5,YP+BH/2,px(k+1)-9,YP+BH/2);

    if(layout.desvio){
      const dw=228, dx=Math.min(px(iA)+BW/2+36, W-dw-M);
      svg+=caixa(layout.desvio,dx,YT,dw,BH);
      svg+=cotovelo(px(iA)+BW/2,YP-5,dx+58,YT+BH+9);           // sobe de Under Analysis
      svg+=cotovelo(dx+dw-58,YT+BH+9,px(iA+1)+BW/2,YP-5);       // desce para o proximo passo
    }
    if(layout.bloqueio){
      const bx=px(iA)-12;
      svg+=caixa(layout.bloqueio,bx,YB,BW,BH,true);
      svg+=cotovelo(px(iA)+BW/2-34,YP+BH+5,bx+BW/2-34,YB-9,R.corDe(layout.bloqueio));
      svg+=cotovelo(bx+BW/2+44,YB-9,px(iA)+BW/2+44,YP+BH+5);
      const gx=bx+BW+42, sobra=(W-M)-gx-30;
      const gw=Math.round(sobra*0.47), hw=sobra-gw;
      const hx=gx+gw+30;
      svg+=grupo(layout.grupoA,gx,YB-6,gw);
      svg+=seta(bx+BW+5,YB+BH/2,gx-9,YB+BH/2);
      svg+=grupo(layout.grupoB,hx,YB-6,hw);
      svg+=seta(gx+gw+5,YB+BH/2,hx-9,YB+BH/2);
      /* Nenhum item pode ficar fora da conta: status sem lugar no desenho
         aparecem num quadro proprio, a esquerda. */
      if(temOutros) svg+=grupo(layout.grupoC, M, YB+BH+16, Math.max(300,bx-M-24),
        LANG==="pt"?"OUTROS STATUS":"OTHER STATUSES");
    }else if(temOutros){
      svg+=grupo(layout.grupoC, M, YP+BH+26, Math.max(300,W/2),
        LANG==="pt"?"OUTROS STATUS":"OTHER STATUSES");
    }
    const mk="pf"+Math.random().toString(36).slice(2,7);
    const ALT=Math.round(maxY+16);
    return `<svg viewBox="0 0 ${W} ${ALT}" style="width:100%;height:auto;display:block;min-width:800px">
      <defs><marker id="${mk}" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5"
        orient="auto-start-reverse"><path d="M0 0.5 L9.5 5 L0 9.5 z" fill="context-stroke"/></marker></defs>
      ${svg.replace(/url\(#pf\)/g,"url(#"+mk+")")
            .replace(/(id="|url\(#)gcl/g,(m)=>m.replace("gcl",mk+"gcl"))}</svg>`;
  },
  donut(dados,{size=128}={}){
    const tot=dados.reduce((s,d)=>s+d.v,0)||1; let acc=0; const r=15.915;
    return `<div class="rowflex" style="gap:16px;align-items:center">
      <svg viewBox="0 0 42 42" style="width:${size}px;height:${size}px;flex:none">
        <circle cx="21" cy="21" r="${r}" fill="none" stroke="var(--line-2)" stroke-width="8"/>
        ${dados.filter(d=>d.v).map(d=>{const p=d.v/tot*100; const el=`<circle cx="21" cy="21" r="${r}" fill="none"
          stroke="${d.cor}" stroke-width="8" stroke-dasharray="${p.toFixed(2)} ${(100-p).toFixed(2)}"
          stroke-dashoffset="${(25-acc).toFixed(2)}" transform="rotate(0 21 21)"><title>${esc(d.l)}: ${d.v}</title></circle>`;
          acc+=p; return el;}).join("")}
        <text x="21" y="20.5" text-anchor="middle" font-size="7" font-weight="700" fill="var(--fg)">${tot}</text>
        <text x="21" y="25.5" text-anchor="middle" font-size="3" fill="var(--fg-3)">${LANG==="pt"?"ITENS":"ITEMS"}</text>
      </svg>
      <div style="display:flex;flex-direction:column;gap:3px;font-size:11.5px;min-width:0;flex:1">
      ${dados.filter(d=>d.v).map(d=>`<div class="rowflex" style="gap:6px"><i class="dot" style="background:${d.cor}"></i>
        <span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(d.l)}</span>
        <b class="mono">${d.v}</b><span class="muted mono" style="font-size:10px">${(d.v/tot*100).toFixed(1)}%</span></div>`).join("")}
      </div></div>`;
  },
  /* A seta segue o sinal real da varia\u00e7\u00e3o; a cor diz se isso \u00e9 bom ou ruim.
     Em contagem de pend\u00eancias, cair \u00e9 bom (menorMelhor). */
  seta(delta,{menorMelhor=false}={}){
    if(!delta) return `<span class="flat">\u25ac</span>`;
    const bom = menorMelhor ? delta<0 : delta>0;
    const ic  = delta>0 ? "\u25b2+" : "\u25bc-";
    return `<span class="${bom?"up":"down"}">${ic}${String(Math.abs(delta)).padStart(2,"0")}</span>`;
  },
};
</script>
<script>
"use strict";
/* ============================== navegação ============================== */
const ROTAS = [
  {id:"dashboard", ic:"◧", t:"dashboard"},
  {id:"itens",     ic:"▤", t:"itens"},
  {id:"kanban",    ic:"▦", t:"kanban"},
  {id:"historico", ic:"◴", t:"historico"},
  {id:"relatorios",ic:"◰", t:"relatorios"},
  {id:"conflitos", ic:"⚠", t:"conflitos"},
  {id:"config",    ic:"⚙", t:"config"},
];

const Render = {
  nav(){
    const abertos = (S.db?.conflitos??[]).filter(c=>!c.resolvido).length;
    $("#nav").innerHTML = ROTAS.map(r=>`<button data-r="${r.id}" class="${S.rota===r.id?"on":""}">
      <span class="ic">${r.ic}</span><span>${T(r.t)}</span>
      ${r.id==="conflitos"&&abertos?`<span class="cnt">${abertos}</span>`:""}</button>`).join("");
    $$("#nav button").forEach(b=>b.onclick=()=>irPara(b.dataset.r));
    $("#whoami").textContent = Usuario.nome() ? (LANG==="pt"?"Usuário: ":"User: ")+Usuario.nome() : "";
  },
  badgePendentes(){
    const n=S.db?.pendentes?.length||0;
    const b=$("#pendBadge"), s=$("#btnSaveNow");
    b.style.display = n? "inline-flex":"none";
    b.textContent = `${n} ${T("pendentes")}`;
    s.style.display = n? "inline-block":"none";
  },
  atual(){ this.nav(); this.badgePendentes(); (this[S.rota]||this.dashboard).call(this); },

  /* ------------------------------ sem base ----------------------------- */
  semBase(motivo){
    $("#pageTitle").textContent="StatusMilestone"; $("#headerExtra").innerHTML="";
    const semSuporte = !Store.suportado;
    $("#view").innerHTML = `<div class="panel pad" style="max-width:640px;margin:36px auto">
      <h3 style="border:0;padding:0;text-transform:none;font-size:17px;letter-spacing:-.02em;color:var(--fg)">${T("semBase")}</h3>
      <p class="muted" style="margin:10px 0 18px">${T("semBaseTxt")}</p>
      ${motivo?`<p style="color:var(--bad);margin-bottom:14px">${esc(motivo)}</p>`:""}
      ${semSuporte? `<div class="panel pad" style="background:var(--panel-2);border-color:var(--bad)">
          <b style="color:var(--bad)">${LANG==="pt"?"Navegador sem suporte":"Unsupported browser"}</b>
          <p class="muted" style="margin:8px 0 0">${LANG==="pt"
            ? "A gravação direta em pasta exige Chrome ou Edge. Neste navegador você pode apenas abrir e baixar a base manualmente."
            : "Direct folder writing requires Chrome or Edge. Here you can only open and download the database manually."}</p></div>
          <div class="rowflex" style="margin-top:14px">
            <button class="btn pri" id="btnAbrirArq">${LANG==="pt"?"Abrir database.json":"Open database.json"}</button></div>`
        : `<div class="rowflex">
            <button class="btn pri" id="btnPasta">📁 ${T("selecionarPasta")}</button>
            ${Store.dirHandlePendente?`<button class="btn" id="btnRetomar">${LANG==="pt"?"Reautorizar pasta anterior":"Re-authorize previous folder"}</button>`:""}
            <button class="btn" id="btnEspelho">${LANG==="pt"?"Recuperar cópia local":"Recover local copy"}</button>
          </div>`}
      <div class="sep"></div>
      <p class="muted" style="font-size:11.5px;line-height:1.7">${LANG==="pt"
        ? "Os dados ficam sempre no arquivo <b>database.json</b> da pasta escolhida — nunca dentro desta página. Backups automáticos vão para a subpasta <b>backups/</b>."
        : "Data always lives in <b>database.json</b> inside the chosen folder — never inside this page. Automatic backups go to the <b>backups/</b> subfolder."}</p>
    </div>`;
    const bp=$("#btnPasta"); if(bp) bp.onclick=()=>UI.abrirPasta();
    const br=$("#btnRetomar"); if(br) br.onclick=()=>UI.retomarPasta();
    const be=$("#btnEspelho"); if(be) be.onclick=()=>UI.recuperarEspelho();
    const ba=$("#btnAbrirArq"); if(ba) ba.onclick=()=>UI.abrirArquivoManual();
  },

  /* ------------------------------ dashboard ---------------------------- */
  dashboard(){
    $("#pageTitle").textContent=T("dashboard");
    $("#headerExtra").innerHTML = Filtros.resumoHTML();
    const itens = itensFiltrados();
    const k = M.kpis(itens);
    const ef = M.evidenceFlow(itens);
    const sy = M.shipyard(itens);
    const fu = M.funcional(itens);
    const ma = R.marcoAnterior(), mt = R.marcoAtual();
    const abAnt = ma? itens.filter(i=>R.aberto(R.statusEm(i.item,ma.data))).length : k.aberto;
    const serieDe = R.marcos()[0]?.data || hoje();
    const serie = M.serie(itens, serieDe, hoje());
    const cores = st=>R.corDe(st);

    const contaDe = l => { const m=new Map(); l.forEach(i=>m.set(i.status,(m.get(i.status)||0)+1)); return m; };
    const flow = (b,lista,titulo,qual)=>painel(qual, titulo,
      `<b style="color:var(--fg)">${b.aberto}</b> ${LANG==="pt"?"em aberto de":"open of"} ${b.total}`,
      `<div class="pad" style="overflow-x:auto;overscroll-behavior-x:contain">${
        G.fluxo(contaDe(lista), b.total, R.fluxoLayout(qual, lista))}</div>`);

    $("#view").innerHTML = `
    <div class="grid kpis" style="margin-bottom:14px">
      ${kpi(T("total"),k.total,"")}
      ${kpi(T("emAberto"),k.aberto, ma? `${G.seta(k.aberto-abAnt,{menorMelhor:true})} ${LANG==="pt"?"vs":"vs"} ${fmtD(ma.data)}`:"")}
      ${kpi(T("validados"),k.validado,"")}
      ${kpi(T("conclusao"),(k.pct*100).toFixed(1)+"%","")}
      ${kpi(T("alterados"),k.mudou, ma?`${LANG==="pt"?"desde":"since"} ${fmtD(ma.data)}`:"")}
    </div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(330px,100%),1fr));margin-bottom:14px">
      ${painel("shipyard","Shipyard Prerequisites","OriginalJx = J08",
        `<div class="pad">${cabecalhoRemaining(sy.aberto, sy.total)}
          ${M.statusComDelta(sy.itens).map(r=>linhaStatus(r.st,r.n,sy.total,r.ant)).join("")||`<div class="muted">—</div>`}
        </div>`)}
      ${painel("b05status","B05 Status","inspType = B05",
        `<div class="pad">${cabecalhoRemaining(ef.b05.aberto, ef.b05.total)}
          ${M.statusComDelta(itens.filter(i=>i.isB05)).map(r=>linhaStatus(r.st,r.n,ef.b05.total,r.ant)).join("")||`<div class="muted">—</div>`}
        </div>`)}
      ${painel("funcional","Functional Insp. Type",
        `${fu.aberto} ${LANG==="pt"?"em aberto de":"open of"} ${fu.total}`,
        `<div class="pad">${fu.linhas.filter(l=>l.total).map(l=>`
          <div class="rowflex" style="justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--line-2)">
            <span style="font-weight:600;color:var(--fg)">${esc(l.tipo)}</span>
            <span class="rowflex" style="gap:9px"><b class="mono" style="font-size:13.5px;
              color:${l.atual?"var(--bad)":"var(--ok)"}">${String(l.atual).padStart(2,"0")}</b>
            <span style="min-width:48px;text-align:right">${G.seta(l.atual-l.anterior,{menorMelhor:true})}</span>
            <span class="muted mono" style="font-size:10.5px;min-width:34px;text-align:right">/${l.total}</span></span>
          </div>`).join("")}</div>`)}
      ${painel("distribuicao",T("distribuicao"),"",
        `<div class="pad">${G.donut(M.porStatus(itens).map(([st,n])=>({l:st,v:n,cor:cores(st)})))}</div>`)}
    </div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(440px,100%),1fr));margin-bottom:14px">
      ${painel("evolucao",T("evolucao"),`${fmtD(serieDe)} — ${fmtD(hoje())}`,
        `<div class="pad">${G.linhas(serie,[
          {k:"aberto",nome:T("emAberto"),cor:"var(--bad)"},
          {k:"validado",nome:T("validados"),cor:"var(--ok)"}])}</div>`)}
      ${painel("aging",T("aging"),
        LANG==="pt"?"itens em aberto, por dias sem atualização":"open items, by days without update",
        `<div class="pad">${G.barras(M.aging(itens).map(a=>({l:a.faixa,v:a.n,
          cor:a.faixa==="90+"?"var(--bad)":a.faixa==="61-90"?"var(--orange)":"var(--accent)"})),{h:160})}</div>`)}
      ${painel("tipoInsp",T("tipoInsp"),
        LANG==="pt"?"pendências por status":"open by status",
        `<div class="pad">${pilhaPor(itens,"inspType")}</div>`)}
      ${painel("funcaoVital",T("funcaoVital"),
        LANG==="pt"?"pendências por status":"open by status",
        `<div class="pad">${pilhaPor(itens,"numAndDescription",14,{largo:true})}</div>`, "grid-column:1/-1")}
    </div>
    <div class="grid" style="grid-template-columns:1fr">
      ${flow(ef.b05, itens.filter(i=>i.isB05), LANG==="pt"?'Evidências "somente" B05':'Evidences "only" B05', "b05")}
      ${flow(ef.exceto, itens.filter(i=>!i.isB05), LANG==="pt"?'Evidências "exceto" B05':'Evidences "except" B05', "exceto")}
    </div>`;
    ligarDobras();
    Filtros.ligar();
  },
};

/* Painel que o usuario pode recolher clicando no cabecalho. O estado fica no
   navegador de quem usa, nao na base: e preferencia de tela, nao dado. */
function painel(id, titulo, sub, corpo, estilo=""){
  const rec = S.dobradas.has(id);
  return `<div class="panel${rec?" recolhido":""}" data-dobra="${esc(id)}"${estilo?` style="${estilo}"`:""}>
    <h3 title="${LANG==="pt"?"Clique para recolher ou abrir":"Click to collapse or expand"}">
      <span class="caret">${rec?"\u25b8":"\u25be"}</span>${titulo}${sub?`<span class="sub">${sub}</span>`:""}</h3>
    <div class="corpo">${corpo}</div></div>`;
}
function ligarDobras(){
  $$("#view .panel[data-dobra]>h3").forEach(h=>h.onclick=()=>{
    const p=h.parentElement, id=p.dataset.dobra;
    const rec = !S.dobradas.has(id);
    rec? S.dobradas.add(id) : S.dobradas.delete(id);
    localStorage.setItem("sm.dobradas", JSON.stringify([...S.dobradas]));
    p.classList.toggle("recolhido", rec);
    h.querySelector(".caret").textContent = rec? "\u25b8" : "\u25be";
  });
}
function kpi(lab,val,dlt){ return `<div class="kpi"><div class="lab">${esc(lab)}</div>
  <div class="val">${val}</div><div class="dlt">${dlt||"&nbsp;"}</div></div>`; }
/* "Remaining X on a total of Y", como no relatorio impresso. */
function cabecalhoRemaining(aberto,total){
  return `<div class="rowflex" style="justify-content:space-between;margin-bottom:9px;
    padding-bottom:8px;border-bottom:2px solid var(--line)">
    <span class="muted" style="font-weight:600">${LANG==="pt"?"Em aberto":"Remaining"}</span>
    <b style="font-size:20px;color:${aberto?"var(--bad)":"var(--ok)"}">${aberto}
      <span class="muted" style="font-size:12px;font-weight:400">${LANG==="pt"?"de":"of"} ${total}</span></b></div>`;
}
/* Cada status na sua propria cor, com a variacao desde o marco anterior. */
function linhaStatus(st,n,tot,ant){
  const c=R.corDe(st);
  return `<div class="rowflex" style="justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid var(--line-2)">
  <span class="rowflex" style="gap:7px;min-width:0;flex:1">
    <i style="width:11px;height:11px;border-radius:3px;background:${c};flex:none"></i>
    <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:${c};font-weight:600"
      title="${esc(st)}">${esc(st)}</span></span>
  <span class="rowflex" style="gap:10px;flex:none">
    <b class="mono" style="color:${c};font-size:13.5px">${String(n).padStart(2,"0")}</b>
    ${ant===undefined?"":`<span style="min-width:46px;text-align:right">${G.seta(n-ant,{menorMelhor:R.aberto(st)})}</span>`}
  </span></div>`;
}
function pilhaPor(itens,campo,maxLinhas=10,{largo=false}={}){
  const dados=M.abertoPorCampo(itens,campo).slice(0,maxLinhas);
  if(!dados.length) return `<div class="empty">—</div>`;
  const chaves=[...new Set(dados.flatMap(d=>Object.keys(d[1])))].sort((a,b)=>R.ordemDe(a)-R.ordemDe(b));
  /* No modo largo o nome inteiro aparece, quebrando em linhas; no estreito
     continua cortado, porque nao caberia de jeito nenhum. */
  return G.barrasEmpilhadas(dados.map(([l,v])=>({l: largo? l : (l.length>16?l.slice(0,15)+"…":l), v})),
    chaves, chaves.map(k=>R.corDe(k)), {h:largo?210:190, quebra:largo})
    + `<div class="rowflex" style="gap:10px;margin-top:8px;font-size:10.5px">${chaves.map(k=>
      `<span class="rowflex" style="gap:4px"><i class="dot" style="background:${R.corDe(k)}"></i>${esc(k)}</span>`).join("")}</div>`;
}
</script>
<script>
"use strict";
/* ============================== filtros ================================ */
const Filtros = {
  resumoHTML(){
    const f=S.filtros;
    const n = f.status.length+f.familia.length+f.inspType.length+f.origem.length+f.bigram.length+
              f.funcao.length+(f.b05?1:0)+(f.aging?1:0)+(f.alteradas?1:0)+(f.comObs?1:0)+
              (f.dataDe?1:0)+(f.dataAte?1:0);
    return `<input type="search" id="fBusca" placeholder="${T("buscar")}" value="${esc(f.busca)}" style="width:250px">
      <button class="btn" id="fAbrir">⚟ ${LANG==="pt"?"Filtros":"Filters"}${n?` <b>(${n})</b>`:""}</button>
      ${n||f.busca?`<button class="btn sm" id="fLimpar">${T("limpar")}</button>`:""}`;
  },
  ligar(){
    const b=$("#fBusca");
    if(b){ b.oninput=()=>{S.filtros.busca=b.value; clearTimeout(this._t);
      this._t=setTimeout(()=>{const p=b.selectionStart; Render.atual();
        const nb=$("#fBusca"); if(nb){nb.focus(); nb.setSelectionRange(p,p);} },220); }; }
    const a=$("#fAbrir"); if(a) a.onclick=()=>this.painel();
    const l=$("#fLimpar"); if(l) l.onclick=()=>{S.filtros=filtrosVazios(); Render.atual();};
  },
  painel(){
    const f=S.filtros;
    const grupo=(tit,chave,valores,rotulo=v=>v)=>`<div style="margin-bottom:14px">
      <div style="font-size:10.5px;font-weight:650;text-transform:uppercase;letter-spacing:.04em;color:var(--fg-3);margin-bottom:6px">${esc(tit)}</div>
      <div class="chips">${valores.map(v=>`<span class="chip ${f[chave].includes(v)?"on":""}"
        data-g="${chave}" data-v="${esc(v)}">${esc(rotulo(v))}</span>`).join("")}</div></div>`;
    UI.modal(LANG==="pt"?"Filtros":"Filters", `
      ${grupo(T("status"),"status",R.statusAtivos())}
      ${grupo(LANG==="pt"?"Coluna do Kanban":"Kanban column","familia",R.familias().map(x=>x.id),id=>R.nomeFamilia(id))}
      ${grupo(T("tipoInsp"),"inspType",R.valoresDe("inspType"))}
      ${grupo(T("origem"),"origem",R.valoresDe("originalJx"))}
      ${grupo(T("funcaoVital"),"funcao",R.valoresDe("numAndDescription"))}
      ${grupo("Bigram","bigram",R.bigrams())}
      <div class="sep"></div>
      <div class="rowflex" style="gap:16px;align-items:flex-end;flex-wrap:wrap">
        <label class="fld"><span>B05</span><select id="fB05">
          <option value="">${T("todos")}</option>
          <option value="sim" ${f.b05==="sim"?"selected":""}>${T("b05")}</option>
          <option value="nao" ${f.b05==="nao"?"selected":""}>${T("naoB05")}</option></select></label>
        <label class="fld"><span>${T("semAtualizacao")} (${T("dias")})</span>
          <input type="number" id="fAging" value="${esc(f.aging)}" min="0" style="width:90px"></label>
        <label class="fld"><span>${LANG==="pt"?"Última mudança de":"Last change from"}</span>
          <input type="date" id="fDe" value="${esc(f.dataDe)}"></label>
        <label class="fld"><span>${LANG==="pt"?"até":"to"}</span>
          <input type="date" id="fAte" value="${esc(f.dataAte)}"></label>
        <label class="rowflex" style="gap:6px"><input type="checkbox" id="fAlt" ${f.alteradas?"checked":""}>
          ${LANG==="pt"?"Só alterados no ciclo":"Only changed in cycle"}</label>
        <label class="rowflex" style="gap:6px"><input type="checkbox" id="fObs" ${f.comObs?"checked":""}>
          ${LANG==="pt"?"Só com observação":"Only with notes"}</label>
      </div>`,
      [{txt:T("limpar"),cls:"btn",fn:()=>{S.filtros=filtrosVazios(); UI.fechar(); Render.atual();}},
       {txt:LANG==="pt"?"Aplicar":"Apply",cls:"btn pri",fn:()=>{
          f.b05=$("#fB05").value; f.aging=$("#fAging").value; f.dataDe=$("#fDe").value;
          f.dataAte=$("#fAte").value; f.alteradas=$("#fAlt").checked; f.comObs=$("#fObs").checked;
          UI.fechar(); Render.atual();}}]);
    $$(".chip[data-g]").forEach(c=>c.onclick=()=>{
      const g=c.dataset.g, v=c.dataset.v, arr=S.filtros[g];
      const i=arr.indexOf(v); i<0?arr.push(v):arr.splice(i,1); c.classList.toggle("on");
    });
  },
};

/* =============================== itens ================================= */
Render.itens = function(){
  $("#pageTitle").textContent=T("itens");
  $("#headerExtra").innerHTML = Filtros.resumoHTML()+
    `<button class="btn ${S.textoCompleto?"pri":""}" id="btnTxt" title="${LANG==="pt"
       ? "Alterna entre uma linha por item (com o texto completo ao passar o mouse) e o texto inteiro na tabela"
       : "Switch between one line per item (full text on hover) and the whole text in the table"}">${
       S.textoCompleto? (LANG==="pt"?"⇕ Texto completo":"⇕ Full text")
                      : (LANG==="pt"?"⇔ Uma linha":"⇔ Single line")}</button>`+
    `<button class="btn" id="btnExpTab">↓ CSV</button>`;
  const lista = ordenar(itensFiltrados());
  const cols = [
    ["item",T("item"),"num","7%"],["status",T("status"),"","17%"],["inspType",T("tipoInsp"),"","11%"],
    ["originalJx",T("origem"),"","8%"],["evidence","Evidence","","13%"],
    ["description",LANG==="pt"?"Descrição":"Description","","22%"],
    ["updatedStatusObs",LANG==="pt"?"Obs. do status":"Status note","","16%"],["aging",T("aging"),"num","6%"],
  ];
  /* Celula de texto: corta com reticencias e entrega o conteudo inteiro no
     balao ao passar o mouse; no modo "texto completo" nada e cortado. */
  const cel = (valor, rotulo) => {
    const v = String(valor ?? "");
    if(!v) return `<td><span class="muted">—</span></td>`;
    const tip = (!S.textoCompleto && v.length>26)
      ? ` data-tip="${esc(v)}" data-tip-l="${esc(rotulo)}"` : "";
    return `<td><span class="trunc"${tip}>${esc(v)}</span></td>`;
  };
  $("#view").innerHTML = `<div class="panel">
    <h3>${lista.length} ${LANG==="pt"?"itens":"items"}${lista.length!==S.db.itens.length?` <span class="sub">${LANG==="pt"?"de":"of"} ${S.db.itens.length}</span>`:""}</h3>
    <div class="tblwrap"><table class="${S.textoCompleto?"livre":""}" style="table-layout:fixed">
    <colgroup>${cols.map(c=>`<col style="width:${c[3]}">`).join("")}</colgroup>
    <thead><tr>
      ${cols.map(c=>`<th data-s="${c[0]}" title="${LANG==="pt"?"Ordenar por":"Sort by"} ${esc(c[1])}"${S.ordenacao.campo===c[0]?' style="color:var(--accent)"':""}>${esc(c[1])} <span style="opacity:${S.ordenacao.campo===c[0]?1:.25}">${S.ordenacao.campo===c[0]&&S.ordenacao.dir<0?"▼":"▲"}</span></th>`).join("")}
    </tr></thead><tbody>
      ${lista.length? lista.map(i=>{
        const mud=R.mudouNoCiclo(i);
        return `<tr data-i="${esc(i.item)}" class="${mud?"":""}">
        <td class="num"><b>${esc(i.item)}</b></td>
        <td class="${mud?"chgmark":""}"><span class="pill" style="background:${R.corDe(i.status)}26;color:${R.corDe(i.status)};
          border-color:${R.corDe(i.status)};max-width:100%;overflow:hidden;text-overflow:ellipsis;display:inline-flex"
          title="${esc(i.status)}"><i class="dot" style="background:${R.corDe(i.status)}"></i>
          <span style="overflow:hidden;text-overflow:ellipsis">${esc(i.status)}</span></span></td>
        <td><span class="rowflex" style="gap:4px;flex-wrap:nowrap;min-width:0">
          <span class="trunc">${esc(i.inspType)}</span>${
          i.isB05&&i.inspType!=="B05"?`<span class="tag" style="flex:none">B05</span>`:""}</span></td>
        <td>${esc(i.originalJx)}</td>
        ${cel(i.evidence,"Evidence")}
        ${cel(i.description,LANG==="pt"?"Descrição":"Description")}
        ${cel(i.updatedStatusObs,LANG==="pt"?"Obs. do status":"Status note")}
        <td class="num" style="color:${R.aberto(i.status)&&R.diasSemAtualizacao(i)>(S.db.config.diasAlertaAging??60)?"var(--bad)":"var(--fg-3)"}">${R.diasSemAtualizacao(i)}</td>
      </tr>`;}).join("")
      : `<tr><td colspan="${cols.length}"><div class="empty">${T("nenhumItem")}</div></td></tr>`}
    </tbody></table></div></div>`;
  $$("thead th[data-s]").forEach(th=>th.onclick=()=>{
    const c=th.dataset.s;
    S.ordenacao = S.ordenacao.campo===c? {campo:c,dir:-S.ordenacao.dir} : {campo:c,dir:1};
    Render.atual();});
  $$("tbody tr[data-i]").forEach(tr=>tr.onclick=()=>UI.detalhe(tr.dataset.i));
  $("#btnExpTab").onclick=()=>Export.csv(lista);
  $("#btnTxt").onclick=()=>{ S.textoCompleto=!S.textoCompleto;
    localStorage.setItem("sm.textoCompleto", S.textoCompleto?"1":"0"); Render.atual(); };
  Filtros.ligar();
};

/* =============================== kanban ================================ */
/* Faixas empilhadas: cada categoria ocupa a largura toda e vamos descendo.
   Clicar no cabecalho recolhe; o seletor ao lado reordena os cards. */
const ORD_KANBAN=[
  {id:"item",      pt:"Item",              en:"Item"},
  {id:"status",    pt:"Status",            en:"Status"},
  {id:"inspType",  pt:"Tipo de inspe\u00e7\u00e3o", en:"Inspection type"},
  {id:"originalJx",pt:"Marco de origem",   en:"Origin milestone"},
  {id:"aging",     pt:"Dias sem atualiza\u00e7\u00e3o", en:"Days without update"},
  {id:"description",pt:"Descri\u00e7\u00e3o", en:"Description"},
];
Render.kanban = function(){
  $("#pageTitle").textContent=T("kanban");
  S.kbOrd ??= {campo:"item", dir:1};
  $("#headerExtra").innerHTML = Filtros.resumoHTML()+
    `<label class="rowflex" style="gap:5px;font-size:11.5px;color:var(--fg-3)">
       ${LANG==="pt"?"Ordenar por":"Sort by"}
       <select id="kbOrd">${ORD_KANBAN.map(o=>`<option value="${o.id}" ${S.kbOrd.campo===o.id?"selected":""}>
         ${esc(LANG==="pt"?o.pt:o.en)}</option>`).join("")}</select></label>
     <button class="btn sm" id="kbDir" title="${LANG==="pt"?"Inverter":"Reverse"}">${S.kbOrd.dir>0?"A→Z":"Z→A"}</button>
     <button class="btn sm" id="kbLay" title="${LANG==="pt"?"Alternar entre colunas lado a lado e faixas empilhadas"
        :"Switch between side-by-side columns and stacked rows"}">${S.kbLayout==="h"
        ? (LANG==="pt"?"▥ Horizontal":"▥ Horizontal") : (LANG==="pt"?"▤ Vertical":"▤ Vertical")}</button>
     <button class="btn sm" id="kbTodas">${LANG==="pt"?"Expandir tudo":"Expand all"}</button>`;

  const lista = itensFiltrados();
  const fams = R.familias().slice().sort((a,b)=>a.ordem-b.ordem);
  const porFam={}; fams.forEach(f=>porFam[f.id]=[]);
  lista.forEach(i=>(porFam[R.familiaDe(i.status)] ??= []).push(i));
  const ordFam = l => {
    const {campo,dir}=S.kbOrd;
    return [...l].sort((a,b)=>{
      if(campo==="aging") return (R.diasSemAtualizacao(a)-R.diasSemAtualizacao(b))*dir
                                 || cmpAlfa(a.item,b.item);
      if(campo==="status"){ const d=R.ordemDe(a.status)-R.ordemDe(b.status);
        return (d||cmpAlfa(a.item,b.item))*dir; }
      return (cmpAlfa(a[campo],b[campo]) || cmpAlfa(a.item,b.item))*dir;
    });
  };

  $("#view").innerHTML=`<div class="kb ${S.kbLayout==="h"?"h":"v"}">${fams.map(f=>{
    const itens=ordFam(porFam[f.id]||[]);
    const rec=S.recolhidas.has(f.id);
    const ab=itens.filter(i=>R.aberto(i.status)).length;
    return `<section class="col ${rec?"collapsed":""}" data-f="${f.id}">
      <div class="colh" style="border-left-color:${f.cor}">
        <span class="caret">${rec?"\u25b8":"\u25be"}</span>
        <i class="dot" style="background:${f.cor};width:10px;height:10px"></i>
        <span class="nm">${esc(R.nomeFamilia(f.id))}</span>
        <span class="n">${itens.length}</span>
        ${ab && ab!==itens.length ?`<span class="tag" title="${ab} ${LANG==="pt"?"em aberto":"open"}"
          style="color:${f.cor};border-color:${f.cor};flex:none">${
          S.kbLayout==="h"? ab : `${ab} ${LANG==="pt"?"em aberto":"open"}`}</span>`:""}
        <span class="ch"><span class="muted" style="font-size:11px">
          ${S.db.config.status.filter(x=>x.familia===f.id&&itens.some(i=>i.status===x.codigo))
            .map(x=>esc(x.codigo)).join(" \u00b7 ")}</span></span>
      </div>
      <div class="colbody">${itens.map(i=>cardHTML(i)).join("")||
        `<div class="muted" style="grid-column:1/-1;text-align:center;padding:18px;font-size:11.5px">
          ${LANG==="pt"?"Nenhum item nesta categoria":"No items in this category"}</div>`}</div>
    </section>`;}).join("")}</div>`;

  let arrastando=null;
  $$(".colh").forEach(h=>h.onclick=e=>{
    if(arrastando) return;                       /* nao recolhe ao soltar um card */
    const f=h.closest(".col").dataset.f;
    S.recolhidas.has(f)? S.recolhidas.delete(f) : S.recolhidas.add(f);
    localStorage.setItem("sm.recolhidas",JSON.stringify([...S.recolhidas]));
    Render.atual();});
  $$(".card").forEach(c=>{
    c.draggable=true;
    c.addEventListener("dragstart",e=>{
      arrastando=c.dataset.i;
      e.dataTransfer.setData("text/plain",c.dataset.i);
      e.dataTransfer.effectAllowed="move";
      c.classList.add("dragging");
      document.body.classList.add("arrastando");
    });
    c.addEventListener("dragend",()=>{
      c.classList.remove("dragging");
      document.body.classList.remove("arrastando");
      $$(".col.over").forEach(x=>x.classList.remove("over"));
      setTimeout(()=>arrastando=null,60);        /* engole o clique que vem apos o drop */
    });
    c.addEventListener("click",e=>{
      if(arrastando){e.preventDefault(); return;}
      if(e.target.closest(".cst")){ e.stopPropagation(); return UI.escolherStatus(c.dataset.i); }
      UI.detalhe(c.dataset.i); });
  });
  $$(".col").forEach(col=>{
    const alvo=(e)=>{ e.preventDefault(); e.dataTransfer.dropEffect="move";
      if(col.dataset.f!==R.familiaDe(S.db.itens.find(i=>i.item===arrastando)?.status||""))
        col.classList.add("over"); };
    col.addEventListener("dragenter",alvo);
    col.addEventListener("dragover",alvo);
    col.addEventListener("dragleave",e=>{ if(!col.contains(e.relatedTarget)) col.classList.remove("over"); });
    col.addEventListener("drop",e=>{
      e.preventDefault(); e.stopPropagation();
      col.classList.remove("over");
      const id = e.dataTransfer.getData("text/plain") || arrastando;
      if(id) UI.moverPara(id, col.dataset.f);
    });
  });
  $("#kbOrd").onchange=e=>{S.kbOrd.campo=e.target.value; Render.atual();};
  $("#kbDir").onclick=()=>{S.kbOrd.dir=-S.kbOrd.dir; Render.atual();};
  $("#kbLay").onclick=()=>{S.kbLayout = S.kbLayout==="h"?"v":"h";
    localStorage.setItem("sm.kbLayout",S.kbLayout); Render.atual();};
  $("#kbTodas").onclick=()=>{
    if(S.recolhidas.size) S.recolhidas.clear(); else R.familias().forEach(f=>S.recolhidas.add(f.id));
    localStorage.setItem("sm.recolhidas",JSON.stringify([...S.recolhidas])); Render.atual();};
  Filtros.ligar();
};

/* Coerencia entre o texto da observacao e o status do item: um texto que diz
   "concluído" num item em aberto (ou o contrário) e um sinal de alerta. */
function textoDizConcluido(t){
  t=(t||"").toLowerCase();
  return /done|conform|accepted|waiver|aceito|conclu/.test(t);
}
/* Alguns status sao POSTERIORES a execucao: fazer o B05 e depois aguardar o teste
   a vacuo ou a assinatura e o fluxo normal, entao "B05 done" neles nao e
   contradicao. A lista fica em config, ajustavel sem mexer no codigo. */
function statusAceitaTextoConcluido(st){
  const l = S.db?.config?.statusPosExecucao ?? ["7 - Missing Vacuum Test or Sign"];
  return l.includes(st);
}
function incoerente(status,texto){
  if(!texto) return false;
  if(statusAceitaTextoConcluido(status)) return false;
  const c=textoDizConcluido(texto);
  return (R.aberto(status) && c) || (status==="1 - Validated by ICN" && !c);
}
const CAMPO_ITEM={OriginalJx:"originalJx","Updated Status Obs":"updatedStatusObs",Bigram:"bigram"};

Render.conflitos = function(){

  const caixa=(c,qual)=>{

    const alerta = c.campo==="Updated Status Obs" && incoerente(st,c.valorAplicado);

          &#9888; ${T("incoerente")}</span>`:""}
      </div></div>`;
  };

  $("#view").innerHTML=`
    <div class="panel pad" style="margin-bottom:14px;border-left:3px solid var(--accent)">
      <b>${LANG==="pt"?"O que é esta tela":"What this screen is"}</b>
      <p class="muted" style="margin:6px 0 0;line-height:1.75">${LANG==="pt"
        ? `Os 428 itens casaram nos dois arquivos, mas em alguns campos eles <b>diziam coisas diferentes</b>.
           Nada foi sobrescrito: os dois valores estão guardados e o do <b>${T("arquivo2")}</b> foi aplicado
           provisoriamente. Escolher um valor aqui o torna oficial, guarda o outro no registro do conflito e
           gera um evento no histórico com o seu nome. <b>Nenhuma informação é perdida.</b>`
        : `All 428 items matched across both files, but some fields <b>disagreed</b>. Nothing was overwritten:
           both values are stored and the one from <b>${T("arquivo2")}</b> was applied provisionally. Picking a
           value makes it official, keeps the other in the conflict record, and logs a history event under your
           name. <b>No information is lost.</b>`}</p></div>

    ${abertos.length? Object.entries(porCampo).map(([campo,lista])=>`
      <div class="panel" style="margin-bottom:14px"><h3>${esc(campo)} <span class="sub">${lista.length}</span>

        <div class="pad">${lista.map(cartao).join("")}</div></div>`).join("")
      : `<div class="panel"><div class="empty"><h3>&#10003; ${T("semConflito")}</h3>${T("tudoResolvido")}</div></div>`}

    ${fechados.length?`<div class="panel"><h3>${LANG==="pt"?"Resolvidos":"Resolved"} <span class="sub">${fechados.length}</span></h3>
      <div class="tblwrap" style="max-height:340px"><table><thead><tr>
        <th>${T("item")}</th><th>${T("campo")}</th><th>${LANG==="pt"?"Valor oficial":"Official value"}</th>
        <th>${LANG==="pt"?"Descartado":"Discarded"}</th><th>${T("autor")}</th></tr></thead><tbody>
      ${fechados.map(c=>{const desc=String(c.valorAplicado)===String(c.valorArquivo1)?c.valorArquivo2:c.valorArquivo1;
        return `<tr><td class="num"><b>${esc(c.item)}</b></td><td>${esc(c.campo)}</td>
        <td style="max-width:300px;white-space:pre-wrap">${esc(c.valorAplicado)}</td>
        <td style="max-width:240px;white-space:pre-wrap" class="muted">${esc(desc)}</td>
        <td>${esc(c.resolvidoPor||"")}<div class="muted" style="font-size:10.5px">${esc(c.justificativa||"")}</div></td></tr>`;}).join("")}
      </tbody></table></div></div>`:""}`;

  $$("button[data-c]").forEach(b=>b.onclick=()=>UI.resolverConflito(b.dataset.c,b.dataset.v));

  $$("button[data-lote]").forEach(b=>b.onclick=()=>UI.resolverLote(b.dataset.lote,b.dataset.q));
};
