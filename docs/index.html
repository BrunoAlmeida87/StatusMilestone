<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StatusMilestone</title>
<style>
/* Tema: superfícies mais quentes, contraste suave, cantos arredondados e
   respiro maior. O azul só aparece onde há ação. */
:root{
  --bg:#eef0f4; --panel:#ffffff; --panel-2:#f5f7fa; --line:#b9c2d0; --line-2:#dbe1ea;
  --fg:#1f2430; --fg-2:#596273; --fg-3:#8b93a3;
  --accent:#2a78d6; --accent-fg:#ffffff; --accent-soft:#e8f0fb;
  --ok:#0ca30c; --warn:#d99400; --bad:#d03b3b; --info:#2a78d6; --neutral:#8b93a3; --orange:#eb6834;
  --chg:#fff3c4; --chg-line:#eda100;
  --radius:12px;
  --shadow:0 1px 2px rgba(23,28,40,.04), 0 2px 8px rgba(23,28,40,.05);
  --shadow-2:0 4px 16px rgba(23,28,40,.08);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1218; --panel:#181c23; --panel-2:#20262f; --line:#454f5e; --line-2:#333b47;
  --fg:#e8ebf0; --fg-2:#a8b1c0; --fg-3:#78818f;
  --accent:#5b9ae8; --accent-fg:#0b1016; --accent-soft:#1b2734;
  --ok:#3fbf3f; --warn:#e0a92a; --bad:#e26b6b; --info:#5b9ae8; --neutral:#78818f; --orange:#e8834f;
  --chg:#3d3417; --chg-line:#c99a1e;
  --shadow:0 1px 2px rgba(0,0,0,.28), 0 2px 10px rgba(0,0,0,.24);
  --shadow-2:0 6px 22px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --bg:#0f1218; --panel:#181c23; --panel-2:#20262f; --line:#454f5e; --line-2:#333b47;
  --fg:#e8ebf0; --fg-2:#a8b1c0; --fg-3:#78818f;
  --accent:#5b9ae8; --accent-fg:#0b1016; --accent-soft:#1b2734;
  --ok:#3fbf3f; --warn:#e0a92a; --bad:#e26b6b; --info:#5b9ae8; --neutral:#78818f; --orange:#e8834f;
  --chg:#3d3417; --chg-line:#c99a1e;
  --shadow:0 1px 2px rgba(0,0,0,.28), 0 2px 10px rgba(0,0,0,.24);
  --shadow-2:0 6px 22px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:13.5px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:620;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}

/* ---------- layout ---------- */
#app{display:grid;grid-template-columns:212px 1fr;min-height:100vh}
#side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{padding:17px 17px 14px;border-bottom:1px solid var(--line-2)}
.brand b{display:block;font-size:15px;letter-spacing:-.025em}
.brand span{font-size:11px;color:var(--fg-3)}
nav{padding:8px;display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
nav button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 11px;border:0;border-radius:9px;
  background:transparent;color:var(--fg-2);cursor:pointer;text-align:left;font-size:13px}
nav button:hover{background:var(--line-2);color:var(--fg)}
nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:650;box-shadow:inset 3px 0 0 var(--accent)}
nav button .ic{width:15px;text-align:center;opacity:.85;font-size:13px}
nav button .cnt{margin-left:auto;font:600 10px/1.6 var(--mono);background:var(--bad);color:#fff;
  padding:0 5px;border-radius:9px;min-width:17px;text-align:center}
.sidefoot{padding:9px;border-top:1px solid var(--line-2);display:flex;flex-direction:column;gap:6px}
#main{min-width:0;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--panel) 92%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  padding:11px 22px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h2{font-size:17px;margin-right:auto;letter-spacing:-.02em}
main{padding:20px 22px 70px;min-width:0}

/* ---------- controles ---------- */
.btn{border:1px solid var(--line);background:var(--panel);padding:6px 13px;border-radius:9px;cursor:pointer;
  color:var(--fg-2);white-space:nowrap;font-size:12.5px;font-weight:500;transition:.12s}
.btn:hover{background:var(--line-2);color:var(--fg);border-color:var(--fg-3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.warn{border-color:var(--chg-line);color:var(--chg-line)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 10px;font-size:11.5px;border-radius:7px}
input[type=text],input[type=search],input[type=date],input[type=number],select,textarea{
  background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:6px 11px;outline:0;min-width:0;transition:.12s}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
textarea{resize:vertical;font:inherit;width:100%}
label.fld{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--fg-3)}
label.fld>span{font-weight:600;text-transform:uppercase;letter-spacing:.04em;font-size:10px}

/* ---------- cards ---------- */
.panel{background:var(--panel);border:2px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);min-width:0}
.panel>h3{padding:13px 17px;border-bottom:2px solid var(--line);background:var(--panel-2);border-radius:calc(var(--radius) - 2px) calc(var(--radius) - 2px) 0 0;font-size:11.5px;text-transform:uppercase;
  letter-spacing:.07em;color:var(--fg-2);display:flex;align-items:center;gap:9px;font-weight:700}
.panel[data-dobra]>h3{cursor:pointer;user-select:none}
.panel[data-dobra]>h3:hover{color:var(--fg)}
.panel>h3 .caret{color:var(--fg-3);font-size:10px;width:11px;flex:none;text-align:center}
.panel.recolhido>.corpo{display:none}
.panel.recolhido>h3{border-bottom:0;border-radius:calc(var(--radius) - 2px)}
.panel>h3 .sub{margin-left:auto;font:500 11px/1 var(--sans);text-transform:none;letter-spacing:0;color:var(--fg-3)}
.pad{padding:17px}
.grid{display:grid;gap:16px;min-width:0}
.grid>*{min-width:0}
.kpis{grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr))}
.kpi{background:var(--panel);border:2px solid var(--line);border-radius:var(--radius);padding:15px 17px;box-shadow:var(--shadow);
  border-top:4px solid var(--accent)}
.kpi .lab{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--fg-3);font-weight:600}
.kpi .val{font:700 30px/1.1 var(--sans);letter-spacing:-.03em;margin-top:5px}
.kpi .dlt{font-size:11.5px;margin-top:2px;color:var(--fg-3)}
.up{color:var(--ok)} .down{color:var(--bad)} .flat{color:var(--fg-3)}

/* ---------- tabela ---------- */
.tblwrap{overflow:auto;max-height:calc(100vh - 230px)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);border-right:1px solid var(--line-2);vertical-align:top}
th:last-child,td:last-child{border-right:0}
tbody tr:nth-child(even){background:var(--panel-2)}
thead th{position:sticky;top:0;z-index:2;background:var(--panel-2);font-size:10.5px;text-transform:uppercase;
  letter-spacing:.04em;color:var(--fg-2);font-weight:700;cursor:pointer;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;border-bottom:3px solid var(--line)}
thead th:hover{color:var(--fg)}
tbody tr{cursor:pointer;transition:background .1s}
tbody tr:hover{background:var(--accent-soft)}
tbody tr.sel{background:var(--accent-soft)}
td.num{font:500 12px/1.5 var(--mono)}
.trunc{max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
/* leitura integral: desliga o corte e deixa o texto quebrar linha */
table.livre .trunc{max-width:none;white-space:pre-wrap;overflow:visible;word-break:break-word}
table.livre td{vertical-align:top}
.trunc[data-tip]{cursor:help;text-decoration:underline dotted var(--line);text-underline-offset:3px}
#tip{position:fixed;z-index:300;max-width:min(460px,86vw);background:var(--fg);color:var(--panel);
  padding:9px 12px;border-radius:9px;font-size:12px;line-height:1.55;box-shadow:0 10px 30px rgba(0,0,0,.34);
  pointer-events:none;white-space:pre-wrap;word-break:break-word;display:none}
#tip b{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;opacity:.62;margin-bottom:3px}

/* ---------- pills ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:11px;font-size:11px;
  font-weight:600;white-space:nowrap;border:1px solid transparent;line-height:1.7}
.dot{width:7px;height:7px;border-radius:50%;flex:none}
.tag{display:inline-block;padding:1px 7px;border-radius:6px;background:var(--line-2);color:var(--fg-2);
  font:600 10.5px/1.75 var(--mono);margin:1px 3px 1px 0;border:1px solid var(--line)}
.chgmark{background:var(--chg);border-left:3px solid var(--chg-line)!important}

/* ---------- kanban: colunas lado a lado (h) ou faixas empilhadas (v) ---------- */
.kb{display:flex;gap:12px}
.kb.v{flex-direction:column}
.kb.h{flex-direction:row;align-items:flex-start;overflow-x:auto;padding-bottom:10px}
.kb.h>.col{flex:0 0 306px;max-height:calc(100vh - 212px)}
.kb.h>.col.collapsed{flex:0 0 214px}
.kb.h .colh .ch{display:none}
.col{background:var(--panel);border:2px solid var(--line);border-radius:var(--radius);
  display:flex;flex-direction:column;box-shadow:var(--shadow);overflow:hidden;min-height:0}
.col.collapsed .colbody{display:none}
.colh{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;flex:none;
  border-left:7px solid transparent;border-bottom:2px solid var(--line);background:var(--panel-2)}
.colh:hover{background:var(--line-2)}
.colh .nm{font-weight:650;font-size:13.5px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;min-width:0;flex:1}
.colh .n{flex:none}
.colh .n{font:650 12px/1 var(--mono);color:var(--fg-2);background:var(--panel);
  border:1px solid var(--line);border-radius:10px;padding:3px 9px}
.colh .ch{margin-left:auto;display:flex;gap:6px;align-items:center}
.colh .caret{color:var(--fg-3);font-size:12px;width:14px;text-align:center}
.colbody{padding:12px;display:grid;gap:9px;overflow-y:auto;min-height:0}
.kb.v .colbody{grid-template-columns:repeat(auto-fill,minmax(min(232px,100%),1fr));max-height:430px}
.kb.h .colbody{grid-template-columns:1fr;flex:1 1 auto;max-height:none}
.col.over{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft),var(--shadow-2)}
.col.over .colbody{background:var(--accent-soft)}
.col.over .colh{background:var(--accent-soft)}
body.arrastando .col:not(.over){opacity:.72}
body.arrastando .colh{cursor:copy}
.card{-webkit-user-drag:element}
.card{background:var(--panel);border:2px solid var(--line);border-left-width:7px;border-radius:8px;
  padding:9px 11px;cursor:grab;font-size:12px;transition:border-color .12s,transform .12s}
.card:hover{border-color:var(--accent);transform:translateY(-1px)}
.card.dragging{opacity:.4}
.card .cid{font:700 13px/1.4 var(--mono)}
.card .cdesc{color:var(--fg-2);font-size:11.5px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden}
.card .cmeta{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}
.card .cst{display:flex;align-items:center;gap:6px;width:100%;margin-top:8px;padding:5px 8px;
  border:1px solid var(--line);border-radius:7px;background:var(--panel);cursor:pointer;
  font-size:10.5px;font-weight:600;text-align:left;transition:.12s}
.card .cst span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .cst b{opacity:.5;font-size:13px;line-height:1}
.card .cst:hover{background:var(--panel-2);filter:brightness(1.05)}
.colbody:empty,.colbody{min-height:84px}

/* ---------- modal ---------- */
.ov{position:fixed;inset:0;background:rgba(10,13,18,.55);display:flex;align-items:center;justify-content:center;
  z-index:100;padding:20px;backdrop-filter:blur(2px)}
.modal{background:var(--panel);border:2px solid var(--line);border-radius:16px;max-width:920px;width:100%;
  max-height:88vh;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.modal>header{border-radius:16px 16px 0 0;backdrop-filter:none;background:var(--panel)}
.modal .body{overflow:auto;padding:16px}
.modal footer{padding:11px 16px;border-top:1px solid var(--line-2);display:flex;gap:8px;justify-content:flex-end}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{border:0;background:transparent;padding:7px 12px;cursor:pointer;color:var(--fg-3);
  border-bottom:2px solid transparent;font-size:12.5px}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:620}

/* ---------- diversos ---------- */
.flow{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(135px,100%),1fr))}
.fbox{border:2px solid var(--line);border-left-width:6px;border-radius:6px;padding:8px 10px;background:var(--panel-2)}
.fbox .fn{font:650 21px/1.1 var(--sans)}
.fbox .fl{font-size:10.5px;color:var(--fg-2);margin-top:3px;line-height:1.35}
.fbox .fp{font:500 11px/1 var(--mono);color:var(--fg-3);margin-top:4px}
.bar{height:9px;border-radius:5px;background:var(--line-2);overflow:hidden;display:flex;border:1px solid var(--line)}
.empty{text-align:center;padding:56px 20px;color:var(--fg-3)}
.empty h3{font-size:15px;color:var(--fg-2);margin-bottom:6px}
.toast{position:fixed;bottom:16px;right:16px;z-index:200;display:flex;flex-direction:column;gap:7px;align-items:flex-end}
.toast div{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);
  padding:9px 13px;border-radius:7px;box-shadow:0 6px 20px rgba(0,0,0,.18);animation:sl .2s;max-width:340px}
.toast div.ok{border-left-color:var(--ok)} .toast div.bad{border-left-color:var(--bad)}
@keyframes sl{from{opacity:0;transform:translateY(8px)}}
.rowflex{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.muted{color:var(--fg-3)}
.mono{font-family:var(--mono)}
.sep{height:1px;background:var(--line-2);margin:12px 0}
dl.kv{display:grid;grid-template-columns:150px 1fr;gap:5px 12px;margin:0;font-size:12.5px}
dl.kv dt{color:var(--fg-2);font-size:11px;text-transform:uppercase;letter-spacing:.03em;font-weight:600;padding-top:2px}
dl.kv dd{margin:0;white-space:pre-wrap;word-break:break-word}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:4px 12px;cursor:pointer;font-size:11.5px;transition:.12s}
.chip:hover{border-color:var(--fg-3)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
@media(max-width:860px){
  #app{grid-template-columns:minmax(0,1fr)}
  #side{position:sticky;top:0;z-index:40;height:auto;flex-direction:row;align-items:center;
    min-width:0;max-width:100%;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  nav{flex-direction:row;min-width:0;overflow-x:auto;padding:7px;gap:4px}
  nav button{padding:7px 10px}
  #main{min-width:0}
  main{padding:14px 14px 60px}
  header{padding:10px 14px}
  .brand,.sidefoot{display:none}
}
@media print{#side,header,.noprint{display:none!important}#app{display:block}main{padding:0}}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand"><b>StatusMilestone</b><span id="brandsub">J08 &middot; Fluxo de Evid&ecirc;ncias</span></div>
    <nav id="nav"></nav>
    <div class="sidefoot">
      <button class="btn sm" id="btnTheme">◐ <span data-i="tema">Tema</span></button>
      <button class="btn sm" id="btnLang">🌐 PT / EN</button>
      <div class="muted" style="font-size:10px" id="whoami"></div>
    </div>
  </aside>
  <div id="main">
    <header>
      <h2 id="pageTitle">Dashboard</h2>
      <div id="headerExtra" class="rowflex noprint"></div>
      <div class="rowflex noprint">
        <span id="pendBadge" class="pill" style="display:none;background:var(--chg);color:#4a3d00;border-color:var(--chg-line)"></span>
        <button class="btn" id="btnSaveNow" style="display:none" data-i="salvarAgora">Salvar altera&ccedil;&otilde;es agora</button>
        <span id="presenca" class="pill noprint" style="display:none;background:var(--accent-soft);
          color:var(--accent);border-color:var(--accent)"></span>
        <span id="saveState" class="muted" style="font-size:11px" role="status" aria-live="polite"></span>
      </div>
    </header>
    <main id="view"></main>
  </div>
</div>
<div class="toast" id="toast"></div>
<div id="tip"></div>
<script>

   aplicado:"aplicado hoje",emLote:"Resolver em lote",incoerente:"Texto não combina com o status atual",
   semConflito:"Nenhum conflito em aberto",tudoResolvido:"Todos os conflitos foram decididos."},

   nenhumItem:"No items found",obsNova:"New note...",adicionar:"Add",
   b05:"B05",naoB05:"Non-B05",tipoInsp:"Inspection type",funcaoVital:"Vital function",
   origem:"Origin milestone",aging:"Aging",semAtualizacao:"No update for",dias:"days",
   evolucao:"Trend",distribuicao:"Distribution",campo:"Field",anterior:"Previous",novo:"New",

/* ------------------- IndexedDB: handle + copia de seguranca ------------- */
const IDB = (()=>{
  let dbp;
  const open = ()=> dbp ??= new Promise((res,rej)=>{
    const r = indexedDB.open("statusmilestone",1);
    r.onupgradeneeded = ()=>{ const d=r.result;
      if(!d.objectStoreNames.contains("kv")) d.createObjectStore("kv"); };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
  const tx = async (mode,fn)=>{ const d=await open(); return new Promise((res,rej)=>{
      const t=d.transaction("kv",mode), s=t.objectStore("kv"); const rq=fn(s);
      rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error); }); };
  return {
    get:k=>tx("readonly",s=>s.get(k)).catch(()=>null),
    set:(k,v)=>tx("readwrite",s=>s.put(v,k)).catch(()=>null),
    del:k=>tx("readwrite",s=>s.delete(k)).catch(()=>null),
  };
})();

/* --------------------------- camada de dados --------------------------- */
const Store = {
  dirHandle:null, fileHandle:null, revisaoCarregada:0, suportado:"showDirectoryPicker" in window,

  async restaurarHandle(){
    const h = await IDB.get("dirHandle"); if(!h) return false;
    try{
      if(await h.queryPermission({mode:"readwrite"}) === "granted"){ this.dirHandle=h; return true; }
      this.dirHandlePendente = h; return false;
    }catch{ return false; }
  },
  async pedirPermissaoSalva(){
    const h=this.dirHandlePendente; if(!h) return false;
    if(await h.requestPermission({mode:"readwrite"}) === "granted"){ this.dirHandle=h; return true; }
    return false;
  },
  async escolherPasta(){
    this.dirHandle = await showDirectoryPicker({mode:"readwrite", id:"statusmilestone"});
    await IDB.set("dirHandle", this.dirHandle);
    return this.dirHandle;
  },
  /* Data de modificacao sem ler o conteudo: o polling so abre o arquivo quando muda. */
  async mtime(nome="database.json"){
    try{ const fh=await this.dirHandle.getFileHandle(nome); return (await fh.getFile()).lastModified; }
    catch{ return 0; }
  },
  async lerArquivo(nome="database.json"){
    const fh = await this.dirHandle.getFileHandle(nome);
    return JSON.parse(await (await fh.getFile()).text());
  },
  /* Classificacao do erro de leitura. So "arquivo inexistente" pode ser tratado
     como pasta vazia: permissao negada, JSON invalido ou falha de I/O sao coisas
     diferentes e, na hora de gravar, nenhuma delas autoriza sobrescrever. */
  tipoErroLeitura(e){
    if(e?.name === "NotFoundError") return "INEXISTENTE";
    if(e?.name === "NotAllowedError" || e?.name === "SecurityError") return "PERMISSAO";
    if(e instanceof SyntaxError) return "JSON_INVALIDO";
    return "LEITURA";
  },
  async carregar(){
    if(!this.dirHandle) throw new Error("sem pasta");
    let db;
    try{ db = await this.lerArquivo(); }
    catch(e){
      const tipo = this.tipoErroLeitura(e);
      if(tipo==="INEXISTENTE")   throw new Error("NAO_ENCONTRADO");
      if(tipo==="JSON_INVALIDO") throw new Error("CORROMPIDO: "+e.message);
      const err = new Error("LEITURA_"+tipo); err.causa=e; err.detalhe=e?.message||String(e);
      throw err;
    }
    this.revisaoCarregada = db?.meta?.revisao ?? 0;
    await IDB.set("espelho", db);
    return db;
  },
  /* Uma escrita por vez. Autosave, consolidacao manual, varredura automatica e
     resolucao de conflito podem disparar quase juntos; sem fila, dois writers
     abrem no mesmo arquivo. Uma falha nao trava a fila: a tarefa seguinte roda. */
  _fila:null,
  enfileirar(tarefa){
    const atual = (this._fila ?? Promise.resolve()).then(tarefa);
    this._fila = atual.catch(()=>{});
    return atual;
  },
  /* Controle de concorrencia: rele o arquivo e compara a revisao antes de gravar. */
  gravar(db,{forcar=false}={}){
    if(!this.dirHandle) return Promise.reject(new Error("sem pasta"));
    return this.enfileirar(()=>this._gravar(db,{forcar}));
  },
  async _gravar(db,{forcar=false}={}){
    if(!forcar){
      let disco = null;
      try{ disco = await this.lerArquivo(); }
      catch(e){
        const tipo = this.tipoErroLeitura(e);
        /* So seguimos quando o arquivo comprovadamente nao existe. Qualquer outra
           falha interrompe: gravar por cima do que nao conseguimos ler apagaria
           trabalho alheio sem nem detectar o conflito. */
        if(tipo !== "INEXISTENTE"){
          const err = new Error("LEITURA_"+tipo); err.causa=e; err.detalhe=e?.message||String(e);
          throw err;
        }
      }
      if(disco){
        const rd = disco?.meta?.revisao ?? 0;
        if(rd !== this.revisaoCarregada){
          const err = new Error("CONFLITO_REVISAO"); err.revisaoDisco = rd;
          err.autorDisco = disco?.meta?.ultimoAutor; err.disco = disco; throw err;
        }
      }
    }
    /* Os metadados novos ficam num snapshot ate o close() terminar. Se a escrita
       falhar, a revisao em memoria continua igual a ultima efetivamente gravada. */
    const meta = {...(db.meta||{}), revisao:(db.meta?.revisao||0)+1,
                  atualizadoEm:agora(), ultimoAutor:Usuario.nome()};
    const texto = JSON.stringify({...db, meta}, null, 1);
    let w = null;
    try{
      const fh = await this.dirHandle.getFileHandle("database.json",{create:true});
      w = await fh.createWritable();
      await w.write(texto);
      await w.close();
    }catch(e){
      try{ await w?.abort?.(); }catch{}
      const err = new Error("FALHA_ESCRITA"); err.causa=e; err.detalhe=e?.message||String(e);
      throw err;
    }
    db.meta = meta;                       /* so agora a base ativa avanca de revisao */
    this.revisaoCarregada = meta.revisao;
    await IDB.set("espelho", db);
    return meta.revisao;
  },
  /* O backup so e dado como feito depois de reler e conferir o arquivo gravado:
     quem depende dele (sobrescrita forcada, restauracao) precisa dessa certeza. */
  backup(db,rotulo="manual"){
    if(!this.dirHandle) return Promise.reject(new Error("sem pasta"));
    return this.enfileirar(()=>this._backup(db,rotulo));
  },
  async _backup(db,rotulo="manual"){
    const bdir = await this.dirHandle.getDirectoryHandle("backups",{create:true});
    const nome = `database-${agora().replace(/[:.]/g,"-").slice(0,19)}-${rotulo}.json`;
    const fh = await bdir.getFileHandle(nome,{create:true});
    const w = await fh.createWritable(); await w.write(JSON.stringify(db,null,1)); await w.close();
    let lido;
    try{
      const conf = await bdir.getFileHandle(nome);
      lido = JSON.parse(await (await conf.getFile()).text());
    }catch(e){
      const err = new Error("BACKUP_NAO_CONFIRMADO"); err.causa=e; err.detalhe=e?.message||String(e);
      throw err;
    }
    if(!lido || typeof lido!=="object" || !Array.isArray(lido.itens))
      throw new Error("BACKUP_NAO_CONFIRMADO");
    await this.limparBackupsAntigos(bdir);
    return nome;
  },
  async listarBackups(){
    try{
      const bdir = await this.dirHandle.getDirectoryHandle("backups");
      const out=[]; for await (const [nome,h] of bdir.entries())
        if(h.kind==="file" && nome.endsWith(".json")){ const f=await h.getFile();
          out.push({nome,tamanho:f.size,data:new Date(f.lastModified).toISOString()}); }
      return out.sort((a,b)=>b.nome.localeCompare(a.nome));
    }catch{ return []; }
  },
  async limparBackupsAntigos(bdir,manter=30){
    const lista=[]; for await (const [nome,h] of bdir.entries()) if(nome.endsWith(".json")) lista.push(nome);
    lista.sort().reverse().slice(manter).forEach(n=>bdir.removeEntry(n).catch(()=>{}));
  },
  async restaurarBackup(nome){
    const bdir = await this.dirHandle.getDirectoryHandle("backups");
    const fh = await bdir.getFileHandle(nome);
    return JSON.parse(await (await fh.getFile()).text());
  },
};
