name: Publicar no GitHub Pages

on:
  push:
    branches: [claude/excel-consolidation-tracking-l9o3l4, main]
    paths: ['docs/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Impedir que dados do projeto sejam publicados
        run: |
          set -e
          if find docs -type f \( -name '*.csv' -o -name '*.xlsx' -o -name '*.xlsb' \
               -o -name 'database*.json' \) | grep -q .; then
            echo "::error::Arquivo de dados encontrado em docs/. A base nunca deve ser publicada."
            exit 1
          fi
          echo "OK: docs/ contem apenas a interface."

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4
